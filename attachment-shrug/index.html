<style>
html, body { min-height: 100%; }

<style>
/* Attachment Shrug — say "attached" with nothing attached and the Send button shrugs at you.
   Outcraft Design System v2. Every value is an Outcraft token. */
.at {
  --at-bg: var(--card);
  --at-fg: var(--foreground);
  --at-muted: var(--muted-foreground);
  --at-line: var(--border);
  --at-sunken: var(--subtle);
  --at-fill: var(--muted);
  --at-accent: var(--primary);
  --at-on-accent: var(--primary-foreground);
  display: flex;
  flex-direction: column;
  gap: 12px;
  width: 100%;
  max-width: 400px;
  box-sizing: border-box;
  padding: 20px;
  background: var(--at-bg);
  color: var(--at-fg);
  border-radius: var(--radius-xl);
  border: 1px solid var(--border);
  box-shadow: var(--shadow-sm);
  font: 400 var(--text-body)/var(--leading-body) var(--font-sans);
  letter-spacing: normal;
  text-align: left;
  -webkit-font-smoothing: antialiased;
}
.at p { margin: 0; }
.at-fields { border-bottom: 1px solid var(--at-line); }
.at-row { display: flex; gap: 10px; padding: 8px 0; border-top: 1px solid var(--at-line); font-size: var(--text-body); }
.at-row:first-child { border-top: 0; padding-top: 0; }
/* Top of the card: trimmed to the capitals, so the padding above reads the same as the padding below (10b.39) */
.at-row:first-child > * { text-box: trim-start cap alphabetic; }
.at-row span { width: 58px; color: var(--at-muted); }
.at-row b { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500; }
.at-body { display: block; width: 100%; min-height: 72px; box-sizing: border-box; padding: 0; border: 0; background: none; color: inherit; font: inherit; font-size: var(--text-title-sm); line-height: var(--leading-title-sm); letter-spacing: var(--tracking-title); resize: none; }
.at-body:focus { outline: none; }
.at-files:empty { display: none; }
.at-file { display: flex; align-items: center; gap: 10px; padding: 8px 8px 8px 10px; border-radius: var(--radius-lg); background: var(--at-sunken); animation: at-in var(--spring-ui-duration) var(--spring-ui) both; }
@keyframes at-in { from { opacity: 0; transform: translateY(8px) scale(var(--press-scale)); } }
.at-file-icon { display: grid; place-items: center; flex: none; width: 32px; height: 38px; border-radius: var(--radius-sm); background: var(--danger); color: var(--danger-foreground); font-size: calc(var(--text-caption) - 2px); font-weight: 800; }
.at-file-name { flex: 1; min-width: 0; overflow: hidden; font-weight: 600; text-overflow: ellipsis; white-space: nowrap; }
.at-file-name small { display: block; color: var(--at-muted); font-size: var(--text-caption); font-weight: 400; }
.at-remove { display: grid; place-items: center; flex: none; width: 32px; height: 32px; padding: 0; border: 0; border-radius: 50%; background: var(--at-fill); color: var(--at-muted); cursor: pointer; }
.at-remove svg { display: block; width: 16px; height: 16px; }
.at-remove:focus-visible, .at-clip:focus-visible, .at-send:focus-visible, .at-ask button:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }

.at-bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.at-clip { display: grid; place-items: center; width: 44px; height: 44px; border: 0; border-radius: 50%; background: var(--at-fill); color: var(--at-fg); cursor: pointer; transition: transform var(--spring-press-duration) var(--spring-press), color var(--duration-base), background-color var(--duration-base); }
.at-clip svg { width: 22px; height: 22px; }
.at-clip:active { transform: scale(var(--press-scale-sm)); }
.at.is-hint .at-clip { color: var(--at-on-accent); background: var(--at-accent); animation: at-look 2.4s var(--ease-in-out) infinite; }
@keyframes at-look { 0%, 60%, 100% { transform: rotate(0); } 70% { transform: rotate(-16deg); } 80% { transform: rotate(14deg); } 90% { transform: rotate(-6deg); } }
.at-send-wrap { position: relative; }
.at-send { height: 44px; padding: 0 26px; border: 0; border-radius: var(--radius-md); background: var(--at-accent); color: var(--at-on-accent); font: inherit; font-weight: 600; cursor: pointer; transform-origin: 50% 100%; transition: transform var(--spring-press-duration) var(--spring-press); }
.at-send:active { transform: scale(var(--press-scale)); }
.at-send.is-shrug { animation: at-shrug var(--spring-ui-duration) var(--spring-ui); }
@keyframes at-shrug { 15% { transform: translateY(-6px) scaleX(0.94) scaleY(1.06); } 30% { transform: none; } 45% { transform: translateY(-6px) scaleX(0.94) scaleY(1.06); } 60% { transform: none; } }
.at-shrug { position: absolute; right: 0; bottom: calc(100% + 8px); padding: 6px 10px; border-radius: var(--radius-lg); background: var(--at-fg); color: var(--at-bg); font: 600 var(--text-body)/1 var(--font-sans); white-space: nowrap; opacity: 0; transform: translateY(8px) scale(0.6); transform-origin: 80% 100%; pointer-events: none; transition: opacity var(--duration-base), transform var(--spring-pop-duration) var(--spring-pop); }
.at-shrug::after { content: ""; position: absolute; right: 26px; top: 100%; border: 6px solid transparent; border-top-color: var(--at-fg); }
.at.is-shrugging .at-shrug { opacity: 1; transform: none; }
.at-ask { display: flex; flex-direction: column; gap: 10px; padding: 12px 14px; border-radius: var(--radius-lg); background: oklch(from var(--brand) var(--tint-l) calc(c * var(--tint-c)) h); animation: at-in var(--spring-ui-duration) var(--spring-ui) both; }
.at-ask-text { font-weight: 500; }
.at-ask-actions { display: flex; flex-wrap: wrap; gap: 8px; }
.at-ask button { height: 36px; padding: 0 14px; border: 0; border-radius: var(--radius-md); font: inherit; font-weight: 600; cursor: pointer; }
.at-attach { background: var(--at-accent); color: var(--at-on-accent); }
.at-anyway { background: var(--fill-on-tint); color: var(--at-fg); }
.at-status { min-height: 18px; color: var(--at-muted); font-size: var(--text-small); line-height: var(--leading-small); }
.at-status:empty { display: none; }

@media (prefers-reduced-motion: reduce) {
  .at.is-hint .at-clip, .at-send.is-shrug, .at-file, .at-ask { animation: none; }
  .at-shrug { transition-duration: var(--duration-reduced); }
}
/* Multi-line text wraps evenly and never ends on one or two lonely words */
.at :is(p, li, dd, dt, small, label, figcaption, h1, h2, h3, h4) { text-wrap: balance; }
.at [hidden] { display: none !important; }

</style>
<style>
/* Reset: a small icon button in the corner of every demo; a "Reset" pill slides out on hover or focus */
.mi-host { display: contents; }
.mi-reset { position: absolute; top: 12px; right: 12px; z-index: 5; display: grid; place-items: center; width: 32px; height: 32px; padding: 0; border: 1px solid var(--border); border-radius: var(--radius-full); background: var(--card); color: var(--muted-foreground); box-shadow: var(--shadow-xs); cursor: pointer; -webkit-tap-highlight-color: transparent; transition: color var(--duration-fast) var(--ease-out), border-color var(--duration-fast) var(--ease-out); }
.mi-reset svg { width: 16px; height: 16px; transition: transform var(--spring-ui-duration) var(--spring-ui); }
.mi-reset:hover, .mi-reset:focus-visible { color: var(--foreground); border-color: var(--border-strong); }
.mi-reset:hover svg { transform: rotate(-45deg); }
.mi-reset.is-spin svg { transform: rotate(-360deg); transition: transform var(--spring-pop-duration) var(--spring-pop); }
.mi-reset:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }
.mi-reset-tip { position: absolute; top: 50%; right: calc(100% + 6px); padding: 4px 10px; border-radius: var(--radius-full); background: var(--foreground); color: var(--background); font: 500 var(--text-caption)/var(--leading-caption) var(--font-sans); white-space: nowrap; pointer-events: none; opacity: 0; transform: translate(6px, -50%) scale(0.96); transform-origin: right center; transition: opacity var(--duration-fast) var(--ease-out), transform var(--spring-ui-duration) var(--spring-ui); }
.mi-reset:hover .mi-reset-tip, .mi-reset:focus-visible .mi-reset-tip { opacity: 1; transform: translate(0, -50%) scale(1); }
.mi-reset--page { position: fixed; top: 16px; right: 16px; }
@media (hover: none) { .mi-reset-tip { display: none; } }
@media (prefers-reduced-motion: reduce) { .mi-reset svg, .mi-reset.is-spin svg, .mi-reset-tip { transition: opacity var(--duration-reduced) var(--ease-out); transform: none; } .mi-reset-tip { transform: translate(0, -50%); } }
.mi-sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

</style>
</head>
<body>
<button type="button" class="mi-reset mi-reset--page" data-mi-reset aria-label="Reset Attachment Shrug"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg><span class="mi-reset-tip" aria-hidden="true">Reset</span></button>
<div class="mi-host"><div class="at" data-mi="attachment-shrug" data-file="Q4 Numbers.pdf" data-size="2.4 MB">
  <div class="at-fields">
    <p class="at-row"><span>To</span><b>finance@company.com</b></p>
    <p class="at-row"><span>Subject</span><b>Q4 numbers</b></p>
  </div>
  <textarea class="at-body" rows="3" aria-label="Message">Hi team, please see the attached deck with the Q4 numbers.</textarea>
  <div class="at-files"></div>
  <div class="at-bar">
    <button type="button" class="at-clip" aria-label="Attach a file"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M20 11.5 12 19.4a5 5 0 0 1-7.1-7.1l8.5-8.5a3.4 3.4 0 0 1 4.8 4.8l-8.5 8.5a1.7 1.7 0 0 1-2.4-2.4L15 7"/></svg></button>
    <div class="at-send-wrap">
      <span class="at-shrug" aria-hidden="true">¯\_(ツ)_/¯</span>
      <button type="button" class="at-send">Send</button>
    </div>
  </div>
  <div class="at-ask" hidden>
    <p class="at-ask-text">You wrote “attached”, but nothing is attached.</p>
    <div class="at-ask-actions">
      <button type="button" class="at-attach">Attach File</button>
      <button type="button" class="at-anyway">Send Anyway</button>
    </div>
  </div>
  <p class="at-status" role="status" aria-live="polite"></p>
</div>
</div>
<script>
/* Attachment Shrug — vanilla JS. Auto-initializes every [data-mi="attachment-shrug"].
   If the message mentions an attachment and none is attached, the paperclip looks around while you type and
   Send shrugs instead of sending. Call window.initAttachmentShrug(el) for elements added later. */
(function () {
  'use strict';
  var MENTION = /\b(attach(ed|ment|ments|ing)?|enclosed|see the file|i('|’)ve included)\b/i;

  // Even line breaks: text that wraps to two or three lines is narrowed until its lines are close in length,
  // with the first line the longest, so no line runs long while the next holds a word or two.
  function evenLines(root) {
    var SEL = 'p, li, dd, dt, small, label, figcaption, h1, h2, h3, h4';
    function widths(el) {
      var range = document.createRange(), rows = [];
      range.selectNodeContents(el);
      Array.prototype.forEach.call(range.getClientRects(), function (b) {
        if (!b.width) return;
        var row = rows.filter(function (x) { return Math.abs(x.t - b.top) < b.height / 2; })[0];
        if (row) { row.l = Math.min(row.l, b.left); row.r = Math.max(row.r, b.right); } else rows.push({ t: b.top, l: b.left, r: b.right });
      });
      return rows.sort(function (a, b) { return a.t - b.t; }).map(function (x) { return x.r - x.l; });
    }
    function fit(el) {
      el.style.maxWidth = ''; el.style.textWrap = '';
      var cs = getComputedStyle(el), full = el.getBoundingClientRect().width;
      if (!full || cs.whiteSpace === 'nowrap' || /flex|grid/.test(cs.display)) return;
      if (Array.prototype.some.call(el.children, function (c) { return !/^inline/.test(getComputedStyle(c).display); })) return;
      el.style.textWrap = 'wrap';
      var n = widths(el).length, lo = 0, hi = full, w, L;
      if (n < 2 || n > 3) { el.style.textWrap = ''; return; }
      while (hi - lo > 1) { w = (lo + hi) / 2; el.style.maxWidth = w + 'px'; if (widths(el).length > n) lo = w; else hi = w; }
      var best = 0, gap = Infinity;
      for (w = Math.ceil(hi); w <= full; w += 2) {
        el.style.maxWidth = w + 'px'; L = widths(el);
        // Each line no longer than the one above (within 10%, which reads as equal). Keep the most even width,
        // and prefer the first line longer: a last line longer than the first costs three times its overhang
        var score = Math.max.apply(null, L) - Math.min.apply(null, L) + Math.max(0, L[n - 1] - L[0]) * 3;
        if (L.length === n && L.every(function (x, i) { return !i || x <= L[i - 1] * 1.1 + 1; }) && score < gap) { gap = score; best = w; }
      }
      if (!best) { el.style.maxWidth = ''; el.style.textWrap = ''; return; }
      el.style.maxWidth = best + 'px';
      if (cs.textAlign === 'center' && cs.display === 'block') { el.style.marginLeft = 'auto'; el.style.marginRight = 'auto'; }
    }
    var queued = false, lastW = 0;
    function run() { queued = false; Array.prototype.forEach.call(root.querySelectorAll(SEL), fit); }
    function later() { if (!queued) { queued = true; requestAnimationFrame(run); } }
    later();
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(later);
    if (window.ResizeObserver) new ResizeObserver(function () { var w = root.getBoundingClientRect().width; if (Math.abs(w - lastW) > 0.5) { lastW = w; later(); } }).observe(root);
    if (window.MutationObserver) new MutationObserver(later).observe(root, { subtree: true, childList: true, characterData: true, attributes: true, attributeFilter: ['hidden'] });
  }

  function initAttachmentShrug(root) {
    if (!root || root.__miShrug) return;
    root.__miShrug = true;
    evenLines(root);
    var body = root.querySelector('.at-body'), files = root.querySelector('.at-files');
    var clip = root.querySelector('.at-clip'), send = root.querySelector('.at-send');
    var ask = root.querySelector('.at-ask'), attach = root.querySelector('.at-attach'), anyway = root.querySelector('.at-anyway');
    var status = root.querySelector('.at-status');
    var name = root.getAttribute('data-file') || 'File.pdf', size = root.getAttribute('data-size') || '';
    var hasFile = false;

    function missing() { return MENTION.test(body.value) && !hasFile; }
    function hint() { root.classList.toggle('is-hint', missing()); }
    function calm() { root.classList.remove('is-shrugging'); ask.hidden = true; }

    function addFile() {
      if (hasFile) return;
      hasFile = true;
      var f = document.createElement('div'); f.className = 'at-file';
      var ic = document.createElement('span'); ic.className = 'at-file-icon'; ic.textContent = (name.split('.').pop() || '').toUpperCase();
      var nm = document.createElement('span'); nm.className = 'at-file-name'; nm.textContent = name;
      var sm = document.createElement('small'); sm.textContent = size; nm.appendChild(sm);
      var rm = document.createElement('button'); rm.type = 'button'; rm.className = 'at-remove'; rm.setAttribute('aria-label', 'Remove ' + name); rm.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>';
      rm.addEventListener('click', function () { f.remove(); hasFile = false; hint(); clip.focus(); });
      f.append(ic, nm, rm);
      files.appendChild(f);
      calm(); hint();
    }

    body.addEventListener('input', function () { status.textContent = ''; hint(); if (!missing()) calm(); });
    clip.addEventListener('click', addFile);
    attach.addEventListener('click', function () { addFile(); send.focus(); });

    send.addEventListener('click', function () {
      if (missing()) {
        send.classList.remove('is-shrug'); void send.offsetWidth; send.classList.add('is-shrug');
        root.classList.add('is-shrugging');
        ask.hidden = false;
        status.textContent = '';
        return;
      }
      calm();
      status.textContent = hasFile ? 'Sent, with the attachment. Nobody has to reply “I think you forgot the file.”' : 'Sent.';
    });
    anyway.addEventListener('click', function () {
      calm();
      status.textContent = 'Sent without it. Expect a reply in about four minutes saying you forgot the file.';
      send.focus();
    });
    hint();
  }

  window.initAttachmentShrug = initAttachmentShrug;
  function boot() { document.querySelectorAll('[data-mi="attachment-shrug"]').forEach(initAttachmentShrug); }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();

</script>
<script>
(function () {
  var host = document.querySelector('.mi-host'), orig = host.innerHTML, fn = window["initAttachmentShrug"];
  document.querySelector('[data-mi-reset]').addEventListener('click', function (e) {
    host.innerHTML = orig;
    host.querySelectorAll('[data-mi]').forEach(function (el) { if (typeof fn === 'function') fn(el); });
    var b = e.currentTarget; b.classList.remove('is-spin'); void b.offsetWidth; b.classList.add('is-spin');
    setTimeout(function () { b.classList.remove('is-spin'); }, 700);
  });
})();
</script>
</body>
