<style>

  --text-body: 15px;

/* Merge Zipper — two versions zip together line by line; the zipper snags on a conflict until you pick a side.
   Outcraft Design System v2. Every value is an Outcraft token. */
.mz {
  --mz-bg: var(--card);
  --mz-fg: var(--foreground);
  --mz-muted: var(--muted-foreground);
  --mz-sunken: var(--subtle);
  --mz-fill: var(--muted);
  --mz-accent: var(--primary);
  --mz-on-accent: var(--primary-foreground);
  --mz-yours: var(--info);
  --mz-theirs: var(--orange);
  --mz-row: 28px;
  display: flex;
  flex-direction: column;
  gap: 16px;
  width: 100%;
  max-width: 400px;
  box-sizing: border-box;
  padding: 20px;
  background: var(--mz-bg);
  color: var(--mz-fg);
  border-radius: var(--radius-xl);
  border: 1px solid var(--border);
  box-shadow: var(--shadow-sm);
  font: 400 var(--text-body)/var(--leading-body) var(--font-sans);
  letter-spacing: normal;
  text-align: left;
  -webkit-font-smoothing: antialiased;
}
.mz p { margin: 0; }
.mz-head { display: flex; align-items: center; gap: 12px; }
.mz-tile { flex: none; display: grid; place-items: center; width: 40px; height: 40px; border-radius: var(--radius-md); background: var(--mz-fill); }
.mz-tile svg { width: 20px; height: 20px; stroke-width: 1.75; }
.mz-title { min-width: 0; }
.mz-title b { display: block; font-weight: 600; }
.mz-title small { display: block; margin-top: 2px; color: var(--mz-muted); font-size: var(--text-small); line-height: var(--leading-small); }

/* The code: two columns with the zipper's teeth between them */
.mz-code { padding: 12px 12px 8px; border-radius: var(--radius-lg); background: var(--mz-sunken); }
.mz-cols { display: grid; grid-template-columns: minmax(0, 1fr) 20px minmax(0, 1fr); padding-bottom: 6px; color: var(--mz-muted); font-size: var(--text-caption); line-height: var(--leading-caption); font-weight: 600; }
.mz-cols span:last-child { grid-column: 3; text-align: right; }
.mz-rows { position: relative; }
.mz-row { position: relative; display: grid; grid-template-columns: minmax(0, 1fr) 20px minmax(0, 1fr); align-items: center; height: var(--mz-row); font: 400 var(--text-caption)/var(--mz-row) var(--font-mono); white-space: nowrap; }
.mz-l, .mz-r { overflow: hidden; text-overflow: ellipsis; transition: transform var(--spring-ui-duration) var(--spring-ui), opacity var(--duration-base); }
.mz-r { text-align: right; }
.mz-m { position: absolute; left: 50%; top: 50%; padding: 0 8px; border-radius: var(--radius-sm); line-height: 22px; transform: translate(-50%, -50%) scale(0.9); opacity: 0; transition: transform var(--spring-pop-duration) var(--spring-pop), opacity var(--duration-base); }
/* Teeth: two staggered rows that slide together as the pull passes */
.mz-teeth { position: relative; align-self: stretch; }
.mz-teeth::before, .mz-teeth::after { content: ""; position: absolute; top: 0; bottom: 0; width: 7px; background: repeating-linear-gradient(to bottom, var(--border-strong) 0 4px, transparent 4px 7px); transition: transform var(--spring-ui-duration) var(--spring-ui); }
.mz-teeth::before { left: 2px; }
.mz-teeth::after { right: 2px; background-position: 0 3.5px; }
.mz-row.is-zipped .mz-teeth::before { transform: translateX(3px); }
.mz-row.is-zipped .mz-teeth::after { transform: translateX(-3px); }
.mz-row.is-zipped .mz-l { transform: translateX(24px); opacity: 0; }
.mz-row.is-zipped .mz-r { transform: translateX(-24px); opacity: 0; }
.mz-row.is-zipped .mz-teeth { opacity: 0; transition: opacity var(--duration-slow) var(--duration-fast); }
.mz-row.is-zipped .mz-m { transform: translate(-50%, -50%); opacity: 1; }
/* The conflict: each side tinted in its own color */
.mz-row.is-conflict .mz-l, .mz-row.is-conflict .mz-r { padding: 0 6px; border-radius: var(--radius-sm); line-height: 22px; }
.mz-row.is-conflict .mz-l, .mz-m.is-l { background: oklch(from var(--mz-yours) var(--tint-l) calc(c * var(--tint-c)) h); }
.mz-row.is-conflict .mz-r, .mz-m.is-r { background: oklch(from var(--mz-theirs) var(--tint-l) calc(c * var(--tint-c)) h); }
.mz-pull { position: absolute; left: 50%; top: 0; width: 14px; height: 22px; margin-left: -7px; border-radius: var(--radius-xs); background: var(--mz-accent); box-shadow: var(--shadow-sm); transform: translateY(-14px); transition: transform var(--duration-base) var(--ease-out), opacity var(--duration-base); }
/* Once everything is zipped the pull has done its job and steps out of the way of the last line */
.mz.is-merged .mz-pull { opacity: 0; }
.mz-pull::after { content: ""; position: absolute; left: 4px; right: 4px; bottom: 4px; height: 7px; border-radius: 2px; background: var(--mz-sunken); }
.mz.is-snagged .mz-pull { animation: mz-snag 0.5s var(--ease-in-out); }
@keyframes mz-snag { 20%, 60% { translate: -3px 0; } 40%, 80% { translate: 3px 0; } }

.mz-pick { display: flex; flex-direction: column; gap: 12px; padding: 14px 16px 16px; border-radius: var(--radius-lg); background: var(--mz-sunken); animation: mz-in var(--spring-panel-duration) var(--spring-panel); }
@keyframes mz-in { from { opacity: 0; transform: translateY(-6px); } }
.mz-pick-msg { font-size: var(--text-small); line-height: var(--leading-small); text-box: trim-start cap alphabetic; }
/* Side by side and equal while both fit; on the narrowest phones each takes its own full-width row */
.mz-pick-btns { display: flex; flex-wrap: wrap; gap: 8px; }
.mz-keep { flex: 1 1 120px; min-width: 0; display: inline-flex; align-items: center; justify-content: center; height: 44px; padding: 0 12px; border: 0; border-radius: var(--radius-md); background: var(--fill-on-subtle); color: var(--mz-fg); font: inherit; font-size: var(--text-ui); font-weight: 600; white-space: nowrap; cursor: pointer; transition: transform var(--spring-press-duration) var(--spring-press); }
.mz-dot { width: 8px; height: 8px; margin-right: 8px; border-radius: 50%; }
.mz-dot.is-l { background: var(--mz-yours); }
.mz-dot.is-r { background: var(--mz-theirs); }

.mz-foot { display: flex; align-items: center; gap: 12px; }
.mz .mz-status { flex: 1; min-width: 0; margin-right: auto; color: var(--mz-muted); font-size: var(--text-small); line-height: var(--leading-small); }
.mz-btn { flex: none; height: 44px; padding: 0 16px; border: 0; border-radius: var(--radius-md); background: var(--mz-accent); color: var(--mz-on-accent); font: inherit; font-size: var(--text-ui); font-weight: 600; white-space: nowrap; cursor: pointer; transition: transform var(--spring-press-duration) var(--spring-press); }
.mz-btn.is-secondary { background: var(--mz-fill); color: var(--mz-fg); }
.mz-btn:disabled { cursor: default; background: var(--mz-fill); color: var(--mz-muted); }
.mz-btn:not(:disabled):active, .mz-keep:active { transform: scale(var(--press-scale)); }
.mz-btn:focus-visible, .mz-keep:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }

@media (prefers-reduced-motion: reduce) {
  .mz-l, .mz-r, .mz-m, .mz-teeth::before, .mz-teeth::after, .mz-pull { transition-duration: var(--duration-reduced); }
  .mz-row.is-zipped .mz-l, .mz-row.is-zipped .mz-r { transform: none; }
  .mz.is-snagged .mz-pull, .mz-pick { animation: none; }
}
/* Multi-line text wraps evenly and never ends on one or two lonely words */
.mz :is(p, li, dd, dt, small, label, figcaption, h1, h2, h3, h4) { text-wrap: balance; }
.mz [hidden] { display: none !important; }

</style>

<body>

<div class="mz" data-mi="merge-zipper">
  <div class="mz-head">
    <span class="mz-tile"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="18" cy="18" r="3" /><circle cx="6" cy="6" r="3" /><path d="M6 21V9a9 9 0 0 0 9 9" /></svg></span>
    <p class="mz-title"><b>Merge feature/pricing into main</b><small>6 lines, 1 changed on both sides</small></p>
  </div>
  <div class="mz-code">
    <div class="mz-cols" aria-hidden="true"><span>Yours</span><span>Theirs</span></div>
    <div class="mz-rows">
      <div class="mz-row" data-l="plan: 'pro'," data-r="plan: 'pro',"></div>
      <div class="mz-row" data-l="seats: 5," data-r="seats: 5,"></div>
      <div class="mz-row" data-l="trial: 14," data-r="trial: 14,"></div>
      <div class="mz-row" data-l="price: 24," data-r="price: 29,"></div>
      <div class="mz-row" data-l="cur: 'USD'," data-r="cur: 'USD',"></div>
      <div class="mz-row" data-l="yearly: no," data-r="yearly: no,"></div>
      <span class="mz-pull" aria-hidden="true"></span>
    </div>
  </div>
  <div class="mz-pick" hidden>
    <p class="mz-pick-msg">Both branches changed line 4. Which one stays?</p>
    <div class="mz-pick-btns">
      <button type="button" class="mz-keep" data-side="l"><i class="mz-dot is-l" aria-hidden="true"></i>Keep Yours</button>
      <button type="button" class="mz-keep" data-side="r"><i class="mz-dot is-r" aria-hidden="true"></i>Keep Theirs</button>
    </div>
  </div>
  <div class="mz-foot">
    <p class="mz-status" role="status" aria-live="polite">Ready to merge.</p>
    <button type="button" class="mz-btn">Merge</button>
  </div>
</div>


<script>
/* Merge Zipper — vanilla JS. Auto-initializes every [data-mi="merge-zipper"].
   Each row holds data-l (yours) and data-r (theirs). Merge runs the pull down the rows: equal lines zip into one,
   a line that differs snags the zipper until you keep one side. Call window.initMergeZipper(el) for elements added later. */
(function () {
  'use strict';
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)');

  // Even line breaks: text that wraps to two or three lines is narrowed until its lines are close in length,
  // with the first line the longest, so no line runs long while the next holds a word or two.
  function evenLines(root) {
    var SEL = 'p, li, dd, dt, small, label, figcaption, h1, h2, h3, h4';
    function widths(el) {
      var range = document.createRange(), rows = [];
      range.selectNodeContents(el);
      Array.prototype.forEach.call(range.getClientRects(), function (b) {
        if (!b.width) return;
        var row = rows.filter(function (x) { return Math.abs(x.t - b.top) < b.height / 2; })[0];
        if (row) { row.l = Math.min(row.l, b.left); row.r = Math.max(row.r, b.right); } else rows.push({ t: b.top, l: b.left, r: b.right });
      });
      return rows.sort(function (a, b) { return a.t - b.t; }).map(function (x) { return x.r - x.l; });
    }
    function fit(el) {
      el.style.maxWidth = ''; el.style.textWrap = '';
      // A filled box marked data-fill spans the card from edge to edge, and its text fills it
      if (el.hasAttribute('data-fill')) return;
      var cs = getComputedStyle(el), full = el.getBoundingClientRect().width;
      if (!full || cs.whiteSpace === 'nowrap' || /flex|grid/.test(cs.display)) return;
      if (Array.prototype.some.call(el.children, function (c) { return !/^inline/.test(getComputedStyle(c).display); })) return;
      el.style.textWrap = 'wrap';
      var n = widths(el).length, lo = 0, hi = full, w, L;
      if (n < 2 || n > 3) { el.style.textWrap = ''; return; }
      while (hi - lo > 1) { w = (lo + hi) / 2; el.style.maxWidth = w + 'px'; if (widths(el).length > n) lo = w; else hi = w; }
      var best = 0, gap = Infinity;
      for (w = Math.ceil(hi); w <= full; w += 2) {
        el.style.maxWidth = w + 'px'; L = widths(el);
        // Each line no longer than the one above (within 10%, which reads as equal). Keep the most even width,
        // and prefer the first line longer: a last line longer than the first costs three times its overhang
        var score = Math.max.apply(null, L) - Math.min.apply(null, L) + Math.max(0, L[n - 1] - L[0]) * 3;
        if (L.length === n && L.every(function (x, i) { return !i || x <= L[i - 1] * 1.1 + 1; }) && score < gap) { gap = score; best = w; }
      }
      if (!best) { el.style.maxWidth = ''; el.style.textWrap = ''; return; }
      el.style.maxWidth = best + 'px';
      if (cs.textAlign === 'center' && cs.display === 'block') { el.style.marginLeft = 'auto'; el.style.marginRight = 'auto'; }
    }
    var queued = false, lastW = 0;
    function run() { queued = false; Array.prototype.forEach.call(root.querySelectorAll(SEL), fit); }
    function later() { if (!queued) { queued = true; requestAnimationFrame(run); } }
    later();
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(later);
    if (window.ResizeObserver) new ResizeObserver(function () { var w = root.getBoundingClientRect().width; if (Math.abs(w - lastW) > 0.5) { lastW = w; later(); } }).observe(root);
    if (window.MutationObserver) new MutationObserver(later).observe(root, { subtree: true, childList: true, characterData: true, attributes: true, attributeFilter: ['hidden'] });
  }

  function initMergeZipper(root) {
    if (!root || root.__miMz) return;
    root.__miMz = true;
    evenLines(root);
    var rows = Array.prototype.slice.call(root.querySelectorAll('.mz-row'));
    var pull = root.querySelector('.mz-pull'), pick = root.querySelector('.mz-pick'), pickMsg = root.querySelector('.mz-pick-msg');
    var status = root.querySelector('.mz-status'), btn = root.querySelector('.mz-btn');
    var keeps = root.querySelectorAll('.mz-keep');
    var H = 28, timer = 0, at = 0, busy = false, merged = false, settled = 0;

    rows.forEach(function (row) {
      var l = row.getAttribute('data-l'), r = row.getAttribute('data-r');
      row.innerHTML = '<span class="mz-l"></span><span class="mz-teeth" aria-hidden="true"></span><span class="mz-r"></span><span class="mz-m"></span>';
      row.querySelector('.mz-l').textContent = l; row.querySelector('.mz-r').textContent = r; row.querySelector('.mz-m').textContent = l;
    });
    var conflicts = rows.filter(function (r) { return r.getAttribute('data-l') !== r.getAttribute('data-r'); }).length;

    function speed(ms) { return reduce.matches ? Math.min(ms, 120) : ms; }
    function pullTo(y) { pull.style.transform = 'translateY(' + y + 'px)'; }
    function rowY(i) { return i * H + (H - 22) / 2; }

    function step() {
      if (at >= rows.length) return finish();
      var row = rows[at];
      pullTo(rowY(at));
      timer = setTimeout(function () {
        if (row.getAttribute('data-l') !== row.getAttribute('data-r') && !row.hasAttribute('data-kept')) return snag(row);
        row.classList.add('is-zipped'); at++; step();
      }, speed(200));
    }

    function snag(row) {
      row.classList.add('is-conflict');
      root.classList.remove('is-snagged'); void root.offsetWidth; root.classList.add('is-snagged');
      pickMsg.textContent = 'Both branches changed line ' + (at + 1) + '. Which one stays?';
      pick.hidden = false;
      status.textContent = 'Snagged on line ' + (at + 1) + '.';
      keeps[0].focus({ preventScroll: true });
    }

    keeps.forEach(function (k) {
      k.addEventListener('click', function () {
        var row = rows[at], side = k.getAttribute('data-side'), m = row.querySelector('.mz-m');
        m.textContent = row.getAttribute('data-' + side);
        m.classList.add(side === 'l' ? 'is-l' : 'is-r');
        row.setAttribute('data-kept', side);
        row.classList.remove('is-conflict'); row.classList.add('is-zipped');
        pick.hidden = true; settled++;
        status.textContent = 'Kept ' + (side === 'l' ? 'yours' : 'theirs') + '. Zipping on…';
        btn.focus({ preventScroll: true });
        at++; timer = setTimeout(step, speed(260));
      });
    });

    function finish() {
      pullTo(rows.length * H - 14);
      busy = false; merged = true; root.classList.add('is-merged');
      status.textContent = conflicts ? 'Merged into main. ' + settled + (settled === 1 ? ' conflict' : ' conflicts') + ', settled by you.' : 'Merged into main. Nothing to settle.';
      btn.textContent = 'Unzip'; btn.classList.add('is-secondary'); btn.disabled = false;
    }

    function unzip() {
      var i = rows.length - 1;
      busy = true; btn.disabled = true; root.classList.remove('is-merged');
      (function back() {
        if (i < 0) { reset(); status.textContent = 'Unzipped. Ready to merge again.'; btn.focus({ preventScroll: true }); return; }
        var row = rows[i];
        row.classList.remove('is-zipped');
        pullTo(rowY(i) - H);
        i--; timer = setTimeout(back, speed(70));
      })();
    }

    function reset() {
      clearTimeout(timer);
      rows.forEach(function (row) {
        row.classList.remove('is-zipped', 'is-conflict'); row.removeAttribute('data-kept');
        var m = row.querySelector('.mz-m'); m.className = 'mz-m'; m.textContent = row.getAttribute('data-l');
      });
      at = 0; settled = 0; busy = false; merged = false; pick.hidden = true; root.classList.remove('is-merged');
      pullTo(-14);
      btn.textContent = 'Merge'; btn.classList.remove('is-secondary'); btn.disabled = false;
    }

    btn.addEventListener('click', function () {
      if (busy) return;
      if (merged) return unzip();
      busy = true; btn.disabled = true;
      status.textContent = 'Zipping…';
      step();
    });

    // The button keeps one width whether it says Merge or Unzip
    function sizeBtn() {
      var keep = btn.textContent, w = 0;
      ['Merge', 'Unzip'].forEach(function (s) { btn.textContent = s; btn.style.minWidth = ''; w = Math.max(w, btn.getBoundingClientRect().width); });
      btn.textContent = keep; btn.style.minWidth = Math.ceil(w) + 'px';
    }
    sizeBtn();
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(sizeBtn);
    reset();
  }

  window.initMergeZipper = initMergeZipper;
  function boot() { document.querySelectorAll('[data-mi="merge-zipper"]').forEach(initMergeZipper); }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();

</script>
</body>
</html>
