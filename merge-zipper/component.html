<div class="mz" data-mi="merge-zipper">
  <div class="mz-head">
    <span class="mz-tile"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="18" cy="18" r="3" /><circle cx="6" cy="6" r="3" /><path d="M6 21V9a9 9 0 0 0 9 9" /></svg></span>
    <p class="mz-title"><b>Merge feature/pricing into main</b><small>6 lines, 1 changed on both sides</small></p>
  </div>
  <div class="mz-code">
    <div class="mz-cols" aria-hidden="true"><span>Yours</span><span>Theirs</span></div>
    <div class="mz-rows">
      <div class="mz-row" data-l="plan: 'pro'," data-r="plan: 'pro',"></div>
      <div class="mz-row" data-l="seats: 5," data-r="seats: 5,"></div>
      <div class="mz-row" data-l="trial: 14," data-r="trial: 14,"></div>
      <div class="mz-row" data-l="price: 24," data-r="price: 29,"></div>
      <div class="mz-row" data-l="cur: 'USD'," data-r="cur: 'USD',"></div>
      <div class="mz-row" data-l="yearly: no," data-r="yearly: no,"></div>
      <span class="mz-pull" aria-hidden="true"></span>
    </div>
  </div>
  <div class="mz-pick" hidden>
    <p class="mz-pick-msg">Both branches changed line 4. Which one stays?</p>
    <div class="mz-pick-btns">
      <button type="button" class="mz-keep" data-side="l"><i class="mz-dot is-l" aria-hidden="true"></i>Keep Yours</button>
      <button type="button" class="mz-keep" data-side="r"><i class="mz-dot is-r" aria-hidden="true"></i>Keep Theirs</button>
    </div>
  </div>
  <div class="mz-foot">
    <p class="mz-status" role="status" aria-live="polite">Ready to merge.</p>
    <button type="button" class="mz-btn">Merge</button>
  </div>
</div>
