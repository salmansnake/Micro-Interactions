<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Leaning Empty State · Micro Interactions</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="../outcraft-tokens.css">
<style>
html, body { min-height: 100%; }
body { margin: 0; display: grid; place-items: center; padding: 64px 16px 48px; box-sizing: border-box; background: var(--subtle); color: var(--body); font-family: var(--font-sans); }
</style>
<style>
/* Leaning Empty State — the empty screen's illustration leans toward the button as you get close.
   Outcraft Design System v2. Every value is an Outcraft token. */
.le {
  --le-bg: var(--card);
  --le-fg: var(--foreground);
  --le-muted: var(--muted-foreground);
  --le-line: var(--border);
  --le-sunken: var(--subtle);
  --le-fill: var(--muted);
  --le-accent: var(--primary);
  --le-on-accent: var(--primary-foreground);
  --le-pull: 0;
  position: relative;
  width: 100%;
  max-width: 440px;
  box-sizing: border-box;
  padding: 28px 24px;
  background: var(--le-bg);
  color: var(--le-fg);
  border-radius: var(--radius-xl);
  border: 1px solid var(--border);
  box-shadow: var(--shadow-sm);
  font: 400 var(--text-body)/var(--leading-body) var(--font-sans);
  letter-spacing: normal;
  text-align: center;
  -webkit-font-smoothing: antialiased;
}
.le-empty { display: flex; flex-direction: column; align-items: center; gap: 8px; }
.le-art { position: relative; width: 240px; height: 132px; margin-bottom: 10px; perspective: 600px; }
.le-tile {
  position: absolute;
  display: flex;
  flex-direction: column;
  gap: 5px;
  box-sizing: border-box;
  padding: 10px;
  border-radius: var(--radius-lg);
  background: var(--le-bg);
  box-shadow: 0 0 0 1px var(--le-line), var(--shadow-md);
  transform: translate(var(--tx, 0px), var(--ty, 0px)) rotateX(var(--rx, 0deg)) rotateY(var(--ry, 0deg)) rotate(var(--r0, 0deg));
  transition: transform var(--spring-ui-duration) var(--spring-ui), box-shadow var(--duration-slow);
  will-change: transform;
}
.le-tile i { display: block; height: 6px; border-radius: var(--radius-xs); background: var(--le-fill); }
.le-tile i:first-child { width: 60%; background: color-mix(in srgb, var(--tile, var(--le-accent)) 70%, transparent); }
.le-tile i:nth-child(2) { width: 85%; }
.le-tile i:nth-child(3) { width: 45%; }
.le-tile--a { left: 6px; top: 34px; width: 72px; height: 66px; --r0: -8deg; --tile: var(--ai); }
.le-tile--b { left: 70px; top: 4px; width: 64px; height: 52px; --r0: 5deg; --tile: var(--success); }
.le-tile--c { left: 128px; top: 40px; width: 76px; height: 70px; --r0: -3deg; --tile: var(--le-accent); }
.le-tile--d { left: 186px; top: 8px; width: 52px; height: 48px; --r0: 10deg; --tile: var(--chart-2); }
.le-title { margin: 0; font-size: var(--text-title); line-height: var(--leading-title); font-weight: 600; letter-spacing: var(--tracking-title); }
.le-body { margin: 0 0 12px; max-width: 30ch; color: var(--le-muted); font-size: var(--text-body); line-height: var(--leading-body); }
.le-cta {
  height: 44px;
  padding: 0 22px;
  border: 0;
  border-radius: var(--radius-md);
  background: var(--le-accent);
  color: var(--le-on-accent);
  font: inherit;
  font-size: var(--text-title-sm);
  font-weight: 600;
  letter-spacing: var(--tracking-title);
  cursor: pointer;
  box-shadow: 0 0 0 calc(var(--le-pull) * 6px) color-mix(in srgb, var(--brand) 16%, transparent);
  transition: transform var(--spring-press-duration) var(--spring-press), box-shadow var(--duration-slow);
}
.le-cta:active { transform: scale(var(--press-scale)); }
.le-cta:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }
/* After creating */
.le-filled { text-align: left; }
.le-list-title { margin: 0 0 10px; font-size: var(--text-title); line-height: var(--leading-title); font-weight: 600; letter-spacing: var(--tracking-title); }
.le-list { margin: 0 0 16px; padding: 0; list-style: none; border-radius: var(--radius-lg); background: var(--le-sunken); }
.le-item { display: flex; align-items: center; gap: 12px; padding: 12px 14px; }
.le-item-icon { display: grid; place-items: center; flex: none; width: 36px; height: 36px; border-radius: var(--radius-md); background: var(--le-accent); color: var(--le-on-accent); font-weight: 700; }
.le-item b { display: block; font-weight: 600; }
.le-item small { color: var(--le-muted); font-size: var(--text-small); }
.le-item.is-new { animation: le-arrive var(--spring-pop-duration) var(--spring-pop) both; }
@keyframes le-arrive { from { opacity: 0; transform: translateY(-24px) scale(0.9); } }
.le-reset { height: 32px; padding: 0 14px; border: 0; border-radius: var(--radius-sm); background: var(--le-fill); color: var(--le-fg); font: inherit; font-weight: 600; cursor: pointer; }
.le-reset:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) {
  .le-tile { transition: none; }
  .le-item.is-new { animation: none; }
}
.le [hidden] { display: none !important; }

</style>
<style>
/* Reset: a small icon button in the corner of every demo; a "Reset" pill slides out on hover or focus */
.mi-host { display: contents; }
.mi-reset { position: absolute; top: 12px; right: 12px; z-index: 5; display: grid; place-items: center; width: 32px; height: 32px; padding: 0; border: 1px solid var(--border); border-radius: var(--radius-full); background: var(--card); color: var(--muted-foreground); box-shadow: var(--shadow-xs); cursor: pointer; -webkit-tap-highlight-color: transparent; transition: color var(--duration-fast) var(--ease-out), border-color var(--duration-fast) var(--ease-out); }
.mi-reset svg { width: 16px; height: 16px; transition: transform var(--spring-ui-duration) var(--spring-ui); }
.mi-reset:hover, .mi-reset:focus-visible { color: var(--foreground); border-color: var(--border-strong); }
.mi-reset:hover svg { transform: rotate(-45deg); }
.mi-reset.is-spin svg { transform: rotate(-360deg); transition: transform var(--spring-pop-duration) var(--spring-pop); }
.mi-reset:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }
.mi-reset-tip { position: absolute; top: 50%; right: calc(100% + 6px); padding: 4px 10px; border-radius: var(--radius-full); background: var(--foreground); color: var(--background); font: 500 var(--text-caption)/var(--leading-caption) var(--font-sans); white-space: nowrap; pointer-events: none; opacity: 0; transform: translate(6px, -50%) scale(0.96); transform-origin: right center; transition: opacity var(--duration-fast) var(--ease-out), transform var(--spring-ui-duration) var(--spring-ui); }
.mi-reset:hover .mi-reset-tip, .mi-reset:focus-visible .mi-reset-tip { opacity: 1; transform: translate(0, -50%) scale(1); }
.mi-reset--page { position: fixed; top: 16px; right: 16px; }
@media (hover: none) { .mi-reset-tip { display: none; } }
@media (prefers-reduced-motion: reduce) { .mi-reset svg, .mi-reset.is-spin svg, .mi-reset-tip { transition: opacity var(--duration-reduced) var(--ease-out); transform: none; } .mi-reset-tip { transform: translate(0, -50%); } }
.mi-sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

</style>
</head>
<body>
<button type="button" class="mi-reset mi-reset--page" data-mi-reset aria-label="Reset Leaning Empty State"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg><span class="mi-reset-tip" aria-hidden="true">Reset</span></button>
<div class="mi-host"><div class="le" data-mi="leaning-empty-state">
  <div class="le-empty">
    <div class="le-art" aria-hidden="true">
      <span class="le-tile le-tile--a"><i></i><i></i><i></i></span>
      <span class="le-tile le-tile--b"><i></i><i></i></span>
      <span class="le-tile le-tile--c"><i></i><i></i><i></i></span>
      <span class="le-tile le-tile--d"><i></i><i></i></span>
    </div>
    <p class="le-title">No Projects Yet</p>
    <p class="le-body">Projects keep your environments, files and teammates in one place.</p>
    <button type="button" class="le-cta">New Project</button>
  </div>
  <div class="le-filled" hidden>
    <p class="le-list-title">Projects</p>
    <ul class="le-list">
      <li class="le-item"><span class="le-item-icon">U</span><span><b>Untitled Project</b><small>Created just now</small></span></li>
    </ul>
    <button type="button" class="le-reset">Reset Demo</button>
  </div>
</div>
</div>
<script>
/* Leaning Empty State — vanilla JS. Auto-initializes every [data-mi="leaning-empty-state"].
   Call window.initLeaningEmptyState(el) for elements added later. */
(function () {
  'use strict';
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)');
  var RANGE = 320; // px from the button where the lean starts

  function initLeaningEmptyState(root) {
    if (!root || root.__miLean) return;
    root.__miLean = true;
    var empty = root.querySelector('.le-empty');
    var filled = root.querySelector('.le-filled');
    var cta = root.querySelector('.le-cta');
    var tiles = Array.prototype.slice.call(root.querySelectorAll('.le-tile'));
    var raf = 0, px = 0, py = 0;

    function lean(pull) {
      var c = cta.getBoundingClientRect();
      var cx = c.left + c.width / 2, cy = c.top + c.height / 2;
      root.style.setProperty('--le-pull', pull.toFixed(3));
      tiles.forEach(function (t) {
        var r = t.getBoundingClientRect();
        var dx = cx - (r.left + r.width / 2), dy = cy - (r.top + r.height / 2);
        var len = Math.hypot(dx, dy) || 1;
        var ux = dx / len, uy = dy / len;
        // Tilt so the tile's face turns toward the button, and drift a little toward it.
        t.style.setProperty('--rx', (-uy * 22 * pull).toFixed(2) + 'deg');
        t.style.setProperty('--ry', (ux * 22 * pull).toFixed(2) + 'deg');
        t.style.setProperty('--tx', (ux * 8 * pull).toFixed(2) + 'px');
        t.style.setProperty('--ty', (uy * 8 * pull).toFixed(2) + 'px');
      });
    }

    function frame() {
      raf = 0;
      var c = cta.getBoundingClientRect();
      var d = Math.hypot(px - (c.left + c.width / 2), py - (c.top + c.height / 2));
      lean(Math.max(0, Math.min(1, 1 - d / RANGE)));
    }

    root.addEventListener('pointermove', function (e) {
      if (reduce.matches || empty.hidden) return;
      px = e.clientX; py = e.clientY;
      if (!raf) raf = requestAnimationFrame(frame);
    });
    root.addEventListener('pointerleave', function () { lean(0); });
    cta.addEventListener('focus', function () { if (!reduce.matches) lean(1); });
    cta.addEventListener('blur', function () { lean(0); });

    cta.addEventListener('click', function () {
      var c = cta.getBoundingClientRect();
      var done = function () {
        empty.hidden = true;
        filled.hidden = false;
        var item = filled.querySelector('.le-item');
        item.classList.remove('is-new');
        void item.offsetWidth;
        item.classList.add('is-new');
        filled.querySelector('.le-reset').focus();
      };
      if (reduce.matches) { done(); return; }
      // The tiles gather into the button, then the first project arrives.
      tiles.forEach(function (t, i) {
        var r = t.getBoundingClientRect();
        var dx = c.left + c.width / 2 - (r.left + r.width / 2), dy = c.top + c.height / 2 - (r.top + r.height / 2);
        t.animate([
          { transform: getComputedStyle(t).transform, opacity: 1 },
          { transform: 'translate(' + dx + 'px,' + dy + 'px) scale(0.2) rotate(' + (i % 2 ? 40 : -40) + 'deg)', opacity: 0 }
        ], { duration: 420, delay: i * 50, easing: 'cubic-bezier(.5,0,.75,0)', fill: 'forwards' });
      });
      cta.animate([{ transform: 'scale(1)' }, { transform: 'scale(1.08)', offset: 0.7 }, { transform: 'scale(1)' }], { duration: 600, delay: 260 });
      setTimeout(done, 620);
    });

    root.querySelector('.le-reset').addEventListener('click', function () {
      filled.hidden = true;
      empty.hidden = false;
      tiles.forEach(function (t) { t.getAnimations().forEach(function (a) { a.cancel(); }); });
      lean(0);
      cta.focus();
    });
  }

  window.initLeaningEmptyState = initLeaningEmptyState;
  function boot() { document.querySelectorAll('[data-mi="leaning-empty-state"]').forEach(initLeaningEmptyState); }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();

</script>
<script>
(function () {
  var host = document.querySelector('.mi-host'), orig = host.innerHTML, fn = window["initLeaningEmptyState"];
  document.querySelector('[data-mi-reset]').addEventListener('click', function (e) {
    host.innerHTML = orig;
    host.querySelectorAll('[data-mi]').forEach(function (el) { if (typeof fn === 'function') fn(el); });
    var b = e.currentTarget; b.classList.remove('is-spin'); void b.offsetWidth; b.classList.add('is-spin');
    setTimeout(function () { b.classList.remove('is-spin'); }, 700);
  });
})();
</script>
</body>
</html>
