<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Token Taximeter · Micro Interactions</title>
<link rel="icon" type="image/svg+xml" href="../icons/outcraft-favicon-light.svg" media="(prefers-color-scheme: light)">
<link rel="icon" type="image/svg+xml" href="../icons/outcraft-favicon-dark.svg" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="../icons/outcraft-icon-180x180-light.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="../outcraft-tokens.css">
<style>
html, body { min-height: 100%; }
body { margin: 0; display: grid; place-items: center; padding: 64px 16px 48px; box-sizing: border-box; background: var(--subtle); color: var(--body); font-family: var(--font-sans); }
</style>
<style>
/* Token Taximeter — a taxi meter that runs as you type a prompt, so you see the cost before you send.
   Outcraft Design System v2. Every value is an Outcraft token. */
.tt {
  --tt-bg: var(--card);
  --tt-fg: var(--foreground);
  --tt-muted: var(--muted-foreground);
  --tt-line: var(--border);
  --tt-sunken: var(--subtle);
  --tt-fill: var(--muted);
  --tt-accent: var(--primary);
  --tt-thumb-c: var(--raised);
  --tt-amber: var(--warning);
  display: flex;
  flex-direction: column;
  gap: 10px;
  width: 100%;
  max-width: 440px;
  box-sizing: border-box;
  padding: 20px;
  background: var(--tt-bg);
  color: var(--tt-fg);
  border-radius: var(--radius-xl);
  border: 1px solid var(--border);
  box-shadow: var(--shadow-sm);
  font: 400 var(--text-body)/var(--leading-body) var(--font-sans);
  letter-spacing: normal;
  text-align: left;
  -webkit-font-smoothing: antialiased;
}
/* The meter: a dark display, always dark like real hardware */
.tt-meter {
  display: grid;
  grid-template-columns: auto 1fr;
  align-items: center;
  gap: 4px 12px;
  padding: 14px 16px;
  border-radius: var(--radius-xl);
  border: 1px solid var(--border);
  background: var(--black);
  color: var(--on-color);
  box-shadow: var(--shadow-sm);
}
.tt-flag { grid-row: span 2; align-self: start; padding: 3px 8px; border-radius: var(--radius-sm); background: color-mix(in srgb, var(--on-color) 10%, transparent); color: color-mix(in srgb, var(--on-color) 60%, transparent); font-size: calc(var(--text-caption) - 1px); font-weight: 700; letter-spacing: normal; transition: background-color var(--duration-base), color var(--duration-base); }
.tt.is-running .tt-flag { background: var(--tt-amber); color: var(--black); }
.tt-fare { justify-self: end; display: inline-flex; height: 40px; overflow: hidden; color: var(--tt-amber); font: 600 calc(var(--text-h2) + 4px) / 40px var(--font-mono); letter-spacing: 0; font-variant-numeric: tabular-nums; text-shadow: 0 0 12px color-mix(in srgb, var(--warning) 35%, transparent); }
.tt-col { display: flex; flex-direction: column; transition: transform var(--spring-ui-duration) var(--spring-ui); }
.tt-col span, .tt-fix { display: block; height: 40px; line-height: 40px; text-align: center; }
.tt-tokens { justify-self: end; color: color-mix(in srgb, var(--on-color) 60%, transparent); font-size: var(--text-caption); line-height: var(--leading-caption); font-variant-numeric: tabular-nums; }
.tt-meter.is-tick .tt-fare { animation: tt-tick var(--duration-base) var(--ease-out); }
@keyframes tt-tick { 50% { text-shadow: 0 0 18px color-mix(in srgb, var(--warning) 80%, transparent); } }
.tt-label { padding-left: 4px; color: var(--tt-muted); font-size: var(--text-small); line-height: var(--leading-small); }
.tt-input { width: 100%; box-sizing: border-box; padding: 12px 14px; border: 1px solid var(--input); box-shadow: var(--shadow-xs); border-radius: var(--radius-lg); background: var(--card); color: var(--tt-fg); font: inherit; font-size: var(--text-title-sm); line-height: var(--leading-title-sm); letter-spacing: var(--tracking-title); resize: vertical; outline: none; }
.tt-input:focus-visible { border-color: var(--ring); box-shadow: 0 0 0 3px color-mix(in srgb, var(--ring) 22%, transparent); }
.tt-controls { display: flex; flex-wrap: wrap; gap: 8px; }
.tt-seg { --n: 2; --i: 0; position: relative; display: inline-grid; grid-auto-flow: column; grid-auto-columns: 1fr; padding: 2px; border-radius: var(--radius-md); background: var(--tt-sunken); }
.tt-thumb { position: absolute; top: 2px; bottom: 2px; left: 2px; width: calc((100% - 4px) / var(--n)); border-radius: var(--radius-sm); background: var(--tt-thumb-c); box-shadow: var(--shadow-sm); transform: translateX(calc(var(--i) * 100%)); transition: transform var(--spring-ui-duration) var(--spring-ui); }
.tt-seg button { position: relative; z-index: 1; height: 30px; padding: 0 16px; border: 0; border-radius: var(--radius-sm); background: none; color: var(--tt-fg); font: inherit; font-size: var(--text-small); font-weight: 500; cursor: pointer; }
.tt-seg button[aria-checked="true"] { font-weight: 600; }
.tt-seg button:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }
.tt-budget { display: flex; flex-direction: column; gap: 6px; margin-top: 4px; }
.tt-bar { position: relative; display: flex; height: 8px; overflow: hidden; border-radius: var(--radius-xs); background: var(--tt-fill); }
.tt-used { display: block; height: 100%; background: var(--tt-accent); transition: width var(--spring-ui-duration) var(--spring-ui); }
.tt-next { display: block; height: 100%; background: repeating-linear-gradient(-45deg, color-mix(in srgb, var(--brand-strong) 55%, transparent) 0 3px, color-mix(in srgb, var(--brand) 25%, transparent) 3px 6px); transition: width var(--spring-ui-duration) var(--spring-ui); }
.tt-budget-text { margin: 0; color: var(--tt-muted); font-size: var(--text-small); line-height: var(--leading-small); font-variant-numeric: tabular-nums; }
.tt-budget-text b { color: var(--tt-fg); font-weight: 600; }
@media (prefers-reduced-motion: reduce) {
  .tt-col, .tt-thumb, .tt-used, .tt-next { transition-duration: var(--duration-reduced); }
  .tt-meter.is-tick .tt-fare { animation: none; }
}
.tt [hidden] { display: none !important; }

</style>
<style>
/* Reset: a small icon button in the corner of every demo; a "Reset" pill slides out on hover or focus */
.mi-host { display: contents; }
.mi-reset { position: absolute; top: 12px; right: 12px; z-index: 5; display: grid; place-items: center; width: 32px; height: 32px; padding: 0; border: 1px solid var(--border); border-radius: var(--radius-full); background: var(--card); color: var(--muted-foreground); box-shadow: var(--shadow-xs); cursor: pointer; -webkit-tap-highlight-color: transparent; transition: color var(--duration-fast) var(--ease-out), border-color var(--duration-fast) var(--ease-out); }
.mi-reset svg { width: 16px; height: 16px; transition: transform var(--spring-ui-duration) var(--spring-ui); }
.mi-reset:hover, .mi-reset:focus-visible { color: var(--foreground); border-color: var(--border-strong); }
.mi-reset:hover svg { transform: rotate(-45deg); }
.mi-reset.is-spin svg { transform: rotate(-360deg); transition: transform var(--spring-pop-duration) var(--spring-pop); }
.mi-reset:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }
.mi-reset-tip { position: absolute; top: 50%; right: calc(100% + 6px); padding: 4px 10px; border-radius: var(--radius-full); background: var(--foreground); color: var(--background); font: 500 var(--text-caption)/var(--leading-caption) var(--font-sans); white-space: nowrap; pointer-events: none; opacity: 0; transform: translate(6px, -50%) scale(0.96); transform-origin: right center; transition: opacity var(--duration-fast) var(--ease-out), transform var(--spring-ui-duration) var(--spring-ui); }
.mi-reset:hover .mi-reset-tip, .mi-reset:focus-visible .mi-reset-tip { opacity: 1; transform: translate(0, -50%) scale(1); }
.mi-reset--page { position: fixed; top: 16px; right: 16px; }
@media (hover: none) { .mi-reset-tip { display: none; } }
@media (prefers-reduced-motion: reduce) { .mi-reset svg, .mi-reset.is-spin svg, .mi-reset-tip { transition: opacity var(--duration-reduced) var(--ease-out); transform: none; } .mi-reset-tip { transform: translate(0, -50%); } }
.mi-sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

</style>
</head>
<body>
<button type="button" class="mi-reset mi-reset--page" data-mi-reset aria-label="Reset Token Taximeter"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg><span class="mi-reset-tip" aria-hidden="true">Reset</span></button>
<div class="mi-host"><div class="tt" data-mi="token-taximeter" data-budget="10" data-used="4.2">
  <div class="tt-meter">
    <span class="tt-flag">Waiting</span>
    <span class="tt-fare" aria-label="Estimated cost $0.0000"></span>
    <span class="tt-tokens">0 tokens in · 300 out</span>
  </div>
  <label class="tt-label" for="tt-input">Prompt</label>
  <textarea id="tt-input" class="tt-input" rows="4" placeholder="Ask anything…">Summarize last quarter's churn by plan and suggest three fixes.</textarea>
  <div class="tt-controls">
    <div class="tt-seg" role="radiogroup" aria-label="Model" style="--n:2;--i:0"><span class="tt-thumb"></span><button type="button" role="radio" aria-checked="true" data-model="fast">Fast</button><button type="button" role="radio" aria-checked="false" data-model="smart">Smart</button></div>
    <div class="tt-seg" role="radiogroup" aria-label="Answer length" style="--n:2;--i:0"><span class="tt-thumb"></span><button type="button" role="radio" aria-checked="true" data-len="300">Short</button><button type="button" role="radio" aria-checked="false" data-len="1200">Long</button></div>
  </div>
  <div class="tt-budget">
    <div class="tt-bar" aria-hidden="true"><i class="tt-used"></i><i class="tt-next"></i></div>
    <p class="tt-budget-text"></p>
  </div>
</div>
</div>
<script>
/* Token Taximeter — vanilla JS. Auto-initializes every [data-mi="token-taximeter"].
   Rates are per million tokens; tokens are estimated at 4 characters each. Swap estimate() for a real tokenizer.
   Call window.initTokenTaximeter(el) for elements added later. */
(function () {
  'use strict';
  var RATES = { fast: { in: 0.25, out: 1.25 }, smart: { in: 3, out: 15 } }; // $ per 1M tokens (example rates)
  var DIGIT_H = 40;

  function estimate(text) { return text.trim() ? Math.max(1, Math.ceil(text.length / 4)) : 0; }

  function initTokenTaximeter(root) {
    if (!root || root.__miTaxi) return;
    root.__miTaxi = true;
    var input = root.querySelector('.tt-input');
    var fare = root.querySelector('.tt-fare');
    var meter = root.querySelector('.tt-meter');
    var flag = root.querySelector('.tt-flag');
    var tokensEl = root.querySelector('.tt-tokens');
    var used = root.querySelector('.tt-used');
    var next = root.querySelector('.tt-next');
    var budgetText = root.querySelector('.tt-budget-text');
    var budget = Number(root.getAttribute('data-budget')) || 10;
    var spent = Number(root.getAttribute('data-used')) || 0;
    var model = 'fast', outTokens = 300, last = '', idle = 0;

    // Odometer with fixed "$" and "." and rolling digit columns.
    function drawFare(str) {
      if (fare.children.length !== str.length || fare.getAttribute('data-shape') !== str.replace(/\d/g, '9')) {
        fare.replaceChildren();
        fare.setAttribute('data-shape', str.replace(/\d/g, '9'));
        for (var i = 0; i < str.length; i++) {
          if (/\d/.test(str[i])) {
            var col = document.createElement('span'); col.className = 'tt-col';
            for (var d = 0; d <= 9; d++) { var n = document.createElement('span'); n.textContent = d; col.appendChild(n); }
            fare.appendChild(col);
          } else { var f = document.createElement('span'); f.className = 'tt-fix'; f.textContent = str[i]; fare.appendChild(f); }
        }
        void fare.offsetWidth;
      }
      Array.prototype.forEach.call(fare.children, function (c, i) {
        if (c.classList.contains('tt-col')) c.style.transform = 'translateY(' + (-Number(str[i]) * DIGIT_H) + 'px)';
      });
      fare.setAttribute('aria-label', 'Estimated cost ' + str);
    }

    function update() {
      var tin = estimate(input.value);
      var r = RATES[model];
      var cost = (tin * r.in + (tin ? outTokens : 0) * r.out) / 1e6;
      var str = '$' + cost.toFixed(4);
      if (str !== last) {
        meter.classList.remove('is-tick'); void meter.offsetWidth; meter.classList.add('is-tick');
        last = str;
      }
      drawFare(str);
      tokensEl.textContent = tin.toLocaleString() + ' tokens in · ' + (tin ? outTokens.toLocaleString() : 0) + ' out';
      used.style.width = Math.min(100, spent / budget * 100) + '%';
      next.style.width = (tin ? Math.min(100 - spent / budget * 100, Math.max(1.5, cost / budget * 100)) : 0) + '%'; // true share, with a sliver so it stays visible
      var b = document.createElement('b'); b.textContent = '$' + spent.toFixed(2);
      budgetText.replaceChildren(b, document.createTextNode(' of $' + budget.toFixed(2) + ' used this month. This prompt adds about ' + (cost < 0.01 ? 'less than a cent' : '$' + cost.toFixed(2)) + '.'));
    }

    function running() {
      root.classList.add('is-running');
      flag.textContent = 'Metered';
      clearTimeout(idle);
      idle = setTimeout(function () { root.classList.remove('is-running'); flag.textContent = 'Waiting'; }, 900);
    }

    input.addEventListener('input', function () { running(); update(); });
    root.querySelectorAll('.tt-seg').forEach(function (seg) {
      var buttons = Array.prototype.slice.call(seg.querySelectorAll('button'));
      function pick(i, focus) {
        seg.style.setProperty('--i', i);
        buttons.forEach(function (b, k) { b.setAttribute('aria-checked', k === i ? 'true' : 'false'); b.tabIndex = k === i ? 0 : -1; });
        var b = buttons[i];
        if (b.hasAttribute('data-model')) model = b.getAttribute('data-model');
        if (b.hasAttribute('data-len')) outTokens = Number(b.getAttribute('data-len'));
        if (focus) b.focus();
        running(); update();
      }
      buttons.forEach(function (b, i) {
        b.tabIndex = i === 0 ? 0 : -1;
        b.addEventListener('click', function () { pick(i); });
        b.addEventListener('keydown', function (e) {
          if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') { e.preventDefault(); pick((i + (e.key === 'ArrowRight' ? 1 : -1) + buttons.length) % buttons.length, true); }
        });
      });
    });
    update();
  }

  window.initTokenTaximeter = initTokenTaximeter;
  function boot() { document.querySelectorAll('[data-mi="token-taximeter"]').forEach(initTokenTaximeter); }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();

</script>
<script>
(function () {
  var host = document.querySelector('.mi-host'), orig = host.innerHTML, fn = window["initTokenTaximeter"];
  document.querySelector('[data-mi-reset]').addEventListener('click', function (e) {
    host.innerHTML = orig;
    host.querySelectorAll('[data-mi]').forEach(function (el) { if (typeof fn === 'function') fn(el); });
    var b = e.currentTarget; b.classList.remove('is-spin'); void b.offsetWidth; b.classList.add('is-spin');
    setTimeout(function () { b.classList.remove('is-spin'); }, 700);
  });
})();
</script>
</body>
</html>
