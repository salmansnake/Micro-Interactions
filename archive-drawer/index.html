<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Archive Drawer · Micro Interactions</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="../outcraft-tokens.css">
<style>
html, body { min-height: 100%; }
body { margin: 0; display: grid; place-items: center; padding: 64px 16px 48px; box-sizing: border-box; background: var(--subtle); color: var(--body); font-family: var(--font-sans); }
</style>
<style>
/* Archive Drawer — archived items fly into a drawer that visibly fills up; open it to restore them.
   Outcraft Design System v2. Every value is an Outcraft token. */
.ad {
  --ad-bg: var(--card);
  --ad-fg: var(--foreground);
  --ad-muted: var(--muted-foreground);
  --ad-line: var(--border);
  --ad-sunken: var(--subtle);
  --ad-fill: var(--muted);
  --ad-accent: var(--primary);
  --ad-on-accent: var(--primary-foreground);
  --ad-wood: var(--olive);
  --ad-n: 0;
  position: relative;
  display: flex;
  flex-direction: column;
  gap: 10px;
  width: 100%;
  max-width: 420px;
  box-sizing: border-box;
  padding: 20px;
  background: var(--ad-bg);
  color: var(--ad-fg);
  border-radius: var(--radius-xl);
  border: 1px solid var(--border);
  box-shadow: var(--shadow-sm);
  font: 400 var(--text-body)/var(--leading-body) var(--font-sans);
  letter-spacing: normal;
  text-align: left;
  -webkit-font-smoothing: antialiased;
}
.ad-title { margin: 0; font-size: var(--text-title-sm); line-height: var(--leading-title-sm); font-weight: 600; letter-spacing: var(--tracking-title); }
.ad-list, .ad-archived { display: flex; flex-direction: column; margin: 0; padding: 0; list-style: none; border-radius: var(--radius-lg); background: var(--ad-sunken); }
.ad-row { position: relative; display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 6px 10px 6px 12px; box-sizing: border-box; overflow: hidden; }
.ad-row + .ad-row::before { content: ""; position: absolute; top: 0; left: 56px; right: 0; height: 1px; background: var(--ad-line); transform: scaleY(0.5); transform-origin: top; }
.ad-row > div { flex: 1; min-width: 0; }
.ad-row b { display: block; font-weight: 600; }
.ad-row small { display: block; overflow: hidden; color: var(--ad-muted); font-size: var(--text-small); text-overflow: ellipsis; white-space: nowrap; }
.ad-av { display: grid; place-items: center; flex: none; width: 32px; height: 32px; border-radius: 50%; color: var(--on-chart); font-weight: 700; }
.ad-archive, .ad-restore { flex: none; height: 30px; padding: 0 12px; border: 0; border-radius: var(--radius-sm); background: var(--ad-bg); color: var(--ad-accent); font: inherit; font-weight: 600; cursor: pointer; transition: transform var(--spring-press-duration) var(--spring-press); }
.ad-archive:active, .ad-restore:active { transform: scale(var(--press-scale)); }
.ad-archive:focus-visible, .ad-restore:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }
.ad-row.is-in { animation: ad-in var(--spring-ui-duration) var(--spring-ui) both; }
@keyframes ad-in { from { opacity: 0; transform: translateY(14px) scale(var(--press-scale)); } }
.ad-empty { margin: 0; padding: 18px; border-radius: var(--radius-lg); background: var(--ad-sunken); color: var(--ad-muted); text-align: center; font-size: var(--text-small); }

/* The drawer: a little cabinet whose papers pile up and whose front bulges with the count */
.ad-dock { display: flex; align-items: center; gap: 10px; align-self: flex-end; margin-top: 6px; }
/* The drawer hugs its contents: just the front when empty, taller as archived papers stack up */
.ad-drawer { position: relative; width: 72px; height: calc(36px + min(var(--ad-n), 1) * 6px + min(var(--ad-n), 8) * 2.5px); padding: 0; border: 0; background: none; cursor: pointer; transition: height var(--spring-pop-duration) var(--spring-pop); }
.ad-drawer:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; border-radius: var(--radius-lg); }
.ad-papers {
  position: absolute;
  left: 9px;
  right: 9px;
  bottom: 32px;
  height: calc(min(var(--ad-n), 1) * 4px + min(var(--ad-n), 8) * 2.5px);
  border-radius: var(--radius-xs) var(--radius-xs) 0 0;
  background: repeating-linear-gradient(to top, var(--ad-bg) 0 2px, color-mix(in srgb, var(--ad-fg) 14%, var(--ad-bg)) 2px 2.5px);
  box-shadow: 0 0 0 1px var(--ad-line);
  transform: translateY(calc(var(--ad-open, 0) * -6px));
  transition: height var(--spring-pop-duration) var(--spring-pop), transform var(--spring-ui-duration) var(--spring-ui);
}
.ad-front {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  height: 36px;
  border-radius: var(--radius-md);
  background: linear-gradient(180deg, color-mix(in srgb, var(--ad-wood) 88%, var(--on-color)), var(--ad-wood));
  box-shadow: var(--shadow-sm);
  transform: scaleX(calc(1 + min(var(--ad-n), 8) * 0.008)) translateY(calc(var(--ad-open, 0) * 6px));
  transition: transform var(--spring-pop-duration) var(--spring-pop);
}
/* The drawer front: the handle on top, a small label printed below it in the same tone */
.ad-handle { position: absolute; left: 50%; top: 8px; width: 22px; height: 5px; margin-left: -11px; border-radius: var(--radius-xs); background: color-mix(in srgb, var(--black) 35%, transparent); }
.ad-front-label { position: absolute; left: 0; right: 0; bottom: 7px; text-align: center; color: color-mix(in srgb, var(--black) 45%, transparent); /* 10px thin strokes read lighter than the solid handle, so the text sits 10% deeper to look the same tone */ font: 600 10px/1 var(--font-sans); letter-spacing: 0.02em; }
.ad-drawer.is-gulp .ad-front { animation: ad-gulp var(--spring-pop-duration) var(--spring-pop); }
@keyframes ad-gulp { 30% { transform: scale(1.08, 0.9) translateY(3px); } 100% { transform: none; } }
.ad-badge { position: absolute; top: -4px; right: -6px; display: grid; place-items: center; min-width: 20px; height: 20px; box-sizing: border-box; padding: 0 6px; border-radius: var(--radius-full); background: var(--ad-accent); color: var(--ad-on-accent); font-size: var(--text-caption); font-weight: 700; font-variant-numeric: tabular-nums; transform: scale(calc(min(var(--ad-n), 1))); transition: transform var(--spring-pop-duration) var(--spring-pop); }
.ad-drawer[aria-expanded="true"] { --ad-open: 1; }
.ad-panel { animation: ad-in var(--spring-ui-duration) var(--spring-ui) both; }
.ad-panel-title { margin: 0 0 8px; color: var(--ad-muted); font-size: var(--text-small); font-weight: 600; }
.ad-fly { position: absolute; z-index: 5; left: 0; top: 0; padding: 8px 12px; border-radius: var(--radius-lg); border: 1px solid var(--border); background: var(--ad-bg); box-shadow: 0 0 0 1px var(--ad-line), var(--shadow-lg); font-size: var(--text-small); font-weight: 600; white-space: nowrap; pointer-events: none; }
@media (prefers-reduced-motion: reduce) {
  .ad-row.is-in, .ad-panel, .ad-drawer.is-gulp .ad-front { animation: none; }
  .ad-drawer { transition: none; }
  .ad-papers, .ad-front, .ad-badge { transition-duration: var(--duration-reduced); }
}
.ad [hidden] { display: none !important; }

</style>
<style>
/* Reset: a small icon button in the corner of every demo; a "Reset" pill slides out on hover or focus */
.mi-host { display: contents; }
.mi-reset { position: absolute; top: 12px; right: 12px; z-index: 5; display: grid; place-items: center; width: 32px; height: 32px; padding: 0; border: 1px solid var(--border); border-radius: var(--radius-full); background: var(--card); color: var(--muted-foreground); box-shadow: var(--shadow-xs); cursor: pointer; -webkit-tap-highlight-color: transparent; transition: color var(--duration-fast) var(--ease-out), border-color var(--duration-fast) var(--ease-out); }
.mi-reset svg { width: 16px; height: 16px; transition: transform var(--spring-ui-duration) var(--spring-ui); }
.mi-reset:hover, .mi-reset:focus-visible { color: var(--foreground); border-color: var(--border-strong); }
.mi-reset:hover svg { transform: rotate(-45deg); }
.mi-reset.is-spin svg { transform: rotate(-360deg); transition: transform var(--spring-pop-duration) var(--spring-pop); }
.mi-reset:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }
.mi-reset-tip { position: absolute; top: 50%; right: calc(100% + 6px); padding: 4px 10px; border-radius: var(--radius-full); background: var(--foreground); color: var(--background); font: 500 var(--text-caption)/var(--leading-caption) var(--font-sans); white-space: nowrap; pointer-events: none; opacity: 0; transform: translate(6px, -50%) scale(0.96); transform-origin: right center; transition: opacity var(--duration-fast) var(--ease-out), transform var(--spring-ui-duration) var(--spring-ui); }
.mi-reset:hover .mi-reset-tip, .mi-reset:focus-visible .mi-reset-tip { opacity: 1; transform: translate(0, -50%) scale(1); }
.mi-reset--page { position: fixed; top: 16px; right: 16px; }
@media (hover: none) { .mi-reset-tip { display: none; } }
@media (prefers-reduced-motion: reduce) { .mi-reset svg, .mi-reset.is-spin svg, .mi-reset-tip { transition: opacity var(--duration-reduced) var(--ease-out); transform: none; } .mi-reset-tip { transform: translate(0, -50%); } }
.mi-sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

</style>
</head>
<body>
<button type="button" class="mi-reset mi-reset--page" data-mi-reset aria-label="Reset Archive Drawer"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg><span class="mi-reset-tip" aria-hidden="true">Reset</span></button>
<div class="mi-host"><div class="ad" data-mi="archive-drawer">
  <p class="ad-title">Inbox</p>
  <ul class="ad-list">
    <li class="ad-row"><span class="ad-av" style="background: var(--chart-2); color: var(--on-chart)">M</span><div><b>Mira Chen</b><small>Pricing page review</small></div><button type="button" class="ad-archive" aria-label="Archive Pricing page review">Archive</button></li>
    <li class="ad-row"><span class="ad-av" style="background: var(--chart-4); color: var(--on-chart)">S</span><div><b>Stripe</b><small>Payout of $4,120 sent</small></div><button type="button" class="ad-archive" aria-label="Archive Payout of $4,120 sent">Archive</button></li>
    <li class="ad-row"><span class="ad-av" style="background: var(--chart-3); color: var(--on-chart)">A</span><div><b>Alex Rivera</b><small>Can we move standup?</small></div><button type="button" class="ad-archive" aria-label="Archive Can we move standup?">Archive</button></li>
    <li class="ad-row"><span class="ad-av" style="background: var(--chart-1); color: var(--on-chart)">G</span><div><b>GitHub</b><small>3 checks passed on #482</small></div><button type="button" class="ad-archive" aria-label="Archive 3 checks passed on #482">Archive</button></li>
  </ul>
  <p class="ad-empty" hidden>Inbox zero. Everything is in the drawer.</p>
  <div class="ad-dock">
    <button type="button" class="ad-drawer" aria-expanded="false" aria-label="Archive, 0 items">
      <span class="ad-papers" aria-hidden="true"></span>
      <span class="ad-front" aria-hidden="true"><span class="ad-front-label">Archive</span><span class="ad-handle"></span></span>
      <span class="ad-badge" aria-hidden="true">0</span>
    </button>
  </div>
  <div class="ad-panel" hidden>
    <p class="ad-panel-title">Archived</p>
    <ul class="ad-archived"></ul>
  </div>
</div>
</div>
<script>
/* Archive Drawer — vanilla JS. Auto-initializes every [data-mi="archive-drawer"].
   Call window.initArchiveDrawer(el) for elements added later. */
(function () {
  'use strict';
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)');

  function initArchiveDrawer(root) {
    if (!root || root.__miDrawer) return;
    root.__miDrawer = true;
    var list = root.querySelector('.ad-list');
    var empty = root.querySelector('.ad-empty');
    var drawer = root.querySelector('.ad-drawer');
    var badge = root.querySelector('.ad-badge');
    var panel = root.querySelector('.ad-panel');
    var archived = root.querySelector('.ad-archived');
    var n = 0;

    function setCount() {
      root.style.setProperty('--ad-n', n);
      badge.textContent = n;
      drawer.setAttribute('aria-label', 'Archive, ' + n + (n === 1 ? ' item' : ' items'));
      empty.hidden = list.children.length > 0;
      if (!n && !panel.hidden) toggle(false);
    }
    function gulp() { drawer.classList.remove('is-gulp'); void drawer.offsetWidth; drawer.classList.add('is-gulp'); }

    // Fly a label card from one element to another along an arc.
    function fly(text, fromEl, toEl, shrinkTo, done) {
      if (reduce.matches) { done(); return; }
      var o = root.getBoundingClientRect(), a = fromEl.getBoundingClientRect(), b = toEl.getBoundingClientRect();
      var card = document.createElement('span'); card.className = 'ad-fly'; card.textContent = text;
      root.appendChild(card);
      var w = card.offsetWidth, h = card.offsetHeight;
      var x0 = a.left - o.left + a.width / 2 - w / 2, y0 = a.top - o.top + a.height / 2 - h / 2;
      var x1 = b.left - o.left + b.width / 2 - w / 2, y1 = b.top - o.top + b.height / 2 - h / 2;
      var frames = [];
      for (var k = 0; k <= 12; k++) {
        var t = k / 12, s = shrinkTo ? 1 - t * 0.85 : 0.2 + t * 0.8;
        frames.push({ transform: 'translate(' + (x0 + (x1 - x0) * t).toFixed(1) + 'px,' + (y0 + (y1 - y0) * t - Math.sin(t * Math.PI) * 40).toFixed(1) + 'px) scale(' + s.toFixed(2) + ') rotate(' + (shrinkTo ? t * 8 : (1 - t) * -8).toFixed(1) + 'deg)', opacity: shrinkTo && t > 0.85 ? (1 - t) / 0.15 : 1 });
      }
      card.animate(frames, { duration: 560, easing: 'cubic-bezier(.4,0,.6,1)', fill: 'forwards' }).finished.then(function () { card.remove(); done(); });
    }

    function archive(row) {
      var title = row.querySelector('small').textContent;
      var h = row.offsetHeight;
      row.style.height = h + 'px';
      var anim = reduce.matches ? null : row.animate([{ height: h + 'px', opacity: 1 }, { height: '0px', opacity: 0, paddingTop: '0px', paddingBottom: '0px' }], { duration: 360, easing: 'cubic-bezier(.4,0,.2,1)', fill: 'forwards' });
      fly(title, row, drawer, true, function () {
        n++;
        setCount();
        gulp();
      });
      var finish = function () {
        row.remove();
        if (anim) anim.cancel();
        row.style.height = '';
        // keep the row for restoring
        var li = document.createElement('li');
        li.className = 'ad-row';
        li.appendChild(row.querySelector('.ad-av').cloneNode(true));
        li.appendChild(row.querySelector('div').cloneNode(true));
        var restore = document.createElement('button');
        restore.type = 'button'; restore.className = 'ad-restore'; restore.textContent = 'Restore';
        restore.setAttribute('aria-label', 'Restore ' + title);
        restore.addEventListener('click', function () { unarchive(li, row); });
        li.appendChild(restore);
        archived.insertBefore(li, archived.firstChild);
        setCount();
        var next = list.querySelector('.ad-archive');
        (next || drawer).focus({ preventScroll: true });
      };
      if (anim) anim.finished.then(finish); else finish();
    }

    function unarchive(li, row) {
      var title = row.querySelector('small').textContent;
      li.remove();
      n--;
      setCount();
      gulp();
      list.appendChild(row);
      row.classList.remove('is-in'); void row.offsetWidth;
      row.style.visibility = 'hidden';
      fly(title, drawer, row, false, function () {
        row.style.visibility = '';
        row.classList.add('is-in');
        setCount();
      });
      setCount();
    }

    function toggle(open) {
      panel.hidden = !open;
      drawer.setAttribute('aria-expanded', open ? 'true' : 'false');
      if (open) { var b = archived.querySelector('button'); if (b) b.focus({ preventScroll: true }); }
    }

    list.addEventListener('click', function (e) {
      var b = e.target.closest('.ad-archive');
      if (b) archive(b.closest('.ad-row'));
    });
    drawer.addEventListener('click', function () { if (n) toggle(panel.hidden); else gulp(); });
    setCount();
  }

  window.initArchiveDrawer = initArchiveDrawer;
  function boot() { document.querySelectorAll('[data-mi="archive-drawer"]').forEach(initArchiveDrawer); }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();

</script>
<script>
(function () {
  var host = document.querySelector('.mi-host'), orig = host.innerHTML, fn = window["initArchiveDrawer"];
  document.querySelector('[data-mi-reset]').addEventListener('click', function (e) {
    host.innerHTML = orig;
    host.querySelectorAll('[data-mi]').forEach(function (el) { if (typeof fn === 'function') fn(el); });
    var b = e.currentTarget; b.classList.remove('is-spin'); void b.offsetWidth; b.classList.add('is-spin');
    setTimeout(function () { b.classList.remove('is-spin'); }, 700);
  });
})();
</script>
</body>
</html>
