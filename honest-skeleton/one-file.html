<!doctype html>
<html lang="en">
<head>

<title>Honest Skeleton</title>
<style>
/* Demo page only. Remove this block when pasting into your own page. */
body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 48px 16px; box-sizing: border-box; background: #F3F2EE; }

<style>
@import url('https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap');

/* Outcraft Design System v2: the tokens this component uses, scoped to .hk so they never affect the rest of your page. */
.hk {
  --font-sans: "Geist", system-ui, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --leading-body: 22px;
  --leading-caption: 16px;
  --leading-small: 18px;
  --leading-title: 28px;
  --press-scale: 0.97;
  --radius-full: 9999px;
  --radius-lg: 12px;
  --radius-sm: 6px;
  --radius-xl: 16px;
  --radius-xs: 4px;
  --spring-panel: linear(0, 0.0198, 0.069, 0.1356, 0.211, 0.2893, 0.3667, 0.4407, 0.5096, 0.5727, 0.6297, 0.6805, 0.7255, 0.765, 0.7995, 0.8294, 0.8552, 0.8774, 0.8964, 0.9127, 0.9265, 0.9382, 0.9482, 0.9566, 0.9637, 0.9696, 0.9746, 0.9788, 0.9824, 0.9853, 0.9878, 0.9899, 0.9916, 0.993, 0.9942, 0.9952, 0.996, 0.9967, 0.9973, 0.9978, 1);
  --spring-panel-duration: 530ms;
  --spring-press: linear(0, 0.0189, 0.0676, 0.1361, 0.2164, 0.3025, 0.3896, 0.4743, 0.5543, 0.628, 0.6945, 0.7535, 0.8049, 0.849, 0.8863, 0.9172, 0.9425, 0.9629, 0.9789, 0.9912, 1.0004, 1.0071, 1.0116, 1.0145, 1.016, 1.0166, 1.0164, 1.0156, 1.0146, 1.0133, 1.0118, 1.0104, 1.009, 1.0076, 1.0064, 1.0053, 1.0043, 1.0034, 1.0026, 1.002, 1);
  --spring-press-duration: 310ms;
  --spring-ui: linear(0, 0.0237, 0.0849, 0.1704, 0.2697, 0.3746, 0.4788, 0.5777, 0.6685, 0.7491, 0.8189, 0.8776, 0.9257, 0.9639, 0.9931, 1.0147, 1.0296, 1.0391, 1.0442, 1.046, 1.0451, 1.0425, 1.0387, 1.0342, 1.0294, 1.0246, 1.02, 1.0158, 1.012, 1.0087, 1.0059, 1.0037, 1.0019, 1.0005, 0.9994, 0.9987, 0.9982, 0.998, 0.9979, 0.9979, 1);
  --spring-ui-duration: 460ms;
  --text-body: 15px;
  --text-caption: 12px;
  --text-small: 13px;
  --text-title: 20px;
  --tracking-title: -0.015em;
  --amber-9: #ffc53d;
  --aqua: #79EEEC;
  --aqua-700: #0B7573;
  --ash: #646A66;
  --black: #000000;
  --border: var(--line);
  --card: var(--white);
  --chart-1: var(--aqua);
  --chart-2: var(--pink);
  --chart-4: var(--sage);
  --danger-text: #ca2b30;
  --foreground: var(--black);
  --line: #DCDED9;
  --mist: #ECEBE6;
  --muted: var(--mist);
  --muted-foreground: var(--ash);
  --on-chart: #000000;
  --pink: #FFC7F6;
  --primary: var(--black);
  --primary-foreground: #ffffff;
  --red-11: #ce2c31;
  --ring: var(--aqua-700);
  --sage: #99AD88;
  --shadow-md: 0 2px 4px -1px rgba(17, 17, 16, 0.05), 0 6px 14px -3px rgba(17, 17, 16, 0.09);
  --shadow-sm: 0 1px 2px rgba(17, 17, 16, 0.04), 0 1px 3px rgba(17, 17, 16, 0.07);
  --soft-ground: #F3F2EE;
  --subtle: var(--soft-ground);
  --warning: var(--amber-9);
  --white: #FFFFFF;
}
/* Dark mode: follows data-theme="dark" (or class "dark") on any ancestor, or the system setting. */
[data-theme="dark"] .hk, .dark .hk {
  --amber-9: #ffc53d;
  --aqua: #79EEEC;
  --aqua-700: #79EEEC;
  --ash: #A3A8A4;
  --black: #000000;
  --border: var(--line);
  --card: var(--white);
  --chart-1: var(--aqua);
  --chart-2: var(--pink);
  --chart-4: var(--sage);
  --danger-text: var(--red-11);
  --foreground: #F3F2EE;
  --line: #313432;
  --mist: #2B2E2D;
  --muted: var(--mist);
  --muted-foreground: var(--ash);
  --on-chart: #000000;
  --pink: #FFC7F6;
  --primary: var(--aqua);
  --primary-foreground: #000000;
  --red-11: #ff9592;
  --ring: var(--aqua);
  --sage: #99AD88;
  --shadow-md: 0 2px 4px -1px rgba(0, 0, 0, 0.45), 0 6px 14px -3px rgba(0, 0, 0, 0.45);
  --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.4), 0 1px 3px rgba(0, 0, 0, 0.3);
  --soft-ground: #0C0D0C;
  --subtle: var(--soft-ground);
  --warning: var(--amber-9);
  --white: #161817;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]):not(.light) .hk {
    --amber-9: #ffc53d;
    --aqua: #79EEEC;
    --aqua-700: #79EEEC;
    --ash: #A3A8A4;
    --black: #000000;
    --border: var(--line);
    --card: var(--white);
    --chart-1: var(--aqua);
    --chart-2: var(--pink);
    --chart-4: var(--sage);
    --danger-text: var(--red-11);
    --foreground: #F3F2EE;
    --line: #313432;
    --mist: #2B2E2D;
    --muted: var(--mist);
    --muted-foreground: var(--ash);
    --on-chart: #000000;
    --pink: #FFC7F6;
    --primary: var(--aqua);
    --primary-foreground: #000000;
    --red-11: #ff9592;
    --ring: var(--aqua);
    --sage: #99AD88;
    --shadow-md: 0 2px 4px -1px rgba(0, 0, 0, 0.45), 0 6px 14px -3px rgba(0, 0, 0, 0.45);
    --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.4), 0 1px 3px rgba(0, 0, 0, 0.3);
    --soft-ground: #0C0D0C;
    --subtle: var(--soft-ground);
    --warning: var(--amber-9);
    --white: #161817;
  }
}

/* Honest Skeleton — shows what is known at once, says when a part is slow, and admits failure.
   Outcraft Design System v2. Every value is an Outcraft token. */
.hk {
  --hk-bg: var(--card);
  --hk-fg: var(--foreground);
  --hk-muted: var(--muted-foreground);
  --hk-line: var(--border);
  --hk-sunken: var(--subtle);
  --hk-fill: var(--muted);
  --hk-accent: var(--primary);
  --hk-warn: var(--warning);
  --hk-danger-text: var(--danger-text);
  display: flex;
  flex-direction: column;
  gap: 12px;
  width: 100%;
  max-width: 440px;
  color: var(--hk-fg);
  font: 400 var(--text-body)/var(--leading-body) var(--font-sans);
  letter-spacing: normal;
  text-align: left;
  -webkit-font-smoothing: antialiased;
  /* One bounded card: everything the interaction shows sits inside it, including its note */
  box-sizing: border-box;
  padding: 20px;
  background: var(--card);
  border-radius: var(--radius-xl);
  border: 1px solid var(--border);
  box-shadow: var(--shadow-sm);
}
.hk-card { display: flex; flex-direction: column; gap: 18px; } /* the content; the card is the root */
.hk-head { display: flex; align-items: center; gap: 12px; }
/* A letter in a tile is centered on its capital height, not its line box (10b.5): the tile trims its text to cap height and centers it.
   22px capitals leave an even split in this 44px tile at 1x and 2x (20px sat high) */
.hk-avatar { display: block; align-content: center; text-align: center; text-box: trim-both cap alphabetic; flex: none; width: 44px; height: 44px; border-radius: var(--radius-lg); background: var(--hk-accent); color: var(--primary-foreground); font-size: calc(var(--text-title) + 2px); font-weight: 700; }
.hk-id { min-width: 0; flex: 1; }
.hk-name { margin: 0; font-size: var(--text-title); line-height: var(--leading-title); font-weight: 600; letter-spacing: var(--tracking-title); }
.hk-label { margin: 0 0 8px; color: var(--hk-muted); font-size: var(--text-small); line-height: var(--leading-small); font-weight: 600; letter-spacing: normal; }
.hk-part { position: relative; }

/* Skeleton blocks: the shimmer speed is the expected wait */
.hk-sk {
  display: block;
  height: 12px;
  border-radius: var(--radius-sm);
  background: linear-gradient(90deg, var(--hk-fill) 0%, color-mix(in srgb, var(--hk-fill) 40%, transparent) 50%, var(--hk-fill) 100%) 0 0 / 200% 100%;
  animation: hk-shimmer var(--hk-speed, 1.2s) linear infinite;
}
@keyframes hk-shimmer { from { background-position: 100% 0; } to { background-position: -100% 0; } }
.hk-wait {
  position: absolute;
  top: 50%;
  right: 0;
  padding: 3px 9px;
  border-radius: var(--radius-full);
  background: var(--hk-bg);
  box-shadow: 0 0 0 1px var(--hk-line), var(--shadow-md);
  color: var(--hk-muted);
  font-size: var(--text-caption);
  line-height: var(--leading-caption);
  font-weight: 500;
  white-space: nowrap;
  transform: translateY(-50%);
  animation: hk-in var(--spring-ui-duration) var(--spring-ui) both;
}
.hk-wait::before { content: ""; display: inline-block; width: 6px; height: 6px; margin-right: 6px; border-radius: 50%; background: var(--hk-warn); vertical-align: 1px; }
@keyframes hk-in { from { opacity: 0; transform: translateY(-50%) scale(0.9); } }

/* Arrival: content develops out of the skeleton */
.hk-real { animation: hk-develop var(--spring-panel-duration) var(--spring-panel) both; }
@keyframes hk-develop { from { opacity: 0; filter: blur(6px); transform: translateY(3px); } }

.hk-meta { margin: 0; color: var(--hk-muted); font-size: var(--text-small); line-height: var(--leading-small); letter-spacing: normal; }
.hk-stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.hk-stat { display: flex; flex-direction: column; gap: 6px; min-height: 58px; box-sizing: border-box; padding: 10px 12px; border-radius: var(--radius-lg); background: var(--hk-sunken); }
.hk-stat b { font-size: var(--text-title); line-height: var(--leading-title); font-weight: 600; font-variant-numeric: tabular-nums; }
.hk-stat span { color: var(--hk-muted); font-size: var(--text-caption); line-height: var(--leading-caption); }
.hk-rows { display: flex; flex-direction: column; gap: 10px; margin: 0; padding: 0; list-style: none; }
.hk-rows li { display: flex; align-items: center; gap: 10px; min-height: 24px; }
.hk-rows i { flex: none; width: 24px; height: 24px; border-radius: 50%; background: var(--hk-fill); }
.hk-rows .hk-who { display: grid; place-items: center; color: var(--on-chart); font-size: calc(var(--text-caption) - 1px); font-style: normal; font-weight: 700; }
.hk-rows small { margin-left: auto; color: var(--hk-muted); font-size: var(--text-caption); white-space: nowrap; }
.hk-bars { display: flex; align-items: flex-end; gap: 4px; height: 72px; }
.hk-bars span { flex: 1; border-radius: var(--radius-xs) var(--radius-xs) var(--radius-xs) var(--radius-xs); background: var(--hk-accent); opacity: 0.85; transform-origin: bottom; animation: hk-bar var(--spring-ui-duration) var(--spring-ui) both; }
@keyframes hk-bar { from { transform: scaleY(0); } }
.hk-error { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 72px; box-sizing: border-box; padding: 12px 14px; border-radius: var(--radius-lg); background: var(--hk-sunken); color: var(--hk-danger-text); font-size: var(--text-small); line-height: var(--leading-small); }
.hk-error button, .hk-reload {
  flex: none;
  height: 32px;
  padding: 0 14px;
  border: 0;
  border-radius: var(--radius-sm);
  background: var(--hk-fill);
  color: var(--hk-fg);
  font: inherit;
  font-weight: 600;
  cursor: pointer;
  transition: transform var(--spring-press-duration) var(--spring-press);
}
.hk-reload { background: var(--hk-fill); } /* gray on the white card */
.hk-error button:active, .hk-reload:active { transform: scale(var(--press-scale)); }
.hk-error button:focus-visible, .hk-reload:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }
.hk-foot { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-top: 14px; border-top: 1px solid var(--hk-line); }
.hk-note { margin: 0; color: var(--hk-muted); font-size: var(--text-small); line-height: var(--leading-small); letter-spacing: normal; }
@media (prefers-reduced-motion: reduce) {
  .hk-sk { animation: none; }
  .hk-real, .hk-wait, .hk-bars span { animation: none; }
}
/* Multi-line text wraps evenly and never ends on one or two lonely words */
.hk :is(p, li, dd, dt, small, label, figcaption, h1, h2, h3, h4) { text-wrap: balance; }
.hk [hidden] { display: none !important; }

</style>
</head>
<body>

<div class="hk" data-mi="honest-skeleton">
  <article class="hk-card" aria-label="Atlas project">
    <header class="hk-head">
      <span class="hk-avatar" aria-hidden="true">A</span>
      <div class="hk-id">
        <p class="hk-name">Atlas</p>
        <div class="hk-part" data-part="meta"></div>
      </div>
    </header>
    <div class="hk-part hk-stats" data-part="stats"></div>
    <section class="hk-section">
      <p class="hk-label">Recent Activity</p>
      <div class="hk-part" data-part="activity"></div>
    </section>
    <section class="hk-section">
      <p class="hk-label">Requests, Last 14 Days</p>
      <div class="hk-part" data-part="chart"></div>
    </section>
  </article>
  <div class="hk-foot">
    <p class="hk-note">The name shows at once because you clicked it in a list. Everything else says how it's doing.</p>
    <button type="button" class="hk-reload">Reload</button>
  </div>
</div>


<script>
/* Honest Skeleton — vanilla JS. Auto-initializes every [data-mi="honest-skeleton"].
   Each part loads on its own: known data renders at once, slow parts say so, failed parts offer Retry.
   Call window.initHonestSkeleton(el) for elements added later. */
(function () {
  'use strict';
  var SLOW_AFTER = 1200; // ms before a part admits it is slow

  function h(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }
  function sk(width, height) {
    var s = h('span', 'hk-sk');
    s.style.width = width;
    if (height) s.style.height = height;
    return s;
  }

  // Each part: its skeleton, its real content, and how it behaves in the demo.
  var PARTS = {
    meta: {
      speed: '0.9s',
      skeleton: function () { var w = h('div'); w.style.paddingTop = '6px'; w.appendChild(sk('11em')); return w; },
      real: function () { return h('p', 'hk-meta', 'Production · Updated 4 minutes ago'); }
    },
    stats: {
      speed: '1s',
      skeleton: function () {
        var f = document.createDocumentFragment();
        for (var i = 0; i < 3; i++) { var c = h('div', 'hk-stat'); c.appendChild(sk('60%', '18px')); c.appendChild(sk('80%', '10px')); f.appendChild(c); }
        return f;
      },
      real: function () {
        var f = document.createDocumentFragment();
        [['3', 'Members'], ['128', 'Deploys'], ['99.98%', 'Uptime']].forEach(function (s) {
          var c = h('div', 'hk-stat hk-real'); c.appendChild(h('b', null, s[0])); c.appendChild(h('span', null, s[1])); f.appendChild(c);
        });
        return f;
      }
    },
    activity: {
      speed: '1.6s',
      skeleton: function () {
        var ul = h('ul', 'hk-rows');
        ['70%', '58%', '64%'].forEach(function (w) { var li = h('li'); li.appendChild(h('i')); li.appendChild(sk(w)); ul.appendChild(li); });
        return ul;
      },
      real: function () {
        var ul = h('ul', 'hk-rows hk-real');
        [['M', 'var(--chart-2)', 'Mira deployed production', '2m'], ['S', 'var(--chart-4)', 'Sam updated roadmap-q4.csv', '1h'], ['Y', 'var(--chart-1)', 'You invited Alex', '3h']].forEach(function (r) {
          var li = h('li'); var i = h('i', 'hk-who', r[0]); i.style.background = r[1];
          li.appendChild(i); li.appendChild(h('span', null, r[2])); li.appendChild(h('small', null, r[3])); ul.appendChild(li);
        });
        return ul;
      }
    },
    chart: {
      speed: '1.4s',
      skeleton: function () { return sk('100%', '72px'); },
      real: function () {
        var b = h('div', 'hk-bars hk-real');
        [42, 55, 48, 61, 58, 70, 66, 74, 69, 80, 77, 85, 82, 92].forEach(function (v, i) {
          var s = h('span'); s.style.height = v + '%'; s.style.animationDelay = (i * 30) + 'ms'; b.appendChild(s);
        });
        return b;
      }
    }
  };
  // Demo timing: when each part arrives, and whether its first attempt fails.
  var PLAN = { meta: { at: 450 }, stats: { at: 800 }, activity: { at: 2300 }, chart: { at: 2600, failFirst: true } };

  // Even line breaks: text that wraps to two or three lines is narrowed until its lines are close in length,
  // with the first line the longest, so no line runs long while the next holds a word or two.
  function evenLines(root) {
    var SEL = 'p, li, dd, dt, small, label, figcaption, h1, h2, h3, h4';
    function widths(el) {
      var range = document.createRange(), rows = [];
      range.selectNodeContents(el);
      Array.prototype.forEach.call(range.getClientRects(), function (b) {
        if (!b.width) return;
        var row = rows.filter(function (x) { return Math.abs(x.t - b.top) < b.height / 2; })[0];
        if (row) { row.l = Math.min(row.l, b.left); row.r = Math.max(row.r, b.right); } else rows.push({ t: b.top, l: b.left, r: b.right });
      });
      return rows.sort(function (a, b) { return a.t - b.t; }).map(function (x) { return x.r - x.l; });
    }
    function fit(el) {
      el.style.maxWidth = ''; el.style.textWrap = '';
      var cs = getComputedStyle(el), full = el.getBoundingClientRect().width;
      if (!full || cs.whiteSpace === 'nowrap' || /flex|grid/.test(cs.display)) return;
      if (Array.prototype.some.call(el.children, function (c) { return !/^inline/.test(getComputedStyle(c).display); })) return;
      el.style.textWrap = 'wrap';
      var n = widths(el).length, lo = 0, hi = full, w, L;
      if (n < 2 || n > 3) { el.style.textWrap = ''; return; }
      while (hi - lo > 1) { w = (lo + hi) / 2; el.style.maxWidth = w + 'px'; if (widths(el).length > n) lo = w; else hi = w; }
      var best = 0, gap = Infinity;
      for (w = Math.ceil(hi); w <= full; w += 2) {
        el.style.maxWidth = w + 'px'; L = widths(el);
        // Each line no longer than the one above (within 10%, which reads as equal). Keep the most even width,
        // and prefer the first line longer: a last line longer than the first costs three times its overhang
        var score = Math.max.apply(null, L) - Math.min.apply(null, L) + Math.max(0, L[n - 1] - L[0]) * 3;
        if (L.length === n && L.every(function (x, i) { return !i || x <= L[i - 1] * 1.1 + 1; }) && score < gap) { gap = score; best = w; }
      }
      if (!best) { el.style.maxWidth = ''; el.style.textWrap = ''; return; }
      el.style.maxWidth = best + 'px';
      if (cs.textAlign === 'center' && cs.display === 'block') { el.style.marginLeft = 'auto'; el.style.marginRight = 'auto'; }
    }
    var queued = false, lastW = 0;
    function run() { queued = false; Array.prototype.forEach.call(root.querySelectorAll(SEL), fit); }
    function later() { if (!queued) { queued = true; requestAnimationFrame(run); } }
    later();
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(later);
    if (window.ResizeObserver) new ResizeObserver(function () { var w = root.getBoundingClientRect().width; if (Math.abs(w - lastW) > 0.5) { lastW = w; later(); } }).observe(root);
    if (window.MutationObserver) new MutationObserver(later).observe(root, { subtree: true, childList: true, characterData: true, attributes: true, attributeFilter: ['hidden'] });
  }

  function initHonestSkeleton(root) {
    if (!root || root.__miHonest) return;
    root.__miHonest = true;
    evenLines(root);
    var timers = [];
    var gen = 0;

    function later(fn, ms) { timers.push(setTimeout(fn, ms)); }

    function load(name, attempt, token) {
      var slot = root.querySelector('[data-part="' + name + '"]');
      var part = PARTS[name], plan = PLAN[name];
      slot.setAttribute('aria-busy', 'true');
      slot.style.setProperty('--hk-speed', part.speed);
      slot.replaceChildren(part.skeleton());
      var at = attempt === 0 ? plan.at : 900;
      if (at > SLOW_AFTER) {
        later(function () {
          if (token !== gen) return;
          var w = h('span', 'hk-wait', 'Still loading');
          slot.appendChild(w);
          var started = performance.now();
          var tick = setInterval(function () {
            if (!w.isConnected || token !== gen) { clearInterval(tick); return; }
            w.textContent = 'Still loading · ' + Math.round((SLOW_AFTER + performance.now() - started) / 1000) + 's';
          }, 500);
        }, SLOW_AFTER);
      }
      later(function () {
        if (token !== gen) return;
        slot.removeAttribute('aria-busy');
        if (plan.failFirst && attempt === 0) {
          var e = h('div', 'hk-error hk-real');
          e.appendChild(h('span', null, 'Usage couldn’t load. Your other data is fine.'));
          var b = h('button', null, 'Retry');
          b.type = 'button';
          b.addEventListener('click', function () { load(name, 1, token); });
          e.appendChild(b);
          slot.replaceChildren(e);
          return;
        }
        if (name === 'stats') slot.className = 'hk-part hk-stats';
        slot.replaceChildren(part.real());
      }, at);
    }

    function start() {
      timers.forEach(clearTimeout);
      timers = [];
      var token = ++gen;
      Object.keys(PLAN).forEach(function (name) { load(name, 0, token); });
    }

    root.querySelector('.hk-reload').addEventListener('click', start);

    var begun = false;
    if (window.IntersectionObserver) {
      new IntersectionObserver(function (es) {
        if (es[0].isIntersecting && !begun) { begun = true; start(); }
      }, { threshold: 0.3 }).observe(root);
      Object.keys(PLAN).forEach(function (name) {
        var slot = root.querySelector('[data-part="' + name + '"]');
        slot.style.setProperty('--hk-speed', PARTS[name].speed);
        slot.replaceChildren(PARTS[name].skeleton());
      });
    } else start();
  }

  window.initHonestSkeleton = initHonestSkeleton;
  function boot() { document.querySelectorAll('[data-mi="honest-skeleton"]').forEach(initHonestSkeleton); }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();

</script>
</body>
</html>
