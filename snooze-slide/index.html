<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Snooze Slide · Micro Interactions</title>
<link rel="icon" type="image/svg+xml" href="../icons/outcraft-favicon-light.svg" media="(prefers-color-scheme: light)">
<link rel="icon" type="image/svg+xml" href="../icons/outcraft-favicon-dark.svg" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="../icons/outcraft-icon-180x180-light.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap">

<style>
html, body { min-height: 100%; }
body { margin: 0; display: grid; place-items: center; padding: 64px 16px 48px; box-sizing: border-box; background: var(--subtle); color: var(--body); font-family: var(--font-sans); }
</style>
<style>
/* Snooze Slide — drag a notification right and the further you go, the later it comes back.
   Outcraft Design System v2. Every value is an Outcraft token. */
.sn {
  --sn-bg: var(--card);
  --sn-fg: var(--foreground);
  --sn-muted: var(--muted-foreground);
  --sn-line: var(--border);
  --sn-sunken: var(--subtle);
  --sn-fill: var(--muted);
  --sn-accent: var(--primary);
  --sn-indigo: var(--brand-strong);
  display: flex;
  flex-direction: column;
  gap: 10px;
  width: 100%;
  max-width: 420px;
  box-sizing: border-box;
  padding: 20px;
  background: var(--sn-bg);
  color: var(--sn-fg);
  border-radius: var(--radius-xl);
  border: 1px solid var(--border);
  box-shadow: var(--shadow-sm);
  font: 400 var(--text-body)/var(--leading-body) var(--font-sans);
  letter-spacing: normal;
  text-align: left;
  -webkit-font-smoothing: antialiased;
}
.sn-title { margin: 0 0 2px; font-size: var(--text-title-sm); line-height: var(--leading-title-sm); font-weight: 600; letter-spacing: var(--tracking-title); }
.sn-list { display: flex; flex-direction: column; gap: 8px; margin: 0; padding: 0; list-style: none; }
.sn-item { position: relative; border-radius: var(--radius-xl); overflow: hidden; }
.sn-item.is-gone { animation: sn-collapse var(--duration-slower) var(--ease-out) forwards; }
@keyframes sn-collapse { to { height: 0; margin-bottom: -8px; opacity: 0; } }
/* The track revealed behind the card: deeper indigo the later it gets */
.sn-track {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 1px;
  padding-left: 18px;
  background: color-mix(in srgb, var(--brand) calc(30% + var(--sn-step, 0) * 17%), var(--sn-sunken));
  color: var(--brand-foreground);
  transition: background-color var(--duration-base);
}
.sn-when { font-size: var(--text-title-sm); line-height: var(--leading-title-sm); font-weight: 700; letter-spacing: var(--tracking-title); }
.sn-time { font-size: var(--text-caption); line-height: var(--leading-caption); opacity: 0.9; }
.sn-when.is-pop { animation: sn-pop var(--spring-pop-duration) var(--spring-pop); }
@keyframes sn-pop { 40% { transform: scale(1.12); } 100% { transform: none; } }
.sn-card {
  position: relative;
  display: flex;
  align-items: center;
  gap: 12px;
  min-height: 64px;
  box-sizing: border-box;
  padding: 10px 14px;
  border-radius: var(--radius-xl);
  background: var(--sn-sunken);
  background-color: color-mix(in srgb, var(--sn-fg) 4%, var(--sn-bg));
  box-shadow: 0 0 0 1px var(--sn-line);
  cursor: grab;
  touch-action: pan-y;
  user-select: none;
  -webkit-user-select: none;
  transform: translateX(var(--sn-x, 0px));
  outline: none;
}
.sn-card.is-settling { transition: transform var(--spring-ui-duration) var(--spring-ui); }
.sn-card:active { cursor: grabbing; }
.sn-card:focus-visible { box-shadow: 0 0 0 3px var(--sn-accent); }
/* Centered on the capital height, not the line box (10b.5): the text is trimmed to cap height and centered */
.sn-avatar { display: block; align-content: center; text-align: center; text-box: trim-both cap alphabetic; flex: none; width: 36px; height: 36px; border-radius: 50%; color: var(--on-chart); font-weight: 700; }
.sn-text { min-width: 0; }
.sn-text p { margin: 0; font-size: var(--text-body); line-height: var(--leading-body); }
.sn-text b { font-weight: 600; }
.sn-text small { color: var(--sn-muted); font-size: var(--text-caption); }
/* Snoozed pills */
.sn-snoozed { display: flex; flex-direction: column; gap: 6px; }
.sn-snoozed:empty { display: none; }
.sn-pill { display: flex; align-items: center; gap: 10px; padding: 6px 6px 6px 14px; border-radius: var(--radius-full); background: oklch(from var(--sn-indigo) var(--tint-l) calc(c * var(--tint-c)) h); color: var(--sn-fg); font-size: var(--text-small); line-height: var(--leading-small); animation: sn-in var(--spring-ui-duration) var(--spring-ui) both; }
.sn-pill svg { flex: none; width: 16px; height: 16px; color: var(--sn-indigo); }
.sn-pill span { flex: 1; min-width: 0; }
/* Capsule in a capsule (button rule 4); the fill is the on-tint secondary, never gray on the tint (button rule 7) */
.sn-pill button { flex: none; height: 28px; padding: 0 12px; border: 0; border-radius: var(--radius-full); background: var(--fill-on-tint); color: var(--sn-accent); font: inherit; font-weight: 600; cursor: pointer; }
.sn-pill button:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }
@keyframes sn-in { from { opacity: 0; transform: translateY(-6px) scale(var(--press-scale)); } }
.sn-hint { margin: 2px 4px 0; color: var(--sn-muted); font-size: var(--text-small); line-height: var(--leading-small); letter-spacing: normal; }
@media (prefers-reduced-motion: reduce) {
  .sn-card.is-settling { transition-duration: var(--duration-reduced); }
  .sn-item.is-gone, .sn-pill, .sn-when.is-pop { animation: none; }
  .sn-item.is-gone { display: none; }
}
/* Multi-line text wraps evenly and never ends on one or two lonely words */
.sn :is(p, li, dd, dt, small, label, figcaption, h1, h2, h3, h4) { text-wrap: balance; }
.sn [hidden] { display: none !important; }

</style>
<style>
/* Reset: a small icon button in the corner of every demo; a "Reset" pill slides out on hover or focus */
.mi-host { display: contents; }
.mi-reset { position: absolute; top: 12px; right: 12px; z-index: 5; display: grid; place-items: center; width: 32px; height: 32px; padding: 0; border: 1px solid var(--border); border-radius: var(--radius-full); background: var(--card); color: var(--muted-foreground); box-shadow: var(--shadow-xs); cursor: pointer; -webkit-tap-highlight-color: transparent; transition: color var(--duration-fast) var(--ease-out), border-color var(--duration-fast) var(--ease-out); }
.mi-reset svg { width: 16px; height: 16px; transition: transform var(--spring-ui-duration) var(--spring-ui); }
.mi-reset:hover, .mi-reset:focus-visible { color: var(--foreground); border-color: var(--border-strong); }
.mi-reset:hover svg { transform: rotate(-45deg); }
.mi-reset.is-spin svg { transform: rotate(-360deg); transition: transform var(--spring-pop-duration) var(--spring-pop); }
.mi-reset:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }
.mi-reset-tip { position: absolute; top: 50%; right: calc(100% + 6px); padding: 4px 10px; border-radius: var(--radius-full); background: var(--foreground); color: var(--background); font: 500 var(--text-caption)/var(--leading-caption) var(--font-sans); white-space: nowrap; pointer-events: none; opacity: 0; transform: translate(6px, -50%) scale(0.96); transform-origin: right center; transition: opacity var(--duration-fast) var(--ease-out), transform var(--spring-ui-duration) var(--spring-ui); }
.mi-reset:hover .mi-reset-tip, .mi-reset:focus-visible .mi-reset-tip { opacity: 1; transform: translate(0, -50%) scale(1); }
.mi-reset--page { position: fixed; top: 16px; right: 16px; }
@media (hover: none) { .mi-reset-tip { display: none; } }
@media (prefers-reduced-motion: reduce) { .mi-reset svg, .mi-reset.is-spin svg, .mi-reset-tip { transition: opacity var(--duration-reduced) var(--ease-out); transform: none; } .mi-reset-tip { transform: translate(0, -50%); } }
.mi-sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

</style>
</head>
<body>
<button type="button" class="mi-reset mi-reset--page" data-mi-reset aria-label="Reset Snooze Slide"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg><span class="mi-reset-tip" aria-hidden="true">Reset</span></button>
<div class="mi-host"><div class="sn" data-mi="snooze-slide">
  <p class="sn-title">Notifications</p>
  <ul class="sn-list">
    <li class="sn-item">
      <div class="sn-track" aria-hidden="true"><span class="sn-when"></span><span class="sn-time"></span></div>
      <div class="sn-card" tabindex="0" role="button" aria-label="Mira asked for your review on the Pricing page. Drag right or press the right arrow to snooze.">
        <span class="sn-avatar" style="background: var(--chart-2); color: var(--on-chart)">M</span>
        <div class="sn-text"><p><b>Mira</b> asked for your review on <b>Pricing page</b></p><small>2 minutes ago</small></div>
      </div>
    </li>
    <li class="sn-item">
      <div class="sn-track" aria-hidden="true"><span class="sn-when"></span><span class="sn-time"></span></div>
      <div class="sn-card" tabindex="0" role="button" aria-label="Invoice 1042 is due in 3 days. Drag right or press the right arrow to snooze.">
        <span class="sn-avatar" style="background: var(--chart-4); color: var(--on-chart)">$</span>
        <div class="sn-text"><p><b>Invoice #1042</b> is due in 3 days</p><small>1 hour ago</small></div>
      </div>
    </li>
  </ul>
  <div class="sn-snoozed" aria-live="polite"></div>
  <p class="sn-hint">Drag a notification right to snooze it. Keep dragging for later.</p>
</div>
</div>
<script>
/* Snooze Slide — vanilla JS. Auto-initializes every [data-mi="snooze-slide"].
   Call window.initSnoozeSlide(el) for elements added later. */
(function () {
  'use strict';
  var STEP = 64;          // px of drag per snooze option
  var MAX_DRAG = STEP * 4 + 24;

  function nextAt(hour, addDays, weekday) {
    var d = new Date();
    if (weekday != null) { var diff = (weekday + 7 - d.getDay()) % 7 || 7; d.setDate(d.getDate() + diff); }
    else d.setDate(d.getDate() + (addDays || 0));
    d.setHours(hour, 0, 0, 0);
    return d;
  }
  function options() {
    var now = new Date();
    var inHour = new Date(now.getTime() + 3600000);
    var evening = nextAt(18, now.getHours() >= 17 ? 1 : 0);
    return [
      { label: 'In 1 Hour', at: inHour },
      { label: now.getHours() >= 17 ? 'Tomorrow Evening' : 'This Evening', at: evening },
      { label: 'Tomorrow', at: nextAt(9, 1) },
      { label: 'Next Week', at: nextAt(9, 0, 1) }
    ];
  }
  function fmt(d) {
    var today = new Date(); today.setHours(0, 0, 0, 0);
    var day = new Date(d); day.setHours(0, 0, 0, 0);
    var diff = Math.round((day - today) / 86400000);
    var time = d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
    if (diff === 0) return 'Today at ' + time;
    if (diff === 1) return 'Tomorrow at ' + time;
    return d.toLocaleDateString('en-US', { weekday: 'long', month: 'short', day: 'numeric' }) + ' at ' + time;
  }
  var CLOCK = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="8" cy="8" r="6"/><path d="M8 4.8V8l2.2 1.4"/></svg>';

  // Even line breaks: text that wraps to two or three lines is narrowed until its lines are close in length,
  // with the first line the longest, so no line runs long while the next holds a word or two.
  function evenLines(root) {
    var SEL = 'p, li, dd, dt, small, label, figcaption, h1, h2, h3, h4';
    function widths(el) {
      var range = document.createRange(), rows = [];
      range.selectNodeContents(el);
      Array.prototype.forEach.call(range.getClientRects(), function (b) {
        if (!b.width) return;
        var row = rows.filter(function (x) { return Math.abs(x.t - b.top) < b.height / 2; })[0];
        if (row) { row.l = Math.min(row.l, b.left); row.r = Math.max(row.r, b.right); } else rows.push({ t: b.top, l: b.left, r: b.right });
      });
      return rows.sort(function (a, b) { return a.t - b.t; }).map(function (x) { return x.r - x.l; });
    }
    function fit(el) {
      el.style.maxWidth = ''; el.style.textWrap = '';
      var cs = getComputedStyle(el), full = el.getBoundingClientRect().width;
      if (!full || cs.whiteSpace === 'nowrap' || /flex|grid/.test(cs.display)) return;
      if (Array.prototype.some.call(el.children, function (c) { return !/^inline/.test(getComputedStyle(c).display); })) return;
      el.style.textWrap = 'wrap';
      var n = widths(el).length, lo = 0, hi = full, w, L;
      if (n < 2 || n > 3) { el.style.textWrap = ''; return; }
      while (hi - lo > 1) { w = (lo + hi) / 2; el.style.maxWidth = w + 'px'; if (widths(el).length > n) lo = w; else hi = w; }
      var best = 0, gap = Infinity;
      for (w = Math.ceil(hi); w <= full; w += 2) {
        el.style.maxWidth = w + 'px'; L = widths(el);
        // Each line no longer than the one above (within 10%, which reads as equal). Keep the most even width,
        // and prefer the first line longer: a last line longer than the first costs three times its overhang
        var score = Math.max.apply(null, L) - Math.min.apply(null, L) + Math.max(0, L[n - 1] - L[0]) * 3;
        if (L.length === n && L.every(function (x, i) { return !i || x <= L[i - 1] * 1.1 + 1; }) && score < gap) { gap = score; best = w; }
      }
      if (!best) { el.style.maxWidth = ''; el.style.textWrap = ''; return; }
      el.style.maxWidth = best + 'px';
      if (cs.textAlign === 'center' && cs.display === 'block') { el.style.marginLeft = 'auto'; el.style.marginRight = 'auto'; }
    }
    var queued = false, lastW = 0;
    function run() { queued = false; Array.prototype.forEach.call(root.querySelectorAll(SEL), fit); }
    function later() { if (!queued) { queued = true; requestAnimationFrame(run); } }
    later();
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(later);
    if (window.ResizeObserver) new ResizeObserver(function () { var w = root.getBoundingClientRect().width; if (Math.abs(w - lastW) > 0.5) { lastW = w; later(); } }).observe(root);
    if (window.MutationObserver) new MutationObserver(later).observe(root, { subtree: true, childList: true, characterData: true, attributes: true, attributeFilter: ['hidden'] });
  }

  function initSnoozeSlide(root) {
    if (!root || root.__miSnooze) return;
    root.__miSnooze = true;
    evenLines(root);
    var snoozed = root.querySelector('.sn-snoozed');

    root.querySelectorAll('.sn-item').forEach(function (item) {
      var card = item.querySelector('.sn-card');
      var track = item.querySelector('.sn-track');
      var when = item.querySelector('.sn-when');
      var time = item.querySelector('.sn-time');
      var opts = options();
      var x = 0, startX = 0, dragging = false, step = -1;

      function setX(v, settle) {
        x = Math.max(0, Math.min(MAX_DRAG, v));
        card.classList.toggle('is-settling', !!settle);
        card.style.setProperty('--sn-x', x + 'px');
        var s = x < STEP * 0.75 ? -1 : Math.min(3, Math.floor((x - STEP * 0.75) / STEP));
        if (s !== step) {
          step = s;
          opts = options();
          track.style.setProperty('--sn-step', Math.max(0, s));
          if (s >= 0) {
            when.textContent = opts[s].label;
            time.textContent = fmt(opts[s].at);
            when.classList.remove('is-pop');
            void when.offsetWidth;
            when.classList.add('is-pop');
            if (navigator.vibrate && dragging) { try { navigator.vibrate(8); } catch (e) {} }
          } else { when.textContent = 'Snooze'; time.textContent = 'Keep dragging'; }
        }
      }

      function commit() {
        if (step < 0) { setX(0, true); return; }
        var choice = opts[step];
        card.classList.add('is-settling');
        card.style.setProperty('--sn-x', '110%');
        setTimeout(function () { item.style.height = item.offsetHeight + 'px'; void item.offsetWidth; item.classList.add('is-gone'); }, 220);
        setTimeout(function () {
          item.hidden = true;
          item.classList.remove('is-gone');
          var pill = document.createElement('div');
          pill.className = 'sn-pill';
          pill.innerHTML = CLOCK;
          var text = document.createElement('span');
          text.textContent = 'Snoozed until ' + fmt(choice.at);
          var undo = document.createElement('button');
          undo.type = 'button';
          undo.textContent = 'Undo';
          undo.addEventListener('click', function () {
            pill.remove();
            item.hidden = false;
            item.style.height = '';
            setX(0, false);
            card.focus();
          });
          pill.append(text, undo);
          snoozed.appendChild(pill);
          undo.focus({ preventScroll: true });
        }, 640);
      }

      card.addEventListener('pointerdown', function (e) {
        dragging = true;
        startX = e.clientX - x;
        try { card.setPointerCapture(e.pointerId); } catch (err) {}
        card.classList.remove('is-settling');
      });
      card.addEventListener('pointermove', function (e) {
        if (!dragging) return;
        var raw = e.clientX - startX;
        // rubber band past the last option
        setX(raw > MAX_DRAG - 24 ? MAX_DRAG - 24 + (raw - (MAX_DRAG - 24)) * 0.25 : raw);
      });
      function end() { if (!dragging) return; dragging = false; commit(); }
      card.addEventListener('pointerup', end);
      card.addEventListener('pointercancel', function () { dragging = false; setX(0, true); });

      card.addEventListener('keydown', function (e) {
        if (e.key === 'ArrowRight') { e.preventDefault(); setX(Math.min(STEP * 3 + STEP * 0.75 + 4, (step < 0 ? STEP * 0.75 + 4 : x + STEP)), true); }
        else if (e.key === 'ArrowLeft') { e.preventDefault(); setX(step <= 0 ? 0 : x - STEP, true); }
        else if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); if (step >= 0) commit(); }
        else if (e.key === 'Escape') setX(0, true);
      });
      card.addEventListener('blur', function () { if (!dragging && step >= 0 && !item.hidden && card.style.getPropertyValue('--sn-x') !== '110%') setX(0, true); });
      when.textContent = 'Snooze';
      time.textContent = 'Keep dragging';
    });
  }

  window.initSnoozeSlide = initSnoozeSlide;
  function boot() { document.querySelectorAll('[data-mi="snooze-slide"]').forEach(initSnoozeSlide); }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();

</script>
<script>
(function () {
  var host = document.querySelector('.mi-host'), orig = host.innerHTML, fn = window["initSnoozeSlide"];
  document.querySelector('[data-mi-reset]').addEventListener('click', function (e) {
    host.innerHTML = orig;
    host.querySelectorAll('[data-mi]').forEach(function (el) { if (typeof fn === 'function') fn(el); });
    var b = e.currentTarget; b.classList.remove('is-spin'); void b.offsetWidth; b.classList.add('is-spin');
    setTimeout(function () { b.classList.remove('is-spin'); }, 700);
  });
})();
</script>
</body>
