<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Anxious Typing Dots · Micro Interactions</title>
<link rel="icon" type="image/svg+xml" href="../icons/outcraft-favicon-light.svg" media="(prefers-color-scheme: light)">
<link rel="icon" type="image/svg+xml" href="../icons/outcraft-favicon-dark.svg" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="../icons/outcraft-icon-180x180-light.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="../outcraft-tokens.css">
<style>
html, body { min-height: 100%; }
body { margin: 0; display: grid; place-items: center; padding: 64px 16px 48px; box-sizing: border-box; background: var(--subtle); color: var(--body); font-family: var(--font-sans); }
</style>
<style>
/* Anxious Typing Dots — the typing indicator gets more nervous the longer someone types, then they send "yes".
   Outcraft Design System v2. Every value is an Outcraft token. */
.ax {
  --ax-bg: var(--card);
  --ax-fg: var(--foreground);
  --ax-muted: var(--muted-foreground);
  --ax-line: var(--border);
  --ax-sunken: var(--subtle);
  --ax-fill: var(--muted);
  --ax-accent: var(--primary);
  --ax-on-accent: var(--primary-foreground);
  --ax-them: color-mix(in srgb, var(--ax-fg) 9%, var(--ax-bg));
  --ax-beat: 1.2s;
  display: flex;
  flex-direction: column;
  gap: 14px;
  width: 100%;
  max-width: 400px;
  box-sizing: border-box;
  padding: 20px;
  background: var(--ax-bg);
  color: var(--ax-fg);
  border-radius: var(--radius-xl);
  border: 1px solid var(--border);
  box-shadow: var(--shadow-sm);
  font: 400 var(--text-body)/var(--leading-body) var(--font-sans);
  letter-spacing: normal;
  text-align: left;
  -webkit-font-smoothing: antialiased;
}
.ax p { margin: 0; }
.ax-head { display: flex; align-items: center; gap: 10px; padding-bottom: 12px; border-bottom: 1px solid var(--ax-line); }
/* A letter in a tile is centered on its capital height, not its line box (10b.5): the tile trims its text to cap height and centers it.
   14px capitals leave an even split above and below at 1x and 2x */
.ax-avatar { display: block; align-content: center; text-align: center; text-box: trim-both cap alphabetic; flex: none; width: 36px; height: 36px; border-radius: 50%; background: var(--chart-2); color: var(--on-chart); font-size: var(--text-ui); font-weight: 700; }
.ax-name { font-weight: 600; }
.ax-presence { color: var(--ax-muted); font-size: var(--text-caption); line-height: var(--leading-caption); }

/* Holds its height on purpose: the typing bubble resizes on every frame, so the card would jitter */
.ax-thread { display: flex; flex-direction: column; gap: 4px; min-height: 196px; }
.ax-msg { max-width: 78%; padding: 8px 13px; border-radius: var(--radius-xl); font-size: var(--text-body-lg); line-height: var(--leading-body-lg); letter-spacing: normal; }
.ax-msg--me { align-self: flex-end; background: var(--ax-accent); color: var(--ax-on-accent); }
.ax-msg--them { align-self: flex-start; margin-top: 6px; background: var(--ax-them); animation: ax-pop var(--spring-pop-duration) var(--spring-pop) both; }
.ax-read { align-self: flex-end; color: var(--ax-muted); font-size: calc(var(--text-caption) - 1px); line-height: 14px; font-weight: 500; }

/* The indicator. Its size, speed and shake come from data-stage. */
.ax-typing { margin-top: 8px; }
.ax-bubble {
  position: relative;
  display: block;
  width: 62px;
  height: 36px;
  border-radius: var(--radius-xl);
  background: var(--ax-them);
  transform-origin: 0 100%;
  transition: width var(--spring-ui-duration) var(--spring-ui), height var(--spring-ui-duration) var(--spring-ui), transform var(--spring-ui-duration) var(--spring-ui), opacity var(--duration-slow);
}
.ax-ghost { position: absolute; top: 11px; left: 14px; right: 14px; bottom: 32px; border-radius: var(--radius-xs); background: repeating-linear-gradient(to bottom, color-mix(in srgb, var(--ax-fg) 10%, transparent) 0 7px, transparent 7px 13px); -webkit-mask-image: linear-gradient(90deg, var(--black) 62%, transparent); mask-image: linear-gradient(90deg, var(--black) 62%, transparent); opacity: 0; transition: opacity var(--duration-slower); }
.ax-dots { position: absolute; left: 14px; bottom: 14px; display: flex; gap: 4px; }
.ax-dots i { width: 8px; height: 8px; border-radius: 50%; background: color-mix(in srgb, var(--ax-fg) 38%, transparent); animation: ax-bob var(--ax-beat) var(--ease-in-out) infinite; }
.ax-dots i:nth-child(2) { animation-delay: calc(var(--ax-beat) / 6); }
.ax-dots i:nth-child(3) { animation-delay: calc(var(--ax-beat) / 3); }
@keyframes ax-bob { 0%, 60%, 100% { transform: translateY(0); opacity: 0.5; } 30% { transform: translateY(-4px); opacity: 1; } }

.ax[data-stage="2"] { --ax-beat: 0.9s; }
.ax[data-stage="2"] .ax-bubble { width: 96px; }
.ax[data-stage="3"] { --ax-beat: 0.62s; }
.ax[data-stage="3"] .ax-bubble { width: 168px; height: 58px; }
.ax[data-stage="4"], .ax[data-stage="5"] { --ax-beat: 0.4s; }
.ax[data-stage="4"] .ax-bubble, .ax[data-stage="5"] .ax-bubble { width: 230px; height: 84px; }
.ax[data-stage="3"] .ax-ghost, .ax[data-stage="4"] .ax-ghost, .ax[data-stage="5"] .ax-ghost { opacity: 1; }
.ax[data-stage="4"] .ax-dots { animation: ax-jitter var(--duration-base) steps(2) infinite; }
.ax[data-stage="5"] .ax-dots i { animation: none; opacity: 0.35; }
.ax[data-stage="6"] .ax-bubble, .ax[data-stage="7"] .ax-bubble { transform: scale(0); opacity: 0; transition-duration: var(--spring-press-duration); }
/* Once the reply lands, the empty indicator gives its space back so "yes" sits right under the question */
.ax[data-stage="7"] .ax-typing { display: none; }
.ax[data-stage="7"] .ax-msg--them { margin-top: 10px; }
@keyframes ax-jitter { 50% { transform: translate(0.5px, -0.5px); } }
@keyframes ax-pop { from { opacity: 0; transform: scale(0.6); } }

.ax-foot { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-top: 12px; border-top: 1px solid var(--ax-line); }
.ax-now { min-width: 0; }
.ax-caption { font-weight: 600; font-size: var(--text-body); }
.ax-timer { color: var(--ax-muted); font-size: var(--text-small); line-height: var(--leading-small); font-variant-numeric: tabular-nums; }
.ax-replay { flex: none; height: 36px; padding: 0 16px; border: 0; border-radius: var(--radius-md); background: var(--ax-fill); color: var(--ax-fg); font: inherit; font-weight: 600; cursor: pointer; transition: transform var(--spring-press-duration) var(--spring-press); }
.ax-replay:active { transform: scale(var(--press-scale)); }
.ax-replay:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }

@media (prefers-reduced-motion: reduce) {
  .ax-dots i, .ax[data-stage="4"] .ax-dots, .ax-msg--them { animation: none; }
  .ax-bubble { transition-duration: var(--duration-reduced); transition-timing-function: linear; }
}
/* Multi-line text wraps evenly and never ends on one or two lonely words */
.ax :is(p, li, dd, dt, small, label, figcaption, h1, h2, h3, h4) { text-wrap: balance; }
.ax [hidden] { display: none !important; }

</style>
<style>
/* Reset: a small icon button in the corner of every demo; a "Reset" pill slides out on hover or focus */
.mi-host { display: contents; }
.mi-reset { position: absolute; top: 12px; right: 12px; z-index: 5; display: grid; place-items: center; width: 32px; height: 32px; padding: 0; border: 1px solid var(--border); border-radius: var(--radius-full); background: var(--card); color: var(--muted-foreground); box-shadow: var(--shadow-xs); cursor: pointer; -webkit-tap-highlight-color: transparent; transition: color var(--duration-fast) var(--ease-out), border-color var(--duration-fast) var(--ease-out); }
.mi-reset svg { width: 16px; height: 16px; transition: transform var(--spring-ui-duration) var(--spring-ui); }
.mi-reset:hover, .mi-reset:focus-visible { color: var(--foreground); border-color: var(--border-strong); }
.mi-reset:hover svg { transform: rotate(-45deg); }
.mi-reset.is-spin svg { transform: rotate(-360deg); transition: transform var(--spring-pop-duration) var(--spring-pop); }
.mi-reset:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }
.mi-reset-tip { position: absolute; top: 50%; right: calc(100% + 6px); padding: 4px 10px; border-radius: var(--radius-full); background: var(--foreground); color: var(--background); font: 500 var(--text-caption)/var(--leading-caption) var(--font-sans); white-space: nowrap; pointer-events: none; opacity: 0; transform: translate(6px, -50%) scale(0.96); transform-origin: right center; transition: opacity var(--duration-fast) var(--ease-out), transform var(--spring-ui-duration) var(--spring-ui); }
.mi-reset:hover .mi-reset-tip, .mi-reset:focus-visible .mi-reset-tip { opacity: 1; transform: translate(0, -50%) scale(1); }
.mi-reset--page { position: fixed; top: 16px; right: 16px; }
@media (hover: none) { .mi-reset-tip { display: none; } }
@media (prefers-reduced-motion: reduce) { .mi-reset svg, .mi-reset.is-spin svg, .mi-reset-tip { transition: opacity var(--duration-reduced) var(--ease-out); transform: none; } .mi-reset-tip { transform: translate(0, -50%); } }
.mi-sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

</style>
</head>
<body>
<button type="button" class="mi-reset mi-reset--page" data-mi-reset aria-label="Reset Anxious Typing Dots"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg><span class="mi-reset-tip" aria-hidden="true">Reset</span></button>
<div class="mi-host"><div class="ax" data-mi="anxious-dots" data-name="Mira">
  <header class="ax-head">
    <span class="ax-avatar" aria-hidden="true">M</span>
    <div><p class="ax-name">Mira Chen</p><p class="ax-presence">Active now</p></div>
  </header>
  <div class="ax-thread">
    <p class="ax-msg ax-msg--me">Quick question. Are we still shipping on Friday?</p>
    <p class="ax-read">Seen 4:12 PM</p>
    <div class="ax-typing" aria-hidden="true">
      <span class="ax-bubble"><span class="ax-ghost"></span><span class="ax-dots"><i></i><i></i><i></i></span></span>
    </div>
    <p class="ax-msg ax-msg--them" hidden>yes</p>
  </div>
  <div class="ax-foot">
    <div class="ax-now">
      <p class="ax-caption" role="status" aria-live="polite">Mira is typing…</p>
      <p class="ax-timer">Typing for 0:00</p>
    </div>
    <button type="button" class="ax-replay">Replay</button>
  </div>
</div>
</div>
<script>
/* Anxious Typing Dots — vanilla JS. Auto-initializes every [data-mi="anxious-dots"].
   Plays a scripted typing session when it first comes into view; Replay plays it again.
   In a real chat, drive data-stage from how long the other person has been typing.
   Call window.initAnxiousDots(el) for elements added later. */
(function () {
  'use strict';
  // at: demo time in ms. clock: how long they've "really" been typing, in seconds.
  function script(n) {
    return [
      { at: 0, stage: 1, caption: n + ' is typing…', clock: 3 },
      { at: 1800, stage: 2, caption: n + ' is typing a lot…', clock: 41 },
      { at: 3600, stage: 3, caption: 'This is a paragraph now.', clock: 96 },
      { at: 5400, stage: 4, caption: n + ' is writing you a novel.', clock: 178 },
      { at: 7400, stage: 5, caption: n + ' stopped typing.', clock: 200, timer: 'Paused at ' },
      { at: 8600, stage: 4, caption: n + ' is typing again…', clock: 204 },
      { at: 9900, stage: 6, caption: n + ' deleted all of it.', clock: 242, timer: 'Deleted after ' },
      { at: 11300, stage: 7, caption: '4 minutes of typing. 3 letters.', clock: 249, timer: 'Total: ', end: true }
    ];
  }
  function mmss(s) { s = Math.round(s); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); }

  // Even line breaks: text that wraps to two or three lines is narrowed until its lines are close in length,
  // with the first line the longest, so no line runs long while the next holds a word or two.
  function evenLines(root) {
    var SEL = 'p, li, dd, dt, small, label, figcaption, h1, h2, h3, h4';
    function widths(el) {
      var range = document.createRange(), rows = [];
      range.selectNodeContents(el);
      Array.prototype.forEach.call(range.getClientRects(), function (b) {
        if (!b.width) return;
        var row = rows.filter(function (x) { return Math.abs(x.t - b.top) < b.height / 2; })[0];
        if (row) { row.l = Math.min(row.l, b.left); row.r = Math.max(row.r, b.right); } else rows.push({ t: b.top, l: b.left, r: b.right });
      });
      return rows.sort(function (a, b) { return a.t - b.t; }).map(function (x) { return x.r - x.l; });
    }
    function fit(el) {
      el.style.maxWidth = ''; el.style.textWrap = '';
      var cs = getComputedStyle(el), full = el.getBoundingClientRect().width;
      if (!full || cs.whiteSpace === 'nowrap' || /flex|grid/.test(cs.display)) return;
      if (Array.prototype.some.call(el.children, function (c) { return !/^inline/.test(getComputedStyle(c).display); })) return;
      el.style.textWrap = 'wrap';
      var n = widths(el).length, lo = 0, hi = full, w, L;
      if (n < 2 || n > 3) { el.style.textWrap = ''; return; }
      while (hi - lo > 1) { w = (lo + hi) / 2; el.style.maxWidth = w + 'px'; if (widths(el).length > n) lo = w; else hi = w; }
      var best = 0, gap = Infinity;
      for (w = Math.ceil(hi); w <= full; w += 2) {
        el.style.maxWidth = w + 'px'; L = widths(el);
        // Each line no longer than the one above (within 10%, which reads as equal). Keep the most even width,
        // and prefer the first line longer: a last line longer than the first costs three times its overhang
        var score = Math.max.apply(null, L) - Math.min.apply(null, L) + Math.max(0, L[n - 1] - L[0]) * 3;
        if (L.length === n && L.every(function (x, i) { return !i || x <= L[i - 1] * 1.1 + 1; }) && score < gap) { gap = score; best = w; }
      }
      if (!best) { el.style.maxWidth = ''; el.style.textWrap = ''; return; }
      el.style.maxWidth = best + 'px';
      if (cs.textAlign === 'center' && cs.display === 'block') { el.style.marginLeft = 'auto'; el.style.marginRight = 'auto'; }
    }
    var queued = false, lastW = 0;
    function run() { queued = false; Array.prototype.forEach.call(root.querySelectorAll(SEL), fit); }
    function later() { if (!queued) { queued = true; requestAnimationFrame(run); } }
    later();
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(later);
    if (window.ResizeObserver) new ResizeObserver(function () { var w = root.getBoundingClientRect().width; if (Math.abs(w - lastW) > 0.5) { lastW = w; later(); } }).observe(root);
    if (window.MutationObserver) new MutationObserver(later).observe(root, { subtree: true, childList: true, characterData: true, attributes: true, attributeFilter: ['hidden'] });
  }

  function initAnxiousDots(root) {
    if (!root || root.__miDots) return;
    root.__miDots = true;
    evenLines(root);
    var name = root.getAttribute('data-name') || 'They';
    var steps = script(name);
    var caption = root.querySelector('.ax-caption');
    var timer = root.querySelector('.ax-timer');
    var reply = root.querySelector('.ax-msg--them');
    var presence = root.querySelector('.ax-presence');
    var replay = root.querySelector('.ax-replay');
    var t0 = 0, raf = 0, idx = -1;

    function frame(now) {
      var t = Math.max(0, now - t0); // the first frame can be stamped just before t0
      while (idx + 1 < steps.length && t >= steps[idx + 1].at) {
        idx++;
        var s = steps[idx];
        root.setAttribute('data-stage', s.stage);
        caption.textContent = s.caption;
        if (s.end) {
          reply.hidden = false;
          presence.textContent = 'Active now';
        } else if (s.stage === 6) presence.textContent = 'Active now';
        else presence.textContent = 'Typing…';
      }
      var cur = steps[idx], nxt = steps[idx + 1];
      // The timer runs between the scripted clock values, so it visibly races.
      var secs = cur.clock;
      if (nxt && !cur.timer) secs = cur.clock + (nxt.clock - cur.clock) * Math.min(1, (t - cur.at) / (nxt.at - cur.at));
      timer.textContent = (cur.timer || 'Typing for ') + mmss(secs);
      if (nxt) raf = requestAnimationFrame(frame);
    }

    function play() {
      cancelAnimationFrame(raf);
      reply.hidden = true;
      idx = -1;
      t0 = performance.now();
      raf = requestAnimationFrame(frame);
    }

    replay.addEventListener('click', play);
    root.setAttribute('data-stage', '1');
    if ('IntersectionObserver' in window) {
      var io = new IntersectionObserver(function (entries) {
        if (entries.some(function (e) { return e.isIntersecting; })) { io.disconnect(); play(); }
      }, { threshold: 0.5 });
      io.observe(root);
    } else play();
    root.replay = play;
  }

  window.initAnxiousDots = initAnxiousDots;
  function boot() { document.querySelectorAll('[data-mi="anxious-dots"]').forEach(initAnxiousDots); }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();

</script>
<script>
(function () {
  var host = document.querySelector('.mi-host'), orig = host.innerHTML, fn = window["initAnxiousDots"];
  document.querySelector('[data-mi-reset]').addEventListener('click', function (e) {
    host.innerHTML = orig;
    host.querySelectorAll('[data-mi]').forEach(function (el) { if (typeof fn === 'function') fn(el); });
    var b = e.currentTarget; b.classList.remove('is-spin'); void b.offsetWidth; b.classList.add('is-spin');
    setTimeout(function () { b.classList.remove('is-spin'); }, 700);
  });
})();
</script>
</body>
</html>
