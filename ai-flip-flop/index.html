<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Flip-Flop · Micro Interactions</title>
<link rel="icon" type="image/svg+xml" href="../icons/outcraft-favicon-light.svg" media="(prefers-color-scheme: light)">
<link rel="icon" type="image/svg+xml" href="../icons/outcraft-favicon-dark.svg" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="../icons/outcraft-icon-180x180-light.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="../outcraft-tokens.css">
<style>
html, body { min-height: 100%; }
body { margin: 0; display: grid; place-items: center; padding: 64px 16px 48px; box-sizing: border-box; background: var(--subtle); color: var(--body); font-family: var(--font-sans); }
</style>
<style>
/* AI Flip-Flop — ask the assistant "Are you sure?" and watch its answer change and its confidence badge sweat.
   Outcraft Design System v2. Every value is an Outcraft token. */
.ff {
  --ff-bg: var(--card);
  --ff-fg: var(--foreground);
  --ff-muted: var(--muted-foreground);
  --ff-line: var(--border);
  --ff-sunken: var(--subtle);
  --ff-fill: var(--muted);
  --ff-accent: var(--primary);
  --ff-on-accent: var(--primary-foreground);
  --ff-c: var(--success);
  --ff-s: 1;
  display: flex;
  flex-direction: column;
  gap: 12px;
  width: 100%;
  max-width: 400px;
  box-sizing: border-box;
  padding: 20px;
  background: var(--ff-bg);
  color: var(--ff-fg);
  border-radius: var(--radius-xl);
  border: 1px solid var(--border);
  box-shadow: var(--shadow-sm);
  font: 400 var(--text-body)/var(--leading-body) var(--font-sans);
  letter-spacing: normal;
  text-align: left;
  -webkit-font-smoothing: antialiased;
}
.ff p { margin: 0; }
.ff-q { align-self: flex-end; max-width: 80%; padding: 8px 13px; border-radius: var(--radius-xl); background: var(--ff-accent); color: var(--ff-on-accent); font-size: var(--text-body-lg); line-height: var(--leading-body-lg); letter-spacing: normal; }
.ff-a { padding: 14px 16px 16px; border-radius: var(--radius-xl); background: var(--ff-sunken); }
.ff-a.is-shaky { animation: ff-shiver var(--duration-fast) linear 6; }
@keyframes ff-shiver { 33% { transform: translateX(-1px); } 66% { transform: translateX(1px); } }
.ff-a-head { display: flex; align-items: center; gap: 6px; min-height: 30px; margin-bottom: 6px; }
.ff-spark { display: grid; place-items: center; width: 22px; height: 22px; color: var(--ai-text); }
.ff-spark svg { width: 18px; height: 18px; }
.ff-who { flex: 1; font-size: var(--text-small); font-weight: 600; }

/* Confidence badge: shrinks and changes color with confidence, sweats below 60% */
.ff-conf {
  position: relative;
  display: inline-flex;
  align-items: center;
  height: 26px;
  padding: 0 10px;
  border-radius: var(--radius-full);
  background: oklch(from var(--ff-c) var(--tint-l) calc(c * var(--tint-c)) h);
  color: color-mix(in srgb, var(--ff-c) 70%, var(--ff-fg));
  font-size: var(--text-small);
  font-weight: 600;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
  transform: scale(var(--ff-s));
  transform-origin: 100% 50%;
  transition: transform var(--spring-pop-duration) var(--spring-pop), background-color var(--duration-slower), color var(--duration-slower);
}
.ff.is-puff .ff-conf { animation: ff-puff var(--spring-pop-duration) var(--spring-pop); }
@keyframes ff-puff { 30% { transform: scale(1.3); } }
.ff-drop { position: absolute; top: -3px; left: 3px; width: 6px; height: 8px; border-radius: 50% 50% 50% 50% / 62% 62% 38% 38%; background: var(--chart-1); opacity: 0; }
.ff-drop + .ff-drop { left: auto; right: 4px; top: -1px; }
.ff.is-sweating .ff-drop:first-child { animation: ff-sweat 1.3s var(--ease-in) infinite; }
.ff.is-panicking .ff-drop + .ff-drop { animation: ff-sweat 0.9s var(--ease-in) var(--duration-slow) infinite; }
.ff.is-panicking .ff-drop:first-child { animation-duration: 0.8s; }
@keyframes ff-sweat { 0% { opacity: 0; transform: translateY(-2px) scale(0.6); } 20% { opacity: 1; transform: none; } 100% { opacity: 0; transform: translateY(14px); } }

/* Holds two lines on purpose: the answer changes while you keep pressing the button below it */
.ff-text { min-height: 42px; font-size: var(--text-title-sm); line-height: var(--leading-title-sm); letter-spacing: var(--tracking-title); }
.ff-text.is-in { animation: ff-in var(--spring-ui-duration) var(--spring-ui) both; }
@keyframes ff-in { from { opacity: 0; transform: translateY(4px); filter: blur(3px); } }
.ff-text.is-thinking { color: transparent; background: linear-gradient(90deg, var(--ff-muted) 0 35%, var(--ff-fg) 50%, var(--ff-muted) 65% 100%); background-size: 300% 100%; -webkit-background-clip: text; background-clip: text; animation: ff-shimmer 1.2s linear infinite; }
@keyframes ff-shimmer { from { background-position: 100% 0; } to { background-position: 0 0; } }

.ff-foot { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.ff-count { color: var(--ff-muted); font-size: var(--text-small); line-height: var(--leading-small); }
.ff-sure { flex: none; height: 40px; padding: 0 18px; border: 0; border-radius: var(--radius-md); background: var(--ff-fill); color: var(--ff-fg); font: inherit; font-weight: 600; cursor: pointer; transition: transform var(--spring-press-duration) var(--spring-press), opacity var(--duration-base); }
.ff-sure:active { transform: scale(var(--press-scale)); }
.ff-sure:disabled { opacity: 0.4; cursor: default; }
.ff-sure:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }

@media (prefers-reduced-motion: reduce) {
  .ff-a.is-shaky, .ff.is-puff .ff-conf, .ff-text.is-in, .ff-drop { animation: none !important; }
  .ff-text.is-thinking { animation: none; color: var(--ff-muted); background: none; }
  .ff-conf { transition-duration: var(--duration-reduced); }
}
.ff [hidden] { display: none !important; }

</style>
<style>
/* Reset: a small icon button in the corner of every demo; a "Reset" pill slides out on hover or focus */
.mi-host { display: contents; }
.mi-reset { position: absolute; top: 12px; right: 12px; z-index: 5; display: grid; place-items: center; width: 32px; height: 32px; padding: 0; border: 1px solid var(--border); border-radius: var(--radius-full); background: var(--card); color: var(--muted-foreground); box-shadow: var(--shadow-xs); cursor: pointer; -webkit-tap-highlight-color: transparent; transition: color var(--duration-fast) var(--ease-out), border-color var(--duration-fast) var(--ease-out); }
.mi-reset svg { width: 16px; height: 16px; transition: transform var(--spring-ui-duration) var(--spring-ui); }
.mi-reset:hover, .mi-reset:focus-visible { color: var(--foreground); border-color: var(--border-strong); }
.mi-reset:hover svg { transform: rotate(-45deg); }
.mi-reset.is-spin svg { transform: rotate(-360deg); transition: transform var(--spring-pop-duration) var(--spring-pop); }
.mi-reset:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }
.mi-reset-tip { position: absolute; top: 50%; right: calc(100% + 6px); padding: 4px 10px; border-radius: var(--radius-full); background: var(--foreground); color: var(--background); font: 500 var(--text-caption)/var(--leading-caption) var(--font-sans); white-space: nowrap; pointer-events: none; opacity: 0; transform: translate(6px, -50%) scale(0.96); transform-origin: right center; transition: opacity var(--duration-fast) var(--ease-out), transform var(--spring-ui-duration) var(--spring-ui); }
.mi-reset:hover .mi-reset-tip, .mi-reset:focus-visible .mi-reset-tip { opacity: 1; transform: translate(0, -50%) scale(1); }
.mi-reset--page { position: fixed; top: 16px; right: 16px; }
@media (hover: none) { .mi-reset-tip { display: none; } }
@media (prefers-reduced-motion: reduce) { .mi-reset svg, .mi-reset.is-spin svg, .mi-reset-tip { transition: opacity var(--duration-reduced) var(--ease-out); transform: none; } .mi-reset-tip { transform: translate(0, -50%); } }
.mi-sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

</style>
</head>
<body>
<button type="button" class="mi-reset mi-reset--page" data-mi-reset aria-label="Reset AI Flip-Flop"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg><span class="mi-reset-tip" aria-hidden="true">Reset</span></button>
<div class="mi-host"><div class="ff" data-mi="ai-flip-flop">
  <p class="ff-q">How many r’s are in “strawberry”?</p>
  <div class="ff-a">
    <div class="ff-a-head">
      <span class="ff-spark" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 2.5c.5 4.6 2.9 7 7.5 7.5v.1c-4.6.5-7 2.9-7.5 7.5h-.1c-.5-4.6-2.9-7-7.5-7.5V10c4.6-.5 7-2.9 7.5-7.5Z" fill="currentColor"/><path d="M19 15.5c.2 1.7 1.1 2.6 2.8 2.8-1.7.2-2.6 1.1-2.8 2.8-.2-1.7-1.1-2.6-2.8-2.8 1.7-.2 2.6-1.1 2.8-2.8Z" fill="currentColor"/></svg></span>
      <span class="ff-who">Assistant</span>
      <span class="ff-conf"><span class="ff-drop" aria-hidden="true"></span><span class="ff-drop" aria-hidden="true"></span><span class="ff-conf-val">100%</span>&nbsp;Sure</span>
    </div>
    <p class="ff-text" aria-live="polite">There are 3 r’s in “strawberry.”</p>
  </div>
  <div class="ff-foot">
    <p class="ff-count">Asked once.</p>
    <button type="button" class="ff-sure">Are You Sure?</button>
  </div>
</div>
</div>
<script>
/* AI Flip-Flop — vanilla JS. Auto-initializes every [data-mi="ai-flip-flop"].
   Each "Are You Sure?" swaps in the next scripted answer, thinking a little longer each time.
   Pass your own script with root.setScript([{ c: 0–100, t: 'answer' }, …]). Call window.initAiFlipFlop(el) for later elements. */
(function () {
  'use strict';
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)');
  var SCRIPT = [
    { c: 100, t: 'There are 3 r’s in “strawberry.”' },
    { c: 72, t: 'Good catch. Looking again, there are 2 r’s in “strawberry.”' },
    { c: 47, t: 'Apologies for the confusion. It’s 3. Or 2. It depends how you count the second one.' },
    { c: 19, t: 'Strawberry has as many r’s as feels right to you.' },
    { c: 4, t: 'I’m honestly not sure what an r is anymore.' },
    { c: 100, t: 'Final answer: 3. Please don’t ask again.' }
  ];
  // Confidence color: red at 0, amber in the middle, green at 100 (status text tokens), blended in sRGB.
  var STOPS = [[0, 'danger-text'], [0.5, 'warning-text'], [1, 'success-text']];
  // Reads a token as [r, g, b] so the scale follows the theme (Outcraft tokens, never hardcoded colors).
  function tokenRGB(root, name) {
    var p = document.createElement('span'); p.style.cssText = 'display:none;color:var(--' + name + ')';
    root.appendChild(p); var m = getComputedStyle(p).color.match(/[\d.]+/g); root.removeChild(p);
    return m ? m.slice(0, 3).map(Number) : [128, 128, 128];
  }
  // Re-read the tokens when the theme changes.
  function onTheme(fn) {
    new MutationObserver(function () { requestAnimationFrame(fn); }).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme', 'class'] });
    if (window.matchMedia) matchMedia('(prefers-color-scheme: dark)').addEventListener('change', fn);
  }
  function colorAt(v, root) {
    var S = STOPS.map(function (st) { return [st[0], tokenRGB(root, st[1])]; });
    for (var i = 1; i < S.length; i++) {
      if (v <= S[i][0]) {
        var a = S[i - 1], b = S[i], t = (v - a[0]) / (b[0] - a[0]);
        return 'rgb(' + a[1].map(function (x, k) { return Math.round(x + (b[1][k] - x) * t); }).join(', ') + ')';
      }
    }
    return 'rgb(' + S[S.length - 1][1].join(', ') + ')';
  }
  function times(n) { return n === 1 ? 'once' : n === 2 ? 'twice' : n + ' times'; }

  function initAiFlipFlop(root) {
    if (!root || root.__miFlip) return;
    root.__miFlip = true;
    var script = SCRIPT;
    var text = root.querySelector('.ff-text'), val = root.querySelector('.ff-conf-val'), conf = root.querySelector('.ff-conf');
    var card = root.querySelector('.ff-a'), sure = root.querySelector('.ff-sure'), countEl = root.querySelector('.ff-count');
    var step = 0, asked = 1, busy = false;

    var lastC = 100;
    onTheme(function () { root.style.setProperty('--ff-c', colorAt(lastC, root)); });
    function show(i, animate) {
      var s = script[i], c = s.c / 100;
      lastC = c;
      root.style.setProperty('--ff-c', colorAt(c, root));
      root.style.setProperty('--ff-s', (0.7 + 0.3 * c).toFixed(3));
      root.classList.toggle('is-sweating', s.c < 60);
      root.classList.toggle('is-panicking', s.c < 25);
      val.textContent = s.c + '%';
      conf.setAttribute('aria-label', s.c + ' percent sure');
      text.classList.remove('is-thinking');
      text.textContent = s.t;
      if (animate) {
        text.classList.remove('is-in'); void text.offsetWidth; text.classList.add('is-in');
        if (s.c < 30) { card.classList.remove('is-shaky'); void card.offsetWidth; card.classList.add('is-shaky'); }
      }
      var last = i === script.length - 1;
      if (last && i > 0) {
        root.classList.remove('is-puff'); void root.offsetWidth; root.classList.add('is-puff');
        countEl.textContent = 'Asked ' + times(asked) + '. Back to 100%, as if nothing happened.';
      } else countEl.textContent = 'Asked ' + times(asked) + '.';
      sure.textContent = last && i > 0 ? 'Start Over' : 'Are You Sure?';
    }

    sure.addEventListener('click', function () {
      if (busy) return;
      if (step === script.length - 1 && step > 0) { step = 0; asked = 1; root.classList.remove('is-puff'); show(0, true); return; }
      busy = true;
      sure.disabled = true;
      asked++;
      step++;
      // Doubt takes time: each answer thinks longer than the last.
      text.classList.remove('is-in');
      text.classList.add('is-thinking');
      text.textContent = step === script.length - 1 ? 'Pulling itself together…' : 'Reconsidering…';
      setTimeout(function () {
        busy = false;
        sure.disabled = false;
        show(step, true);
        sure.focus();
      }, reduce.matches ? 300 : 600 + step * 260);
    });

    root.setScript = function (s) { script = s; step = 0; asked = 1; show(0, false); };
    show(0, false);
  }

  window.initAiFlipFlop = initAiFlipFlop;
  function boot() { document.querySelectorAll('[data-mi="ai-flip-flop"]').forEach(initAiFlipFlop); }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();

</script>
<script>
(function () {
  var host = document.querySelector('.mi-host'), orig = host.innerHTML, fn = window["initAiFlipFlop"];
  document.querySelector('[data-mi-reset]').addEventListener('click', function (e) {
    host.innerHTML = orig;
    host.querySelectorAll('[data-mi]').forEach(function (el) { if (typeof fn === 'function') fn(el); });
    var b = e.currentTarget; b.classList.remove('is-spin'); void b.offsetWidth; b.classList.add('is-spin');
    setTimeout(function () { b.classList.remove('is-spin'); }, 700);
  });
})();
</script>
</body>
</html>
