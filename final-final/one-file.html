<!doctype html>
<html lang="en">
<head>

<title>final_FINAL_v3</title>
<style>

body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 48px 16px; box-sizing: border-box; background: #F3F2EE; }

<style>
@import url('https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap');

/* Outcraft Design System v2: the tokens this component uses, scoped to .fn so they never affect the rest of your page. */
.fn {
  --font-sans: "Geist", system-ui, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --leading-body: 22px;
  --leading-caption: 16px;
  --leading-small: 18px;
  --leading-title-sm: 24px;
  --press-scale: 0.97;
  --radius-lg: 12px;
  --radius-md: 8px;
  --radius-sm: 6px;
  --radius-xl: 16px;
  --radius-xs: 4px;
  --spring-press: linear(0, 0.0189, 0.0676, 0.1361, 0.2164, 0.3025, 0.3896, 0.4743, 0.5543, 0.628, 0.6945, 0.7535, 0.8049, 0.849, 0.8863, 0.9172, 0.9425, 0.9629, 0.9789, 0.9912, 1.0004, 1.0071, 1.0116, 1.0145, 1.016, 1.0166, 1.0164, 1.0156, 1.0146, 1.0133, 1.0118, 1.0104, 1.009, 1.0076, 1.0064, 1.0053, 1.0043, 1.0034, 1.0026, 1.002, 1);
  --spring-press-duration: 310ms;
  --spring-ui: linear(0, 0.0237, 0.0849, 0.1704, 0.2697, 0.3746, 0.4788, 0.5777, 0.6685, 0.7491, 0.8189, 0.8776, 0.9257, 0.9639, 0.9931, 1.0147, 1.0296, 1.0391, 1.0442, 1.046, 1.0451, 1.0425, 1.0387, 1.0342, 1.0294, 1.0246, 1.02, 1.0158, 1.012, 1.0087, 1.0059, 1.0037, 1.0019, 1.0005, 0.9994, 0.9987, 0.9982, 0.998, 0.9979, 0.9979, 1);
  --spring-ui-duration: 460ms;
  --text-body: 15px;
  --text-caption: 12px;
  --text-small: 13px;
  --text-title-sm: 17px;
  --tracking-title: -0.015em;
  --ai: var(--orange);
  --aqua: #79EEEC;
  --aqua-700: #0B7573;
  --ash: #646A66;
  --black: #000000;
  --border: var(--line);
  --card: var(--white);
  --foreground: var(--black);
  --line: #DCDED9;
  --mist: #ECEBE6;
  --muted: var(--mist);
  --muted-foreground: var(--ash);
  --on-color: #ffffff;
  --orange: #FE8C5F;
  --pink: #FFC7F6;
  --pop: var(--pink);
  --pop-foreground: #000000;
  --primary: var(--black);
  --primary-foreground: #ffffff;
  --ring: var(--aqua-700);
  --shadow-sm: 0 1px 2px rgba(17, 17, 16, 0.04), 0 1px 3px rgba(17, 17, 16, 0.07);
  --soft-ground: #F3F2EE;
  --subtle: var(--soft-ground);
  --white: #FFFFFF;
}
/* Dark mode: follows data-theme="dark" (or class "dark") on any ancestor, or the system setting. */
[data-theme="dark"] .fn, .dark .fn {
  --ai: var(--orange);
  --aqua: #79EEEC;
  --aqua-700: #79EEEC;
  --ash: #A3A8A4;
  --black: #000000;
  --border: var(--line);
  --card: var(--white);
  --foreground: #F3F2EE;
  --line: #313432;
  --mist: #2B2E2D;
  --muted: var(--mist);
  --muted-foreground: var(--ash);
  --on-color: #ffffff;
  --orange: #FE8C5F;
  --pink: #FFC7F6;
  --pop: var(--pink);
  --pop-foreground: #000000;
  --primary: var(--aqua);
  --primary-foreground: #000000;
  --ring: var(--aqua);
  --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.4), 0 1px 3px rgba(0, 0, 0, 0.3);
  --soft-ground: #0C0D0C;
  --subtle: var(--soft-ground);
  --white: #161817;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]):not(.light) .fn {
    --ai: var(--orange);
    --aqua: #79EEEC;
    --aqua-700: #79EEEC;
    --ash: #A3A8A4;
    --black: #000000;
    --border: var(--line);
    --card: var(--white);
    --foreground: #F3F2EE;
    --line: #313432;
    --mist: #2B2E2D;
    --muted: var(--mist);
    --muted-foreground: var(--ash);
    --on-color: #ffffff;
    --orange: #FE8C5F;
    --pink: #FFC7F6;
    --pop: var(--pink);
    --pop-foreground: #000000;
    --primary: var(--aqua);
    --primary-foreground: #000000;
    --ring: var(--aqua);
    --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.4), 0 1px 3px rgba(0, 0, 0, 0.3);
    --soft-ground: #0C0D0C;
    --subtle: var(--soft-ground);
    --white: #161817;
  }
}

/* final_FINAL_v3 — every save evolves the file name, the way everyone's file names evolve.
   Outcraft Design System v2. Every value is an Outcraft token. */
.fn {
  --fn-bg: var(--card);
  --fn-fg: var(--foreground);
  --fn-muted: var(--muted-foreground);
  --fn-line: var(--border);
  --fn-sunken: var(--subtle);
  --fn-fill: var(--muted);
  --fn-accent: var(--primary);
  --fn-on-accent: var(--primary-foreground);
  display: flex;
  flex-direction: column;
  gap: 12px;
  width: 100%;
  max-width: 400px;
  box-sizing: border-box;
  padding: 20px;
  background: var(--fn-bg);
  color: var(--fn-fg);
  border-radius: var(--radius-xl);
  border: 1px solid var(--border);
  box-shadow: var(--shadow-sm);
  font: 400 var(--text-body)/var(--leading-body) var(--font-sans);
  letter-spacing: normal;
  text-align: left;
  -webkit-font-smoothing: antialiased;
}
.fn p { margin: 0; }
.fn-file { display: flex; align-items: center; gap: 14px; padding: 14px; border-radius: var(--radius-xl); background: var(--fn-sunken); }
.fn-icon { display: grid; place-items: center; flex: none; width: 48px; height: 48px; border-radius: var(--radius-lg); background: var(--pop); color: var(--pop-foreground); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--black) 6%, transparent); }
.fn-icon svg { width: 26px; height: 26px; }
.fn-text { min-width: 0; }
.fn-name { font-size: var(--text-title-sm); line-height: var(--leading-title-sm); font-weight: 600; letter-spacing: var(--tracking-title); overflow-wrap: anywhere; }
.fn-ext { color: var(--fn-muted); font-weight: 500; }
.fn-caret { display: inline-block; width: 2px; height: 18px; margin: 0 1px -3px; border-radius: var(--radius-xs); background: var(--fn-accent); opacity: 0; }
.fn.is-typing .fn-caret { opacity: 1; animation: fn-blink 0.9s steps(1) infinite; }
@keyframes fn-blink { 50% { opacity: 0; } }
.fn-meta { color: var(--fn-muted); font-size: var(--text-small); line-height: var(--leading-small); }
.fn-save { display: flex; align-items: center; justify-content: center; gap: 8px; height: 44px; border: 0; border-radius: var(--radius-md); background: var(--fn-accent); color: var(--fn-on-accent); font: inherit; font-weight: 600; cursor: pointer; transition: transform var(--spring-press-duration) var(--spring-press); }
.fn-save:active { transform: scale(var(--press-scale)); }
.fn-save:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }
.fn-save kbd { padding: 2px 6px; border-radius: var(--radius-sm); background: color-mix(in srgb, var(--on-color) 22%, transparent); font: 600 var(--text-caption)/var(--leading-caption) var(--font-sans); }
.fn-folder { display: flex; flex-direction: column; gap: 6px; }
.fn-folder-title { color: var(--fn-muted); font-size: var(--text-small); font-weight: 600; }
.fn-list { margin: 0; padding: 0; list-style: none; border-radius: var(--radius-lg); background: var(--fn-sunken); }
.fn-list li { position: relative; display: flex; align-items: center; gap: 10px; min-height: 36px; padding: 6px 14px; color: var(--fn-muted); font-size: var(--text-small); line-height: var(--leading-small); overflow-wrap: anywhere; animation: fn-in var(--spring-ui-duration) var(--spring-ui) both; }
.fn-list li::before { content: ""; flex: none; width: 14px; height: 10px; border-radius: var(--radius-xs); background: var(--ai); opacity: 0.7; }
.fn-list li + li::after { content: ""; position: absolute; top: 0; left: 38px; right: 0; height: 1px; background: var(--fn-line); transform: scaleY(0.5); transform-origin: top; }
.fn-list .fn-more { color: var(--fn-muted); font-style: normal; }
.fn-list .fn-more::before { visibility: hidden; }
@keyframes fn-in { from { opacity: 0; transform: translateY(-6px); } }
.fn-status { min-height: 18px; color: var(--fn-muted); font-size: var(--text-small); line-height: var(--leading-small); }
/* Nothing to say yet, so no space: it stays a live region but leaves the layout until text arrives */
.fn-status:empty { position: absolute; width: 1px; height: 1px; min-height: 0; margin: 0; padding: 0; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

@media (prefers-reduced-motion: reduce) {
  .fn.is-typing .fn-caret, .fn-list li { animation: none; }
}
.fn [hidden] { display: none !important; }

</style>
</head>
<body>

<div class="fn" data-mi="final-final" data-base="Pitch Deck" data-ext=".pdf">
  <div class="fn-file">
    <span class="fn-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4M10 9H8M16 13H8M16 17H8"/></svg></span>
    <div class="fn-text">
      <p class="fn-name"><span class="fn-typed">Pitch Deck</span><span class="fn-caret" aria-hidden="true"></span><span class="fn-ext">.pdf</span></p>
      <p class="fn-meta">24 pages · Saved just now</p>
    </div>
  </div>
  <button type="button" class="fn-save">Save <kbd>⌘S</kbd></button>
  <div class="fn-folder" hidden>
    <p class="fn-folder-title">Also in This Folder</p>
    <ul class="fn-list"></ul>
  </div>
  <p class="fn-status" role="status" aria-live="polite"></p>
</div>


<script>
/* final_FINAL_v3 — vanilla JS. Auto-initializes every [data-mi="final-final"].
   Each save (button, or ⌘S / Ctrl+S inside the component) backspaces and retypes the name to its next stage.
   Call window.initFinalFinal(el) for elements added later. */
(function () {
  'use strict';
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)');
  var SUFFIXES = ['', ' final', ' final_v2', ' FINAL', ' FINAL_final', ' FINAL_final_v3', ' FINAL_final_v3 (use this one)',
    ' FINAL_final_v3 (use this one) (1)', ' FINAL_final_v3 (use this one) (1) EDITED', ''];
  var NOTES = { 3: 'Confident.', 5: 'Very confident.', 6: 'This is the one.', 7: 'This is also the one.', 8: 'Nine files. One deck. Nobody knows which is real.', 9: 'Full circle. It’s just “Pitch Deck” again.' };

  function initFinalFinal(root) {
    if (!root || root.__miFinal) return;
    root.__miFinal = true;
    var base = root.getAttribute('data-base') || 'Untitled';
    var ext = root.getAttribute('data-ext') || '';
    var typed = root.querySelector('.fn-typed'), meta = root.querySelector('.fn-meta');
    var save = root.querySelector('.fn-save'), folder = root.querySelector('.fn-folder'), list = root.querySelector('.fn-list');
    var status = root.querySelector('.fn-status');
    var stage = 0, busy = false, files = [];

    function type(from, to, done) {
      if (reduce.matches) { typed.textContent = to; done(); return; }
      var keep = 0;
      while (keep < from.length && keep < to.length && from[keep] === to[keep]) keep++;
      var cur = from, typing = false;
      root.classList.add('is-typing');
      (function step() {
        if (!typing && cur.length > keep) { cur = cur.slice(0, -1); typed.textContent = cur; setTimeout(step, 22); return; }
        typing = true; // backspacing is done, now type forward
        if (cur.length < to.length) { cur = to.slice(0, cur.length + 1); typed.textContent = cur; setTimeout(step, 38); return; }
        root.classList.remove('is-typing');
        done();
      })();
    }

    function renderFolder() {
      list.replaceChildren();
      var shown = files.slice(-3).reverse();
      shown.forEach(function (f) { var li = document.createElement('li'); li.textContent = f + ext; list.appendChild(li); });
      if (files.length > 3) { var m = document.createElement('li'); m.className = 'fn-more'; m.textContent = 'and ' + (files.length - 3) + ' more'; list.appendChild(m); }
      folder.hidden = files.length === 0;
    }

    function doSave() {
      if (busy) return;
      busy = true;
      var oldName = base + SUFFIXES[stage];
      if (stage < SUFFIXES.length - 1 && files.indexOf(oldName) < 0) files.push(oldName);
      stage = (stage + 1) % SUFFIXES.length;
      var newName = base + SUFFIXES[stage];
      meta.textContent = '24 pages · Saving…';
      status.textContent = '';
      type(oldName, newName, function () {
        busy = false;
        meta.textContent = '24 pages · Saved just now';
        status.textContent = NOTES[stage] || '';
        if (stage === SUFFIXES.length - 1) { stage = 0; files = []; }
        renderFolder();
      });
    }

    save.addEventListener('click', doSave);
    root.addEventListener('keydown', function (e) {
      if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 's') { e.preventDefault(); doSave(); }
    });
    typed.textContent = base;
  }

  window.initFinalFinal = initFinalFinal;
  function boot() { document.querySelectorAll('[data-mi="final-final"]').forEach(initFinalFinal); }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();

</script>
</body>
</html>
