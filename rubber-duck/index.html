<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rubber Duck Gate · Micro Interactions</title>
<link rel="icon" type="image/svg+xml" href="../icons/outcraft-favicon-light.svg" media="(prefers-color-scheme: light)">
<link rel="icon" type="image/svg+xml" href="../icons/outcraft-favicon-dark.svg" media="(prefers-color-scheme: dark)">

<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap">

<style>
html, body { min-height: 100%; }
body { margin: 0; display: grid; place-items: center; padding: 64px 16px 48px; box-sizing: border-box; background: var(--subtle); color: var(--body); font-family: var(--font-sans); }
</style>
<style>
/* Rubber Duck Gate — before you file a bug, a rubber duck asks you to explain it. It nods along.
   Outcraft Design System v2. Every value is an Outcraft token. */
.rd {
  --rd-bg: var(--card);
  --rd-fg: var(--foreground);
  --rd-muted: var(--muted-foreground);
  --rd-line: var(--border);
  --rd-sunken: var(--subtle);
  --rd-fill: var(--muted);
  --rd-accent: var(--primary);
  --rd-on-accent: var(--primary-foreground);
  display: flex;
  flex-direction: column;
  gap: 12px;
  width: 100%;
  max-width: 400px;
  box-sizing: border-box;
  padding: 20px;
  background: var(--rd-bg);
  color: var(--rd-fg);
  border-radius: var(--radius-xl);
  border: 1px solid var(--border);
  box-shadow: var(--shadow-sm);
  font: 400 var(--text-body)/var(--leading-body) var(--font-sans);
  letter-spacing: normal;
  text-align: left;
  -webkit-font-smoothing: antialiased;
}
.rd p { margin: 0; }
.rd-form { border-radius: var(--radius-lg); background: var(--rd-sunken); }
.rd-field { position: relative; display: flex; flex-direction: column; gap: 2px; padding: 10px 16px 12px; }
.rd-field + .rd-field::before { content: ""; position: absolute; top: 0; left: 16px; right: 0; height: 1px; background: var(--rd-line); transform: scaleY(0.5); transform-origin: top; }
.rd-field-label { color: var(--rd-muted); font-size: var(--text-caption); line-height: var(--leading-caption); font-weight: 500; transition: color var(--duration-base); }
.rd-field:focus-within .rd-field-label { color: var(--rd-accent); }
.rd-title, .rd-desc { padding: 0; border: 0; background: none; color: inherit; font: inherit; resize: none; }
.rd-title { font-weight: 600; }
.rd-title:focus, .rd-desc:focus { outline: none; }
.rd-desc::placeholder { color: var(--rd-muted); }
.rd.is-ducking .rd-desc-label { color: var(--warning-text); }

.rd-duck-row { display: flex; align-items: flex-end; gap: 10px; animation: rd-up var(--spring-pop-duration) var(--spring-pop) both; }
@keyframes rd-up { from { opacity: 0; transform: translateY(24px) scale(0.9); } }
.rd-duck { flex: none; width: 64px; height: 56px; transform-origin: 50% 90%; }
.rd-duck svg { display: block; width: 100%; height: 100%; }
.rd-duck.is-nod { animation: rd-nod var(--spring-ui-duration) var(--spring-ui); }
@keyframes rd-nod { 30% { transform: rotate(9deg) translateY(2px); } 60% { transform: rotate(-3deg); } }
.rd-duck.is-joy { animation: rd-joy var(--spring-pop-duration) var(--spring-pop); }
@keyframes rd-joy { 40% { transform: translateY(-18px) rotate(-200deg); } 100% { transform: rotate(-360deg); } }
.rd-say { position: relative; flex: 1; padding: 10px 14px; border-radius: var(--radius-xl) var(--radius-xl) var(--radius-xl) var(--radius-sm); background: oklch(from var(--warning) var(--tint-l) calc(c * var(--tint-c)) h); font-size: var(--text-body); line-height: var(--leading-body); }

.rd-actions { display: flex; flex-wrap: wrap; gap: 8px; }
.rd-actions button { flex: 1 1 auto; height: 44px; padding: 0 16px; border: 0; border-radius: var(--radius-md); font: inherit; font-weight: 600; cursor: pointer; transition: transform var(--spring-press-duration) var(--spring-press); }
.rd-actions button:active { transform: scale(var(--press-scale)); }
.rd-actions button:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }
.rd-submit, .rd-solved { background: var(--rd-accent); color: var(--rd-on-accent); }
.rd-file { background: var(--rd-fill); color: var(--rd-fg); }
.rd-foot { color: var(--rd-muted); font-size: var(--text-small); line-height: var(--leading-small); }
.rd-foot b { color: var(--rd-fg); font-variant-numeric: tabular-nums; }
.rd.is-closed .rd-form { opacity: 0.5; transition: opacity var(--duration-slow); }

@media (prefers-reduced-motion: reduce) {
  .rd-duck-row, .rd-duck.is-nod, .rd-duck.is-joy { animation: none; }
}
/* Multi-line text wraps evenly and never ends on one or two lonely words */
.rd :is(p, li, dd, dt, small, label, figcaption, h1, h2, h3, h4) { text-wrap: balance; }
.rd [hidden] { display: none !important; }

</style>
<style>
/* Reset: a small icon button in the corner of every demo; a "Reset" pill slides out on hover or focus */
.mi-host { display: contents; }
.mi-reset { position: absolute; top: 12px; right: 12px; z-index: 5; display: grid; place-items: center; width: 32px; height: 32px; padding: 0; border: 1px solid var(--border); border-radius: var(--radius-full); background: var(--card); color: var(--muted-foreground); box-shadow: var(--shadow-xs); cursor: pointer; -webkit-tap-highlight-color: transparent; transition: color var(--duration-fast) var(--ease-out), border-color var(--duration-fast) var(--ease-out); }
.mi-reset svg { width: 16px; height: 16px; transition: transform var(--spring-ui-duration) var(--spring-ui); }
.mi-reset:hover, .mi-reset:focus-visible { color: var(--foreground); border-color: var(--border-strong); }
.mi-reset:hover svg { transform: rotate(-45deg); }
.mi-reset.is-spin svg { transform: rotate(-360deg); transition: transform var(--spring-pop-duration) var(--spring-pop); }
.mi-reset:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }
.mi-reset-tip { position: absolute; top: 50%; right: calc(100% + 6px); padding: 4px 10px; border-radius: var(--radius-full); background: var(--foreground); color: var(--background); font: 500 var(--text-caption)/var(--leading-caption) var(--font-sans); white-space: nowrap; pointer-events: none; opacity: 0; transform: translate(6px, -50%) scale(0.96); transform-origin: right center; transition: opacity var(--duration-fast) var(--ease-out), transform var(--spring-ui-duration) var(--spring-ui); }
.mi-reset:hover .mi-reset-tip, .mi-reset:focus-visible .mi-reset-tip { opacity: 1; transform: translate(0, -50%) scale(1); }
.mi-reset--page { position: fixed; top: 16px; right: 16px; }
@media (hover: none) { .mi-reset-tip { display: none; } }
@media (prefers-reduced-motion: reduce) { .mi-reset svg, .mi-reset.is-spin svg, .mi-reset-tip { transition: opacity var(--duration-reduced) var(--ease-out); transform: none; } .mi-reset-tip { transform: translate(0, -50%); } }
.mi-sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

</style>
</head>
<body>
<button type="button" class="mi-reset mi-reset--page" data-mi-reset aria-label="Reset Rubber Duck Gate"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg><span class="mi-reset-tip" aria-hidden="true">Reset</span></button>
<div class="mi-host"><div class="rd" data-mi="rubber-duck" data-solved="37">
  <div class="rd-form">
    <label class="rd-field">
      <span class="rd-field-label">Title</span>
      <input class="rd-title" type="text" value="Export button does nothing" autocomplete="off">
    </label>
    <label class="rd-field">
      <span class="rd-field-label rd-desc-label">What happens?</span>
      <textarea class="rd-desc" rows="3" placeholder="Steps, what you expected, what happened"></textarea>
    </label>
  </div>
  <div class="rd-duck-row" hidden>
    <span class="rd-duck" aria-hidden="true">
      <svg viewBox="0 0 64 56"><ellipse cx="30" cy="38" rx="25" ry="15" style="fill: var(--warning)"/><path d="M8 32c-4-6-3-12 1-12 3 0 4 5 6 8" style="fill: var(--warning)"/><circle cx="40" cy="20" r="13" style="fill: var(--warning)"/><path d="M51 21c5-1 10 0 12 2-2 3-7 4-12 3Z" style="fill: var(--ai)"/><circle cx="43" cy="16.5" r="2.2" style="fill: var(--black)"/><circle cx="43.8" cy="15.8" r=".7" style="fill: var(--on-color)"/><path d="M18 36c4 5 12 6 18 3" stroke-width="2.5" fill="none" stroke-linecap="round" style="stroke: color-mix(in srgb, var(--amber-9) 80%, var(--black))"/></svg>
    </span>
    <p class="rd-say" role="status" aria-live="polite">Before you file it, explain it to me. Step by step.</p>
  </div>
  <div class="rd-actions">
    <button type="button" class="rd-submit">File Bug</button>
    <button type="button" class="rd-solved" hidden>I Figured It Out</button>
    <button type="button" class="rd-file" hidden>Still Broken, File It</button>
  </div>
  <p class="rd-foot">The duck has closed <b class="rd-pct">37%</b> of bugs before they were filed.</p>
</div>
</div>
<script>
/* Rubber Duck Gate — vanilla JS. Auto-initializes every [data-mi="rubber-duck"].
   File Bug first summons the duck; it nods at every finished sentence. After two sentences you can
   say you figured it out, or file it anyway. Call window.initRubberDuck(el) for elements added later. */
(function () {
  'use strict';
  var NODS = ['Mm-hm.', 'Go on.', 'And then what happens?', 'Interesting.', 'Wait. Say that part again.', 'Quack. Keep going.'];

  function sentences(s) { return (s.match(/[.?!](\s|$)|\n/g) || []).length; }

  // Even line breaks: text that wraps to two or three lines is narrowed until its lines are close in length,
  // with the first line the longest, so no line runs long while the next holds a word or two.
  function evenLines(root) {
    var SEL = 'p, li, dd, dt, small, label, figcaption, h1, h2, h3, h4';
    function widths(el) {
      var range = document.createRange(), rows = [];
      range.selectNodeContents(el);
      Array.prototype.forEach.call(range.getClientRects(), function (b) {
        if (!b.width) return;
        var row = rows.filter(function (x) { return Math.abs(x.t - b.top) < b.height / 2; })[0];
        if (row) { row.l = Math.min(row.l, b.left); row.r = Math.max(row.r, b.right); } else rows.push({ t: b.top, l: b.left, r: b.right });
      });
      return rows.sort(function (a, b) { return a.t - b.t; }).map(function (x) { return x.r - x.l; });
    }
    function fit(el) {
      el.style.maxWidth = ''; el.style.textWrap = '';
      var cs = getComputedStyle(el), full = el.getBoundingClientRect().width;
      if (!full || cs.whiteSpace === 'nowrap' || /flex|grid/.test(cs.display)) return;
      if (Array.prototype.some.call(el.children, function (c) { return !/^inline/.test(getComputedStyle(c).display); })) return;
      el.style.textWrap = 'wrap';
      var n = widths(el).length, lo = 0, hi = full, w, L;
      if (n < 2 || n > 3) { el.style.textWrap = ''; return; }
      while (hi - lo > 1) { w = (lo + hi) / 2; el.style.maxWidth = w + 'px'; if (widths(el).length > n) lo = w; else hi = w; }
      var best = 0, gap = Infinity;
      for (w = Math.ceil(hi); w <= full; w += 2) {
        el.style.maxWidth = w + 'px'; L = widths(el);
        // Each line no longer than the one above (within 10%, which reads as equal). Keep the most even width,
        // and prefer the first line longer: a last line longer than the first costs three times its overhang
        var score = Math.max.apply(null, L) - Math.min.apply(null, L) + Math.max(0, L[n - 1] - L[0]) * 3;
        if (L.length === n && L.every(function (x, i) { return !i || x <= L[i - 1] * 1.1 + 1; }) && score < gap) { gap = score; best = w; }
      }
      if (!best) { el.style.maxWidth = ''; el.style.textWrap = ''; return; }
      el.style.maxWidth = best + 'px';
      if (cs.textAlign === 'center' && cs.display === 'block') { el.style.marginLeft = 'auto'; el.style.marginRight = 'auto'; }
    }
    var queued = false, lastW = 0;
    function run() { queued = false; Array.prototype.forEach.call(root.querySelectorAll(SEL), fit); }
    function later() { if (!queued) { queued = true; requestAnimationFrame(run); } }
    later();
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(later);
    if (window.ResizeObserver) new ResizeObserver(function () { var w = root.getBoundingClientRect().width; if (Math.abs(w - lastW) > 0.5) { lastW = w; later(); } }).observe(root);
    if (window.MutationObserver) new MutationObserver(later).observe(root, { subtree: true, childList: true, characterData: true, attributes: true, attributeFilter: ['hidden'] });
  }

  function initRubberDuck(root) {
    if (!root || root.__miDuck) return;
    root.__miDuck = true;
    evenLines(root);
    var desc = root.querySelector('.rd-desc'), label = root.querySelector('.rd-desc-label');
    var row = root.querySelector('.rd-duck-row'), duck = root.querySelector('.rd-duck'), say = root.querySelector('.rd-say');
    var submit = root.querySelector('.rd-submit'), solved = root.querySelector('.rd-solved'), file = root.querySelector('.rd-file');
    var pctEl = root.querySelector('.rd-pct'), pct = Number(root.getAttribute('data-solved')) || 37;
    var ducking = false, seen = 0, n = 0;

    function play(cls) { duck.classList.remove('is-nod', 'is-joy'); void duck.offsetWidth; duck.classList.add(cls); }

    function reset() {
      ducking = false; seen = 0; n = 0;
      root.classList.remove('is-ducking', 'is-closed');
      row.hidden = true;
      desc.value = ''; desc.disabled = false;
      label.textContent = 'What happens?';
      submit.hidden = false; submit.textContent = 'File Bug';
      solved.hidden = true; file.hidden = true;
    }

    submit.addEventListener('click', function () {
      if (submit.textContent !== 'File Bug') { reset(); desc.focus(); return; }
      ducking = true;
      root.classList.add('is-ducking');
      row.hidden = false;
      say.textContent = 'Before you file it, explain it to me. Step by step.';
      label.textContent = 'Explain it to the duck';
      submit.hidden = true;
      desc.focus();
    });

    desc.addEventListener('input', function () {
      if (!ducking) return;
      var s = sentences(desc.value);
      if (s > seen) {
        seen = s;
        say.textContent = NODS[n++ % NODS.length];
        play('is-nod');
      }
      if (seen >= 2) { solved.hidden = false; file.hidden = false; }
    });

    solved.addEventListener('click', function () {
      ducking = false;
      pct = Math.min(99, pct + 1);
      pctEl.textContent = pct + '%';
      say.textContent = 'Quack. Bug closed before it existed.';
      play('is-joy');
      root.classList.add('is-closed');
      desc.disabled = true;
      solved.hidden = true; file.hidden = true;
      submit.hidden = false; submit.textContent = 'Report Another';
      submit.focus();
    });

    file.addEventListener('click', function () {
      ducking = false;
      say.textContent = 'Filed as BUG-' + (1000 + Math.floor(Math.random() * 900)) + '. The duck believes in you.';
      play('is-nod');
      root.classList.add('is-closed');
      desc.disabled = true;
      solved.hidden = true; file.hidden = true;
      submit.hidden = false; submit.textContent = 'Report Another';
      submit.focus();
    });
  }

  window.initRubberDuck = initRubberDuck;
  function boot() { document.querySelectorAll('[data-mi="rubber-duck"]').forEach(initRubberDuck); }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();

</script>
<script>
(function () {
  var host = document.querySelector('.mi-host'), orig = host.innerHTML, fn = window["initRubberDuck"];
  document.querySelector('[data-mi-reset]').addEventListener('click', function (e) {
    host.innerHTML = orig;
    host.querySelectorAll('[data-mi]').forEach(function (el) { if (typeof fn === 'function') fn(el); });
    var b = e.currentTarget; b.classList.remove('is-spin'); void b.offsetWidth; b.classList.add('is-spin');
    setTimeout(function () { b.classList.remove('is-spin'); }, 700);
  });
})();
</script>
</body>
</html>
