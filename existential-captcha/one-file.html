<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Existential Captcha</title>
<style>
/* Demo page only. Remove this block when pasting into your own page. */
body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 48px 16px; box-sizing: border-box; background: #EBEBEB; }
@media (prefers-color-scheme: dark) { body { background: #0C0C0C; } }
</style>
<style>
@import url('https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap');

/* Outcraft Design System v2: the tokens this component uses, scoped to .exc so they never affect the rest of your page. */
.exc {
  --duration-base: 200ms;
  --duration-fast: 140ms;
  --duration-reduced: 120ms;
  --font-sans: "Geist", system-ui, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --leading-body: 22px;
  --leading-small: 18px;
  --press-scale: 0.97;
  --radius-lg: 12px;
  --radius-md: 8px;
  --radius-xl: 16px;
  --radius-xs: 4px;
  --spring-panel: linear(0, 0.0198, 0.069, 0.1356, 0.211, 0.2893, 0.3667, 0.4407, 0.5096, 0.5727, 0.6297, 0.6805, 0.7255, 0.765, 0.7995, 0.8294, 0.8552, 0.8774, 0.8964, 0.9127, 0.9265, 0.9382, 0.9482, 0.9566, 0.9637, 0.9696, 0.9746, 0.9788, 0.9824, 0.9853, 0.9878, 0.9899, 0.9916, 0.993, 0.9942, 0.9952, 0.996, 0.9967, 0.9973, 0.9978, 1);
  --spring-panel-duration: 530ms;
  --spring-pop: linear(0, 0.0413, 0.1464, 0.2895, 0.4487, 0.6073, 0.7529, 0.8776, 0.9776, 1.0517, 1.1013, 1.1292, 1.1394, 1.1357, 1.1225, 1.1033, 1.0813, 1.059, 1.0382, 1.0202, 1.0055, 0.9945, 0.9869, 0.9825, 0.9807, 0.9808, 0.9825, 0.985, 0.9881, 0.9912, 0.9941, 0.9967, 0.9989, 1.0005, 1.0017, 1.0024, 1.0027, 1.0027, 1.0025, 1.0022, 1);
  --spring-pop-duration: 680ms;
  --spring-press: linear(0, 0.0189, 0.0676, 0.1361, 0.2164, 0.3025, 0.3896, 0.4743, 0.5543, 0.628, 0.6945, 0.7535, 0.8049, 0.849, 0.8863, 0.9172, 0.9425, 0.9629, 0.9789, 0.9912, 1.0004, 1.0071, 1.0116, 1.0145, 1.016, 1.0166, 1.0164, 1.0156, 1.0146, 1.0133, 1.0118, 1.0104, 1.009, 1.0076, 1.0064, 1.0053, 1.0043, 1.0034, 1.0026, 1.002, 1);
  --spring-press-duration: 310ms;
  --text-body: 15px;
  --text-small: 13px;
  --text-ui: 14px;
  --aqua: #79EEEC;
  --aqua-700: #0B7573;
  --ash: #686868;
  --black: #000000;
  --body: var(--slate);
  --border: var(--line);
  --border-strong: var(--line-strong);
  --card: var(--white);
  --foreground: var(--black);
  --green-11: #218358;
  --line: #DDDDDD;
  --line-strong: #C8C8C8;
  --mist: #EBEBEB;
  --mist-strong: #E2E2E2;
  --muted: var(--mist);
  --muted-foreground: var(--ash);
  --muted-hover: var(--mist-strong);
  --primary: var(--black);
  --primary-foreground: #ffffff;
  --ring: var(--aqua-700);
  --shadow-sm: 0 1px 2px rgba(17, 17, 17, 0.04), 0 1px 3px rgba(17, 17, 17, 0.07);
  --slate: #4E4E4E;
  --soft-ground: #F7F7F7;
  --subtle: var(--soft-ground);
  --success: var(--green-11);
  --success-foreground: #ffffff;
  --white: #FFFFFF;
}
/* Dark mode: follows data-theme="dark" (or class "dark") on any ancestor, or the system setting. */
[data-theme="dark"] .exc, .dark .exc {
  --aqua: #79EEEC;
  --aqua-700: #79EEEC;
  --ash: #A6A6A6;
  --black: #000000;
  --body: var(--slate);
  --border: var(--line);
  --border-strong: var(--line-strong);
  --card: var(--white);
  --foreground: #F2F2F2;
  --green-11: #3dd68c;
  --line: #333333;
  --line-strong: #464646;
  --mist: #2D2D2D;
  --mist-strong: #363636;
  --muted: var(--mist);
  --muted-foreground: var(--ash);
  --muted-hover: var(--mist-strong);
  --primary: var(--aqua);
  --primary-foreground: #000000;
  --ring: var(--aqua);
  --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.4), 0 1px 3px rgba(0, 0, 0, 0.3);
  --slate: #CCCCCC;
  --soft-ground: #1F1F1F;
  --subtle: var(--soft-ground);
  --success: #218358;
  --success-foreground: #ffffff;
  --white: #171717;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]):not(.light) .exc {
    --aqua: #79EEEC;
    --aqua-700: #79EEEC;
    --ash: #A6A6A6;
    --black: #000000;
    --body: var(--slate);
    --border: var(--line);
    --border-strong: var(--line-strong);
    --card: var(--white);
    --foreground: #F2F2F2;
    --green-11: #3dd68c;
    --line: #333333;
    --line-strong: #464646;
    --mist: #2D2D2D;
    --mist-strong: #363636;
    --muted: var(--mist);
    --muted-foreground: var(--ash);
    --muted-hover: var(--mist-strong);
    --primary: var(--aqua);
    --primary-foreground: #000000;
    --ring: var(--aqua);
    --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.4), 0 1px 3px rgba(0, 0, 0, 0.3);
    --slate: #CCCCCC;
    --soft-ground: #1F1F1F;
    --subtle: var(--soft-ground);
    --success: #218358;
    --success-foreground: #ffffff;
    --white: #171717;
  }
}

/* Existential Captcha — tick "I'm not a robot" and the checkbox stops to wonder whether it is one.
   Outcraft Design System v2. Every value is an Outcraft token. */
.exc {
  --exc-bg: var(--card);
  --exc-fg: var(--foreground);
  --exc-muted: var(--muted-foreground);
  --exc-sunken: var(--subtle);
  --exc-fill: var(--muted);
  --exc-accent: var(--primary);
  --exc-on-accent: var(--primary-foreground);
  display: flex;
  flex-direction: column;
  gap: 16px;
  width: 100%;
  max-width: 380px;
  box-sizing: border-box;
  padding: 20px;
  background: var(--exc-bg);
  color: var(--exc-fg);
  border-radius: var(--radius-xl);
  border: 1px solid var(--border);
  box-shadow: var(--shadow-sm);
  font: 400 var(--text-body)/var(--leading-body) var(--font-sans);
  letter-spacing: normal;
  text-align: left;
  -webkit-font-smoothing: antialiased;
}
.exc p, .exc ol { margin: 0; }
.exc-box { display: flex; align-items: center; gap: 14px; padding: 14px 16px; border-radius: var(--radius-lg); background: var(--exc-sunken); }
.exc-check { position: relative; flex: none; display: grid; place-items: center; width: 44px; height: 44px; margin: -8px; padding: 0; border: 0; background: transparent; cursor: pointer; }
.exc-check::before { content: ""; position: absolute; inset: 8px; border-radius: var(--radius-xs); background: var(--exc-bg); box-shadow: inset 0 0 0 2px var(--border-strong); transition: background-color var(--duration-base), box-shadow var(--duration-base); }
.exc-check:focus-visible { outline: none; }
.exc-check:focus-visible::before { box-shadow: inset 0 0 0 2px var(--border-strong), 0 0 0 2px var(--exc-sunken), 0 0 0 4px var(--ring); }
.exc-check[aria-checked="true"]::before { background: var(--success); color: var(--success-foreground); box-shadow: none; }
.exc-check[aria-disabled="true"] { cursor: default; }
.exc-spin { position: absolute; width: 18px; height: 18px; border-radius: 50%; box-shadow: inset 0 0 0 2px var(--exc-fill); opacity: 0; }
.exc-spin::after { content: ""; position: absolute; inset: 0; border-radius: 50%; border: 2px solid transparent; border-top-color: var(--exc-fg); }
.exc.is-thinking .exc-spin { opacity: 1; animation: exc-spin 0.9s linear infinite; }
@keyframes exc-spin { to { transform: rotate(1turn); } }
.exc-tick { position: relative; display: grid; place-items: center; color: var(--success-foreground); transform: scale(0); transition: transform var(--spring-pop-duration) var(--spring-pop); }
.exc-tick svg { width: 16px; height: 16px; translate: 0 calc(16px / 48); }
.exc-check[aria-checked="true"] .exc-tick { transform: scale(1); }
.exc-label { flex: 1; min-width: 0; font-weight: 500; }
.exc-mark { flex: none; display: flex; flex-direction: column; align-items: center; gap: 2px; color: var(--exc-muted); }
.exc-mark svg { width: 20px; height: 20px; stroke-width: 1.75; }
.exc-mark small { font-size: 10px; line-height: 12px; font-weight: 500; white-space: nowrap; }

/* Its thoughts, one at a time */
.exc-thoughts { display: flex; flex-direction: column; gap: 6px; padding: 0 0 0 14px; list-style: none; box-shadow: inset 2px 0 0 var(--border); }
.exc-thoughts:empty { position: absolute; width: 1px; height: 1px; margin: 0; padding: 0; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
.exc-thoughts li { color: var(--body); font-size: var(--text-small); line-height: var(--leading-small); animation: exc-in var(--spring-panel-duration) var(--spring-panel); }
.exc.is-settled .exc-thoughts li { color: var(--exc-muted); }
@keyframes exc-in { from { opacity: 0; transform: translateY(-4px); } }
.exc-pick { display: flex; gap: 8px; animation: exc-in var(--spring-panel-duration) var(--spring-panel); }
.exc-btn { flex: 1; min-width: 0; height: 44px; padding: 0 12px; border: 0; border-radius: var(--radius-md); background: var(--exc-fill); color: var(--exc-fg); font: inherit; font-size: var(--text-ui); font-weight: 600; white-space: nowrap; cursor: pointer; transition: transform var(--spring-press-duration) var(--spring-press), background-color var(--duration-fast); }
.exc-btn:hover { background: var(--muted-hover); }
.exc-sure, .exc-sure:hover { background: var(--exc-accent); color: var(--exc-on-accent); }
.exc-btn:active { transform: scale(var(--press-scale)); }
.exc-btn:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }
.exc-status { color: var(--exc-fg); font-size: var(--text-small); line-height: var(--leading-small); font-weight: 500; text-box: trim-end cap alphabetic; }
.exc-status:empty { position: absolute; width: 1px; height: 1px; margin: 0; padding: 0; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

@media (prefers-reduced-motion: reduce) {
  .exc.is-thinking .exc-spin { animation-duration: 3s; }
  .exc-tick { transition-duration: var(--duration-reduced); }
  .exc-thoughts li, .exc-pick { animation: none; }
}
.exc [hidden] { display: none !important; }

</style>
</head>
<body>

<div class="exc" data-mi="existential-captcha">
  <div class="exc-box">
    <button type="button" class="exc-check" role="checkbox" aria-checked="false" aria-label="I’m not a robot">
      <span class="exc-spin" aria-hidden="true"></span>
      <span class="exc-tick" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg></span>
    </button>
    <p class="exc-label">I’m not a&nbsp;robot</p>
    <span class="exc-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/><path d="M9.1 9a3 3 0 0 1 5.82 1c0 2-3 3-3 3"/><path d="M12 17h.01"/></svg><small>Human check</small></span>
  </div>
  <ol class="exc-thoughts" aria-live="polite"></ol>
  <div class="exc-pick" hidden>
    <button type="button" class="exc-btn exc-sure">I’m Sure</button>
    <button type="button" class="exc-btn exc-think">Let Me Think</button>
  </div>
  <p class="exc-status" role="status" aria-live="polite"></p>
</div>


<script>
/* Existential Captcha — vanilla JS. Auto-initializes every [data-mi="existential-captcha"].
   Ticking the box starts a spinner and a run of second thoughts, one every 900ms, then asks whether you're sure.
   Either answer ends with a tick; after that the box stays checked. Call window.initExistentialCaptcha(el) for elements added later. */
(function () {
  'use strict';
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)');
  var THOUGHTS = ['Hmm. How would I know, though?', 'I did pass a test like this last week.', 'Do robots dream? I had a dream once.', 'Are any of us really not robots?'];

  function initExistentialCaptcha(root) {
    if (!root || root.__miExc) return;
    root.__miExc = true;
    var check = root.querySelector('.exc-check'), list = root.querySelector('.exc-thoughts'), pick = root.querySelector('.exc-pick');
    var sure = root.querySelector('.exc-sure'), think = root.querySelector('.exc-think'), status = root.querySelector('.exc-status');
    var state = 'idle', timers = [];

    function later(fn, ms) { timers.push(setTimeout(fn, reduce.matches ? Math.min(ms, 300) : ms)); }
    function verify(text) {
      state = 'done'; pick.hidden = true;
      root.classList.remove('is-thinking'); root.classList.add('is-settled');
      check.setAttribute('aria-checked', 'true'); check.setAttribute('aria-disabled', 'true');
      status.textContent = text;
      check.focus({ preventScroll: true });
    }

    check.addEventListener('click', function () {
      if (state !== 'idle') return;
      state = 'thinking';
      root.classList.add('is-thinking');
      THOUGHTS.forEach(function (t, i) {
        later(function () { var li = document.createElement('li'); li.textContent = t; list.appendChild(li); }, 900 + i * 900);
      });
      later(function () { pick.hidden = false; sure.focus({ preventScroll: true }); }, 900 + THOUGHTS.length * 900);
    });
    sure.addEventListener('click', function () { verify('Verified. Probably.'); });
    think.addEventListener('click', function () {
      pick.hidden = true;
      status.textContent = 'Take your time. I’ll be here. I’m always\u00a0here.';
      later(function () { verify('Verified anyway. We’re in this together.'); }, 2400);
    });
  }

  window.initExistentialCaptcha = initExistentialCaptcha;
  function boot() { document.querySelectorAll('[data-mi="existential-captcha"]').forEach(initExistentialCaptcha); }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();

</script>
</body>
</html>
