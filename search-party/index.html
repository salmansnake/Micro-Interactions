<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 Search Party · Micro Interactions</title>
<link rel="icon" type="image/svg+xml" href="../icons/outcraft-favicon-light.svg" media="(prefers-color-scheme: light)">
<link rel="icon" type="image/svg+xml" href="../icons/outcraft-favicon-dark.svg" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="../icons/outcraft-icon-180x180-light.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="../outcraft-tokens.css">
<style>
html, body { min-height: 100%; }
body { margin: 0; display: grid; place-items: center; padding: 64px 16px 48px; box-sizing: border-box; background: var(--subtle); color: var(--body); font-family: var(--font-sans); }
</style>
<style>
/* 404 Search Party — on a missing page, cursors with flashlights sweep the dark until they find what went wrong.
   Outcraft Design System v2. Every value is an Outcraft token. */
.spy {
  --spy-bg: var(--card);
  --spy-fg: var(--foreground);
  --spy-muted: var(--muted-foreground);
  --spy-sunken: var(--subtle);
  --spy-fill: var(--muted);
  --spy-accent: var(--primary);
  --spy-on-accent: var(--primary-foreground);
  display: flex;
  flex-direction: column;
  gap: 16px;
  width: 100%;
  max-width: 400px;
  box-sizing: border-box;
  padding: 20px;
  background: var(--spy-bg);
  color: var(--spy-fg);
  border-radius: var(--radius-xl);
  border: 1px solid var(--border);
  box-shadow: var(--shadow-sm);
  font: 400 var(--text-body)/var(--leading-body) var(--font-sans);
  letter-spacing: normal;
  text-align: left;
  -webkit-font-smoothing: antialiased;
}
.spy p, .spy ul, .spy ol { margin: 0; }
.spy ul, .spy ol { padding: 0; list-style: none; }
.spy-title b { display: block; font-weight: 600; text-box: trim-start cap alphabetic; }
.spy-title small { display: block; margin-top: 2px; color: var(--spy-muted); font-size: var(--text-small); line-height: var(--leading-small); }
/* The dark room is a scene: its colors stay the same in light and dark */
.spy-dark { --x0: -99px; --y0: -99px; --x1: -99px; --y1: -99px; --x2: -99px; --y2: -99px; position: relative; height: 180px; overflow: hidden; border-radius: var(--radius-lg); background: color-mix(in oklab, var(--black) 88%, var(--sage)); cursor: none; touch-action: none; }
.spy-room { position: absolute; inset: 0; background: color-mix(in oklab, var(--black) 70%, var(--sage)); }
.spy-junk, .spy-find { position: absolute; font: 600 var(--text-small)/1 var(--font-mono); white-space: nowrap; color: color-mix(in oklab, var(--on-color) 60%, var(--sage)); }
.spy-find { left: var(--spy-fx, 46%); top: var(--spy-fy, 40%); color: var(--aqua); font-size: var(--text-ui); transition: transform var(--spring-pop-duration) var(--spring-pop); }
.spy.is-found .spy-find { transform: scale(1.25); }
/* The night: a dark layer with a hole for every flashlight */
.spy-night { position: absolute; inset: 0; background: color-mix(in oklab, var(--black) 92%, var(--sage));
  -webkit-mask: radial-gradient(circle 44px at var(--x0) var(--y0), transparent 60%, black), radial-gradient(circle 44px at var(--x1) var(--y1), transparent 60%, black), radial-gradient(circle 44px at var(--x2) var(--y2), transparent 60%, black), radial-gradient(circle 52px at var(--xp, -99px) var(--yp, -99px), transparent 60%, black);
  -webkit-mask-composite: source-in; mask-composite: intersect;
  mask: radial-gradient(circle 44px at var(--x0) var(--y0), transparent 60%, black), radial-gradient(circle 44px at var(--x1) var(--y1), transparent 60%, black), radial-gradient(circle 44px at var(--x2) var(--y2), transparent 60%, black), radial-gradient(circle 52px at var(--xp, -99px) var(--yp, -99px), transparent 60%, black);
  mask-composite: intersect; transition: opacity var(--duration-slower); }
.spy.is-found .spy-night { opacity: 0.55; }
.spy-cursor { position: absolute; left: 0; top: 0; width: 20px; height: 20px; color: var(--on-color); filter: drop-shadow(0 1px 1px color-mix(in srgb, var(--black) 60%, transparent)); will-change: transform; }
.spy-cursor svg { display: block; width: 20px; height: 20px; }
.spy-found { display: flex; flex-direction: column; gap: 12px; animation: spy-in var(--spring-panel-duration) var(--spring-panel); }
@keyframes spy-in { from { opacity: 0; transform: translateY(-6px); } }
.spy-msg { font-size: var(--text-small); line-height: var(--leading-small); font-weight: 500; }
.spy-msg code { padding: 1px 4px; border-radius: var(--radius-xs); background: var(--spy-fill); font: 500 var(--text-caption)/1 var(--font-mono); }
.spy-links { display: flex; gap: 8px; }
.spy-links .spy-btn { flex: 1; text-decoration: none; box-sizing: border-box; }
.spy-btn { flex: none; display: inline-flex; align-items: center; justify-content: center; height: 44px; padding: 0 16px; border: 0; border-radius: var(--radius-md); background: var(--spy-fill); color: var(--spy-fg); font: inherit; font-size: var(--text-ui); font-weight: 600; white-space: nowrap; cursor: pointer; transition: transform var(--spring-press-duration) var(--spring-press), background-color var(--duration-fast); }
.spy-btn svg { width: 16px; height: 16px; margin-right: 8px; }
.spy-btn:hover:not(:disabled) { background: var(--muted-hover); }
.spy-btn.is-primary, .spy-btn.is-primary:hover:not(:disabled) { background: var(--spy-accent); color: var(--spy-on-accent); }
.spy-btn:disabled { cursor: default; background: var(--spy-fill); color: var(--spy-muted); }
.spy-btn:not(:disabled):active { transform: scale(var(--press-scale)); }
.spy-btn:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }
.spy-status { color: var(--body); font-size: var(--text-small); line-height: var(--leading-small); text-box: trim-end cap alphabetic; }
.spy-status:empty { position: absolute; width: 1px; height: 1px; margin: 0; padding: 0; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

@media (prefers-reduced-motion: reduce) {
  .spy-night { opacity: 0.55; }
  .spy-found { animation: none; }
}
/* Multi-line text wraps evenly and never ends on one or two lonely words */
.spy :is(p, li, dd, dt, small, label, figcaption, h1, h2, h3, h4) { text-wrap: balance; }
.spy [hidden] { display: none !important; }

</style>
<style>
/* Reset: a small icon button in the corner of every demo; a "Reset" pill slides out on hover or focus */
.mi-host { display: contents; }
.mi-reset { position: absolute; top: 12px; right: 12px; z-index: 5; display: grid; place-items: center; width: 32px; height: 32px; padding: 0; border: 1px solid var(--border); border-radius: var(--radius-full); background: var(--card); color: var(--muted-foreground); box-shadow: var(--shadow-xs); cursor: pointer; -webkit-tap-highlight-color: transparent; transition: color var(--duration-fast) var(--ease-out), border-color var(--duration-fast) var(--ease-out); }
.mi-reset svg { width: 16px; height: 16px; transition: transform var(--spring-ui-duration) var(--spring-ui); }
.mi-reset:hover, .mi-reset:focus-visible { color: var(--foreground); border-color: var(--border-strong); }
.mi-reset:hover svg { transform: rotate(-45deg); }
.mi-reset.is-spin svg { transform: rotate(-360deg); transition: transform var(--spring-pop-duration) var(--spring-pop); }
.mi-reset:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }
.mi-reset-tip { position: absolute; top: 50%; right: calc(100% + 6px); padding: 4px 10px; border-radius: var(--radius-full); background: var(--foreground); color: var(--background); font: 500 var(--text-caption)/var(--leading-caption) var(--font-sans); white-space: nowrap; pointer-events: none; opacity: 0; transform: translate(6px, -50%) scale(0.96); transform-origin: right center; transition: opacity var(--duration-fast) var(--ease-out), transform var(--spring-ui-duration) var(--spring-ui); }
.mi-reset:hover .mi-reset-tip, .mi-reset:focus-visible .mi-reset-tip { opacity: 1; transform: translate(0, -50%) scale(1); }
.mi-reset--page { position: fixed; top: 16px; right: 16px; }
@media (hover: none) { .mi-reset-tip { display: none; } }
@media (prefers-reduced-motion: reduce) { .mi-reset svg, .mi-reset.is-spin svg, .mi-reset-tip { transition: opacity var(--duration-reduced) var(--ease-out); transform: none; } .mi-reset-tip { transform: translate(0, -50%); } }
.mi-sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

</style>
</head>
<body>
<button type="button" class="mi-reset mi-reset--page" data-mi-reset aria-label="Reset 404 Search Party"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg><span class="mi-reset-tip" aria-hidden="true">Reset</span></button>
<div class="mi-host"><div class="spy" data-mi="search-party" data-typo="/pricng" data-fix="/pricing">
  <p class="spy-title"><b>404 · We can’t find that page</b><small>A search party is out looking. Move your pointer to help.</small></p>
  <div class="spy-dark">
    <div class="spy-room" aria-hidden="true">
      <span class="spy-junk" style="left: 8%; top: 18%">/old-blog</span>
      <span class="spy-junk" style="left: 62%; top: 72%">/careers-2019</span>
      <span class="spy-junk" style="left: 14%; top: 70%">/beta</span>
      <span class="spy-find">/pricng</span>
    </div>
    <span class="spy-night" aria-hidden="true"></span>
    <span class="spy-cursor" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4.037 4.688a.495.495 0 0 1 .651-.651l16 6.5a.5.5 0 0 1-.063.947l-6.124 1.58a2 2 0 0 0-1.438 1.435l-1.579 6.126a.5.5 0 0 1-.947.063z"/></svg></span>
    <span class="spy-cursor" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4.037 4.688a.495.495 0 0 1 .651-.651l16 6.5a.5.5 0 0 1-.063.947l-6.124 1.58a2 2 0 0 0-1.438 1.435l-1.579 6.126a.5.5 0 0 1-.947.063z"/></svg></span>
    <span class="spy-cursor" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4.037 4.688a.495.495 0 0 1 .651-.651l16 6.5a.5.5 0 0 1-.063.947l-6.124 1.58a2 2 0 0 0-1.438 1.435l-1.579 6.126a.5.5 0 0 1-.947.063z"/></svg></span>
  </div>
  <div class="spy-found" hidden>
    <p class="spy-msg"></p>
    <div class="spy-links">
      <a class="spy-btn is-primary" href="#pricing">Go to Pricing</a>
      <a class="spy-btn" href="#home">Home</a>
    </div>
  </div>
  <p class="spy-status" role="status" aria-live="polite">Searching…</p>
</div>
</div>
<script>
/* 404 Search Party — vanilla JS. Auto-initializes every [data-mi="search-party"].
   Three cursors sweep the dark room on their own looping paths, each with a flashlight (a hole in the night layer's
   mask); your pointer carries a fourth. After 5 seconds one of them walks to the clue (data-typo) and the page
   suggests the address it meant (data-fix). Call window.initSearchParty(el) for elements added later. */
(function () {
  'use strict';
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)');

  // Even line breaks: text that wraps to two or three lines is narrowed until its lines are close in length,
  // with the first line the longest, so no line runs long while the next holds a word or two.
  function evenLines(root) {
    var SEL = 'p, li, dd, dt, small, label, figcaption, h1, h2, h3, h4';
    function widths(el) {
      var range = document.createRange(), rows = [];
      range.selectNodeContents(el);
      Array.prototype.forEach.call(range.getClientRects(), function (b) {
        if (!b.width) return;
        var row = rows.filter(function (x) { return Math.abs(x.t - b.top) < b.height / 2; })[0];
        if (row) { row.l = Math.min(row.l, b.left); row.r = Math.max(row.r, b.right); } else rows.push({ t: b.top, l: b.left, r: b.right });
      });
      return rows.sort(function (a, b) { return a.t - b.t; }).map(function (x) { return x.r - x.l; });
    }
    function fit(el) {
      el.style.maxWidth = ''; el.style.textWrap = '';
      // A filled box marked data-fill spans the card from edge to edge, and its text fills it
      if (el.hasAttribute('data-fill')) return;
      var cs = getComputedStyle(el), full = el.getBoundingClientRect().width;
      if (!full || cs.whiteSpace === 'nowrap' || /flex|grid/.test(cs.display)) return;
      if (Array.prototype.some.call(el.children, function (c) { return !/^inline/.test(getComputedStyle(c).display); })) return;
      el.style.textWrap = 'wrap';
      var n = widths(el).length, lo = 0, hi = full, w, L;
      if (n < 2 || n > 3) { el.style.textWrap = ''; return; }
      while (hi - lo > 1) { w = (lo + hi) / 2; el.style.maxWidth = w + 'px'; if (widths(el).length > n) lo = w; else hi = w; }
      var best = 0, gap = Infinity;
      for (w = Math.ceil(hi); w <= full; w += 2) {
        el.style.maxWidth = w + 'px'; L = widths(el);
        // Each line no longer than the one above (within 10%, which reads as equal). Keep the most even width,
        // and prefer the first line longer: a last line longer than the first costs three times its overhang
        var score = Math.max.apply(null, L) - Math.min.apply(null, L) + Math.max(0, L[n - 1] - L[0]) * 3;
        if (L.length === n && L.every(function (x, i) { return !i || x <= L[i - 1] * 1.1 + 1; }) && score < gap) { gap = score; best = w; }
      }
      if (!best) { el.style.maxWidth = ''; el.style.textWrap = ''; return; }
      el.style.maxWidth = best + 'px';
      if (cs.textAlign === 'center' && cs.display === 'block') { el.style.marginLeft = 'auto'; el.style.marginRight = 'auto'; }
    }
    var queued = false, lastW = 0;
    function run() { queued = false; Array.prototype.forEach.call(root.querySelectorAll(SEL), fit); }
    function later() { if (!queued) { queued = true; requestAnimationFrame(run); } }
    later();
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(later);
    if (window.ResizeObserver) new ResizeObserver(function () { var w = root.getBoundingClientRect().width; if (Math.abs(w - lastW) > 0.5) { lastW = w; later(); } }).observe(root);
    if (window.MutationObserver) new MutationObserver(later).observe(root, { subtree: true, childList: true, characterData: true, attributes: true, attributeFilter: ['hidden'] });
  }

  function initSearchParty(root) {
    if (!root || root.__miSpy) return;
    root.__miSpy = true;
    evenLines(root);
    var dark = root.querySelector('.spy-dark'), find = root.querySelector('.spy-find'), cursors = root.querySelectorAll('.spy-cursor');
    var found = root.querySelector('.spy-found'), msg = root.querySelector('.spy-msg'), status = root.querySelector('.spy-status');
    var typo = root.getAttribute('data-typo') || '/pricng', fix = root.getAttribute('data-fix') || '/pricing';
    var t0 = performance.now(), raf = 0, done = false, walk = null;
    find.textContent = typo;
    // Each searcher loops a different figure-eight across the room
    var PATHS = [[0.28, 0.32, 0.9, 1.3, 0], [0.32, 0.3, 1.2, 0.8, 2], [0.36, 0.34, 0.7, 1.1, 4]];

    function frame(now) {
      if (!root.isConnected) return;
      var W = dark.clientWidth, H = dark.clientHeight, t = (now - t0) / 1000;
      cursors.forEach(function (c, i) {
        var p = PATHS[i], x, y;
        if (walk && i === 0) {
          var k = Math.min(1, (now - walk.t) / 1200), e = k * k * (3 - 2 * k);
          x = walk.x + (walk.tx - walk.x) * e; y = walk.y + (walk.ty - walk.y) * e;
          if (k === 1 && !done) reveal();
        } else {
          x = W * (0.5 + p[0] * Math.sin(t * p[2] + p[4])); y = H * (0.5 + p[1] * Math.sin(t * p[3] * 2 + p[4]));
        }
        c.style.transform = 'translate(' + x.toFixed(1) + 'px, ' + y.toFixed(1) + 'px)';
        dark.style.setProperty('--x' + i, (x + 4).toFixed(1) + 'px'); dark.style.setProperty('--y' + i, (y + 4).toFixed(1) + 'px');
        c.__x = x; c.__y = y;
      });
      if (!walk && t > 5) {
        var fr = find.getBoundingClientRect(), dr = dark.getBoundingClientRect();
        walk = { t: now, x: cursors[0].__x, y: cursors[0].__y, tx: fr.left - dr.left + fr.width / 2, ty: fr.top - dr.top + fr.height + 2 };
        status.textContent = 'Wait, something over here…';
      }
      raf = requestAnimationFrame(frame);
    }
    function reveal() {
      done = true; root.classList.add('is-found');
      msg.innerHTML = 'Found it. You typed <code></code>. You probably meant <code></code>.';
      var codes = msg.querySelectorAll('code'); codes[0].textContent = typo; codes[1].textContent = fix;
      found.hidden = false; status.textContent = '';
    }

    dark.addEventListener('pointermove', function (e) {
      var r = dark.getBoundingClientRect();
      dark.style.setProperty('--xp', (e.clientX - r.left) + 'px'); dark.style.setProperty('--yp', (e.clientY - r.top) + 'px');
    });
    dark.addEventListener('pointerleave', function () { dark.style.setProperty('--xp', '-99px'); dark.style.setProperty('--yp', '-99px'); });
    root.querySelectorAll('.spy-links a').forEach(function (a) { a.addEventListener('click', function (e) { e.preventDefault(); status.textContent = 'In a real app this would take you to ' + (a.textContent.indexOf('Pricing') >= 0 ? fix : '/') + '.'; }); });

    if (reduce.matches) { var W = dark.clientWidth, H = dark.clientHeight; [[0.25, 0.3], [0.7, 0.35], [0.5, 0.75]].forEach(function (p, i) { dark.style.setProperty('--x' + i, p[0] * W + 'px'); dark.style.setProperty('--y' + i, p[1] * H + 'px'); cursors[i].style.transform = 'translate(' + p[0] * W + 'px, ' + p[1] * H + 'px)'; }); reveal(); return; }
    raf = requestAnimationFrame(frame);
  }

  window.initSearchParty = initSearchParty;
  function boot() { document.querySelectorAll('[data-mi="search-party"]').forEach(initSearchParty); }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();

</script>
<script>
(function () {
  var host = document.querySelector('.mi-host'), orig = host.innerHTML, fn = window["initSearchParty"];
  document.querySelector('[data-mi-reset]').addEventListener('click', function (e) {
    host.innerHTML = orig;
    host.querySelectorAll('[data-mi]').forEach(function (el) { if (typeof fn === 'function') fn(el); });
    var b = e.currentTarget; b.classList.remove('is-spin'); void b.offsetWidth; b.classList.add('is-spin');
    setTimeout(function () { b.classList.remove('is-spin'); }, 700);
  });
})();
</script>
</body>
</html>
