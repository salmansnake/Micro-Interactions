<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tired Hand</title>
<style>
/* Demo page only. Remove this block when pasting into your own page. */
body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 48px 16px; box-sizing: border-box; background: #EBEBEB; }
@media (prefers-color-scheme: dark) { body { background: #0C0C0C; } }
</style>
<style>
@import url('https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap');

/* Outcraft Design System v2: the tokens this component uses, scoped to .tdh so they never affect the rest of your page. */
.tdh {
  --duration-reduced: 120ms;
  --duration-slow: 320ms;
  --ease-in-out: cubic-bezier(0.62, 0, 0.32, 1);
  --ease-out: cubic-bezier(0.22, 0.9, 0.24, 1);
  --font-mono: "Geist Mono", ui-monospace, "Cascadia Code", Menlo, Consolas, monospace;
  --font-sans: "Geist", system-ui, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --leading-body: 22px;
  --leading-small: 18px;
  --press-scale: 0.97;
  --radius-full: 9999px;
  --radius-md: 8px;
  --radius-xl: 16px;
  --spring-pop: linear(0, 0.0413, 0.1464, 0.2895, 0.4487, 0.6073, 0.7529, 0.8776, 0.9776, 1.0517, 1.1013, 1.1292, 1.1394, 1.1357, 1.1225, 1.1033, 1.0813, 1.059, 1.0382, 1.0202, 1.0055, 0.9945, 0.9869, 0.9825, 0.9807, 0.9808, 0.9825, 0.985, 0.9881, 0.9912, 0.9941, 0.9967, 0.9989, 1.0005, 1.0017, 1.0024, 1.0027, 1.0027, 1.0025, 1.0022, 1);
  --spring-pop-duration: 680ms;
  --spring-press: linear(0, 0.0189, 0.0676, 0.1361, 0.2164, 0.3025, 0.3896, 0.4743, 0.5543, 0.628, 0.6945, 0.7535, 0.8049, 0.849, 0.8863, 0.9172, 0.9425, 0.9629, 0.9789, 0.9912, 1.0004, 1.0071, 1.0116, 1.0145, 1.016, 1.0166, 1.0164, 1.0156, 1.0146, 1.0133, 1.0118, 1.0104, 1.009, 1.0076, 1.0064, 1.0053, 1.0043, 1.0034, 1.0026, 1.002, 1);
  --spring-press-duration: 310ms;
  --spring-ui: linear(0, 0.0237, 0.0849, 0.1704, 0.2697, 0.3746, 0.4788, 0.5777, 0.6685, 0.7491, 0.8189, 0.8776, 0.9257, 0.9639, 0.9931, 1.0147, 1.0296, 1.0391, 1.0442, 1.046, 1.0451, 1.0425, 1.0387, 1.0342, 1.0294, 1.0246, 1.02, 1.0158, 1.012, 1.0087, 1.0059, 1.0037, 1.0019, 1.0005, 0.9994, 0.9987, 0.9982, 0.998, 0.9979, 0.9979, 1);
  --spring-ui-duration: 460ms;
  --text-body: 15px;
  --text-caption: 12px;
  --text-small: 13px;
  --text-ui: 14px;
  --amber-9: #ffc53d;
  --aqua: #79EEEC;
  --aqua-700: #0B7573;
  --ash: #686868;
  --black: #000000;
  --body: var(--slate);
  --border: var(--line);
  --card: var(--white);
  --foreground: var(--black);
  --line: #DDDDDD;
  --mist: #EBEBEB;
  --muted: var(--mist);
  --muted-foreground: var(--ash);
  --olive: #AA9856;
  --on-color: #ffffff;
  --orange: #FE8C5F;
  --pink: #FFC7F6;
  --primary: var(--black);
  --primary-foreground: #ffffff;
  --ring: var(--aqua-700);
  --sage: #99AD88;
  --shadow-sm: 0 1px 2px rgba(17, 17, 17, 0.04), 0 1px 3px rgba(17, 17, 17, 0.07);
  --slate: #4E4E4E;
  --white: #FFFFFF;
}
/* Dark mode: follows data-theme="dark" (or class "dark") on any ancestor, or the system setting. */
[data-theme="dark"] .tdh, .dark .tdh {
  --amber-9: #ffc53d;
  --aqua: #79EEEC;
  --aqua-700: #79EEEC;
  --ash: #A6A6A6;
  --black: #000000;
  --body: var(--slate);
  --border: var(--line);
  --card: var(--white);
  --foreground: #F2F2F2;
  --line: #333333;
  --mist: #2D2D2D;
  --muted: var(--mist);
  --muted-foreground: var(--ash);
  --olive: #AA9856;
  --on-color: #ffffff;
  --orange: #FE8C5F;
  --pink: #FFC7F6;
  --primary: var(--aqua);
  --primary-foreground: #000000;
  --ring: var(--aqua);
  --sage: #99AD88;
  --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.4), 0 1px 3px rgba(0, 0, 0, 0.3);
  --slate: #CCCCCC;
  --white: #171717;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]):not(.light) .tdh {
    --amber-9: #ffc53d;
    --aqua: #79EEEC;
    --aqua-700: #79EEEC;
    --ash: #A6A6A6;
    --black: #000000;
    --body: var(--slate);
    --border: var(--line);
    --card: var(--white);
    --foreground: #F2F2F2;
    --line: #333333;
    --mist: #2D2D2D;
    --muted: var(--mist);
    --muted-foreground: var(--ash);
    --olive: #AA9856;
    --on-color: #ffffff;
    --orange: #FE8C5F;
    --pink: #FFC7F6;
    --primary: var(--aqua);
    --primary-foreground: #000000;
    --ring: var(--aqua);
    --sage: #99AD88;
    --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.4), 0 1px 3px rgba(0, 0, 0, 0.3);
    --slate: #CCCCCC;
    --white: #171717;
  }
}

/* Tired Hand — a raised hand nobody notices gets tired: it droops, switches arms, then props itself up on a stick.
   Outcraft Design System v2. Every value is an Outcraft token. */
.tdh {
  --tdh-bg: var(--card);
  --tdh-fg: var(--foreground);
  --tdh-muted: var(--muted-foreground);
  --tdh-fill: var(--muted);
  --tdh-accent: var(--primary);
  --tdh-on-accent: var(--primary-foreground);
  /* The video tiles stand in for camera pictures, so their colors stay the same in light and dark */
  --tdh-tile: color-mix(in oklab, var(--black) 78%, var(--sage));
  --tdh-tilt: 0deg;
  --tdh-flip: 1;
  display: flex;
  flex-direction: column;
  gap: 16px;
  width: 100%;
  max-width: 400px;
  box-sizing: border-box;
  padding: 20px;
  background: var(--tdh-bg);
  color: var(--tdh-fg);
  border-radius: var(--radius-xl);
  border: 1px solid var(--border);
  box-shadow: var(--shadow-sm);
  font: 400 var(--text-body)/var(--leading-body) var(--font-sans);
  letter-spacing: normal;
  text-align: left;
  -webkit-font-smoothing: antialiased;
}
.tdh p { margin: 0; }
.tdh-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.tdh-tile { position: relative; display: grid; place-items: center; aspect-ratio: 16 / 11; overflow: hidden; border-radius: var(--radius-md); background: var(--tdh-tile); }
.tdh-tile.is-speaking { box-shadow: inset 0 0 0 2px var(--aqua); }
.tdh-av { display: block; width: 40px; height: 40px; border-radius: 50%; background: var(--aqua); color: var(--black); font-size: var(--text-ui); font-weight: 700; align-content: center; text-align: center; text-box: trim-both cap alphabetic; }
.tdh-tile:nth-child(2) .tdh-av { background: var(--pink); }
.tdh-tile:nth-child(3) .tdh-av { background: var(--orange); }
.tdh-you .tdh-av { width: 40px; background: var(--sage); font-size: 11px; }
.tdh-name { position: absolute; left: 6px; bottom: 6px; display: inline-flex; align-items: center; height: 20px; padding: 0 8px; border-radius: var(--radius-full); background: color-mix(in srgb, var(--black) 62%, transparent); color: var(--on-color); font-size: var(--text-caption); line-height: 1; font-weight: 500; white-space: nowrap; }

/* The hand: an Amber badge that tires over time (tilt), switches arms (flip), then rests on a stick */
.tdh-hand { position: absolute; right: 8px; top: 8px; display: block; width: 32px; height: 32px; transform: scale(0); transform-origin: 50% 100%; transition: transform var(--spring-pop-duration) var(--spring-pop); }
.tdh.is-up .tdh-hand { transform: scale(1); }
.tdh-palm { position: relative; z-index: 1; display: grid; place-items: center; width: 32px; height: 32px; border-radius: 50%; background: var(--amber-9); color: var(--black); transform: scaleX(var(--tdh-flip)) rotate(var(--tdh-tilt)); transform-origin: 50% 90%; transition: transform var(--spring-ui-duration) var(--spring-ui); }
.tdh-palm svg { width: 18px; height: 18px; }
.tdh-stick { position: absolute; left: 50%; top: 26px; width: 4px; height: 0; margin-left: -2px; border-radius: var(--radius-full); background: var(--olive); transition: height var(--duration-slow) var(--ease-out); }
.tdh.is-propped .tdh-stick { height: 22px; }
.tdh.is-waving .tdh-palm { animation: tdh-wave 0.35s var(--ease-in-out) infinite alternate; }
@keyframes tdh-wave { from { transform: scaleX(var(--tdh-flip)) rotate(-24deg); } to { transform: scaleX(var(--tdh-flip)) rotate(24deg); } }
.tdh-clock { position: absolute; right: 8px; bottom: 6px; display: inline-flex; align-items: center; height: 20px; padding: 0 6px; border-radius: var(--radius-full); background: color-mix(in srgb, var(--black) 62%, transparent); color: var(--on-color); font: 500 var(--text-caption)/1 var(--font-mono); font-variant-numeric: tabular-nums; }

.tdh-foot { display: flex; align-items: center; gap: 12px; }
.tdh .tdh-status { flex: 1; min-width: 0; margin-right: auto; color: var(--body); font-size: var(--text-small); line-height: var(--leading-small); }
/* A short sentence in the status wraps as one piece: "Noticed after 5 minutes." never splits */
.tdh-whole { display: inline-block; }
.tdh-btn { flex: none; display: inline-flex; align-items: center; justify-content: center; height: 44px; padding: 0 16px; border: 0; border-radius: var(--radius-md); background: var(--tdh-accent); color: var(--tdh-on-accent); font: inherit; font-size: var(--text-ui); font-weight: 600; white-space: nowrap; cursor: pointer; transition: transform var(--spring-press-duration) var(--spring-press); }
.tdh-btn svg { width: 16px; height: 16px; margin-right: 8px; }
.tdh-btn.is-secondary { background: var(--tdh-fill); color: var(--tdh-fg); }
.tdh-btn:active { transform: scale(var(--press-scale)); }
.tdh-btn:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }

@media (prefers-reduced-motion: reduce) {
  .tdh-hand, .tdh-palm, .tdh-stick { transition-duration: var(--duration-reduced); }
  .tdh.is-waving .tdh-palm { animation: none; }
}
/* Multi-line text wraps evenly and never ends on one or two lonely words */
.tdh :is(p, li, dd, dt, small, label, figcaption, h1, h2, h3, h4) { text-wrap: balance; }
.tdh [hidden] { display: none !important; }

</style>
</head>
<body>

<div class="tdh" data-mi="tired-hand">
  <div class="tdh-grid">
    <div class="tdh-tile is-speaking"><span class="tdh-av" aria-hidden="true">MC</span><span class="tdh-name">Mira Chen</span></div>
    <div class="tdh-tile"><span class="tdh-av" aria-hidden="true">SR</span><span class="tdh-name">Sam Rivera</span></div>
    <div class="tdh-tile"><span class="tdh-av" aria-hidden="true">PS</span><span class="tdh-name">Priya Shah</span></div>
    <div class="tdh-tile tdh-you">
      <span class="tdh-av" aria-hidden="true">You</span><span class="tdh-name">You</span>
      <span class="tdh-hand" aria-hidden="true"><span class="tdh-stick"></span><span class="tdh-palm"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 11V6a2 2 0 0 0-2-2a2 2 0 0 0-2 2"/><path d="M14 10V4a2 2 0 0 0-2-2a2 2 0 0 0-2 2v2"/><path d="M10 10.5V6a2 2 0 0 0-2-2a2 2 0 0 0-2 2v8"/><path d="M18 8a2 2 0 1 1 4 0v6a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.86-5.99-2.34l-3.6-3.6a2 2 0 0 1 2.83-2.82L7 15"/></svg></span></span>
      <span class="tdh-clock" aria-hidden="true" hidden>0:00</span>
    </div>
  </div>
  <div class="tdh-foot">
    <p class="tdh-status" role="status" aria-live="polite">Mira is presenting the roadmap.</p>
    <button type="button" class="tdh-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 11V6a2 2 0 0 0-2-2a2 2 0 0 0-2 2"/><path d="M14 10V4a2 2 0 0 0-2-2a2 2 0 0 0-2 2v2"/><path d="M10 10.5V6a2 2 0 0 0-2-2a2 2 0 0 0-2 2v8"/><path d="M18 8a2 2 0 1 1 4 0v6a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.86-5.99-2.34l-3.6-3.6a2 2 0 0 1 2.83-2.82L7 15"/></svg><span>Raise Hand</span></button>
  </div>
</div>


<script>
/* Tired Hand — vanilla JS. Auto-initializes every [data-mi="tired-hand"].
   Raise Hand starts a sped-up clock (one meeting minute every 2 seconds). Each minute the hand gets more tired:
   droops, switches arms, droops further, rests on a stick, waves wildly, and at last someone notices.
   Call window.initTiredHand(el) for elements added later. */
(function () {
  'use strict';
  var STEP = 2000;
  // Per meeting minute: tilt, which arm, extras, and what the status says
  var STAGES = [
    { tilt: 0, flip: 1, say: 'Hand raised. Mira is still talking.' },
    { tilt: 18, flip: 1, say: '1 minute. The arm is getting heavy.' },
    { tilt: -8, flip: -1, say: '2 minutes. Switched arms.' },
    { tilt: 38, flip: -1, say: '3 minutes. It’s more of a lean now.' },
    { tilt: 0, flip: -1, prop: true, say: '4 minutes. Propped up on a stick.' },
    { tilt: 0, flip: -1, prop: true, wave: true, say: '5 minutes. Waving now. Dignity optional.' }
  ];

  // Even line breaks: text that wraps to two or three lines is narrowed until its lines are close in length,
  // with the first line the longest, so no line runs long while the next holds a word or two.
  function evenLines(root) {
    var SEL = 'p, li, dd, dt, small, label, figcaption, h1, h2, h3, h4';
    function widths(el) {
      var range = document.createRange(), rows = [];
      range.selectNodeContents(el);
      Array.prototype.forEach.call(range.getClientRects(), function (b) {
        if (!b.width) return;
        var row = rows.filter(function (x) { return Math.abs(x.t - b.top) < b.height / 2; })[0];
        if (row) { row.l = Math.min(row.l, b.left); row.r = Math.max(row.r, b.right); } else rows.push({ t: b.top, l: b.left, r: b.right });
      });
      return rows.sort(function (a, b) { return a.t - b.t; }).map(function (x) { return x.r - x.l; });
    }
    function fit(el) {
      el.style.maxWidth = ''; el.style.textWrap = '';
      // A filled box marked data-fill spans the card from edge to edge, and its text fills it
      if (el.hasAttribute('data-fill')) return;
      var cs = getComputedStyle(el), full = el.getBoundingClientRect().width;
      if (!full || cs.whiteSpace === 'nowrap' || /flex|grid/.test(cs.display)) return;
      if (Array.prototype.some.call(el.children, function (c) { return !/^inline/.test(getComputedStyle(c).display); })) return;
      el.style.textWrap = 'wrap';
      var n = widths(el).length, lo = 0, hi = full, w, L;
      if (n < 2 || n > 3) { el.style.textWrap = ''; return; }
      while (hi - lo > 1) { w = (lo + hi) / 2; el.style.maxWidth = w + 'px'; if (widths(el).length > n) lo = w; else hi = w; }
      var best = 0, gap = Infinity;
      for (w = Math.ceil(hi); w <= full; w += 2) {
        el.style.maxWidth = w + 'px'; L = widths(el);
        // Each line no longer than the one above (within 10%, which reads as equal). Keep the most even width,
        // and prefer the first line longer: a last line longer than the first costs three times its overhang
        var score = Math.max.apply(null, L) - Math.min.apply(null, L) + Math.max(0, L[n - 1] - L[0]) * 3;
        if (L.length === n && L.every(function (x, i) { return !i || x <= L[i - 1] * 1.1 + 1; }) && score < gap) { gap = score; best = w; }
      }
      if (!best) { el.style.maxWidth = ''; el.style.textWrap = ''; return; }
      el.style.maxWidth = best + 'px';
      if (cs.textAlign === 'center' && cs.display === 'block') { el.style.marginLeft = 'auto'; el.style.marginRight = 'auto'; }
    }
    var queued = false, lastW = 0;
    function run() { queued = false; Array.prototype.forEach.call(root.querySelectorAll(SEL), fit); }
    function later() { if (!queued) { queued = true; requestAnimationFrame(run); } }
    later();
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(later);
    if (window.ResizeObserver) new ResizeObserver(function () { var w = root.getBoundingClientRect().width; if (Math.abs(w - lastW) > 0.5) { lastW = w; later(); } }).observe(root);
    if (window.MutationObserver) new MutationObserver(later).observe(root, { subtree: true, childList: true, characterData: true, attributes: true, attributeFilter: ['hidden'] });
  }

  function initTiredHand(root) {
    if (!root || root.__miTdh) return;
    root.__miTdh = true;
    evenLines(root);
    var btn = root.querySelector('.tdh-btn'), label = btn.querySelector('span'), status = root.querySelector('.tdh-status');
    var clock = root.querySelector('.tdh-clock'), start = status.textContent;
    var stage = 0, timer = 0, tick = 0, secs = 0, up = false;

    function show(i) {
      var s = STAGES[i];
      root.style.setProperty('--tdh-tilt', s.tilt + 'deg');
      root.style.setProperty('--tdh-flip', s.flip);
      root.classList.toggle('is-propped', !!s.prop);
      root.classList.toggle('is-waving', !!s.wave);
      status.textContent = s.say;
    }
    // Any phrases after the text stay whole: each moves to the next line as one piece, never split mid-phrase
    function lower(text, whole) {
      up = false; clearTimeout(timer); clearInterval(tick);
      root.classList.remove('is-up', 'is-propped', 'is-waving');
      root.style.setProperty('--tdh-tilt', '0deg'); root.style.setProperty('--tdh-flip', 1);
      clock.hidden = true;
      label.textContent = 'Raise Hand'; btn.classList.remove('is-secondary');
      status.textContent = text;
      (whole || []).forEach(function (w) {
        var s = document.createElement('span'); s.className = 'tdh-whole'; s.textContent = w;
        status.append(' ', s);
      });
    }
    function next() {
      stage++;
      if (stage < STAGES.length) { show(stage); timer = setTimeout(next, STEP); return; }
      lower('“Did someone have a question?”', ['Noticed after 5\u00a0minutes.', 'The question: forgotten.']);
    }

    btn.addEventListener('click', function () {
      if (up) return lower('Hand lowered. The question lives on in your heart.');
      up = true; stage = 0; secs = 0;
      root.classList.add('is-up');
      clock.hidden = false; clock.textContent = '0:00';
      // The clock runs at meeting speed: 30 seconds for every real second
      tick = setInterval(function () { secs += 15; clock.textContent = Math.floor(secs / 60) + ':' + ('0' + secs % 60).slice(-2); }, 500);
      label.textContent = 'Lower Hand'; btn.classList.add('is-secondary');
      show(0);
      timer = setTimeout(next, STEP);
    });

    // The button keeps one width for Raise Hand and Lower Hand
    function sizeBtn() {
      var keep = label.textContent, w = 0;
      btn.style.minWidth = '';
      ['Raise Hand', 'Lower Hand'].forEach(function (s) { label.textContent = s; w = Math.max(w, btn.getBoundingClientRect().width); });
      label.textContent = keep; btn.style.minWidth = Math.ceil(w) + 'px';
    }
    sizeBtn();
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(sizeBtn);
    status.textContent = start;
  }

  window.initTiredHand = initTiredHand;
  function boot() { document.querySelectorAll('[data-mi="tired-hand"]').forEach(initTiredHand); }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();

</script>
</body>
</html>
