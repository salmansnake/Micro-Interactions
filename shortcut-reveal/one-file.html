<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shortcut Reveal</title>
<style>
/* Demo page only. Remove this block when pasting into your own page. */
body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 48px 16px; box-sizing: border-box; background: #F3F2EE; }
@media (prefers-color-scheme: dark) { body { background: #0C0D0C; } }
</style>
<style>
@import url('https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap');

/* Outcraft Design System v2: the tokens this component uses, scoped to .sr so they never affect the rest of your page. */
.sr {
  --blur-md: 16px;
  --duration-base: 200ms;
  --duration-fast: 140ms;
  --duration-slower: 480ms;
  --ease-out: cubic-bezier(0.22, 0.9, 0.24, 1);
  --font-sans: "Geist", system-ui, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --frost-saturate: 160%;
  --leading-body: 22px;
  --leading-caption: 16px;
  --leading-small: 18px;
  --leading-title: 28px;
  --leading-title-sm: 24px;
  --press-scale: 0.97;
  --press-scale-sm: 0.94;
  --radius-full: 9999px;
  --radius-md: 8px;
  --radius-sm: 6px;
  --radius-xl: 16px;
  --radius-xs: 4px;
  --spring-press: linear(0, 0.0189, 0.0676, 0.1361, 0.2164, 0.3025, 0.3896, 0.4743, 0.5543, 0.628, 0.6945, 0.7535, 0.8049, 0.849, 0.8863, 0.9172, 0.9425, 0.9629, 0.9789, 0.9912, 1.0004, 1.0071, 1.0116, 1.0145, 1.016, 1.0166, 1.0164, 1.0156, 1.0146, 1.0133, 1.0118, 1.0104, 1.009, 1.0076, 1.0064, 1.0053, 1.0043, 1.0034, 1.0026, 1.002, 1);
  --spring-press-duration: 310ms;
  --spring-ui: linear(0, 0.0237, 0.0849, 0.1704, 0.2697, 0.3746, 0.4788, 0.5777, 0.6685, 0.7491, 0.8189, 0.8776, 0.9257, 0.9639, 0.9931, 1.0147, 1.0296, 1.0391, 1.0442, 1.046, 1.0451, 1.0425, 1.0387, 1.0342, 1.0294, 1.0246, 1.02, 1.0158, 1.012, 1.0087, 1.0059, 1.0037, 1.0019, 1.0005, 0.9994, 0.9987, 0.9982, 0.998, 0.9979, 0.9979, 1);
  --spring-ui-duration: 460ms;
  --text-body: 15px;
  --text-body-lg: 16px;
  --text-caption: 12px;
  --text-small: 13px;
  --text-title: 20px;
  --text-title-sm: 17px;
  --tracking-title: -0.015em;
  --aqua: #79EEEC;
  --aqua-700: #0B7573;
  --ash: #646A66;
  --black: #000000;
  --border: var(--line);
  --brand-foreground: #000000;
  --card: var(--white);
  --foreground: var(--black);
  --frost: rgba(255, 255, 255, 0.74);
  --frost-border: rgba(0, 0, 0, 0.08);
  --green-11: #218358;
  --highlight: var(--aqua);
  --line: #DCDED9;
  --mist: #ECEBE6;
  --muted: var(--mist);
  --muted-foreground: var(--ash);
  --primary: var(--black);
  --primary-foreground: #ffffff;
  --ring: var(--aqua-700);
  --shadow-lg: 0 4px 8px -2px rgba(17, 17, 16, 0.06), 0 16px 32px -8px rgba(17, 17, 16, 0.14);
  --shadow-md: 0 2px 4px -1px rgba(17, 17, 16, 0.05), 0 6px 14px -3px rgba(17, 17, 16, 0.09);
  --success: var(--green-11);
  --success-foreground: #ffffff;
  --white: #FFFFFF;
}
/* Dark mode: follows data-theme="dark" (or class "dark") on any ancestor, or the system setting. */
[data-theme="dark"] .sr, .dark .sr {
  --aqua: #79EEEC;
  --aqua-700: #79EEEC;
  --ash: #A3A8A4;
  --black: #000000;
  --border: var(--line);
  --brand-foreground: #000000;
  --card: var(--white);
  --foreground: #F3F2EE;
  --frost: rgba(21, 23, 22, 0.74);
  --frost-border: rgba(243, 242, 238, 0.1);
  --green-11: #3dd68c;
  --highlight: var(--aqua);
  --line: #313432;
  --mist: #2B2E2D;
  --muted: var(--mist);
  --muted-foreground: var(--ash);
  --primary: var(--aqua);
  --primary-foreground: #000000;
  --ring: var(--aqua);
  --shadow-lg: 0 4px 8px -2px rgba(0, 0, 0, 0.5), 0 16px 32px -8px rgba(0, 0, 0, 0.55);
  --shadow-md: 0 2px 4px -1px rgba(0, 0, 0, 0.45), 0 6px 14px -3px rgba(0, 0, 0, 0.45);
  --success: #218358;
  --success-foreground: #ffffff;
  --white: #161817;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]):not(.light) .sr {
    --aqua: #79EEEC;
    --aqua-700: #79EEEC;
    --ash: #A3A8A4;
    --black: #000000;
    --border: var(--line);
    --brand-foreground: #000000;
    --card: var(--white);
    --foreground: #F3F2EE;
    --frost: rgba(21, 23, 22, 0.74);
    --frost-border: rgba(243, 242, 238, 0.1);
    --green-11: #3dd68c;
    --highlight: var(--aqua);
    --line: #313432;
    --mist: #2B2E2D;
    --muted: var(--mist);
    --muted-foreground: var(--ash);
    --primary: var(--aqua);
    --primary-foreground: #000000;
    --ring: var(--aqua);
    --shadow-lg: 0 4px 8px -2px rgba(0, 0, 0, 0.5), 0 16px 32px -8px rgba(0, 0, 0, 0.55);
    --shadow-md: 0 2px 4px -1px rgba(0, 0, 0, 0.45), 0 6px 14px -3px rgba(0, 0, 0, 0.45);
    --success: #218358;
    --success-foreground: #ffffff;
    --white: #161817;
  }
}

/* Shortcut Reveal — hold Ctrl / ⌘ to see every shortcut on the toolbar.
   Outcraft Design System v2: grouped Frost toolbar over a document. */
.sr {
  --sr-bg: var(--card);
  --sr-fg: var(--foreground);
  --sr-muted: var(--muted-foreground);
  --sr-line: var(--border);
  --sr-fill: var(--muted);
  --sr-hover: var(--muted);
  --sr-accent: var(--primary);
  --sr-on-accent: var(--primary-foreground);
  --sr-success: var(--success);
  --sr-on-success: var(--success-foreground);
  --sr-glass: var(--frost);
  --sr-glass-edge: var(--frost-border);
  --sr-glass-rim: var(--frost-border);
  --sr-glass-shadow: var(--shadow-lg);
  position: relative;
  width: 100%;
  max-width: 580px;
  overflow: hidden;
  background: var(--sr-bg);
  color: var(--sr-fg);
  border-radius: var(--radius-xl);
  border: 1px solid var(--border);
  box-shadow: 0 0 0 1px var(--sr-line), var(--shadow-lg);
  font: 400 var(--text-body)/var(--leading-body) var(--font-sans);
  letter-spacing: normal;
  text-align: left;
  -webkit-font-smoothing: antialiased;
}
.sr-toolbar { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; padding: 10px; }
.sr-group {
  display: flex;
  align-items: center;
  gap: 2px;
  padding: 3px;
  border-radius: var(--radius-full);
  background: var(--sr-glass);
  -webkit-backdrop-filter: blur(var(--blur-md)) saturate(var(--frost-saturate));
  backdrop-filter: blur(var(--blur-md)) saturate(var(--frost-saturate));
  box-shadow: inset 0 0 0 1px var(--frost-border), var(--sr-glass-shadow);
}
.sr-btn {
  position: relative;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 34px;
  height: 34px;
  box-sizing: border-box;
  padding: 0 10px;
  border: 0;
  border-radius: var(--radius-md);
  background: transparent;
  color: var(--sr-fg);
  font: inherit;
  font-weight: 500;
  cursor: pointer;
  transition: background-color var(--duration-fast), color var(--duration-fast), transform var(--spring-press-duration) var(--spring-press);
}
.sr-btn:hover { background: var(--sr-hover); }
/* Buttons in a capsule group are capsules (circles when icon-only), so their hover and on states match the group's shape */
.sr-group .sr-btn { border-radius: var(--radius-full); }
.sr-btn:active { transform: scale(var(--press-scale-sm)); }
.sr-btn:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }
.sr-btn svg { flex: none; width: 16px; height: 16px; }
/* Spacing sits on the label, not a flex gap: the hidden shortcut badge is a child too, and a gap made room for it, pushing every label and icon off center */
.sr-btn svg + .sr-text { margin-left: 6px; }
.sr-btn.is-on { background: color-mix(in srgb, var(--sr-accent) 16%, transparent); color: var(--sr-accent); }
.sr-btn.is-primary { margin-left: auto; height: 40px; padding: 0 18px; background: var(--sr-accent); color: var(--sr-on-accent); font-weight: 600; box-shadow: var(--sr-glass-shadow); }
.sr-btn.is-primary:hover { background: color-mix(in oklab, var(--sr-accent), var(--black) 8%); }
.sr-glyph-b { font-weight: 700; font-size: var(--text-body-lg); }
.sr-glyph-i { font-family: ui-serif, Georgia, serif; font-style: italic; font-size: var(--text-title-sm); }

/* Keycaps: dark HUD capsules */
.sr-kbd {
  position: absolute;
  z-index: 3;
  top: 100%;
  left: 50%;
  margin-top: 9px;
  padding: 4px 8px;
  border-radius: var(--radius-full);
  background: var(--sr-fg);
  color: var(--sr-bg);
  font: 600 var(--text-caption)/var(--leading-caption) var(--font-sans);
  letter-spacing: normal;
  white-space: nowrap;
  box-shadow: var(--shadow-md);
  opacity: 0;
  transform: translate(-50%, -4px) scale(0.7);
  pointer-events: none;
  transition:
    transform var(--spring-ui-duration) var(--spring-ui) var(--sr-delay, 0ms),
    opacity var(--duration-fast) var(--ease-out) var(--sr-delay, 0ms),
    background-color var(--duration-base);
}
.sr-kbd.is-low { margin-top: 36px; }
.sr-kbd.is-low::before {
  content: "";
  position: absolute;
  top: -26px;
  left: 50%;
  width: 1px;
  height: 25px;
  background: var(--sr-fg);
  opacity: 0.35;
}
.sr.is-revealed .sr-kbd { opacity: 1; transform: translate(-50%, 0) scale(1); }
.sr-btn.is-learned .sr-kbd { background: var(--sr-success); color: var(--sr-on-success); }
.sr-btn.is-flash { animation: sr-flash var(--duration-slower) var(--ease-out); }
@keyframes sr-flash {
  from { box-shadow: 0 0 0 0 color-mix(in srgb, var(--sr-accent) 60%, transparent); }
  to { box-shadow: 0 0 0 10px transparent; }
}

/* Document */
.sr-doc { display: flex; flex-direction: column; gap: 10px; min-height: 150px; padding: 20px 22px 18px; transition: opacity var(--duration-base), filter var(--duration-base); }
.sr.is-revealed .sr-doc { opacity: 0.3; filter: blur(2px); }
.sr-doc h4 { margin: 0; font-size: var(--text-title); line-height: var(--leading-title); font-weight: 700; letter-spacing: var(--tracking-title); }
.sr-doc p { margin: 0; max-width: 52ch; color: var(--sr-muted); font-size: var(--text-title-sm); line-height: var(--leading-title-sm); letter-spacing: var(--tracking-title); }
.sr-sel { padding: 0 2px; border-radius: var(--radius-xs); background: var(--highlight); color: var(--brand-foreground); }
.sr-sel.is-bold { font-weight: 700; }
.sr-sel.is-italic { font-style: italic; }

.sr-foot {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 10px;
  padding: 10px 12px 12px 22px;
  border-top: 1px solid var(--sr-line);
  color: var(--sr-muted);
  font-size: var(--text-small);
  line-height: var(--leading-small);
  letter-spacing: normal;
}
.sr-hint kbd {
  padding: 2px 7px;
  border-radius: var(--radius-sm);
  background: var(--sr-fill);
  color: var(--sr-fg);
  font: 600 var(--text-caption)/var(--leading-caption) var(--font-sans);
}
.sr-hold {
  height: 32px;
  padding: 0 14px;
  border: 0;
  border-radius: var(--radius-sm);
  background: var(--sr-fill);
  color: var(--sr-fg);
  font: inherit;
  font-size: var(--text-small);
  font-weight: 600;
  cursor: pointer;
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
  -webkit-touch-callout: none;
}
.sr-hold:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }
.sr-toast {
  position: absolute;
  left: 50%;
  bottom: 60px;
  z-index: 4;
  padding: 9px 16px;
  border-radius: var(--radius-full);
  background: var(--sr-glass);
  -webkit-backdrop-filter: blur(var(--blur-md)) saturate(var(--frost-saturate));
  backdrop-filter: blur(var(--blur-md)) saturate(var(--frost-saturate));
  box-shadow: inset 0 0 0 1px var(--frost-border), var(--sr-glass-shadow);
  color: var(--sr-fg);
  font-size: var(--text-small);
  font-weight: 600;
  white-space: nowrap;
  opacity: 0;
  transform: translate(-50%, 8px) scale(var(--press-scale));
  pointer-events: none;
  transition: opacity var(--duration-base), transform var(--spring-ui-duration) var(--spring-ui);
}
.sr-toast.is-open { opacity: 1; transform: translate(-50%, 0) scale(1); }

@media (max-width: 460px) {
  .sr-text { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  .sr-kbd { transition: opacity var(--duration-fast) linear !important; transform: translate(-50%, 0) scale(1) !important; }
  .sr-btn.is-flash { animation: none; }
}
/* Multi-line text wraps evenly and never ends on one or two lonely words */
.sr :is(p, li, dd, dt, small, label, figcaption, h1, h2, h3, h4) { text-wrap: balance; }
/* Document paragraphs keep their natural flow; only a lonely last word is avoided */
.sr .sr-doc :is(p, li) { text-wrap: pretty; }
.sr [hidden] { display: none !important; }

</style>
</head>
<body>

<div class="sr" data-mi="shortcut-reveal">
  <div class="sr-toolbar" role="toolbar" aria-label="Editor actions">
    <div class="sr-group">
    <button type="button" class="sr-btn" data-shortcut="mod+k" data-action="search" data-name="Search" aria-label="Search">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5 14 14"/></svg>
      <span class="sr-text">Search</span><kbd class="sr-kbd" aria-hidden="true"></kbd>
    </button>
    </div>
    <div class="sr-group">
    <button type="button" class="sr-btn" data-shortcut="mod+b" data-action="bold" data-name="Bold" aria-label="Bold" aria-pressed="false">
      <span class="sr-glyph-b" aria-hidden="true">B</span><kbd class="sr-kbd" aria-hidden="true"></kbd>
    </button>
    <button type="button" class="sr-btn" data-shortcut="mod+i" data-action="italic" data-name="Italic" aria-label="Italic" aria-pressed="false">
      <span class="sr-glyph-i" aria-hidden="true">I</span><kbd class="sr-kbd" aria-hidden="true"></kbd>
    </button>
    <button type="button" class="sr-btn" data-shortcut="mod+shift+m" data-action="comment" data-name="Comment" aria-label="Comment">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 3.5h11v7h-6l-3 2.5v-2.5h-2z"/></svg>
      <kbd class="sr-kbd" aria-hidden="true"></kbd>
    </button>
    <button type="button" class="sr-btn" data-shortcut="mod+z" data-action="undo" data-name="Undo" aria-label="Undo">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5.5 4 2.5 7l3 3"/><path d="M2.5 7h7a4 4 0 0 1 0 8H8"/></svg>
      <kbd class="sr-kbd" aria-hidden="true"></kbd>
    </button>
    </div>
    <div class="sr-group">
    <button type="button" class="sr-btn" data-shortcut="mod+shift+s" data-action="share" data-name="Share" aria-label="Share">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 10V2.5M5 5.5l3-3 3 3"/><path d="M3 9v4.5h10V9"/></svg>
      <span class="sr-text">Share</span><kbd class="sr-kbd" aria-hidden="true"></kbd>
    </button>
    </div>
    <button type="button" class="sr-btn is-primary" data-shortcut="mod+enter" data-action="publish" data-name="Publish">
      Publish<kbd class="sr-kbd" aria-hidden="true"></kbd>
    </button>
  </div>
  <div class="sr-doc">
    <h4>Launch notes</h4>
    <p>We ship the new billing page on Monday. The <span class="sr-sel">annual plan</span> now shows its savings up front, and every invoice carries the workspace name.</p>
    <p>Add open questions as comments before Friday.</p>
  </div>
  <div class="sr-foot">
    <span class="sr-hint" aria-live="polite"></span>
    <button type="button" class="sr-hold">Hold to show shortcuts</button>
  </div>
  <div class="sr-toast" role="status"></div>
</div>


<script>
/* Shortcut Reveal — vanilla JS. Auto-initializes every [data-mi="shortcut-reveal"].
   Call window.initShortcutReveal(el) for elements added later. */
(function () {
  'use strict';
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)');
  var HOLD_MS = 320;
  var platform = (navigator.userAgentData && navigator.userAgentData.platform) || navigator.platform || navigator.userAgent || '';
  var isMac = /mac|iphone|ipad|ipod/i.test(platform);
  var MOD = isMac ? '⌘' : 'Ctrl';
  var MODIFIER_KEYS = ['Shift', 'Alt', 'Control', 'Meta', 'CapsLock'];

  function parse(combo) {
    var parts = combo.toLowerCase().split('+');
    return {
      mod: parts.indexOf('mod') > -1,
      shift: parts.indexOf('shift') > -1,
      alt: parts.indexOf('alt') > -1,
      key: parts[parts.length - 1]
    };
  }

  function keycap(c) {
    var k = c.key === 'enter' ? '↵' : c.key.toUpperCase();
    if (isMac) return (c.alt ? '⌥' : '') + (c.shift ? '⇧' : '') + (c.mod ? '⌘' : '') + k;
    var bits = [];
    if (c.mod) bits.push('Ctrl');
    if (c.alt) bits.push('Alt');
    if (c.shift) bits.push('⇧');
    bits.push(k);
    return bits.join(' ');
  }

  function ariaKeys(c) {
    var k = c.key === 'enter' ? 'Enter' : c.key.toUpperCase();
    return (c.mod ? (isMac ? 'Meta+' : 'Control+') : '') + (c.alt ? 'Alt+' : '') + (c.shift ? 'Shift+' : '') + k;
  }

  // Even line breaks: text that wraps to two or three lines is narrowed until its lines are close in length,
  // with the first line the longest, so no line runs long while the next holds a word or two.
  function evenLines(root) {
    var SEL = 'p, li, dd, dt, small, label, figcaption, h1, h2, h3, h4';
    function widths(el) {
      var range = document.createRange(), rows = [];
      range.selectNodeContents(el);
      Array.prototype.forEach.call(range.getClientRects(), function (b) {
        if (!b.width) return;
        var row = rows.filter(function (x) { return Math.abs(x.t - b.top) < b.height / 2; })[0];
        if (row) { row.l = Math.min(row.l, b.left); row.r = Math.max(row.r, b.right); } else rows.push({ t: b.top, l: b.left, r: b.right });
      });
      return rows.sort(function (a, b) { return a.t - b.t; }).map(function (x) { return x.r - x.l; });
    }
    function fit(el) {
      el.style.maxWidth = ''; el.style.textWrap = '';
      var cs = getComputedStyle(el), full = el.getBoundingClientRect().width;
      if (!full || cs.whiteSpace === 'nowrap' || /flex|grid/.test(cs.display)) return;
      if (Array.prototype.some.call(el.children, function (c) { return !/^inline/.test(getComputedStyle(c).display); })) return;
      el.style.textWrap = 'wrap';
      var n = widths(el).length, lo = 0, hi = full, w, L;
      if (n < 2 || n > 3) { el.style.textWrap = ''; return; }
      while (hi - lo > 1) { w = (lo + hi) / 2; el.style.maxWidth = w + 'px'; if (widths(el).length > n) lo = w; else hi = w; }
      var best = 0, gap = Infinity;
      for (w = Math.ceil(hi); w <= full; w += 2) {
        el.style.maxWidth = w + 'px'; L = widths(el);
        // Each line no longer than the one above (within 10%, which reads as equal). Keep the most even width,
        // and prefer the first line longer: a last line longer than the first costs three times its overhang
        var score = Math.max.apply(null, L) - Math.min.apply(null, L) + Math.max(0, L[n - 1] - L[0]) * 3;
        if (L.length === n && L.every(function (x, i) { return !i || x <= L[i - 1] * 1.1 + 1; }) && score < gap) { gap = score; best = w; }
      }
      if (!best) { el.style.maxWidth = ''; el.style.textWrap = ''; return; }
      el.style.maxWidth = best + 'px';
      if (cs.textAlign === 'center' && cs.display === 'block') { el.style.marginLeft = 'auto'; el.style.marginRight = 'auto'; }
    }
    var queued = false, lastW = 0;
    function run() { queued = false; Array.prototype.forEach.call(root.querySelectorAll(SEL), fit); }
    function later() { if (!queued) { queued = true; requestAnimationFrame(run); } }
    later();
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(later);
    if (window.ResizeObserver) new ResizeObserver(function () { var w = root.getBoundingClientRect().width; if (Math.abs(w - lastW) > 0.5) { lastW = w; later(); } }).observe(root);
    if (window.MutationObserver) new MutationObserver(later).observe(root, { subtree: true, childList: true, characterData: true, attributes: true, attributeFilter: ['hidden'] });
  }

  function initShortcutReveal(root) {
    if (!root || root.__miShortcut) return;
    root.__miShortcut = true;
    evenLines(root);

    var items = Array.prototype.slice.call(root.querySelectorAll('[data-shortcut]')).map(function (b) {
      var c = parse(b.getAttribute('data-shortcut'));
      var kbd = b.querySelector('.sr-kbd');
      kbd.textContent = keycap(c);
      b.setAttribute('aria-keyshortcuts', ariaKeys(c));
      return { b: b, c: c, kbd: kbd, action: b.getAttribute('data-action'), name: b.getAttribute('data-name') || b.textContent.trim() };
    });
    var hint = root.querySelector('.sr-hint');
    var hold = root.querySelector('.sr-hold');
    var toast = root.querySelector('.sr-toast');
    var sel = root.querySelector('.sr-sel');

    var revealed = false;
    var everRevealed = false;
    var holdTimer = 0;
    var toastTimer = 0;
    var comboUsed = false;
    var onScreen = true;
    var pointer = null;
    var learned = {};
    var history = [];

    // ---------- hint ----------
    function setHint() {
      var n = Object.keys(learned).length;
      var kbd = document.createElement('kbd');
      kbd.textContent = MOD;
      if (n > 0) hint.replaceChildren('Learned ' + n + ' of ' + items.length + (items.length === 1 ? ' shortcut' : ' shortcuts'));
      else if (everRevealed) hint.replaceChildren('Keep holding ', kbd, ' and press a letter');
      else hint.replaceChildren('Hold ', kbd, ' to see every shortcut');
    }

    // ---------- reveal ----------
    function reveal(from) {
      if (revealed) return;
      revealed = true;
      var o = from || pointer;
      if (!o) { var r0 = items[0].b.getBoundingClientRect(); o = { x: r0.left, y: r0.top }; }
      items.forEach(function (it) {
        var r = it.b.getBoundingClientRect();
        var d = Math.hypot(r.left + r.width / 2 - o.x, r.top + r.height / 2 - o.y);
        it.kbd.style.setProperty('--sr-delay', (reduce.matches ? 0 : Math.min(260, Math.round(d * 0.6))) + 'ms');
      });
      layoutKeycaps();
      root.classList.add('is-revealed');
      if (!everRevealed) { everRevealed = true; setHint(); }
    }
    // Drop a keycap to a second row when it would collide with its neighbour.
    function layoutKeycaps() {
      var prevRight = -Infinity;
      var prevTop = null;
      var prevLow = false;
      items.forEach(function (it) {
        var r = it.b.getBoundingClientRect();
        var w = it.kbd.offsetWidth;
        var left = r.left + r.width / 2 - w / 2;
        var sameRow = prevTop !== null && Math.abs(r.top - prevTop) < 4;
        var low = sameRow && !prevLow && left < prevRight + 4;
        it.kbd.classList.toggle('is-low', low);
        if (!low) prevRight = left + w;
        prevLow = low;
        prevTop = r.top;
      });
    }
    function hide() {
      clearTimeout(holdTimer);
      if (!revealed) return;
      revealed = false;
      items.forEach(function (it) { it.kbd.style.setProperty('--sr-delay', '0ms'); });
      root.classList.remove('is-revealed');
    }

    // ---------- actions ----------
    function say(msg) {
      clearTimeout(toastTimer);
      toast.textContent = msg;
      toast.classList.add('is-open');
      toastTimer = setTimeout(function () { toast.classList.remove('is-open'); }, 1800);
    }
    function flash(b) {
      b.classList.remove('is-flash');
      void b.offsetWidth;
      b.classList.add('is-flash');
    }
    function toggleStyle(cls, action, record) {
      var on = !sel.classList.contains(cls);
      sel.classList.toggle(cls, on);
      var btn = root.querySelector('[data-action="' + action + '"]');
      btn.classList.toggle('is-on', on);
      btn.setAttribute('aria-pressed', on ? 'true' : 'false');
      if (record !== false) history.push(function () { toggleStyle(cls, action, false); });
      return on;
    }
    function perform(it) {
      switch (it.action) {
        case 'bold': return toggleStyle('is-bold', 'bold') ? 'Bold on' : 'Bold off';
        case 'italic': return toggleStyle('is-italic', 'italic') ? 'Italic on' : 'Italic off';
        case 'undo':
          if (!history.length) return 'Nothing to undo';
          history.pop()();
          return 'Undone';
        case 'search': return 'Search opened';
        case 'comment': return 'Comment added';
        case 'share': return 'Share settings opened';
        case 'publish': return 'Published';
        default: return it.name;
      }
    }
    function run(it, viaKeyboard) {
      flash(it.b);
      var msg = perform(it);
      if (viaKeyboard) {
        learned[it.action] = true;
        it.b.classList.add('is-learned');
        setHint();
        say(msg);
      } else {
        say(msg + ' · ' + keycap(it.c) + ' next time');
      }
    }

    items.forEach(function (it) {
      it.b.addEventListener('click', function () { run(it, false); });
    });

    // ---------- keyboard ----------
    function isModKey(e) { return isMac ? e.key === 'Meta' : e.key === 'Control'; }
    function modHeld(e) { return isMac ? e.metaKey : e.ctrlKey; }
    function typingElsewhere() {
      var a = document.activeElement;
      if (!a || root.contains(a)) return false;
      return a.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName);
    }

    document.addEventListener('keydown', function (e) {
      if (!onScreen || typingElsewhere()) return;
      if (isModKey(e)) {
        if (!e.repeat) {
          comboUsed = false;
          clearTimeout(holdTimer);
          holdTimer = setTimeout(function () { if (!comboUsed) reveal(); }, HOLD_MS);
        }
        return;
      }
      if (!modHeld(e) || MODIFIER_KEYS.indexOf(e.key) > -1) return;
      comboUsed = true; // a normal shortcut: don't flash the keycaps
      if (!revealed) clearTimeout(holdTimer);
      var key = e.key.toLowerCase();
      for (var i = 0; i < items.length; i++) {
        var c = items[i].c;
        if (c.mod && c.key === key && c.shift === e.shiftKey && c.alt === e.altKey) {
          e.preventDefault();
          run(items[i], true);
          return;
        }
      }
    });
    document.addEventListener('keyup', function (e) {
      if (isModKey(e) || !modHeld(e)) hide();
    });
    window.addEventListener('blur', hide);
    document.addEventListener('visibilitychange', function () { if (document.hidden) hide(); });

    // ---------- pointer + touch ----------
    root.addEventListener('pointermove', function (e) { pointer = { x: e.clientX, y: e.clientY }; });
    root.addEventListener('pointerleave', function () { pointer = null; });

    hold.addEventListener('pointerdown', function (e) {
      e.preventDefault();
      try { hold.setPointerCapture(e.pointerId); } catch (err) {}
      reveal({ x: e.clientX, y: e.clientY });
    });
    ['pointerup', 'pointercancel', 'lostpointercapture'].forEach(function (t) { hold.addEventListener(t, hide); });
    hold.addEventListener('contextmenu', function (e) { e.preventDefault(); });
    hold.addEventListener('keydown', function (e) {
      if ((e.key === ' ' || e.key === 'Enter') && !e.repeat) { e.preventDefault(); reveal(); }
    });
    hold.addEventListener('keyup', function (e) { if (e.key === ' ' || e.key === 'Enter') hide(); });

    // Only listen while the toolbar is on screen.
    if (window.IntersectionObserver) {
      new IntersectionObserver(function (entries) {
        onScreen = entries[0].isIntersecting;
        if (!onScreen) hide();
      }, { threshold: 0.2 }).observe(root);
    }

    setHint();
  }

  window.initShortcutReveal = initShortcutReveal;
  function boot() { document.querySelectorAll('[data-mi="shortcut-reveal"]').forEach(initShortcutReveal); }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();

</script>
</body>
</html>
