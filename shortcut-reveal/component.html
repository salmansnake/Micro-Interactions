<div class="sr" data-mi="shortcut-reveal">
  <div class="sr-toolbar" role="toolbar" aria-label="Editor actions">
    <div class="sr-group">
    <button type="button" class="sr-btn" data-shortcut="mod+k" data-action="search" data-name="Search" aria-label="Search">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5 14 14"/></svg>
      <span class="sr-text">Search</span><kbd class="sr-kbd" aria-hidden="true"></kbd>
    </button>
    </div>
    <div class="sr-group">
    <button type="button" class="sr-btn" data-shortcut="mod+b" data-action="bold" data-name="Bold" aria-label="Bold" aria-pressed="false">
      <span class="sr-glyph-b" aria-hidden="true">B</span><kbd class="sr-kbd" aria-hidden="true"></kbd>
    </button>
    <button type="button" class="sr-btn" data-shortcut="mod+i" data-action="italic" data-name="Italic" aria-label="Italic" aria-pressed="false">
      <span class="sr-glyph-i" aria-hidden="true">I</span><kbd class="sr-kbd" aria-hidden="true"></kbd>
    </button>
    <button type="button" class="sr-btn" data-shortcut="mod+shift+m" data-action="comment" data-name="Comment" aria-label="Comment">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 3.5h11v7h-6l-3 2.5v-2.5h-2z"/></svg>
      <kbd class="sr-kbd" aria-hidden="true"></kbd>
    </button>
    <button type="button" class="sr-btn" data-shortcut="mod+z" data-action="undo" data-name="Undo" aria-label="Undo">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5.5 4 2.5 7l3 3"/><path d="M2.5 7h7a4 4 0 0 1 0 8H8"/></svg>
      <kbd class="sr-kbd" aria-hidden="true"></kbd>
    </button>
    </div>
    <div class="sr-group">
    <button type="button" class="sr-btn" data-shortcut="mod+shift+s" data-action="share" data-name="Share" aria-label="Share">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 10V2.5M5 5.5l3-3 3 3"/><path d="M3 9v4.5h10V9"/></svg>
      <span class="sr-text">Share</span><kbd class="sr-kbd" aria-hidden="true"></kbd>
    </button>
    </div>
    <button type="button" class="sr-btn is-primary" data-shortcut="mod+enter" data-action="publish" data-name="Publish">
      Publish<kbd class="sr-kbd" aria-hidden="true"></kbd>
    </button>
  </div>
  <div class="sr-doc">
    <h4>Launch notes</h4>
    <p>We ship the new billing page on Monday. The <span class="sr-sel">annual plan</span> now shows its savings up front, and every invoice carries the workspace name.</p>
    <p>Add open questions as comments before Friday.</p>
  </div>
  <div class="sr-foot">
    <span class="sr-hint" aria-live="polite"></span>
    <button type="button" class="sr-hold">Hold to show shortcuts</button>
  </div>
  <div class="sr-toast" role="status"></div>
</div>
