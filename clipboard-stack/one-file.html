/* Dark mode: follows data-theme="dark" (or class "dark") on any ancestor, or the system setting. */
[data-theme="dark"] .cs, .dark .cs {

/* Clipboard Stack — copied text flies into a clipboard that keeps your recent copies.
   Outcraft Design System v2. Every value is an Outcraft token. */
.cs {
  --cs-bg: var(--card);
  --cs-fg: var(--foreground);
  --cs-muted: var(--muted-foreground);
  --cs-line: var(--border);
  --cs-sunken: var(--subtle);
  --cs-fill: var(--muted);
  --cs-accent: var(--primary);
  --cs-on-accent: var(--primary-foreground);
  --cs-green: var(--success-text);
  position: relative;
  display: flex;
  flex-direction: column;
  gap: 14px;
  width: 100%;
  max-width: 440px;
  box-sizing: border-box;
  padding: 20px;
  background: var(--cs-bg);
  color: var(--cs-fg);
  border-radius: var(--radius-xl);
  border: 1px solid var(--border);
  box-shadow: var(--shadow-sm);
  font: 400 var(--text-body)/var(--leading-body) var(--font-sans);
  letter-spacing: normal;
  text-align: left;
  -webkit-font-smoothing: antialiased;
}
.cs-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.cs-title { margin: 0; font-size: var(--text-title-sm); line-height: var(--leading-title-sm); font-weight: 600; letter-spacing: var(--tracking-title); }
.cs-dock-wrap { position: relative; }
.cs-dock {
  position: relative;
  display: grid;
  place-items: center;
  width: 44px;
  height: 44px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--cs-fill);
  color: var(--cs-fg);
  cursor: pointer;
  transition: transform var(--spring-press-duration) var(--spring-press);
}
.cs-dock svg { position: relative; z-index: 1; width: 22px; height: 22px; }
.cs-dock:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }
.cs-dock.is-hit { animation: cs-hit var(--spring-pop-duration) var(--spring-pop); }
@keyframes cs-hit { 30% { transform: scale(1.14); } 100% { transform: scale(1); } }
/* Paper slips peeking out of the clipboard, one per copy (up to three) */
.cs-cards { position: absolute; inset: 0; }
.cs-cards i {
  position: absolute;
  left: 50%;
  top: 7px;
  width: 15px;
  height: 18px;
  margin-left: -7.5px;
  border-radius: var(--radius-xs);
  background: var(--cs-bg);
  box-shadow: 0 0 0 1px var(--cs-line), var(--shadow-xs);
  opacity: 0;
  transform: translateY(4px) rotate(0deg);
  transition: transform var(--spring-ui-duration) var(--spring-ui), opacity var(--duration-base);
}
.cs[data-count="1"] .cs-cards i:nth-child(1),
.cs[data-count="2"] .cs-cards i:nth-child(-n+2),
.cs.is-many .cs-cards i { opacity: 1; }
.cs-cards i:nth-child(1) { transform: translate(-7px, -4px) rotate(-14deg); }
.cs-cards i:nth-child(2) { transform: translate(7px, -4px) rotate(12deg); }
.cs-cards i:nth-child(3) { transform: translate(0, -8px) rotate(-3deg); }
/* Centered on the capital height, not the line box (10b.5): the text is trimmed to cap height and centered */
.cs-badge {
  position: absolute;
  z-index: 2;
  top: -2px;
  right: -2px;
  display: block;
  align-content: center;
  text-align: center;
  text-box: trim-both cap alphabetic;
  min-width: 18px;
  height: 18px;
  box-sizing: border-box;
  padding: 0 5px;
  border-radius: var(--radius-full);
  background: var(--cs-accent);
  color: var(--cs-on-accent);
  font-size: calc(var(--text-caption) - 1px);
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  transform: scale(0);
  transition: transform var(--spring-pop-duration) var(--spring-pop);
}
.cs.has-items .cs-badge { transform: scale(1); }

/* Popover */
.cs-pop {
  position: absolute;
  z-index: 5;
  top: calc(100% + 8px);
  right: 0;
  width: 280px;
  max-width: calc(100vw - 48px);
  box-sizing: border-box;
  padding: 12px;
  border-radius: var(--radius-xl);
  background: var(--cs-bg);
  box-shadow: 0 0 0 1px var(--cs-line), var(--shadow-xl);
  transform-origin: top right;
  animation: cs-pop var(--spring-ui-duration) var(--spring-ui) both;
}
@keyframes cs-pop { from { opacity: 0; transform: scale(var(--press-scale-sm)); } }
.cs-pop { padding: 10px; }
.cs-pop:focus { outline: none; }
.cs-pop-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 0 2px 6px 6px; min-height: 28px; }
.cs-pop-title { margin: 0; color: var(--cs-muted); font-size: var(--text-small); font-weight: 600; }
.cs-clear { height: 28px; padding: 0 8px; border: 0; border-radius: var(--radius-sm); background: none; color: var(--cs-fg); font: 500 var(--text-caption)/1 var(--font-sans); cursor: pointer; transition: background-color var(--duration-fast); }
.cs-clear:hover { background: var(--cs-sunken); }
.cs-clear:focus-visible { outline: 2px solid var(--ring); outline-offset: 1px; }
.cs:not(.has-items) .cs-clear { display: none; }
.cs-pop-empty { margin: 2px 6px 4px; color: var(--cs-muted); font-size: var(--text-small); line-height: var(--leading-small); }
.cs.has-items .cs-pop-empty { display: none; }
.cs-list { display: flex; flex-direction: column; gap: 2px; margin: 0; padding: 0; list-style: none; }
.cs-list li { display: flex; align-items: center; gap: 2px; border-radius: var(--radius-md); }
.cs-list li:hover, .cs-list li:focus-within { background: var(--cs-sunken); }
.cs-again {
  display: flex;
  flex: 1;
  min-width: 0;
  flex-direction: column;
  gap: 0;
  padding: 6px 4px 6px 8px;
  border: 0;
  border-radius: var(--radius-md);
  background: none;
  color: var(--cs-fg);
  font: inherit;
  text-align: left;
  cursor: pointer;
}
.cs-again:focus-visible, .cs-x:focus-visible { outline: 2px solid var(--ring); outline-offset: -2px; }
.cs-list code { overflow: hidden; font: 500 var(--text-caption)/var(--leading-caption) var(--font-mono); text-overflow: ellipsis; white-space: nowrap; }
.cs-list small { overflow: hidden; color: var(--cs-muted); font-size: var(--text-caption); line-height: var(--leading-caption); text-overflow: ellipsis; white-space: nowrap; }
/* Remove one copy */
.cs-x { flex: none; display: grid; place-items: center; width: 28px; height: 28px; margin-right: 4px; padding: 0; border: 0; border-radius: var(--radius-sm); background: none; color: var(--cs-muted); cursor: pointer; transition: color var(--duration-fast), background-color var(--duration-fast); }
.cs-x svg { width: 14px; height: 14px; }
.cs-x:hover { color: var(--cs-fg); background: var(--cs-line); }
.cs-list li.is-out { animation: cs-out var(--duration-base) var(--ease-in) forwards; }
@keyframes cs-out { to { opacity: 0; transform: translateX(12px); } }
.cs-sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* Rows */
.cs-rows { display: flex; flex-direction: column; margin: 0; padding: 0; list-style: none; border-radius: var(--radius-lg); background: var(--cs-sunken); }
.cs-row { position: relative; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 12px 10px 14px; }
.cs-row + .cs-row::before { content: ""; position: absolute; top: 0; left: 14px; right: 0; height: 1px; background: var(--cs-line); transform: scaleY(0.5); transform-origin: top; }
.cs-row > div { min-width: 0; }
.cs-label { margin: 0; color: var(--cs-muted); font-size: var(--text-caption); line-height: var(--leading-caption); }
.cs-value { display: inline-flex; align-items: center; gap: 6px; font: 500 var(--text-ui)/var(--leading-ui) var(--font-mono); letter-spacing: 0; }
.cs-swatch { width: 12px; height: 12px; border-radius: var(--radius-xs); background: var(--aqua); }
.cs-copy {
  flex: none;
  min-width: 72px;
  height: 32px;
  padding: 0 14px;
  border: 0;
  border-radius: var(--radius-sm);
  background: var(--cs-bg);
  color: var(--cs-accent);
  font: inherit;
  font-weight: 600;
  cursor: pointer;
  transition: transform var(--spring-press-duration) var(--spring-press), color var(--duration-base);
}
.cs-copy:active { transform: scale(var(--press-scale)); }
.cs-copy:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }
/* Copied keeps the button's colors: the label changes and a check appears, centered on it */
.cs-copy { display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
.cs-copy.is-done, .cs-copy.is-done:active { transform: none; }
.cs-copy svg { flex: none; width: 14px; height: 14px; translate: 0 calc(100% / 48); }
/* The flying slip */
.cs-slip {
  position: absolute;
  z-index: 6;
  left: 0;
  top: 0;
  max-width: 180px;
  overflow: hidden;
  padding: 5px 10px;
  border-radius: var(--radius-md);
  background: var(--cs-bg);
  box-shadow: 0 0 0 1px var(--cs-line), var(--shadow-md);
  color: var(--cs-fg);
  font: 500 var(--text-caption)/var(--leading-caption) var(--font-mono);
  white-space: nowrap;
  text-overflow: ellipsis;
  pointer-events: none;
}
@media (prefers-reduced-motion: reduce) {
  .cs-dock.is-hit, .cs-pop, .cs-list li.is-out { animation: none; }
}
/* Multi-line text wraps evenly and never ends on one or two lonely words */
.cs :is(p, li, dd, dt, small, label, figcaption, h1, h2, h3, h4) { text-wrap: balance; }
.cs [hidden] { display: none !important; }

</style>

<div class="cs" data-mi="clipboard-stack">
  <div class="cs-head">

  <ul class="cs-rows">

<script>
/* Clipboard Stack — vanilla JS. Auto-initializes every [data-mi="clipboard-stack"].
   Any [data-copy] button inside the root copies its value. Call window.initClipboardStack(el) for later elements. */
(function () {
  'use strict';
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)');
  var KEEP = 5;

  function ago(t) {
    var s = Math.round((Date.now() - t) / 1000);
    if (s < 10) return 'Just now';
    if (s < 60) return s + ' seconds ago'; // never 1: under 10 seconds is "Just now"
    var m = Math.round(s / 60);
    return m + (m === 1 ? ' minute ago' : ' minutes ago');
  }

  function writeClipboard(text) {
    try { return navigator.clipboard.writeText(text).catch(function () {}); } catch (e) { return Promise.resolve(); }
  }

  // Even line breaks: text that wraps to two or three lines is narrowed until its lines are close in length,
  // with the first line the longest, so no line runs long while the next holds a word or two.
  function evenLines(root) {
    var SEL = 'p, li, dd, dt, small, label, figcaption, h1, h2, h3, h4';
    function widths(el) {
      var range = document.createRange(), rows = [];
      range.selectNodeContents(el);
      Array.prototype.forEach.call(range.getClientRects(), function (b) {
        if (!b.width) return;
        var row = rows.filter(function (x) { return Math.abs(x.t - b.top) < b.height / 2; })[0];
        if (row) { row.l = Math.min(row.l, b.left); row.r = Math.max(row.r, b.right); } else rows.push({ t: b.top, l: b.left, r: b.right });
      });
      return rows.sort(function (a, b) { return a.t - b.t; }).map(function (x) { return x.r - x.l; });
    }
    function fit(el) {
      el.style.maxWidth = ''; el.style.textWrap = '';
      var cs = getComputedStyle(el), full = el.getBoundingClientRect().width;
      if (!full || cs.whiteSpace === 'nowrap' || /flex|grid/.test(cs.display)) return;
      if (Array.prototype.some.call(el.children, function (c) { return !/^inline/.test(getComputedStyle(c).display); })) return;
      el.style.textWrap = 'wrap';
      var n = widths(el).length, lo = 0, hi = full, w, L;
      if (n < 2 || n > 3) { el.style.textWrap = ''; return; }
      while (hi - lo > 1) { w = (lo + hi) / 2; el.style.maxWidth = w + 'px'; if (widths(el).length > n) lo = w; else hi = w; }

    function run() { queued = false; Array.prototype.forEach.call(root.querySelectorAll(SEL), fit); }
    function later() { if (!queued) { queued = true; requestAnimationFrame(run); } }
    later();
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(later);
    if (window.ResizeObserver) new ResizeObserver(function () { var w = root.getBoundingClientRect().width; if (Math.abs(w - lastW) > 0.5) { lastW = w; later(); } }).observe(root);
    if (window.MutationObserver) new MutationObserver(later).observe(root, { subtree: true, childList: true, characterData: true, attributes: true, attributeFilter: ['hidden'] });
  }

  function initClipboardStack(root) {
    if (!root || root.__miClip) return;
    root.__miClip = true;
    evenLines(root);
    var dock = root.querySelector('.cs-dock');
    var badge = root.querySelector('.cs-badge');
    var pop = root.querySelector('.cs-pop');
    var list = root.querySelector('.cs-list');
    var clear = root.querySelector('.cs-clear');
    var sr = root.querySelector('.cs-sr');
    var X = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>';
    var stack = []; // newest first: { text, label, t }
    var COPIED = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>Copied';
    // Each copy button is as wide as its "Copied" state from the start, so confirming never resizes it
    root.querySelectorAll('.cs-copy').forEach(function (b) { var keep = b.innerHTML; b.innerHTML = COPIED; var w = parseFloat(getComputedStyle(b).width); b.innerHTML = keep; if (w) b.style.minWidth = Math.ceil(w) + 'px'; });

    function render() {
      root.setAttribute('data-count', String(Math.min(stack.length, 3)));
      root.classList.toggle('has-items', stack.length > 0);
      root.classList.toggle('is-many', stack.length >= 3);
      badge.textContent = stack.length;
      dock.setAttribute('aria-label', 'Recent copies, ' + stack.length + (stack.length === 1 ? ' item' : ' items'));
      list.replaceChildren();
      stack.forEach(function (item) {
        var li = document.createElement('li');
        var b = document.createElement('button');
        b.type = 'button';
        b.className = 'cs-again';
        var code = document.createElement('code'); code.textContent = item.text;
        var small = document.createElement('small'); small.textContent = item.label + ' · ' + ago(item.t);
        b.append(code, small);
        b.addEventListener('click', function () {
          writeClipboard(item.text);
          add(item.text, item.label, null);
          var top = list.querySelector('.cs-again');
          if (top) { top.querySelector('small').textContent = item.label + ' · Copied again'; top.focus(); }
        });
        var x = document.createElement('button');
        x.type = 'button';
        x.className = 'cs-x';
        x.setAttribute('aria-label', 'Remove ' + item.label);
        x.innerHTML = X;
        x.addEventListener('click', function () { remove(item.text, li); });
        li.append(b, x);
        list.appendChild(li);
      });
    }

    // Remove one copy: the count drops by one, the rest stay.
    function remove(text, li) {
      var i = stack.findIndex(function (s) { return s.text === text; });
      if (i < 0) return;
      var label = stack[i].label;
      function finish() {
        stack.splice(i, 1);
        render();
        var rest = list.querySelectorAll('.cs-x');
        (rest[Math.min(i, rest.length - 1)] || pop).focus();
        sr.textContent = label + ' removed';
      }
      if (reduce.matches) { finish(); return; }
      li.classList.add('is-out');
      setTimeout(finish, 180);
    }

    // Clear everything: the badge goes away and the paper slips fold back in.
    clear.addEventListener('click', function () {
      stack = [];
      render();
      pop.focus();
      sr.textContent = 'All copies cleared';
    });
    function add(text, label, from) {
      stack = stack.filter(function (s) { return s.text !== text; });
      stack.unshift({ text: text, label: label, t: Date.now() });
      stack = stack.slice(0, KEEP);
      if (!from || reduce.matches) { render(); bump(); return; }
      fly(text, from, function () { render(); bump(); });
    }

    function bump() {
      dock.classList.remove('is-hit');
      void dock.offsetWidth;
      dock.classList.add('is-hit');
    }

    function fly(text, from, done) {
      var o = root.getBoundingClientRect();
      var a = from.getBoundingClientRect();
      var b = dock.getBoundingClientRect();
      var slip = document.createElement('span');
      slip.className = 'cs-slip';
      slip.textContent = text;
      root.appendChild(slip);
      var sw = slip.offsetWidth, shh = slip.offsetHeight;
      var x0 = a.left + a.width / 2 - o.left - sw / 2, y0 = a.top + a.height / 2 - o.top - shh / 2;
      var x1 = b.left + b.width / 2 - o.left - sw / 2, y1 = b.top + b.height / 2 - o.top - shh / 2;
      var frames = [];
      for (var i = 0; i <= 12; i++) {
        var t = i / 12;
        var x = x0 + (x1 - x0) * t, y = y0 + (y1 - y0) * t - Math.sin(t * Math.PI) * 60;
        var s = t < 0.15 ? 0.8 + t / 0.15 * 0.2 : 1 - Math.max(0, t - 0.6) / 0.4 * 0.8;
        frames.push({ transform: 'translate(' + x.toFixed(1) + 'px,' + y.toFixed(1) + 'px) rotate(' + (-8 * Math.sin(t * Math.PI)).toFixed(1) + 'deg) scale(' + s.toFixed(3) + ')', opacity: t > 0.9 ? (1 - t) * 10 : 1 });
      }
      slip.animate(frames, { duration: 620, easing: 'cubic-bezier(.35,.1,.5,1)', fill: 'forwards' }).finished.then(function () { slip.remove(); done(); });
    }

    root.addEventListener('click', function (e) {
      var btn = e.target.closest('[data-copy]');
      if (!btn || !root.contains(btn)) return;
      var text = btn.getAttribute('data-copy');
      var row = btn.closest('.cs-row');
      var label = row && row.querySelector('.cs-label') ? row.querySelector('.cs-label').textContent : 'Copied';
      writeClipboard(text);
      add(text, label, btn);
      var old = btn.getAttribute('data-label') || btn.textContent;
      btn.setAttribute('data-label', old);
      btn.innerHTML = COPIED;
      btn.classList.add('is-done');
      setTimeout(function () { btn.textContent = old; btn.classList.remove('is-done'); }, 1400);
    });

    function setOpen(on) {
      pop.hidden = !on;
      dock.setAttribute('aria-expanded', on ? 'true' : 'false');
      if (on) { render(); var first = list.querySelector('.cs-again'); if (first) first.focus(); else pop.focus(); }
    }
    dock.addEventListener('click', function () { setOpen(pop.hidden); });
    root.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !pop.hidden) { setOpen(false); dock.focus(); } });
    document.addEventListener('pointerdown', function (e) {
      if (!pop.hidden && !pop.contains(e.target) && !dock.contains(e.target)) setOpen(false);
    });

    render();
  }

  window.initClipboardStack = initClipboardStack;
  function boot() { document.querySelectorAll('[data-mi="clipboard-stack"]').forEach(initClipboardStack); }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();

</script>
</body>
</html>
