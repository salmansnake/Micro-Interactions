<div class="sc" data-mi="spill-counter" data-limit="80">
  <label class="sc-label" for="sc-input">Release Headline</label>
  <div class="sc-field">
    <div class="sc-mirror" aria-hidden="true"></div>
    <textarea id="sc-input" class="sc-input" rows="2" spellcheck="false" aria-describedby="sc-status">Billing now shows yearly savings up front, beside every plan</textarea>
  </div>
  <div class="sc-foot">
    <p class="sc-status" id="sc-status" role="status" aria-live="polite"></p>
    <span class="sc-meter" aria-hidden="true">
      <svg viewBox="0 0 24 24"><circle class="sc-track" cx="12" cy="12" r="9"></circle><circle class="sc-ring" cx="12" cy="12" r="9"></circle></svg>
      <span class="sc-drip"></span>
    </span>
    <span class="sc-count" aria-hidden="true"></span>
    <button type="button" class="sc-trim" hidden>Trim</button>
    <button type="button" class="sc-post">Post</button>
  </div>
  <div class="sc-try"><span>Try</span><button type="button" class="sc-auto">Keep Typing for Me</button></div>
</div>
