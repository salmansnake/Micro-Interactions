<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spill Counter</title>
<style>
/* Demo page only. Remove this block when pasting into your own page. */
body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 48px 16px; box-sizing: border-box; background: #F3F2EE; }
@media (prefers-color-scheme: dark) { body { background: #0C0D0C; } }

<style>
@import url('https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap');

/* Outcraft Design System v2: the tokens this component uses, scoped to .sc so they never affect the rest of your page. */
.sc {
  --duration-base: 200ms;
  --duration-reduced: 120ms;
  --duration-slower: 480ms;
  --ease-out: cubic-bezier(0.22, 0.9, 0.24, 1);
  --font-sans: "Geist", system-ui, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --leading-body: 22px;
  --leading-small: 18px;
  --leading-title-sm: 24px;
  --press-scale: 0.97;
  --radius-lg: 12px;
  --radius-sm: 6px;
  --radius-xl: 16px;
  --radius-xs: 4px;
  --spring-pop: linear(0, 0.0413, 0.1464, 0.2895, 0.4487, 0.6073, 0.7529, 0.8776, 0.9776, 1.0517, 1.1013, 1.1292, 1.1394, 1.1357, 1.1225, 1.1033, 1.0813, 1.059, 1.0382, 1.0202, 1.0055, 0.9945, 0.9869, 0.9825, 0.9807, 0.9808, 0.9825, 0.985, 0.9881, 0.9912, 0.9941, 0.9967, 0.9989, 1.0005, 1.0017, 1.0024, 1.0027, 1.0027, 1.0025, 1.0022, 1);
  --spring-pop-duration: 680ms;
  --spring-press: linear(0, 0.0189, 0.0676, 0.1361, 0.2164, 0.3025, 0.3896, 0.4743, 0.5543, 0.628, 0.6945, 0.7535, 0.8049, 0.849, 0.8863, 0.9172, 0.9425, 0.9629, 0.9789, 0.9912, 1.0004, 1.0071, 1.0116, 1.0145, 1.016, 1.0166, 1.0164, 1.0156, 1.0146, 1.0133, 1.0118, 1.0104, 1.009, 1.0076, 1.0064, 1.0053, 1.0043, 1.0034, 1.0026, 1.002, 1);
  --spring-press-duration: 310ms;
  --text-body: 15px;
  --text-small: 13px;
  --text-title-sm: 17px;
  --tracking-title: -0.015em;
  --amber-9: #ffc53d;
  --aqua: #79EEEC;
  --aqua-700: #0B7573;
  --ash: #646A66;
  --black: #000000;
  --border: var(--line);
  --brand: var(--aqua);
  --card: var(--white);
  --danger: #ce2c31;
  --danger-soft: color-mix(in srgb, var(--danger) 16%, transparent);
  --danger-soft-foreground: #AC2529;
  --danger-text: #ca2b30;
  --foreground: var(--black);
  --input: var(--line-strong);
  --line: #DCDED9;
  --line-strong: #C6C9C3;
  --mist: #ECEBE6;
  --muted: var(--mist);
  --muted-foreground: var(--ash);
  --primary: var(--black);
  --primary-foreground: #ffffff;
  --red-11: #ce2c31;
  --ring: var(--aqua-700);
  --shadow-sm: 0 1px 2px rgba(17, 17, 16, 0.04), 0 1px 3px rgba(17, 17, 16, 0.07);
  --soft-ground: #F3F2EE;
  --subtle: var(--soft-ground);
  --tint-c: 0.4;
  --tint-l: 0.92;
  --warning: var(--amber-9);
  --white: #FFFFFF;
}
/* Dark mode: follows data-theme="dark" (or class "dark") on any ancestor, or the system setting. */
[data-theme="dark"] .sc, .dark .sc {
  --amber-9: #ffc53d;
  --aqua: #79EEEC;
  --aqua-700: #79EEEC;
  --ash: #A3A8A4;
  --black: #000000;
  --border: var(--line);
  --brand: var(--aqua);
  --card: var(--white);
  --danger: #d4373c;
  --danger-soft: color-mix(in srgb, var(--danger) 30%, transparent);
  --danger-soft-foreground: var(--red-11);
  --danger-text: var(--red-11);
  --foreground: #F3F2EE;
  --input: var(--line-strong);
  --line: #313432;
  --line-strong: #434744;
  --mist: #2B2E2D;
  --muted: var(--mist);
  --muted-foreground: var(--ash);
  --primary: var(--aqua);
  --primary-foreground: #000000;
  --red-11: #ff9592;
  --ring: var(--aqua);
  --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.4), 0 1px 3px rgba(0, 0, 0, 0.3);
  --soft-ground: #0C0D0C;
  --subtle: var(--soft-ground);
  --tint-c: 0.45;
  --tint-l: 0.32;
  --warning: var(--amber-9);
  --white: #161817;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]):not(.light) .sc {
    --amber-9: #ffc53d;
    --aqua: #79EEEC;
    --aqua-700: #79EEEC;
    --ash: #A3A8A4;
    --black: #000000;
    --border: var(--line);
    --brand: var(--aqua);
    --card: var(--white);
    --danger: #d4373c;
    --danger-soft: color-mix(in srgb, var(--danger) 30%, transparent);
    --danger-soft-foreground: var(--red-11);
    --danger-text: var(--red-11);
    --foreground: #F3F2EE;
    --input: var(--line-strong);
    --line: #313432;
    --line-strong: #434744;
    --mist: #2B2E2D;
    --muted: var(--mist);
    --muted-foreground: var(--ash);
    --primary: var(--aqua);
    --primary-foreground: #000000;
    --red-11: #ff9592;
    --ring: var(--aqua);
    --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.4), 0 1px 3px rgba(0, 0, 0, 0.3);
    --soft-ground: #0C0D0C;
    --subtle: var(--soft-ground);
    --tint-c: 0.45;
    --tint-l: 0.32;
    --warning: var(--amber-9);
    --white: #161817;
  }
}

/* Spill Counter — characters past the limit spill off the line instead of a red number.
   Outcraft Design System v2. Every value is an Outcraft token. */
.sc {
  --sc-bg: var(--card);
  --sc-fg: var(--foreground);
  --sc-muted: var(--muted-foreground);
  --sc-line: var(--border);
  --sc-sunken: var(--subtle);
  --sc-fill: var(--muted);
  --sc-accent: var(--primary);
  --sc-on-accent: var(--primary-foreground);
  --sc-warn: var(--warning);
  --sc-danger: var(--danger);
  --sc-danger-text: var(--danger-text);
  --sc-danger-soft: oklch(from var(--danger) var(--tint-l) calc(c * var(--tint-c)) h);
  --sc-tone: var(--sc-accent);
  display: flex;
  flex-direction: column;
  gap: 8px;
  width: 100%;
  max-width: 440px;
  box-sizing: border-box;
  padding: 20px;
  background: var(--sc-bg);
  color: var(--sc-fg);
  border-radius: var(--radius-xl);
  border: 1px solid var(--border);
  box-shadow: var(--shadow-sm);
  font: 400 var(--text-body)/var(--leading-body) var(--font-sans);
  letter-spacing: normal;
  text-align: left;
  -webkit-font-smoothing: antialiased;
}
.sc.is-warn { --sc-tone: var(--sc-warn); }
.sc.is-over { --sc-tone: var(--sc-danger); }
.sc-label { padding-left: 4px; color: var(--sc-muted); font-size: var(--text-small); line-height: var(--leading-small); letter-spacing: normal; }
.sc-field { position: relative; border-radius: var(--radius-lg); background: var(--card); border: 1px solid var(--input); transition: box-shadow var(--duration-base) var(--ease-out); }
.sc-field:focus-within { border-color: var(--ring); box-shadow: 0 0 0 3px color-mix(in srgb, var(--ring) 22%, transparent); }
.sc.is-over .sc-field { box-shadow: 0 0 0 2px var(--sc-danger); }
/* The mirror and the textarea share every metric so characters line up exactly */
.sc-mirror,
.sc-input {
  display: block;
  width: 100%;
  box-sizing: border-box;
  margin: 0;
  padding: 12px 14px 14px;
  border: 0;
  font: 400 var(--text-title-sm)/var(--leading-title-sm) var(--font-sans);
  letter-spacing: var(--tracking-title);
  white-space: pre-wrap;
  overflow-wrap: break-word;
  word-break: normal;
  tab-size: 4;
}
.sc-mirror { position: absolute; inset: 0; overflow: visible; color: var(--sc-fg); pointer-events: none; }
.sc-input {
  position: relative;
  z-index: 1;
  min-height: 80px;
  overflow: hidden;
  resize: none;
  background: transparent;
  color: transparent;
  caret-color: var(--sc-fg);
  outline: none;
}
.sc-input::selection { background: color-mix(in srgb, var(--brand) 28%, transparent); color: transparent; }
/* Characters past the limit: on every line, each hangs a little lower than the last (the script sets top, 1px to 9px across the line) */
.sc-x {
  position: relative;
  border-radius: var(--radius-xs);
  background: var(--sc-danger-soft);
  color: var(--sc-danger-text);
}
.sc-x.is-new { animation: sc-drop var(--spring-pop-duration) var(--spring-pop) both; }
@keyframes sc-drop { from { top: -10px; opacity: 0; } }
.sc-x.is-falling { animation: sc-fall var(--duration-slower) cubic-bezier(0.5, 0, 0.9, 0.5) forwards; animation-delay: var(--sc-d, 0ms); }
@keyframes sc-fall { to { top: 34px; opacity: 0; } }

.sc-foot { display: flex; align-items: center; justify-content: flex-end; gap: 10px; }
/* The message sits on its own line right under the field; the ring, Trim and Post follow in one row */
.sc-status { margin: 0; padding-left: 4px; color: var(--sc-muted); font-size: var(--text-small); line-height: var(--leading-small); letter-spacing: normal; }
/* Nothing to say yet, so no space: it stays a live region but leaves the layout until text arrives */
.sc-status:empty { position: absolute; width: 1px; height: 1px; min-height: 0; margin: 0; padding: 0; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
/* The ring and its number are one tight pair */
.sc-gauge { display: flex; align-items: center; gap: 6px; margin-right: 4px; }
.sc.is-over .sc-status { color: var(--sc-danger-text); font-weight: 500; }
.sc-meter { position: relative; flex: none; width: 24px; height: 24px; }
.sc-meter svg { display: block; width: 24px; height: 24px; transform: rotate(-90deg); }
.sc-track { fill: none; stroke: var(--sc-fill); stroke-width: 2.5; }
.sc-ring {
  fill: none;
  stroke: var(--sc-tone);
  stroke-width: 2.5;
  stroke-linecap: round;
  stroke-dasharray: 56.55;
  stroke-dashoffset: 56.55;
  transition: stroke-dashoffset var(--spring-press-duration) var(--spring-press), stroke var(--duration-base);
}
.sc-drip {
  position: absolute;
  left: 50%;
  top: 19px;
  width: 6px;
  height: 8px;
  margin-left: -3px;
  border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
  background: var(--sc-danger);
  opacity: 0;
}
.sc.is-over .sc-drip { animation: sc-drip 1.4s cubic-bezier(0.5, 0, 1, 0.6) infinite; }
@keyframes sc-drip {
  0% { transform: translateY(-6px) scale(0.3); opacity: 0; }
  25% { transform: translateY(-2px) scale(1); opacity: 1; }
  100% { transform: translateY(14px) scale(0.8); opacity: 0; }
}
.sc-count { flex: none; color: var(--sc-tone); font-size: var(--text-small); font-weight: 600; font-variant-numeric: tabular-nums; }
.sc-count:empty { display: none; }
.sc-trim,
.sc-post,
.sc-try button {
  flex: none;
  height: 32px;
  padding: 0 14px;
  border: 0;
  border-radius: var(--radius-sm);
  font: inherit;
  font-weight: 600;
  cursor: pointer;
  transition: transform var(--spring-press-duration) var(--spring-press), opacity var(--duration-base), background-color var(--duration-base);
}
.sc-trim { background: var(--danger-soft); color: var(--danger-soft-foreground); }
.sc-post { background: var(--sc-accent); color: var(--sc-on-accent); }
.sc-post:disabled { opacity: 0.35; cursor: default; }
.sc-trim:active, .sc-post:active, .sc-try button:active { transform: scale(var(--press-scale)); }
.sc-trim:focus-visible, .sc-post:focus-visible, .sc-try button:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }
.sc-try { display: flex; align-items: center; gap: 8px; margin-top: 6px; padding-top: 14px; border-top: 1px solid var(--sc-line); color: var(--sc-muted); font-size: var(--text-small); }
.sc-try button { height: 28px; padding: 0 12px; background: var(--sc-fill); color: var(--sc-fg); font-weight: 400; }
.sc-try button:disabled { opacity: 0.4; cursor: default; }
@media (prefers-reduced-motion: reduce) {
  .sc-x.is-new, .sc-x.is-falling, .sc.is-over .sc-drip { animation: none; }
  .sc-ring { transition-duration: var(--duration-reduced); }
}
/* Multi-line text wraps evenly and never ends on one or two lonely words */
.sc :is(p, li, dd, dt, small, label, figcaption, h1, h2, h3, h4) { text-wrap: balance; }
.sc [hidden] { display: none !important; }

</style>
</head>
<body>

<div class="sc" data-mi="spill-counter" data-limit="80">
  <label class="sc-label" for="sc-input">Release Headline</label>
  <div class="sc-field">
    <div class="sc-mirror" aria-hidden="true"></div>
    <textarea id="sc-input" class="sc-input" rows="2" spellcheck="false" aria-describedby="sc-status">Billing now shows yearly savings up front, beside every plan</textarea>
  </div>
  <p class="sc-status" id="sc-status" role="status" aria-live="polite"></p>
  <div class="sc-foot">
    <span class="sc-gauge" aria-hidden="true">
      <span class="sc-meter">
        <svg viewBox="0 0 24 24"><circle class="sc-track" cx="12" cy="12" r="9"></circle><circle class="sc-ring" cx="12" cy="12" r="9"></circle></svg>
        <span class="sc-drip"></span>
      </span>
      <span class="sc-count"></span>
    </span>
    <button type="button" class="sc-trim" hidden>Trim</button>
    <button type="button" class="sc-post">Post</button>
  </div>
  <div class="sc-try"><span>Try</span><button type="button" class="sc-auto">Keep Typing for Me</button></div>
</div>


<script>
/* Spill Counter — vanilla JS. Auto-initializes every [data-mi="spill-counter"].
   Call window.initSpillCounter(el) for elements added later. */
(function () {
  'use strict';
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)');
  var RING = 56.55; // 2πr for r = 9
  var MORE = ' and inside every invoice we send to customers each month';

  // Even line breaks: text that wraps to two or three lines is narrowed until its lines are close in length,
  // with the first line the longest, so no line runs long while the next holds a word or two.
  function evenLines(root) {
    var SEL = 'p, li, dd, dt, small, label, figcaption, h1, h2, h3, h4';
    function widths(el) {
      var range = document.createRange(), rows = [];
      range.selectNodeContents(el);
      Array.prototype.forEach.call(range.getClientRects(), function (b) {
        if (!b.width) return;
        var row = rows.filter(function (x) { return Math.abs(x.t - b.top) < b.height / 2; })[0];
        if (row) { row.l = Math.min(row.l, b.left); row.r = Math.max(row.r, b.right); } else rows.push({ t: b.top, l: b.left, r: b.right });
      });
      return rows.sort(function (a, b) { return a.t - b.t; }).map(function (x) { return x.r - x.l; });
    }
    function fit(el) {
      el.style.maxWidth = ''; el.style.textWrap = '';
      var cs = getComputedStyle(el), full = el.getBoundingClientRect().width;
      if (!full || cs.whiteSpace === 'nowrap' || /flex|grid/.test(cs.display)) return;
      if (Array.prototype.some.call(el.children, function (c) { return !/^inline/.test(getComputedStyle(c).display); })) return;
      el.style.textWrap = 'wrap';
      var n = widths(el).length, lo = 0, hi = full, w, L;
      if (n < 2 || n > 3) { el.style.textWrap = ''; return; }
      while (hi - lo > 1) { w = (lo + hi) / 2; el.style.maxWidth = w + 'px'; if (widths(el).length > n) lo = w; else hi = w; }
      var best = 0, gap = Infinity;
      for (w = Math.ceil(hi); w <= full; w += 2) {
        el.style.maxWidth = w + 'px'; L = widths(el);
        // Each line no longer than the one above (within 10%, which reads as equal). Keep the most even width,
        // and prefer the first line longer: a last line longer than the first costs three times its overhang
        var score = Math.max.apply(null, L) - Math.min.apply(null, L) + Math.max(0, L[n - 1] - L[0]) * 3;
        if (L.length === n && L.every(function (x, i) { return !i || x <= L[i - 1] * 1.1 + 1; }) && score < gap) { gap = score; best = w; }
      }
      if (!best) { el.style.maxWidth = ''; el.style.textWrap = ''; return; }
      el.style.maxWidth = best + 'px';
      if (cs.textAlign === 'center' && cs.display === 'block') { el.style.marginLeft = 'auto'; el.style.marginRight = 'auto'; }
    }
    var queued = false, lastW = 0;
    function run() { queued = false; Array.prototype.forEach.call(root.querySelectorAll(SEL), fit); }
    function later() { if (!queued) { queued = true; requestAnimationFrame(run); } }
    later();
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(later);
    if (window.ResizeObserver) new ResizeObserver(function () { var w = root.getBoundingClientRect().width; if (Math.abs(w - lastW) > 0.5) { lastW = w; later(); } }).observe(root);
    if (window.MutationObserver) new MutationObserver(later).observe(root, { subtree: true, childList: true, characterData: true, attributes: true, attributeFilter: ['hidden'] });
  }

  function initSpillCounter(root) {
    if (!root || root.__miSpill) return;
    root.__miSpill = true;
    evenLines(root);

    var limit = Number(root.getAttribute('data-limit')) || 80;
    var input = root.querySelector('.sc-input');
    var mirror = root.querySelector('.sc-mirror');
    var ring = root.querySelector('.sc-ring');
    var count = root.querySelector('.sc-count');
    var status = root.querySelector('.sc-status');
    var trim = root.querySelector('.sc-trim');
    var post = root.querySelector('.sc-post');
    var auto = root.querySelector('.sc-auto');
    var lastLen = input.value.length;
    var trimming = false;
    var typing = 0;

    function grow() {
      input.style.height = 'auto';
      input.style.height = input.scrollHeight + 'px';
    }

    // Rebuild the mirror. Characters from `fresh` onwards drop in.
    function render(fresh) {
      var v = input.value;
      mirror.textContent = '';
      mirror.appendChild(document.createTextNode(v.slice(0, limit)));
      var extra = v.slice(limit);
      for (var i = 0; i < extra.length; i++) {
        var s = document.createElement('span');
        s.className = 'sc-x';
        s.textContent = extra[i];
        if (!reduce.matches && limit + i >= fresh) s.classList.add('is-new');
        mirror.appendChild(s);
      }
      mirror.appendChild(document.createTextNode('​')); // keeps a trailing newline's height
      grow();
      slope();
      update(v.length);
    }

    // Every line of spilled characters slopes down, from 1px where it starts to 9px at the right edge,
    // so each new line keeps spilling instead of going flat. Measure at rest, then offset.
    function slope() {
      var spans = mirror.querySelectorAll('.sc-x');
      if (!spans.length) return;
      var cs = getComputedStyle(mirror);
      var right = mirror.clientWidth - parseFloat(cs.paddingRight);
      var pos = [];
      spans.forEach(function (s) { s.style.top = '0px'; });
      spans.forEach(function (s) { pos.push([s.offsetTop, s.offsetLeft]); });
      var lineTop = null, start = 0;
      spans.forEach(function (s, i) {
        if (pos[i][0] !== lineTop) { lineTop = pos[i][0]; start = pos[i][1]; }
        var t = right > start ? (pos[i][1] - start) / (right - start) : 0;
        s.style.top = (1 + 8 * Math.max(0, Math.min(1, t))).toFixed(2) + 'px';
      });
    }

    function update(len) {
      var left = limit - len;
      var over = left < 0;
      root.classList.toggle('is-over', over);
      root.classList.toggle('is-warn', !over && left <= 10);
      ring.style.strokeDashoffset = (RING * (1 - Math.min(len / limit, 1))).toFixed(2);
      count.textContent = left <= 20 ? String(left) : '';
      trim.hidden = !over;
      if (over) trim.textContent = 'Trim ' + -left + (left === -1 ? ' Character' : ' Characters');
      post.disabled = over || len === 0 || trimming;
      if (over) status.textContent = -left + (left === -1 ? ' character' : ' characters') + ' over the limit.';
      else if (left <= 10) status.textContent = left + (left === 1 ? ' character' : ' characters') + ' left.';
      else status.textContent = '';
    }

    input.addEventListener('input', function () {
      var len = input.value.length;
      render(len > lastLen ? Math.max(limit, input.selectionStart - (len - lastLen)) : Infinity);
      lastLen = len;
    });

    trim.addEventListener('click', function () {
      if (trimming) return;
      var spans = mirror.querySelectorAll('.sc-x');
      var finish = function () {
        input.value = input.value.slice(0, limit);
        lastLen = input.value.length;
        trimming = false;
        render(Infinity);
        status.textContent = 'Trimmed to ' + limit + (limit === 1 ? ' character.' : ' characters.');
        input.focus();
        input.setSelectionRange(limit, limit);
      };
      if (reduce.matches || !spans.length) { finish(); return; }
      trimming = true;
      post.disabled = true;
      Array.prototype.forEach.call(spans, function (s, i) {
        s.classList.remove('is-new');
        s.style.setProperty('--sc-d', Math.min((spans.length - 1 - i) * 14, 320) + 'ms');
        s.classList.add('is-falling');
      });
      setTimeout(finish, Math.min((spans.length - 1) * 14, 320) + 440);
    });

    post.addEventListener('click', function () {
      if (post.disabled) return;
      status.textContent = 'Posted.';
    });

    if (auto) {
      auto.addEventListener('click', function () {
        if (typing) return;
        var i = 0;
        auto.disabled = true;
        typing = setInterval(function () {
          if (i >= MORE.length) { clearInterval(typing); typing = 0; auto.disabled = false; return; }
          input.value += MORE[i++];
          var len = input.value.length;
          render(len - 1);
          lastLen = len;
        }, reduce.matches ? 5 : 40);
      });
    }

    if (window.ResizeObserver) new ResizeObserver(function () { grow(); slope(); }).observe(root);
    render(Infinity);
  }

  window.initSpillCounter = initSpillCounter;
  function boot() { document.querySelectorAll('[data-mi="spill-counter"]').forEach(initSpillCounter); }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();

</script>
</body>
