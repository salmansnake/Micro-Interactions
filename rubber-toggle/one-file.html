<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rubber Toggle</title>
<style>
/* Demo page only. Remove this block when pasting into your own page. */
body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 48px 16px; box-sizing: border-box; background: #EBEBEB; }
@media (prefers-color-scheme: dark) { body { background: #0C0C0C; } }
</style>
<style>
@import url('https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap');

/* Outcraft Design System v2: the tokens this component uses, scoped to .rtg so they never affect the rest of your page. */
.rtg {
  --duration-base: 200ms;
  --duration-reduced: 120ms;
  --duration-slow: 320ms;
  --ease-out: cubic-bezier(0.22, 0.9, 0.24, 1);
  --font-sans: "Geist", system-ui, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --leading-body: 22px;
  --leading-small: 18px;
  --leading-ui: 20px;
  --radius-full: 9999px;
  --radius-xl: 16px;
  --spring-pop: linear(0, 0.0413, 0.1464, 0.2895, 0.4487, 0.6073, 0.7529, 0.8776, 0.9776, 1.0517, 1.1013, 1.1292, 1.1394, 1.1357, 1.1225, 1.1033, 1.0813, 1.059, 1.0382, 1.0202, 1.0055, 0.9945, 0.9869, 0.9825, 0.9807, 0.9808, 0.9825, 0.985, 0.9881, 0.9912, 0.9941, 0.9967, 0.9989, 1.0005, 1.0017, 1.0024, 1.0027, 1.0027, 1.0025, 1.0022, 1);
  --spring-pop-duration: 680ms;
  --text-body: 15px;
  --text-small: 13px;
  --text-ui: 14px;
  --aqua: #79EEEC;
  --aqua-700: #0B7573;
  --ash: #686868;
  --black: #000000;
  --border: var(--line);
  --card: var(--white);
  --foreground: var(--black);
  --lift: #FFFFFF;
  --line: #DDDDDD;
  --mist: #EBEBEB;
  --muted: var(--mist);
  --muted-foreground: var(--ash);
  --raised: var(--lift);
  --ring: var(--aqua-700);
  --shadow-sm: 0 1px 2px rgba(17, 17, 17, 0.04), 0 1px 3px rgba(17, 17, 17, 0.07);
  --switch-on: var(--black);
  --white: #FFFFFF;
}
/* Dark mode: follows data-theme="dark" (or class "dark") on any ancestor, or the system setting. */
[data-theme="dark"] .rtg, .dark .rtg {
  --aqua: #79EEEC;
  --aqua-700: #79EEEC;
  --ash: #A6A6A6;
  --black: #000000;
  --border: var(--line);
  --card: var(--white);
  --foreground: #F2F2F2;
  --lift: #424242;
  --line: #333333;
  --mist: #2D2D2D;
  --muted: var(--mist);
  --muted-foreground: var(--ash);
  --raised: var(--lift);
  --ring: var(--aqua);
  --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.4), 0 1px 3px rgba(0, 0, 0, 0.3);
  --switch-on: var(--aqua);
  --white: #171717;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]):not(.light) .rtg {
    --aqua: #79EEEC;
    --aqua-700: #79EEEC;
    --ash: #A6A6A6;
    --black: #000000;
    --border: var(--line);
    --card: var(--white);
    --foreground: #F2F2F2;
    --lift: #424242;
    --line: #333333;
    --mist: #2D2D2D;
    --muted: var(--mist);
    --muted-foreground: var(--ash);
    --raised: var(--lift);
    --ring: var(--aqua);
    --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.4), 0 1px 3px rgba(0, 0, 0, 0.3);
    --switch-on: var(--aqua);
    --white: #171717;
  }
}

/* Rubber Toggle — switches whose knobs stretch like rubber when you drag them, and snap back with a wobble.
   Outcraft Design System v2. Every value is an Outcraft token. */
.rtg {
  --rtg-bg: var(--card);
  --rtg-fg: var(--foreground);
  --rtg-muted: var(--muted-foreground);
  --rtg-track: var(--muted);
  --rtg-on: var(--switch-on);
  --rtg-off-dot: var(--raised);
  --rtg-on-dot: var(--card);
  display: flex;
  flex-direction: column;
  gap: 12px;
  width: 100%;
  max-width: 380px;
  box-sizing: border-box;
  padding: 20px;
  background: var(--rtg-bg);
  color: var(--rtg-fg);
  border-radius: var(--radius-xl);
  border: 1px solid var(--border);
  box-shadow: var(--shadow-sm);
  font: 400 var(--text-body)/var(--leading-body) var(--font-sans);
  letter-spacing: normal;
  text-align: left;
  -webkit-font-smoothing: antialiased;
}
.rtg p, .rtg ul { margin: 0; }
.rtg-title b { display: block; font-weight: 600; text-box: trim-start cap alphabetic; }
.rtg-title small { display: block; margin-top: 2px; color: var(--rtg-muted); font-size: var(--text-small); line-height: var(--leading-small); }
.rtg-list { padding: 0; list-style: none; }
.rtg-list li { position: relative; display: flex; align-items: center; gap: 16px; padding: 10px 0; }
.rtg-list li + li::before { content: ""; position: absolute; top: 0; left: 0; right: 0; height: 1px; background: var(--border); }
.rtg-list li:last-child { padding-bottom: 0; }
.rtg-text { flex: 1; min-width: 0; }
.rtg-text b { display: block; font-size: var(--text-ui); line-height: var(--leading-ui); font-weight: 600; }
.rtg-text small { display: block; margin-top: 2px; color: var(--rtg-muted); font-size: var(--text-small); line-height: var(--leading-small); }

/* The switch: a 52 × 32 track in a 44px hit area. The knob moves by --rtg-x and stretches by --rtg-s */
.rtg-switch { --rtg-x: 0px; --rtg-s: 1; position: relative; flex: none; width: 52px; height: 32px; margin: 6px 0; padding: 0; border: 0; border-radius: var(--radius-full); background: var(--rtg-track); cursor: grab; touch-action: none; transition: background-color var(--duration-base); }
.rtg-switch::after { content: ""; position: absolute; inset: -6px 0; }
.rtg-switch[aria-checked="true"] { background: var(--rtg-on); }
.rtg-switch:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }
.rtg-knob { position: absolute; left: 3px; top: 3px; width: 26px; height: 26px; border-radius: var(--radius-full); background: var(--rtg-off-dot); box-shadow: var(--shadow-sm); transform: translateX(var(--rtg-x)) scaleX(var(--rtg-s)); transform-origin: var(--rtg-o, 0 50%); transition: transform var(--spring-pop-duration) var(--spring-pop), background-color var(--duration-base); pointer-events: none; }
.rtg-switch[aria-checked="true"] .rtg-knob { background: var(--rtg-on-dot); }
.rtg-switch.is-dragging { cursor: grabbing; }
.rtg-switch.is-dragging .rtg-knob { transition: background-color var(--duration-base); }
/* A tap squishes the knob before it travels */
.rtg-switch.is-squish .rtg-knob { animation: rtg-squish var(--duration-slow) var(--ease-out); }
@keyframes rtg-squish { 30% { scale: 1.25 0.88; } }

@media (prefers-reduced-motion: reduce) {
  .rtg-knob { transition-duration: var(--duration-reduced); transition-timing-function: var(--ease-out); }
  .rtg-switch.is-squish .rtg-knob { animation: none; }
}
/* Multi-line text wraps evenly and never ends on one or two lonely words */
.rtg :is(p, li, dd, dt, small, label, figcaption, h1, h2, h3, h4) { text-wrap: balance; }
.rtg [hidden] { display: none !important; }

</style>
</head>
<body>

<div class="rtg" data-mi="rubber-toggle">
  <p class="rtg-title"><b>Notifications</b><small>Tap a switch, or drag its knob past the end.</small></p>
  <ul class="rtg-list">
    <li><p class="rtg-text"><b>Mentions</b><small>When someone tags you</small></p><button type="button" class="rtg-switch" role="switch" aria-checked="true" aria-label="Mentions"><span class="rtg-knob"></span></button></li>
    <li><p class="rtg-text"><b>Weekly digest</b><small>Every Monday at 9:00 AM</small></p><button type="button" class="rtg-switch" role="switch" aria-checked="false" aria-label="Weekly digest"><span class="rtg-knob"></span></button></li>
    <li><p class="rtg-text"><b>Product news</b><small>A few times a year</small></p><button type="button" class="rtg-switch" role="switch" aria-checked="false" aria-label="Product news"><span class="rtg-knob"></span></button></li>
  </ul>
</div>


<script>
/* Rubber Toggle — vanilla JS. Auto-initializes every [data-mi="rubber-toggle"].
   Drag a knob and it follows; drag past either end and it stretches like rubber (up to 1.5×, more slowly the further
   you go). Let go and it snaps to the nearer side on the pop spring. A tap squishes it, then flips it.
   Call window.initRubberToggle(el) for elements added later. */
(function () {
  'use strict';
  var TRAVEL = 20; // 52px track, 26px knob, 3px inset each side

  // Even line breaks: text that wraps to two or three lines is narrowed until its lines are close in length,
  // with the first line the longest, so no line runs long while the next holds a word or two.
  function evenLines(root) {
    var SEL = 'p, li, dd, dt, small, label, figcaption, h1, h2, h3, h4';
    function widths(el) {
      var range = document.createRange(), rows = [];
      range.selectNodeContents(el);
      Array.prototype.forEach.call(range.getClientRects(), function (b) {
        if (!b.width) return;
        var row = rows.filter(function (x) { return Math.abs(x.t - b.top) < b.height / 2; })[0];
        if (row) { row.l = Math.min(row.l, b.left); row.r = Math.max(row.r, b.right); } else rows.push({ t: b.top, l: b.left, r: b.right });
      });
      return rows.sort(function (a, b) { return a.t - b.t; }).map(function (x) { return x.r - x.l; });
    }
    function fit(el) {
      el.style.maxWidth = ''; el.style.textWrap = '';
      // A filled box marked data-fill spans the card from edge to edge, and its text fills it
      if (el.hasAttribute('data-fill')) return;
      var cs = getComputedStyle(el), full = el.getBoundingClientRect().width;
      if (!full || cs.whiteSpace === 'nowrap' || /flex|grid/.test(cs.display)) return;
      if (Array.prototype.some.call(el.children, function (c) { return !/^inline/.test(getComputedStyle(c).display); })) return;
      el.style.textWrap = 'wrap';
      var n = widths(el).length, lo = 0, hi = full, w, L;
      if (n < 2 || n > 3) { el.style.textWrap = ''; return; }
      while (hi - lo > 1) { w = (lo + hi) / 2; el.style.maxWidth = w + 'px'; if (widths(el).length > n) lo = w; else hi = w; }
      var best = 0, gap = Infinity;
      for (w = Math.ceil(hi); w <= full; w += 2) {
        el.style.maxWidth = w + 'px'; L = widths(el);
        // Each line no longer than the one above (within 10%, which reads as equal). Keep the most even width,
        // and prefer the first line longer: a last line longer than the first costs three times its overhang
        var score = Math.max.apply(null, L) - Math.min.apply(null, L) + Math.max(0, L[n - 1] - L[0]) * 3;
        if (L.length === n && L.every(function (x, i) { return !i || x <= L[i - 1] * 1.1 + 1; }) && score < gap) { gap = score; best = w; }
      }
      if (!best) { el.style.maxWidth = ''; el.style.textWrap = ''; return; }
      el.style.maxWidth = best + 'px';
      if (cs.textAlign === 'center' && cs.display === 'block') { el.style.marginLeft = 'auto'; el.style.marginRight = 'auto'; }
    }
    var queued = false, lastW = 0;
    function run() { queued = false; Array.prototype.forEach.call(root.querySelectorAll(SEL), fit); }
    function later() { if (!queued) { queued = true; requestAnimationFrame(run); } }
    later();
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(later);
    if (window.ResizeObserver) new ResizeObserver(function () { var w = root.getBoundingClientRect().width; if (Math.abs(w - lastW) > 0.5) { lastW = w; later(); } }).observe(root);
    if (window.MutationObserver) new MutationObserver(later).observe(root, { subtree: true, childList: true, characterData: true, attributes: true, attributeFilter: ['hidden'] });
  }

  function initRubberToggle(root) {
    if (!root || root.__miRtg) return;
    root.__miRtg = true;
    evenLines(root);

    root.querySelectorAll('.rtg-switch').forEach(function (sw) {
      var start = 0, base = 0, moved = false, down = false;
      function on() { return sw.getAttribute('aria-checked') === 'true'; }
      function rest() { sw.style.setProperty('--rtg-x', (on() ? TRAVEL : 0) + 'px'); sw.style.setProperty('--rtg-s', 1); }
      function flip(v) { sw.setAttribute('aria-checked', v ? 'true' : 'false'); rest(); }

      sw.addEventListener('pointerdown', function (e) {
        down = true; moved = false; start = e.clientX; base = on() ? TRAVEL : 0;
        sw.setPointerCapture(e.pointerId);
      });
      sw.addEventListener('pointermove', function (e) {
        if (!down) return;
        var dx = e.clientX - start;
        if (!moved && Math.abs(dx) < 3) return;
        moved = true; sw.classList.add('is-dragging');
        var x = base + dx, over = x < 0 ? -x : Math.max(0, x - TRAVEL);
        // Past an end the knob stays put and stretches toward the pointer instead, with growing resistance (at most 1.5×)
        var s = 1 + 0.5 * (1 - Math.exp(-over / 40));
        sw.style.setProperty('--rtg-o', x < 0 ? '100% 50%' : '0 50%');
        sw.style.setProperty('--rtg-x', Math.max(0, Math.min(TRAVEL, x)) + 'px');
        sw.style.setProperty('--rtg-s', s.toFixed(3));
      });
      function up(e) {
        if (!down) return;
        down = false; sw.classList.remove('is-dragging');
        if (!moved) return;
        var x = base + (e.clientX - start);
        flip(x > TRAVEL / 2);
      }
      sw.addEventListener('pointerup', up);
      sw.addEventListener('pointercancel', function () { down = false; sw.classList.remove('is-dragging'); rest(); });
      sw.addEventListener('click', function (e) {
        if (moved) { moved = false; e.preventDefault(); return; }
        sw.classList.remove('is-squish'); void sw.offsetWidth; sw.classList.add('is-squish');
        flip(!on());
      });
      sw.addEventListener('animationend', function () { sw.classList.remove('is-squish'); });
      rest();
    });
  }

  window.initRubberToggle = initRubberToggle;
  function boot() { document.querySelectorAll('[data-mi="rubber-toggle"]').forEach(initRubberToggle); }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();

</script>
</body>
</html>
