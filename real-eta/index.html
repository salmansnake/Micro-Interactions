<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Real ETA · Micro Interactions</title>
<link rel="icon" type="image/svg+xml" href="../icons/outcraft-favicon-light.svg" media="(prefers-color-scheme: light)">
<link rel="icon" type="image/svg+xml" href="../icons/outcraft-favicon-dark.svg" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="../icons/outcraft-icon-180x180-light.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="../outcraft-tokens.css">
<style>
html, body { min-height: 100%; }
body { margin: 0; display: grid; place-items: center; padding: 64px 16px 48px; box-sizing: border-box; background: var(--background); color: var(--body); font-family: var(--font-sans); }
</style>
<style>
/* Real ETA — delivery shown as an honest range that narrows as the package gets closer, instead of a promise that slips.
   Outcraft Design System v2. Every value is an Outcraft token. */
.eta {
  --eta-bg: var(--card);
  --eta-fg: var(--foreground);
  --eta-muted: var(--muted-foreground);
  --eta-sunken: var(--subtle);
  --eta-fill: var(--muted);
  --eta-accent: var(--primary);
  --eta-on-accent: var(--primary-foreground);
  display: flex;
  flex-direction: column;
  gap: 16px;
  width: 100%;
  max-width: 400px;
  box-sizing: border-box;
  padding: 20px;
  background: var(--eta-bg);
  color: var(--eta-fg);
  border-radius: var(--radius-xl);
  border: 1px solid var(--border);
  box-shadow: var(--shadow-sm);
  font: 400 var(--text-body)/var(--leading-body) var(--font-sans);
  letter-spacing: normal;
  text-align: left;
  -webkit-font-smoothing: antialiased;
}
.eta p, .eta ul, .eta ol { margin: 0; }
.eta ul, .eta ol { padding: 0; list-style: none; }
.eta-title { min-width: 0; }
.eta-title b { display: block; font-weight: 600; }
.eta-title small { display: block; margin-top: 2px; color: var(--eta-muted); font-size: var(--text-small); line-height: var(--leading-small); }
.eta-tile { flex: none; display: grid; place-items: center; width: 40px; height: 40px; border-radius: var(--radius-md); background: var(--eta-fill); color: var(--eta-fg); }
.eta-tile svg { width: 20px; height: 20px; stroke-width: 1.75; }
.eta-head { display: flex; align-items: center; gap: 12px; }
.eta-head .eta-title b { text-box: trim-start cap alphabetic; }
/* The chart box: a soft neutral inset; one bar per day, its height the chance of arriving that day */
.eta-chart { display: flex; flex-direction: column; gap: 12px; padding: 14px 14px 10px; border-radius: var(--radius-lg); background: var(--subtle); }
.eta-big b { display: block; font-size: var(--text-title-sm); line-height: var(--leading-title-sm); font-weight: 600; text-box: trim-start cap alphabetic; }
.eta-big small { display: block; margin-top: 2px; color: var(--eta-muted); font-size: var(--text-small); line-height: var(--leading-small); }
.eta-days { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); align-items: end; gap: 8px; height: 112px; }
.eta-day { display: flex; flex-direction: column; align-items: center; gap: 4px; height: 100%; justify-content: flex-end; }
.eta-bar { width: 100%; height: 72px; border-radius: var(--radius-sm) var(--radius-sm) 2px 2px; background: oklch(from var(--aqua) var(--tint-mark-l) calc(c * var(--tint-c)) h); transform-origin: 50% 100%; transform: scaleY(var(--p, 0)); transition: transform var(--spring-panel-duration) var(--spring-panel), background-color var(--duration-base); }
.eta-day.is-top .eta-bar { background: var(--brand-strong); }
.eta-pct { color: var(--eta-muted); font: 500 11px/14px var(--font-mono); font-variant-numeric: tabular-nums; }
.eta-day.is-top .eta-pct { color: var(--eta-fg); font-weight: 600; }
.eta-lab { color: var(--eta-muted); font-size: var(--text-caption); line-height: var(--leading-caption); white-space: nowrap; }
.eta-day.is-top .eta-lab { color: var(--eta-fg); font-weight: 600; }
/* Steps: dots on a rail, filled up to where the package is */
.eta-steps { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); }
.eta-steps li { position: relative; padding-top: 16px; color: var(--eta-muted); font-size: var(--text-caption); line-height: var(--leading-caption); text-align: center; }
.eta-steps li::before { content: ""; position: absolute; top: 0; left: 50%; width: 10px; height: 10px; margin-left: -5px; border-radius: 50%; background: var(--eta-bg); box-shadow: inset 0 0 0 2px var(--border-strong); z-index: 1; }
.eta-steps li + li::after { content: ""; position: absolute; top: 4px; right: 50%; width: 100%; height: 2px; background: var(--border-strong); }
.eta-steps li.is-done { color: var(--eta-fg); font-weight: 600; }
.eta-steps li.is-done::before { background: var(--brand-strong); box-shadow: none; }
.eta-steps li.is-done::after { background: var(--brand-strong); }
.eta-btn { flex: none; display: inline-flex; align-items: center; justify-content: center; height: 44px; padding: 0 16px; border: 0; border-radius: var(--radius-md); background: var(--eta-fill); color: var(--eta-fg); font: inherit; font-size: var(--text-ui); font-weight: 600; white-space: nowrap; cursor: pointer; transition: transform var(--spring-press-duration) var(--spring-press), background-color var(--duration-fast); }
.eta-btn svg { width: 16px; height: 16px; margin-right: 8px; }
.eta-btn:hover:not(:disabled) { background: var(--muted-hover); }
.eta-btn.is-primary, .eta-btn.is-primary:hover:not(:disabled) { background: var(--eta-accent); color: var(--eta-on-accent); }
.eta-btn:disabled { cursor: default; background: var(--eta-fill); color: var(--eta-muted); }
.eta-btn:not(:disabled):active { transform: scale(var(--press-scale)); }
.eta-btn:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }
.eta-foot { display: flex; justify-content: flex-end; }
/* The status has its own full-width line; the script keeps it as tall as the longest message, so the card never changes height */
.eta .eta-status { color: var(--body); font-size: var(--text-small); line-height: var(--leading-small); }
/* An empty status stays a live region but leaves the layout until text arrives */
.eta-status:empty { position: absolute; width: 1px; height: 1px; margin: 0; padding: 0; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

@media (prefers-reduced-motion: reduce) {
  .eta-bar { transition-duration: var(--duration-reduced); }
}
.eta [hidden] { display: none !important; }

</style>
<style>
/* Reset: a small icon button in the corner of every demo; a "Reset" pill slides out on hover or focus */
.mi-host { display: contents; }
.mi-reset { position: absolute; top: 12px; right: 12px; z-index: 5; display: grid; place-items: center; width: 32px; height: 32px; padding: 0; border: 1px solid var(--border); border-radius: var(--radius-full); background: var(--card); color: var(--muted-foreground); box-shadow: var(--shadow-xs); cursor: pointer; -webkit-tap-highlight-color: transparent; transition: color var(--duration-fast) var(--ease-out), border-color var(--duration-fast) var(--ease-out); }
.mi-reset svg { width: 16px; height: 16px; transition: transform var(--spring-ui-duration) var(--spring-ui); }
.mi-reset:hover, .mi-reset:focus-visible { color: var(--foreground); border-color: var(--border-strong); }
.mi-reset:hover svg { transform: rotate(-45deg); }
.mi-reset.is-spin svg { transform: rotate(-360deg); transition: transform var(--spring-pop-duration) var(--spring-pop); }
.mi-reset:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }
.mi-reset-tip { position: absolute; top: 50%; right: calc(100% + 6px); padding: 4px 10px; border-radius: var(--radius-full); background: var(--foreground); color: var(--background); font: 500 var(--text-caption)/var(--leading-caption) var(--font-sans); white-space: nowrap; pointer-events: none; opacity: 0; transform: translate(6px, -50%) scale(0.96); transform-origin: right center; transition: opacity var(--duration-fast) var(--ease-out), transform var(--spring-ui-duration) var(--spring-ui); }
.mi-reset:hover .mi-reset-tip, .mi-reset:focus-visible .mi-reset-tip { opacity: 1; transform: translate(0, -50%) scale(1); }
.mi-reset--page { position: fixed; top: 16px; right: 16px; }
@media (hover: none) { .mi-reset-tip { display: none; } }
@media (prefers-reduced-motion: reduce) { .mi-reset svg, .mi-reset.is-spin svg, .mi-reset-tip { transition: opacity var(--duration-reduced) var(--ease-out); transform: none; } .mi-reset-tip { transform: translate(0, -50%); } }
.mi-sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

</style>
</head>
<body>
<button type="button" class="mi-reset mi-reset--page" data-mi-reset aria-label="Reset Real ETA"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg><span class="mi-reset-tip" aria-hidden="true">Reset</span></button>
<div class="mi-host"><div class="eta" data-mi="real-eta">
  <div class="eta-head">
    <span class="eta-tile"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 21.73a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73z"/><path d="M12 22V12"/><polyline points="3.29 7 12 12 20.71 7"/><path d="m7.5 4.27 9 5.15"/></svg></span>
    <p class="eta-title"><b>Standing desk</b><small class="eta-where">Ordered · Austin, TX</small></p>
  </div>
  <div class="eta-chart">
    <p class="eta-big"><b class="eta-when">Most likely Thu, Nov 12</b><small class="eta-odds">80% chance by Sat</small></p>
    <ol class="eta-days"></ol>
  </div>
  <ol class="eta-steps"><li>Ordered</li><li>Shipped</li><li>In Austin</li><li>Delivering</li></ol>
  <p class="eta-status" role="status" aria-live="polite">A range, because we don’t know yet. It narrows as we learn more along the way.</p>
  <div class="eta-foot">
    <button type="button" class="eta-btn is-primary"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg><span>Move Time Forward</span></button>
  </div>
</div>
</div>
<script>
/* Real ETA — vanilla JS. Auto-initializes every [data-mi="real-eta"].
   Each stage of the delivery has a chance for each day. The bars show it, the tallest is "most likely", and the
   odds line says how likely it is by a given day. Move Time Forward moves to the next stage, and the range narrows.
   Call window.initRealEta(el) for elements added later. */
(function () {
  'use strict';
  var DAYS = ['Wed', 'Thu', 'Fri', 'Sat', 'Mon'], DATES = ['Wed, Nov 11', 'Thu, Nov 12', 'Fri, Nov 13', 'Sat, Nov 14', 'Mon, Nov 16'];
  var STAGES = [
    { where: 'Ordered · Austin, TX', p: [10, 35, 30, 15, 10], say: 'A range, because we don’t know yet. It narrows as we learn more along the way.' },
    { where: 'Shipped from Dallas', p: [15, 50, 25, 10, 0], say: 'Left Dallas this morning. Monday is off the table, and Thursday is now the best\u00a0bet.' },
    { where: 'At the Austin hub', p: [0, 85, 15, 0, 0], say: 'In Austin at the local hub. Thursday it is, unless the trucks are full that day.' },
    { where: 'Out for delivery', p: [0, 100, 0, 0, 0], say: 'On the truck and a few stops away. Between 2 and 4 PM today, so keep an eye out.' }
  ];

  function initRealEta(root) {
    if (!root || root.__miEta) return;
    root.__miEta = true;
    var list = root.querySelector('.eta-days'), when = root.querySelector('.eta-when'), odds = root.querySelector('.eta-odds');
    var where = root.querySelector('.eta-where'), steps = root.querySelectorAll('.eta-steps li'), btn = root.querySelector('.eta-btn'), status = root.querySelector('.eta-status');
    var s = 0;
    DAYS.forEach(function (d) {
      var li = document.createElement('li'); li.className = 'eta-day';
      li.innerHTML = '<span class="eta-pct"></span><span class="eta-bar"></span><span class="eta-lab"></span>';
      li.querySelector('.eta-lab').textContent = d; list.appendChild(li);
    });
    var days = list.children;

    // Reserve the height of the longest message at the current width, so stepping through never moves the card
    function reserve() {
      var keep = status.textContent, h = 0;
      status.style.minHeight = '';
      STAGES.forEach(function (st) { status.textContent = st.say; h = Math.max(h, status.getBoundingClientRect().height); });
      status.textContent = keep; status.style.minHeight = Math.ceil(h) + 'px';
    }

    function render() {
      var st = STAGES[s], top = st.p.indexOf(Math.max.apply(null, st.p)), sum = 0, by = -1;
      Array.prototype.forEach.call(days, function (li, i) {
        li.style.setProperty('--p', (st.p[i] / 100).toFixed(2));
        li.querySelector('.eta-pct').textContent = st.p[i] ? st.p[i] + '%' : '';
        li.classList.toggle('is-top', i === top);
        li.setAttribute('aria-label', DATES[i] + ': ' + st.p[i] + '% chance');
      });
      // The first day by which it's at least 80% likely
      st.p.some(function (x, i) { sum += x; if (sum >= 80) { by = i; return true; } return false; });
      when.textContent = s === STAGES.length - 1 ? 'Today, 2–4 PM' : 'Most likely ' + DATES[top];
      odds.textContent = s === STAGES.length - 1 ? 'It’s on the truck' : (by === top ? sum + '% chance on ' + DAYS[top] : '80% chance by ' + DAYS[by]);
      where.textContent = st.where;
      steps.forEach(function (li, i) { li.classList.toggle('is-done', i <= s); });
      status.textContent = st.say;
      btn.disabled = s === STAGES.length - 1;
    }
    btn.addEventListener('click', function () { if (s < STAGES.length - 1) { s++; render(); } });
    render();
    reserve();
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(reserve);
    var lastW = 0;
    if (window.ResizeObserver) new ResizeObserver(function () { var w = root.getBoundingClientRect().width; if (Math.abs(w - lastW) > 0.5) { lastW = w; reserve(); } }).observe(root);
  }

  window.initRealEta = initRealEta;
  function boot() { document.querySelectorAll('[data-mi="real-eta"]').forEach(initRealEta); }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();

</script>
<script>
(function () {
  var host = document.querySelector('.mi-host'), orig = host.innerHTML, fn = window["initRealEta"];
  document.querySelector('[data-mi-reset]').addEventListener('click', function (e) {
    host.innerHTML = orig;
    host.querySelectorAll('[data-mi]').forEach(function (el) { if (typeof fn === 'function') fn(el); });
    var b = e.currentTarget; b.classList.remove('is-spin'); void b.offsetWidth; b.classList.add('is-spin');
    setTimeout(function () { b.classList.remove('is-spin'); }, 700);
  });
})();
</script>
</body>
</html>
