/* Domino Delete — delete several items at once and they topple one into the next like dominoes, then the gap closes.
   Outcraft Design System v2. Every value is an Outcraft token. */
.dmd {
  --dmd-bg: var(--card);
  --dmd-fg: var(--foreground);
  --dmd-muted: var(--muted-foreground);
  --dmd-sunken: var(--subtle);
  --dmd-fill: var(--muted);
  --dmd-accent: var(--primary);
  --dmd-on-accent: var(--primary-foreground);
  --dmd-frame: var(--card);
  --dmd-sun-l: 0.99;
  --dmd-step: -1;
  --dmd-sky: 0;
  display: flex;
  flex-direction: column;
  gap: 16px;
  width: 100%;
  max-width: 400px;
  box-sizing: border-box;
  padding: 20px;
  background: var(--dmd-bg);
  color: var(--dmd-fg);
  border-radius: var(--radius-xl);
  border: 1px solid var(--border);
  box-shadow: var(--shadow-sm);
  font: 400 var(--text-body)/var(--leading-body) var(--font-sans);
  letter-spacing: normal;
  text-align: left;
  -webkit-font-smoothing: antialiased;
}
.dmd p, .dmd ul, .dmd ol { margin: 0; }
.dmd ul, .dmd ol { padding: 0; list-style: none; }
.dmd-title b { display: block; font-weight: 600; text-box: trim-start cap alphabetic; }
.dmd-title small { display: block; margin-top: 2px; color: var(--dmd-muted); font-size: var(--text-small); line-height: var(--leading-small); }
/* The photos stand in a row like dominoes on a gray shelf */
.dmd-row { display: flex; align-items: flex-end; gap: 6px; height: 132px; padding: 0 12px 14px; box-sizing: border-box; border-radius: var(--radius-lg); background: var(--dmd-sunken); }
/* Every tile is a print: a white frame with a little photo in it and its number on the strip below. It keeps a
   seventh of the shelf, so the ones left keep their size when others are gone */
.dmd-tile { --dmd-k: var(--aqua); position: relative; flex: 0 0 calc((100% - 36px) / 7); min-width: 0; display: flex; flex-direction: column; height: 96px; padding: 3px 3px 0; box-sizing: border-box; border: 0; border-radius: var(--radius-md); background: var(--dmd-frame); color: var(--dmd-muted); box-shadow: var(--shadow-sm); cursor: pointer; transform-origin: 100% 100%; transition: transform var(--spring-ui-duration) var(--spring-ui), box-shadow var(--duration-fast); }

.dmd-pic .m { fill: oklch(from var(--dmd-k) calc(var(--tint-l) + var(--dmd-sky) + var(--dmd-step) * 0.08) calc(c * 0.6) h); }

.dmd-tile.is-blurry .dmd-pic svg { filter: blur(1.6px); transform: scale(1.1); }
.dmd-tile b { display: block; height: 16px; font: 600 10px/16px var(--font-mono); text-align: center; }
/* Picked: it lifts, takes a ring in the primary color and a check pops in at the photo's bottom right corner,
   inside the print, so it never reaches into the gap or the next print's ring */
.dmd-tile[aria-pressed="true"] { transform: translateY(-8px); box-shadow: 0 0 0 2px var(--dmd-accent), var(--shadow-md); }

/* Outside the picked ring, so focus never hides it */
.dmd-tile:focus-visible { outline: 2px solid var(--ring); outline-offset: 4px; }

.dmd-tile.is-gone { display: none; }
.dmd-btn { flex: none; display: inline-flex; align-items: center; justify-content: center; height: 44px; padding: 0 16px; border: 0; border-radius: var(--radius-md); background: var(--dmd-fill); color: var(--dmd-fg); font: inherit; font-size: var(--text-ui); font-weight: 600; white-space: nowrap; cursor: pointer; transition: transform var(--spring-press-duration) var(--spring-press), background-color var(--duration-fast); }
.dmd-btn svg { width: 16px; height: 16px; margin-right: 8px; }
.dmd-btn:hover:not(:disabled) { background: var(--muted-hover); }
.dmd-btn.is-primary, .dmd-btn.is-primary:hover:not(:disabled) { background: var(--dmd-accent); color: var(--dmd-on-accent); }
.dmd-btn:disabled { cursor: default; background: var(--dmd-fill); color: var(--dmd-muted); }
.dmd-btn:not(:disabled):active { transform: scale(var(--press-scale)); }
.dmd-btn:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }
.dmd-foot { display: flex; align-items: center; gap: 12px; }
.dmd-foot > button:first-of-type { margin-left: auto; }
.dmd .dmd-status { flex: 1; min-width: 0; margin-right: auto; color: var(--body); font-size: var(--text-small); line-height: var(--leading-small); }
/* An empty status stays a live region but leaves the layout until text arrives */
.dmd-status:empty { position: absolute; width: 1px; height: 1px; margin: 0; padding: 0; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

/* In dark the shelf takes the page ground and the prints a lighter gray frame, so they stand out from it with no
   shadow to help; the sky lifts 0.06 so every photo stands clear of its frame; the scene turns to dusk */
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .dmd { --dmd-sunken: var(--background); --dmd-frame: var(--muted); --dmd-sky: 0.06; --dmd-sun-l: 0.86; --dmd-step: 1; } }
:root[data-theme="dark"] .dmd { --dmd-sunken: var(--background); --dmd-frame: var(--muted); --dmd-sky: 0.06; --dmd-sun-l: 0.86; --dmd-step: 1; }

@media (prefers-reduced-motion: reduce) {
  .dmd-tile, .dmd-check { transition-duration: var(--duration-reduced); }
  .dmd-tile.is-falling { transform: none; transition: opacity var(--duration-reduced); }
  .dmd-tile.is-knocked { animation: none; }
}
/* Multi-line text wraps evenly and never ends on one or two lonely words */
.dmd :is(p, li, dd, dt, small, label, figcaption, h1, h2, h3, h4) { text-wrap: balance; }
.dmd [hidden] { display: none !important; }

      del.disabled = !n; delLabel.textContent = n ? 'Delete ' + n : 'Delete';
    }
    // Slide the survivors into the gap: remember where they were, let them move, then ease from there
    function closeGap(before) {
      Array.prototype.forEach.call(row.children, function (b) {
        if (b.classList.contains('is-gone') || reduce.matches) return;
        var dx = before.get(b) - b.getBoundingClientRect().left;
        if (!dx) return;
        b.style.transition = 'none'; b.style.transform = 'translateX(' + dx + 'px)';
        void b.offsetWidth; b.style.transition = ''; b.style.transform = '';
      });
    }
    del.addEventListener('click', function () {
      var p = picked(); if (!p.length) return;
      del.disabled = true; last = p;
      p.forEach(function (b, i) {
        setTimeout(function () { b.classList.add('is-falling'); }, reduce.matches ? 0 : i * 90);
        // The photo it falls into, if that one stays, takes the hit as it lands
        var next = b.nextElementSibling;
        while (next && next.classList.contains('is-gone')) next = next.nextElementSibling;
        if (next && p.indexOf(next) < 0 && !reduce.matches) setTimeout(function () { next.classList.add('is-knocked'); }, i * 90 + 200);
      });
      setTimeout(function () {
        var before = new Map(); Array.prototype.forEach.call(row.children, function (b) { before.set(b, b.getBoundingClientRect().left); });
        p.forEach(function (b) { b.classList.add('is-gone'); b.classList.remove('is-falling'); b.setAttribute('aria-pressed', 'false'); });
        closeGap(before);
        undo.hidden = false;
        status.textContent = 'Toppled ' + p.length + (p.length === 1 ? ' photo' : ' photos') + '.';
        render(); undo.focus({ preventScroll: true });
      }, reduce.matches ? 140 : p.length * 90 + 440);
    });
    undo.addEventListener('click', function () {
      var before = new Map(); Array.prototype.forEach.call(row.children, function (b) { before.set(b, b.getBoundingClientRect().left); });
      last.forEach(function (b) { b.classList.remove('is-gone'); b.setAttribute('aria-pressed', 'true'); });
      closeGap(before);
      undo.hidden = true; status.textContent = 'Stood them all back up.'; render(); del.focus({ preventScroll: true });
    });
    render();
    keepWidth(del, delLabel, ['Delete', 'Delete 7']);
  }

  window.initDominoDelete = initDominoDelete;
  function boot() { document.querySelectorAll('[data-mi="domino-delete"]').forEach(initDominoDelete); }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();

</script>
