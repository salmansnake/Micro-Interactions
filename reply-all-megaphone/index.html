<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reply-All Megaphone · Micro Interactions</title>
<link rel="icon" type="image/svg+xml" href="../icons/outcraft-favicon-light.svg" media="(prefers-color-scheme: light)">
<link rel="icon" type="image/svg+xml" href="../icons/outcraft-favicon-dark.svg" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="../icons/outcraft-icon-180x180-light.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="../outcraft-tokens.css">
<style>
html, body { min-height: 100%; }
body { margin: 0; display: grid; place-items: center; padding: 64px 16px 48px; box-sizing: border-box; background: var(--background); color: var(--body); font-family: var(--font-sans); }
</style>
<style>
/* Reply-All Megaphone — Reply All to a crowd turns the button into a megaphone and shows the crowd before it sends.
   Outcraft Design System v2. Every value is an Outcraft token. */
.ram {
  --ram-bg: var(--card);
  --ram-fg: var(--foreground);
  --ram-muted: var(--muted-foreground);
  --ram-sunken: var(--subtle);
  --ram-fill: var(--muted);
  --ram-accent: var(--primary);
  --ram-on-accent: var(--primary-foreground);
  display: flex;
  flex-direction: column;
  gap: 16px;
  width: 100%;
  max-width: 400px;
  box-sizing: border-box;
  padding: 20px;
  background: var(--ram-bg);
  color: var(--ram-fg);
  border-radius: var(--radius-xl);
  border: 1px solid var(--border);
  box-shadow: var(--shadow-sm);
  font: 400 var(--text-body)/var(--leading-body) var(--font-sans);
  letter-spacing: normal;
  text-align: left;
  -webkit-font-smoothing: antialiased;
}
.ram p { margin: 0; }
.ram-mail { display: flex; flex-direction: column; gap: 8px; }
.ram-from { display: flex; align-items: center; gap: 12px; }
.ram-av { flex: none; display: block; width: 36px; height: 36px; border-radius: 50%; background: var(--chart-4); color: var(--on-chart); font-size: var(--text-ui); font-weight: 700; align-content: center; text-align: center; text-box: trim-both cap alphabetic; }
.ram-who { flex: 1; min-width: 0; }
.ram-who b { display: block; font-size: var(--text-ui); line-height: var(--leading-ui); font-weight: 600; }
.ram-who small { display: block; margin-top: 2px; color: var(--ram-muted); font-size: var(--text-small); line-height: var(--leading-small); }
.ram-time { flex: none; align-self: flex-start; color: var(--ram-muted); font-size: var(--text-caption); line-height: var(--leading-caption); font-variant-numeric: tabular-nums; }
.ram-subject { margin-top: 4px !important; font-size: var(--text-title-sm); line-height: var(--leading-title-sm); letter-spacing: var(--tracking-title-sm); font-weight: 600; }
.ram-body { color: var(--body); font-size: var(--text-ui); line-height: var(--leading-ui); }

/* The crowd: every recipient, as a dot, springing in one after another */
.ram-crowd { display: flex; flex-direction: column; gap: 12px; padding: 14px 16px 16px; border-radius: var(--radius-lg); background: var(--ram-sunken); animation: ram-in var(--spring-panel-duration) var(--spring-panel); }
@keyframes ram-in { from { opacity: 0; transform: translateY(-6px); } }
.ram-crowd-head { display: flex; align-items: center; gap: 10px; }
.ram-horn { flex: none; display: grid; place-items: center; width: 32px; height: 32px; border-radius: 50%; background: var(--warning); color: var(--warning-foreground); animation: ram-blare 0.6s var(--ease-in-out) 2; }
.ram-horn svg { width: 16px; height: 16px; }
@keyframes ram-blare { 0%, 100% { transform: rotate(0); } 30% { transform: rotate(-14deg) scale(1.08); } 60% { transform: rotate(8deg); } }
.ram-ask { font-size: var(--text-small); line-height: var(--leading-small); font-weight: 500; }
.ram-dots { display: grid; grid-template-columns: repeat(20, minmax(0, 1fr)); gap: 4px; }
.ram-dots i { aspect-ratio: 1; border-radius: 50%; background: var(--chart-1); animation: ram-pop var(--spring-pop-duration) var(--spring-pop) both; }
.ram-dots i.is-sender { box-shadow: 0 0 0 2px var(--ram-sunken), 0 0 0 4px var(--ram-fg); }
@keyframes ram-pop { from { transform: scale(0); } }
/* The count of the people past the dots belongs to the dots: 6px under them, the full panel gap before the buttons (10b.6a) */
.ram .ram-more { margin-top: -6px; color: var(--ram-muted); font-size: var(--text-small); line-height: var(--leading-small); }
.ram-pick { display: flex; gap: 8px; }

.ram-to { display: flex; align-items: center; gap: 8px; animation: ram-in var(--spring-panel-duration) var(--spring-panel); }
.ram-to-label { color: var(--ram-muted); font-size: var(--text-small); line-height: var(--leading-small); }
.ram-chip { display: inline-flex; align-items: center; height: 28px; padding: 0 10px; border-radius: var(--radius-full); background: var(--ram-fill); font-size: var(--text-small); font-weight: 600; white-space: nowrap; }
.ram-to.is-all .ram-chip { background: oklch(from var(--warning) var(--tint-l) calc(c * var(--tint-c)) h); color: oklch(from var(--warning-text) clamp(var(--tint-ink-min), l, var(--tint-ink-l)) c h); }

.ram-actions { display: flex; gap: 8px; }
.ram-btn { flex: 1; min-width: 0; display: inline-flex; align-items: center; justify-content: center; height: 44px; padding: 0 14px; border: 0; border-radius: var(--radius-md); background: var(--ram-fill); color: var(--ram-fg); font: inherit; font-size: var(--text-ui); font-weight: 600; white-space: nowrap; cursor: pointer; transition: transform var(--spring-press-duration) var(--spring-press), background-color var(--duration-fast); }
.ram-btn svg { width: 16px; height: 16px; margin-right: 8px; }
.ram-btn:hover { background: var(--muted-hover); }
.ram-crowd .ram-btn { background: var(--fill-on-subtle); }
.ram-reply, .ram-just, .ram-crowd .ram-just { background: var(--ram-accent); color: var(--ram-on-accent); }
.ram-reply:hover, .ram-crowd .ram-just:hover { background: var(--ram-accent); }
.ram-btn:active { transform: scale(var(--press-scale)); }
.ram-btn:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }
.ram-ic { display: inline-flex; }
.ram-ic-horn { display: none; }
.ram.is-blaring .ram-ic-all { display: none; }
.ram.is-blaring .ram-ic-horn { display: inline-flex; animation: ram-blare 0.6s var(--ease-in-out); }
.ram.is-blaring .ram-replyall { background: var(--warning); color: var(--warning-foreground); }

.ram-done { display: flex; align-items: center; gap: 12px; }
.ram .ram-status { flex: 1; min-width: 0; margin-right: auto; color: var(--body); font-size: var(--text-small); line-height: var(--leading-small); }
.ram-discard { flex: none; }
/* Before a reply starts the row is empty: it stays a live region but leaves the layout (and the gap) */
.ram-done:has(.ram-status:empty):has(.ram-discard[hidden]) { position: absolute; width: 1px; height: 1px; margin: 0; padding: 0; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

@media (prefers-reduced-motion: reduce) {
  .ram-crowd, .ram-to, .ram-horn, .ram-dots i, .ram.is-blaring .ram-ic-horn { animation: none; }
  .ram-btn { transition-duration: var(--duration-reduced); }
}
/* Multi-line text wraps evenly and never ends on one or two lonely words */
.ram :is(p, li, dd, dt, small, label, figcaption, h1, h2, h3, h4) { text-wrap: balance; }
.ram [hidden] { display: none !important; }

</style>
<style>
/* Reset: a small icon button in the corner of every demo; a "Reset" pill slides out on hover or focus */
.mi-host { display: contents; }
.mi-reset { position: absolute; top: 12px; right: 12px; z-index: 5; display: grid; place-items: center; width: 32px; height: 32px; padding: 0; border: 1px solid var(--border); border-radius: var(--radius-full); background: var(--card); color: var(--muted-foreground); box-shadow: var(--shadow-xs); cursor: pointer; -webkit-tap-highlight-color: transparent; transition: color var(--duration-fast) var(--ease-out), border-color var(--duration-fast) var(--ease-out); }
.mi-reset svg { width: 16px; height: 16px; transition: transform var(--spring-ui-duration) var(--spring-ui); }
.mi-reset:hover, .mi-reset:focus-visible { color: var(--foreground); border-color: var(--border-strong); }
.mi-reset:hover svg { transform: rotate(-45deg); }
.mi-reset.is-spin svg { transform: rotate(-360deg); transition: transform var(--spring-pop-duration) var(--spring-pop); }
.mi-reset:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }
.mi-reset-tip { position: absolute; top: 50%; right: calc(100% + 6px); padding: 4px 10px; border-radius: var(--radius-full); background: var(--foreground); color: var(--background); font: 500 var(--text-caption)/var(--leading-caption) var(--font-sans); white-space: nowrap; pointer-events: none; opacity: 0; transform: translate(6px, -50%) scale(0.96); transform-origin: right center; transition: opacity var(--duration-fast) var(--ease-out), transform var(--spring-ui-duration) var(--spring-ui); }
.mi-reset:hover .mi-reset-tip, .mi-reset:focus-visible .mi-reset-tip { opacity: 1; transform: translate(0, -50%) scale(1); }
.mi-reset--page { position: fixed; top: 16px; right: 16px; }
@media (hover: none) { .mi-reset-tip { display: none; } }
@media (prefers-reduced-motion: reduce) { .mi-reset svg, .mi-reset.is-spin svg, .mi-reset-tip { transition: opacity var(--duration-reduced) var(--ease-out); transform: none; } .mi-reset-tip { transform: translate(0, -50%); } }
.mi-sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

</style>
</head>
<body>
<button type="button" class="mi-reset mi-reset--page" data-mi-reset aria-label="Reset Reply-All Megaphone"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg><span class="mi-reset-tip" aria-hidden="true">Reset</span></button>
<div class="mi-host"><div class="ram" data-mi="reply-all-megaphone" data-people="40" data-sender="Alex Rivera">
  <div class="ram-mail">
    <div class="ram-from">
      <span class="ram-av" aria-hidden="true">AR</span>
      <p class="ram-who"><b>Alex Rivera</b><small>to All Company&nbsp;· 40 people</small></p>
      <span class="ram-time">9:12 AM</span>
    </div>
    <p class="ram-subject">Office closed Friday</p>
    <p class="ram-body">The Austin office is closed on Friday for floor repairs. Does anyone need a desk at the downtown space instead?</p>
  </div>
  <div class="ram-crowd" hidden>
    <div class="ram-crowd-head"><span class="ram-horn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 6a13 13 0 0 0 8.4-2.8A1 1 0 0 1 21 4v12a1 1 0 0 1-1.6.8A13 13 0 0 0 11 14H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2z"/><path d="M6 14a12 12 0 0 0 2.4 7.2 2 2 0 0 0 3.2-2.4A8 8 0 0 1 10 14"/><path d="M8 6v8"/></svg></span><p class="ram-ask">Reply to all 40 people? Only Alex asked.</p></div>
    <div class="ram-dots" aria-hidden="true"></div>
    <p class="ram-more" aria-hidden="true" hidden></p>
    <div class="ram-pick">
      <button type="button" class="ram-btn ram-just">Just Alex</button>
      <button type="button" class="ram-btn ram-all">Yes, All 40</button>
    </div>
  </div>
  <div class="ram-to" hidden>
    <span class="ram-to-label">To</span>
    <span class="ram-chip"></span>
  </div>
  <div class="ram-actions">
    <button type="button" class="ram-btn ram-reply"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 18v-2a4 4 0 0 0-4-4H4"/><path d="m9 17-5-5 5-5"/></svg>Reply</button>
    <button type="button" class="ram-btn ram-replyall"><span class="ram-ic ram-ic-all"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 17-5-5 5-5"/><path d="M22 18v-2a4 4 0 0 0-4-4H7"/><path d="m7 17-5-5 5-5"/></svg></span><span class="ram-ic ram-ic-horn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 6a13 13 0 0 0 8.4-2.8A1 1 0 0 1 21 4v12a1 1 0 0 1-1.6.8A13 13 0 0 0 11 14H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2z"/><path d="M6 14a12 12 0 0 0 2.4 7.2 2 2 0 0 0 3.2-2.4A8 8 0 0 1 10 14"/><path d="M8 6v8"/></svg></span>Reply All</button>
  </div>
  <div class="ram-done">
    <p class="ram-status" role="status" aria-live="polite"></p>
    <button type="button" class="ram-btn ram-discard" hidden>Discard</button>
  </div>
</div>
</div>
<script>
/* Reply-All Megaphone — vanilla JS. Auto-initializes every [data-mi="reply-all-megaphone"].
   Reply All to more than a few people (data-people) turns the button into a megaphone and shows the whole crowd,
   one dot each, before asking whether the sender alone would do. Call window.initReplyAllMegaphone(el) for elements added later. */
(function () {
  'use strict';
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)');
  var COLORS = ['var(--chart-1)', 'var(--chart-2)', 'var(--chart-3)', 'var(--chart-4)', 'var(--chart-5)'];

  // Even line breaks: text that wraps to two or three lines is narrowed until its lines are close in length,
  // with the first line the longest, so no line runs long while the next holds a word or two.
  function evenLines(root) {
    var SEL = 'p, li, dd, dt, small, label, figcaption, h1, h2, h3, h4';
    function widths(el) {
      var range = document.createRange(), rows = [];
      range.selectNodeContents(el);
      Array.prototype.forEach.call(range.getClientRects(), function (b) {
        if (!b.width) return;
        var row = rows.filter(function (x) { return Math.abs(x.t - b.top) < b.height / 2; })[0];
        if (row) { row.l = Math.min(row.l, b.left); row.r = Math.max(row.r, b.right); } else rows.push({ t: b.top, l: b.left, r: b.right });
      });
      return rows.sort(function (a, b) { return a.t - b.t; }).map(function (x) { return x.r - x.l; });
    }
    function fit(el) {
      el.style.maxWidth = ''; el.style.textWrap = '';
      // A filled box marked data-fill spans the card from edge to edge, and its text fills it
      if (el.hasAttribute('data-fill')) return;
      var cs = getComputedStyle(el), full = el.getBoundingClientRect().width;
      if (!full || cs.whiteSpace === 'nowrap' || /flex|grid/.test(cs.display)) return;
      if (Array.prototype.some.call(el.children, function (c) { return !/^inline/.test(getComputedStyle(c).display); })) return;
      el.style.textWrap = 'wrap';
      var n = widths(el).length, lo = 0, hi = full, w, L;
      if (n < 2 || n > 3) { el.style.textWrap = ''; return; }
      while (hi - lo > 1) { w = (lo + hi) / 2; el.style.maxWidth = w + 'px'; if (widths(el).length > n) lo = w; else hi = w; }
      var best = 0, gap = Infinity;
      for (w = Math.ceil(hi); w <= full; w += 2) {
        el.style.maxWidth = w + 'px'; L = widths(el);
        // Each line no longer than the one above (within 10%, which reads as equal). Keep the most even width,
        // and prefer the first line longer: a last line longer than the first costs three times its overhang
        var score = Math.max.apply(null, L) - Math.min.apply(null, L) + Math.max(0, L[n - 1] - L[0]) * 3;
        if (L.length === n && L.every(function (x, i) { return !i || x <= L[i - 1] * 1.1 + 1; }) && score < gap) { gap = score; best = w; }
      }
      if (!best) { el.style.maxWidth = ''; el.style.textWrap = ''; return; }
      el.style.maxWidth = best + 'px';
      if (cs.textAlign === 'center' && cs.display === 'block') { el.style.marginLeft = 'auto'; el.style.marginRight = 'auto'; }
    }
    var queued = false, lastW = 0;
    function run() { queued = false; Array.prototype.forEach.call(root.querySelectorAll(SEL), fit); }
    function later() { if (!queued) { queued = true; requestAnimationFrame(run); } }
    later();
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(later);
    if (window.ResizeObserver) new ResizeObserver(function () { var w = root.getBoundingClientRect().width; if (Math.abs(w - lastW) > 0.5) { lastW = w; later(); } }).observe(root);
    if (window.MutationObserver) new MutationObserver(later).observe(root, { subtree: true, childList: true, characterData: true, attributes: true, attributeFilter: ['hidden'] });
  }

  function initReplyAllMegaphone(root) {
    if (!root || root.__miRam) return;
    root.__miRam = true;
    evenLines(root);
    var people = Math.max(2, Number(root.getAttribute('data-people')) || 40); // never 1: a reply-all needs a crowd
    var count = people.toLocaleString('en-US'), others = (people - 1).toLocaleString('en-US');
    var MAX_DOTS = 60; // three rows: past this the crowd is a count, so a list of thousands can't stretch the card
    var sender = root.getAttribute('data-sender') || 'Alex Rivera', first = sender.split(' ')[0];
    var crowd = root.querySelector('.ram-crowd'), dots = root.querySelector('.ram-dots'), ask = root.querySelector('.ram-ask');
    var more = root.querySelector('.ram-more'), group = root.querySelector('.ram-who small');
    var actions = root.querySelector('.ram-actions'), to = root.querySelector('.ram-to'), chip = root.querySelector('.ram-chip');
    var status = root.querySelector('.ram-status');
    var reply = root.querySelector('.ram-reply'), all = root.querySelector('.ram-replyall');
    var just = root.querySelector('.ram-just'), yes = root.querySelector('.ram-all'), discard = root.querySelector('.ram-discard');
    var timer = 0;

    group.textContent = 'to All Company · ' + count + ' people'; // never 1: people is at least 2
    ask.textContent = 'Reply to all ' + count + ' people? Only ' + first + ' asked.'; // never 1: people is at least 2
    just.textContent = 'Just ' + first; yes.textContent = 'Yes, All ' + count;

    function writeTo(everyone) {
      crowd.hidden = true; actions.hidden = true;
      to.hidden = false; to.classList.toggle('is-all', everyone);
      chip.textContent = everyone ? 'All Company (' + count + ')' : sender;
      discard.hidden = false;
      status.textContent = everyone ? 'Replying to all ' + count + '. Bold. Very bold.'
        : 'Replying to ' + first + ' only. ' + others + (people - 1 === 1 ? ' inbox thanks' : ' inboxes thank') + ' you.';
      discard.focus({ preventScroll: true });
    }

    reply.addEventListener('click', function () { writeTo(false); });
    all.addEventListener('click', function () {
      if (people <= 3) return writeTo(true);
      root.classList.add('is-blaring');
      clearTimeout(timer);
      timer = setTimeout(function () {
        root.classList.remove('is-blaring');
        actions.hidden = true;
        // One dot per person up to MAX_DOTS, the sender ringed; they spring in fast, so the crowd's size lands all at once
        dots.innerHTML = '';
        more.hidden = people <= MAX_DOTS;
        more.textContent = more.hidden ? '' : 'and ' + (people - MAX_DOTS).toLocaleString('en-US') + ' more';
        for (var i = 0; i < Math.min(people, MAX_DOTS); i++) {
          var d = document.createElement('i');
          if (i === 0) d.className = 'is-sender';
          d.style.background = COLORS[(i * 7) % 5];
          d.style.animationDelay = (reduce.matches ? 0 : i * 12) + 'ms';
          dots.appendChild(d);
        }
        crowd.hidden = false;
        just.focus({ preventScroll: true });
      }, reduce.matches ? 0 : 520);
    });
    just.addEventListener('click', function () { writeTo(false); });
    yes.addEventListener('click', function () { writeTo(true); });
    discard.addEventListener('click', function () {
      to.hidden = true; discard.hidden = true; status.textContent = '';
      actions.hidden = false; all.focus({ preventScroll: true });
    });
  }

  window.initReplyAllMegaphone = initReplyAllMegaphone;
  function boot() { document.querySelectorAll('[data-mi="reply-all-megaphone"]').forEach(initReplyAllMegaphone); }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();

</script>
<script>
(function () {
  var host = document.querySelector('.mi-host'), orig = host.innerHTML, fn = window["initReplyAllMegaphone"];
  document.querySelector('[data-mi-reset]').addEventListener('click', function (e) {
    host.innerHTML = orig;
    host.querySelectorAll('[data-mi]').forEach(function (el) { if (typeof fn === 'function') fn(el); });
    var b = e.currentTarget; b.classList.remove('is-spin'); void b.offsetWidth; b.classList.add('is-spin');
    setTimeout(function () { b.classList.remove('is-spin'); }, 700);
  });
})();
</script>
</body>
