<div class="drc" data-mi="data-receipt">
  <div class="drc-head">
    <span class="drc-tile"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 2v3"/><path d="M16 2v3"/><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18"/></svg></span>
    <p class="drc-title"><b>Connect Calendar to Atlas</b><small>Here’s everything Atlas could do with it.</small></p>
  </div>
  <div class="drc-slot">
    <div class="drc-paper">
      <p class="drc-hd" aria-hidden="true">Access receipt</p>
      <ul class="drc-lines">
        <li><span class="drc-k">Read</span><span class="drc-t">Event titles and&nbsp;times</span><span class="drc-req">Needed</span></li>
        <li data-optional><span class="drc-k">Read</span><span class="drc-t">Who’s invited to each&nbsp;event</span><button type="button" class="drc-toggle" aria-pressed="false" aria-label="Remove: read who’s invited">Remove</button></li>
        <li data-optional><span class="drc-k">Write</span><span class="drc-t">Events you create in&nbsp;Atlas</span><button type="button" class="drc-toggle" aria-pressed="false" aria-label="Remove: write events you create in Atlas">Remove</button></li>
        <li class="is-never"><span class="drc-k">Never</span><span class="drc-t">Your email&nbsp;inbox</span></li>
        <li class="is-never"><span class="drc-k">Never</span><span class="drc-t">Events marked&nbsp;private</span></li>
      </ul>
      <p class="drc-total"><span>Total</span><b class="drc-count">3 permissions</b></p>
      <span class="drc-stamp" aria-hidden="true">Connected</span>
    </div>
  </div>
  <div class="drc-foot">
    <p class="drc-status" role="status" aria-live="polite"></p>
    <button type="button" class="drc-btn"><span class="drc-label">Connect with 3</span></button>
  </div>
</div>
