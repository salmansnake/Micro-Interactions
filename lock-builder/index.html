<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lock Builder · Micro Interactions</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="../outcraft-tokens.css">
<style>
html, body { min-height: 100%; }
body { margin: 0; display: grid; place-items: center; padding: 64px 16px 48px; box-sizing: border-box; background: var(--subtle); color: var(--body); font-family: var(--font-sans); }
</style>
<style>
/* Lock Builder — each password rule you meet slides a bolt into a padlock; meet them all and it snaps shut.
   Outcraft Design System v2. Every value is an Outcraft token. */
.lb {
  --lb-bg: var(--card);
  --lb-fg: var(--foreground);
  --lb-muted: var(--muted-foreground);
  --lb-line: var(--border);
  --lb-sunken: var(--subtle);
  --lb-fill: var(--muted);
  --lb-accent: var(--primary);
  --lb-green: var(--success);
  --lb-green-text: var(--success-text);
  --lb-orange: var(--warning);
  --lb-tone: var(--lb-muted);
  display: flex;
  flex-direction: column;
  gap: 14px;
  width: 100%;
  max-width: 400px;
  box-sizing: border-box;
  padding: 20px;
  background: var(--lb-bg);
  color: var(--lb-fg);
  border-radius: var(--radius-xl);
  border: 1px solid var(--border);
  box-shadow: var(--shadow-sm);
  font: 400 var(--text-body)/var(--leading-body) var(--font-sans);
  letter-spacing: normal;
  text-align: left;
  -webkit-font-smoothing: antialiased;
}
.lb[data-level="1"], .lb[data-level="2"] { --lb-tone: var(--lb-orange); }
.lb[data-level="3"] { --lb-tone: var(--lb-accent); }
.lb[data-level="4"] { --lb-tone: var(--lb-green); }
.lb-top { display: flex; align-items: center; gap: 16px; }
.lb-lock { flex: none; width: 56px; height: 63px; overflow: visible; }
.lb-shackle {
  fill: none;
  stroke: var(--lb-tone);
  stroke-width: 6;
  stroke-linecap: round;
  transform-box: fill-box;
  transform-origin: 100% 100%;
  transform: translateY(-9px) rotate(14deg);
  transition: stroke var(--duration-slow), transform var(--spring-ui-duration) var(--spring-ui);
}
.lb[data-level="4"] .lb-shackle { transform: none; transition: stroke var(--duration-slow), transform var(--spring-pop-duration) var(--spring-pop); }
.lb-body { fill: color-mix(in srgb, var(--lb-tone) 18%, transparent); stroke: var(--lb-tone); stroke-width: 2; transition: fill var(--duration-slow), stroke var(--duration-slow); }
.lb[data-level="4"] .lb-body { fill: var(--lb-green); }
.lb-bolt { fill: var(--lb-tone); opacity: 0; transform-box: fill-box; transform-origin: 50% 100%; transform: translateY(14px) scaleY(0.3); transition: transform var(--spring-pop-duration) var(--spring-pop), opacity var(--duration-base), fill var(--duration-slow); }
.lb-bolt.is-in { opacity: 1; transform: none; }
.lb[data-level="4"] .lb-bolt { fill: var(--on-color); }
.lb.is-locked .lb-lock { animation: lb-thunk var(--spring-pop-duration) var(--spring-pop); }
@keyframes lb-thunk { 30% { transform: translateY(3px) scale(1.04, 0.96); } 100% { transform: none; } }
.lb-title { margin: 0; font-size: var(--text-title-sm); line-height: var(--leading-title-sm); font-weight: 600; letter-spacing: var(--tracking-title); }
.lb-strength { margin: 2px 0 0; color: var(--lb-muted); font-size: var(--text-small); line-height: var(--leading-small); letter-spacing: normal; }
.lb-strength b { color: var(--lb-tone); }
.lb[data-level="4"] .lb-strength b { color: var(--lb-green-text); }
.lb-field { position: relative; display: flex; align-items: center; border-radius: var(--radius-md); background: var(--card); border: 1px solid var(--input); transition: box-shadow var(--duration-base); }
.lb-field:focus-within { border-color: var(--ring); box-shadow: 0 0 0 3px color-mix(in srgb, var(--ring) 22%, transparent); }
.lb-input { flex: 1; min-width: 0; height: 44px; padding: 0 14px; border: 0; background: transparent; color: var(--lb-fg); font: 400 var(--text-title-sm)/var(--leading-title-sm) var(--font-sans); letter-spacing: var(--tracking-title); outline: none; }
.lb-show { flex: none; height: 32px; margin-right: 6px; padding: 0 12px; border: 0; border-radius: var(--radius-sm); background: none; color: var(--lb-accent); font: inherit; font-weight: 600; cursor: pointer; }
.lb-show:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }
.lb-rules { display: flex; flex-direction: column; gap: 8px; margin: 0; padding: 0 4px; list-style: none; font-size: var(--text-body); line-height: var(--leading-body); }
.lb-rules li { display: flex; align-items: center; gap: 10px; color: var(--lb-muted); transition: color var(--duration-base); }
.lb-rules li.is-met { color: var(--lb-fg); }
.lb-tick { position: relative; flex: none; width: 18px; height: 18px; border-radius: 50%; box-shadow: inset 0 0 0 1.5px var(--lb-fill); transition: background-color var(--duration-base), box-shadow var(--duration-base); }
.lb-tick::after { content: ""; position: absolute; left: 6px; top: 3px; width: 4px; height: 8px; border: solid var(--on-color); border-width: 0 2px 2px 0; transform: rotate(45deg) scale(0); transition: transform var(--spring-pop-duration) var(--spring-pop); }
.lb-rules li.is-met .lb-tick { background: var(--lb-green); box-shadow: none; }
.lb-rules li.is-met .lb-tick::after { transform: rotate(45deg) scale(1); }
@media (prefers-reduced-motion: reduce) {
  .lb-shackle, .lb-bolt, .lb-tick::after { transition-duration: var(--duration-reduced) !important; transition-timing-function: linear !important; }
  .lb.is-locked .lb-lock { animation: none; }
}
.lb [hidden] { display: none !important; }

</style>
<style>
/* Reset: a small icon button in the corner of every demo; a "Reset" pill slides out on hover or focus */
.mi-host { display: contents; }
.mi-reset { position: absolute; top: 12px; right: 12px; z-index: 5; display: grid; place-items: center; width: 32px; height: 32px; padding: 0; border: 1px solid var(--border); border-radius: var(--radius-full); background: var(--card); color: var(--muted-foreground); box-shadow: var(--shadow-xs); cursor: pointer; -webkit-tap-highlight-color: transparent; transition: color var(--duration-fast) var(--ease-out), border-color var(--duration-fast) var(--ease-out); }
.mi-reset svg { width: 16px; height: 16px; transition: transform var(--spring-ui-duration) var(--spring-ui); }
.mi-reset:hover, .mi-reset:focus-visible { color: var(--foreground); border-color: var(--border-strong); }
.mi-reset:hover svg { transform: rotate(-45deg); }
.mi-reset.is-spin svg { transform: rotate(-360deg); transition: transform var(--spring-pop-duration) var(--spring-pop); }
.mi-reset:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }
.mi-reset-tip { position: absolute; top: 50%; right: calc(100% + 6px); padding: 4px 10px; border-radius: var(--radius-full); background: var(--foreground); color: var(--background); font: 500 var(--text-caption)/var(--leading-caption) var(--font-sans); white-space: nowrap; pointer-events: none; opacity: 0; transform: translate(6px, -50%) scale(0.96); transform-origin: right center; transition: opacity var(--duration-fast) var(--ease-out), transform var(--spring-ui-duration) var(--spring-ui); }
.mi-reset:hover .mi-reset-tip, .mi-reset:focus-visible .mi-reset-tip { opacity: 1; transform: translate(0, -50%) scale(1); }
.mi-reset--page { position: fixed; top: 16px; right: 16px; }
@media (hover: none) { .mi-reset-tip { display: none; } }
@media (prefers-reduced-motion: reduce) { .mi-reset svg, .mi-reset.is-spin svg, .mi-reset-tip { transition: opacity var(--duration-reduced) var(--ease-out); transform: none; } .mi-reset-tip { transform: translate(0, -50%); } }
.mi-sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

</style>
</head>
<body>
<button type="button" class="mi-reset mi-reset--page" data-mi-reset aria-label="Reset Lock Builder"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg><span class="mi-reset-tip" aria-hidden="true">Reset</span></button>
<div class="mi-host"><div class="lb" data-mi="lock-builder">
  <div class="lb-top">
    <svg class="lb-lock" viewBox="0 0 64 72" aria-hidden="true">
      <path class="lb-shackle" d="M18 34V22a14 14 0 0 1 28 0v12"></path>
      <rect class="lb-body" x="8" y="32" width="48" height="36" rx="10"></rect>
      <rect class="lb-bolt" x="15" y="40" width="6" height="20" rx="3"></rect>
      <rect class="lb-bolt" x="25" y="40" width="6" height="20" rx="3"></rect>
      <rect class="lb-bolt" x="35" y="40" width="6" height="20" rx="3"></rect>
      <rect class="lb-bolt" x="45" y="40" width="6" height="20" rx="3"></rect>
    </svg>
    <div>
      <p class="lb-title">Create a Password</p>
      <p class="lb-strength" aria-live="polite">Each rule you meet adds a bolt.</p>
    </div>
  </div>
  <div class="lb-field">
    <input id="lb-input" class="lb-input" type="password" autocomplete="new-password" spellcheck="false" placeholder="Password" aria-describedby="lb-rules">
    <button type="button" class="lb-show" aria-pressed="false">Show</button>
  </div>
  <ul class="lb-rules" id="lb-rules">
    <li data-rule="length"><span class="lb-tick" aria-hidden="true"></span>10 or more characters</li>
    <li data-rule="case"><span class="lb-tick" aria-hidden="true"></span>Upper and lowercase letters</li>
    <li data-rule="number"><span class="lb-tick" aria-hidden="true"></span>At least one number</li>
    <li data-rule="symbol"><span class="lb-tick" aria-hidden="true"></span>At least one symbol</li>
  </ul>
</div>
</div>
<script>
/* Lock Builder — vanilla JS. Auto-initializes every [data-mi="lock-builder"].
   Call window.initLockBuilder(el) for elements added later. */
(function () {
  'use strict';
  var RULES = {
    length: function (v) { return v.length >= 10; },
    case: function (v) { return /[a-z]/.test(v) && /[A-Z]/.test(v); },
    number: function (v) { return /\d/.test(v); },
    symbol: function (v) { return /[^A-Za-z0-9\s]/.test(v); }
  };
  var WORDS = ['', 'Weak', 'Fair', 'Good', 'Strong'];

  function initLockBuilder(root) {
    if (!root || root.__miLock) return;
    root.__miLock = true;
    var input = root.querySelector('.lb-input');
    var show = root.querySelector('.lb-show');
    var bolts = Array.prototype.slice.call(root.querySelectorAll('.lb-bolt'));
    var rules = Array.prototype.slice.call(root.querySelectorAll('[data-rule]'));
    var strength = root.querySelector('.lb-strength');
    var level = 0;

    function update() {
      var v = input.value;
      var met = 0;
      rules.forEach(function (li) {
        var ok = RULES[li.getAttribute('data-rule')](v);
        li.classList.toggle('is-met', ok);
        if (ok) met++;
      });
      // Bolts fill left to right, one per rule met.
      bolts.forEach(function (b, i) { b.classList.toggle('is-in', i < met); });
      if (met === 4 && level < 4) {
        root.classList.remove('is-locked');
        void root.offsetWidth;
        root.classList.add('is-locked');
      }
      level = met;
      root.setAttribute('data-level', String(met));
      if (!v) { strength.textContent = 'Each rule you meet adds a bolt.'; return; }
      var b = document.createElement('b');
      b.textContent = WORDS[met] || 'Weak';
      var rest = met === 4 ? '. Locked.' : '. ' + (4 - met) + (4 - met === 1 ? ' rule to go.' : ' rules to go.');
      strength.replaceChildren(b, document.createTextNode(rest));
    }

    input.addEventListener('input', update);
    show.addEventListener('click', function () {
      var on = input.type === 'password';
      input.type = on ? 'text' : 'password';
      show.textContent = on ? 'Hide' : 'Show';
      show.setAttribute('aria-pressed', on ? 'true' : 'false');
      input.focus();
    });
    update();
  }

  window.initLockBuilder = initLockBuilder;
  function boot() { document.querySelectorAll('[data-mi="lock-builder"]').forEach(initLockBuilder); }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();

</script>
<script>
(function () {
  var host = document.querySelector('.mi-host'), orig = host.innerHTML, fn = window["initLockBuilder"];
  document.querySelector('[data-mi-reset]').addEventListener('click', function (e) {
    host.innerHTML = orig;
    host.querySelectorAll('[data-mi]').forEach(function (el) { if (typeof fn === 'function') fn(el); });
    var b = e.currentTarget; b.classList.remove('is-spin'); void b.offsetWidth; b.classList.add('is-spin');
    setTimeout(function () { b.classList.remove('is-spin'); }, 700);
  });
})();
</script>
</body>
</html>
