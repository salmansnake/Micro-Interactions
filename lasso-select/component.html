<div class="ls" data-mi="lasso-select">
  <div class="ls-head">
    <p class="ls-title">Brand Assets</p>
    <p class="ls-hint">Draw around files to select them. Hold Shift to add.</p>
  </div>
  <div class="ls-area" tabindex="-1">
    <ul class="ls-grid" role="listbox" aria-multiselectable="true" aria-label="Files">
      <li role="option" aria-selected="false" tabindex="0" style="--c:var(--brand-strong)"><i></i><span>logo-mark.svg</span></li>
      <li role="option" aria-selected="false" tabindex="-1" style="--c:var(--success)"><i></i><span>hero-v2.png</span></li>
      <li role="option" aria-selected="false" tabindex="-1" style="--c:var(--ai)"><i></i><span>pricing.fig</span></li>
      <li role="option" aria-selected="false" tabindex="-1" style="--c:var(--chart-2)"><i></i><span>deck-q4.pdf</span></li>
      <li role="option" aria-selected="false" tabindex="-1" style="--c:var(--chart-3)"><i></i><span>icon-set.zip</span></li>
      <li role="option" aria-selected="false" tabindex="-1" style="--c:var(--chart-1)"><i></i><span>palette.ase</span></li>
      <li role="option" aria-selected="false" tabindex="-1" style="--c:var(--chart-6)"><i></i><span>type-specimen.pdf</span></li>
      <li role="option" aria-selected="false" tabindex="-1" style="--c:var(--chart-5)"><i></i><span>photo-team.jpg</span></li>
      <li role="option" aria-selected="false" tabindex="-1" style="--c:var(--brand-strong)"><i></i><span>favicon.ico</span></li>
      <li role="option" aria-selected="false" tabindex="-1" style="--c:var(--success)"><i></i><span>og-image.png</span></li>
      <li role="option" aria-selected="false" tabindex="-1" style="--c:var(--ai)"><i></i><span>email-header.png</span></li>
      <li role="option" aria-selected="false" tabindex="-1" style="--c:var(--chart-2)"><i></i><span>brand-guide.pdf</span></li>
    </ul>
    <svg class="ls-svg" aria-hidden="true"><path class="ls-path" d=""></path></svg>
    <span class="ls-count" aria-hidden="true"></span>
  </div>
  <div class="ls-bar" role="toolbar" aria-label="Selection actions" hidden>
    <span class="ls-bar-text" aria-live="polite"></span>
    <button type="button" class="ls-act">Move</button>
    <button type="button" class="ls-act">Download</button>
    <button type="button" class="ls-clear" aria-label="Clear selection">×</button>
  </div>
</div>
