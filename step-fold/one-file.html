<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Step Fold</title>
<style>
/* Demo page only. Remove this block when pasting into your own page. */
body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 48px 16px; box-sizing: border-box; background: #F3F2EE; }
@media (prefers-color-scheme: dark) { body { background: #0C0D0C; } }
</style>
<style>
@import url('https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap');

/* Outcraft Design System v2: the tokens this component uses, scoped to .fo so they never affect the rest of your page. */
.fo {
  --duration-base: 200ms;
  --duration-slower: 480ms;
  --font-sans: "Geist", system-ui, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --leading-body: 22px;
  --leading-caption: 16px;
  --leading-h2: 36px;
  --leading-h3: 32px;
  --leading-title-sm: 24px;
  --radius-lg: 12px;
  --radius-md: 8px;
  --radius-sm: 6px;
  --radius-xl: 16px;
  --spring-pop: linear(0, 0.0413, 0.1464, 0.2895, 0.4487, 0.6073, 0.7529, 0.8776, 0.9776, 1.0517, 1.1013, 1.1292, 1.1394, 1.1357, 1.1225, 1.1033, 1.0813, 1.059, 1.0382, 1.0202, 1.0055, 0.9945, 0.9869, 0.9825, 0.9807, 0.9808, 0.9825, 0.985, 0.9881, 0.9912, 0.9941, 0.9967, 0.9989, 1.0005, 1.0017, 1.0024, 1.0027, 1.0027, 1.0025, 1.0022, 1);
  --spring-pop-duration: 680ms;
  --spring-press: linear(0, 0.0189, 0.0676, 0.1361, 0.2164, 0.3025, 0.3896, 0.4743, 0.5543, 0.628, 0.6945, 0.7535, 0.8049, 0.849, 0.8863, 0.9172, 0.9425, 0.9629, 0.9789, 0.9912, 1.0004, 1.0071, 1.0116, 1.0145, 1.016, 1.0166, 1.0164, 1.0156, 1.0146, 1.0133, 1.0118, 1.0104, 1.009, 1.0076, 1.0064, 1.0053, 1.0043, 1.0034, 1.0026, 1.002, 1);
  --spring-press-duration: 310ms;
  --spring-ui: linear(0, 0.0237, 0.0849, 0.1704, 0.2697, 0.3746, 0.4788, 0.5777, 0.6685, 0.7491, 0.8189, 0.8776, 0.9257, 0.9639, 0.9931, 1.0147, 1.0296, 1.0391, 1.0442, 1.046, 1.0451, 1.0425, 1.0387, 1.0342, 1.0294, 1.0246, 1.02, 1.0158, 1.012, 1.0087, 1.0059, 1.0037, 1.0019, 1.0005, 0.9994, 0.9987, 0.9982, 0.998, 0.9979, 0.9979, 1);
  --spring-ui-duration: 460ms;
  --text-body: 15px;
  --text-caption: 12px;
  --text-h2: 30px;
  --text-h3: 24px;
  --text-small: 13px;
  --text-title: 20px;
  --text-title-sm: 17px;
  --tracking-title: -0.015em;
  --aqua: #79EEEC;
  --aqua-700: #0B7573;
  --ash: #646A66;
  --black: #000000;
  --border: var(--line);
  --brand: var(--aqua);
  --card: var(--white);
  --danger: #ce2c31;
  --fill-on-subtle: color-mix(in oklab, var(--muted) 95%, var(--foreground));
  --foreground: var(--black);
  --line: #DCDED9;
  --mist: #ECEBE6;
  --muted: var(--mist);
  --muted-foreground: var(--ash);
  --primary: var(--black);
  --primary-foreground: #ffffff;
  --ring: var(--aqua-700);
  --shadow-sm: 0 1px 2px rgba(17, 17, 16, 0.04), 0 1px 3px rgba(17, 17, 16, 0.07);
  --soft-ground: #F3F2EE;
  --subtle: var(--soft-ground);
  --tint-c: 0.4;
  --tint-l: 0.92;
  --white: #FFFFFF;
}
/* Dark mode: follows data-theme="dark" (or class "dark") on any ancestor, or the system setting. */
[data-theme="dark"] .fo, .dark .fo {
  --aqua: #79EEEC;
  --aqua-700: #79EEEC;
  --ash: #A3A8A4;
  --black: #000000;
  --border: var(--line);
  --brand: var(--aqua);
  --card: var(--white);
  --danger: #d4373c;
  --fill-on-subtle: var(--muted);
  --foreground: #F3F2EE;
  --line: #313432;
  --mist: #2B2E2D;
  --muted: var(--mist);
  --muted-foreground: var(--ash);
  --primary: var(--aqua);
  --primary-foreground: #000000;
  --ring: var(--aqua);
  --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.4), 0 1px 3px rgba(0, 0, 0, 0.3);
  --soft-ground: #0C0D0C;
  --subtle: var(--soft-ground);
  --tint-c: 0.45;
  --tint-l: 0.32;
  --white: #161817;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]):not(.light) .fo {
    --aqua: #79EEEC;
    --aqua-700: #79EEEC;
    --ash: #A3A8A4;
    --black: #000000;
    --border: var(--line);
    --brand: var(--aqua);
    --card: var(--white);
    --danger: #d4373c;
    --fill-on-subtle: var(--muted);
    --foreground: #F3F2EE;
    --line: #313432;
    --mist: #2B2E2D;
    --muted: var(--mist);
    --muted-foreground: var(--ash);
    --primary: var(--aqua);
    --primary-foreground: #000000;
    --ring: var(--aqua);
    --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.4), 0 1px 3px rgba(0, 0, 0, 0.3);
    --soft-ground: #0C0D0C;
    --subtle: var(--soft-ground);
    --tint-c: 0.45;
    --tint-l: 0.32;
    --white: #161817;
  }
}

/* Step Fold — finished steps of a form fold up into summary chips; tap a chip to unfold and edit it.
   Outcraft Design System v2. Every value is an Outcraft token. */
.fo {
  --fo-bg: var(--card);
  --fo-fg: var(--foreground);
  --fo-muted: var(--muted-foreground);
  --fo-line: var(--border);
  --fo-sunken: var(--subtle);
  --fo-fill: var(--muted);
  --fo-accent: var(--primary);
  --fo-on-accent: var(--primary-foreground);
  display: flex;
  flex-direction: column;
  gap: 10px;
  width: 100%;
  max-width: 420px;
  box-sizing: border-box;
  padding: 20px;
  background: var(--fo-bg);
  color: var(--fo-fg);
  border-radius: var(--radius-xl);
  border: 1px solid var(--border);
  box-shadow: var(--shadow-sm);
  font: 400 var(--text-body)/var(--leading-body) var(--font-sans);
  letter-spacing: normal;
  text-align: left;
  -webkit-font-smoothing: antialiased;
  perspective: 900px;
}
.fo-chips { display: flex; flex-wrap: wrap; gap: 6px; min-height: 0; }
.fo-chips:empty { display: none; }
.fo-chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  height: 32px;
  padding: 0 12px 0 6px;
  border: 0;
  border-radius: var(--radius-sm);
  background: oklch(from var(--brand) var(--tint-l) calc(c * var(--tint-c)) h);
  color: var(--fo-fg);
  font: inherit;
  font-size: var(--text-small);
  cursor: pointer;
  transform-origin: 50% 0;
  animation: fo-chip var(--spring-pop-duration) var(--spring-pop) both;
}
.fo-chip i { display: grid; place-items: center; flex: none; width: 20px; height: 20px; border-radius: 50%; background: var(--fo-accent); color: var(--fo-on-accent); }
/* Lucide check, drawn as an icon so it sits in the true center (a text tick sat where the font put it).
   Its strokes span y 6 to 17 on the 24 grid, half a unit above middle, so it moves down that half unit. */
.fo-chip i svg { display: block; width: 14px; height: 14px; translate: 0 calc(100% / 48); }
.fo-chip small { color: var(--fo-muted); font-size: var(--text-caption); }
.fo-nowrap { white-space: nowrap; } /* "per seat" stays together, so a narrow card never leaves "seat" alone */
.fo-chip b { font-weight: 600; }
.fo-chip:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }
@keyframes fo-chip { from { opacity: 0; transform: translateY(14px) scale(0.7) rotateX(60deg); } }
.fo-step { border-radius: var(--radius-xl); background: var(--fo-sunken); transform-origin: 50% 0; }
.fo-step[hidden] { display: none; }
.fo-step.is-folding { animation: fo-fold var(--duration-slower) cubic-bezier(0.5, 0, 0.75, 0) forwards; }
@keyframes fo-fold { to { opacity: 0; transform: rotateX(-80deg) scaleY(0.4); } }
.fo-step.is-unfolding { animation: fo-unfold var(--spring-ui-duration) var(--spring-ui) both; }
@keyframes fo-unfold { from { opacity: 0; transform: rotateX(-70deg) scaleY(0.5); } }
.fo-step.is-waiting .fo-body { display: none; }
.fo-step.is-waiting { background: none; box-shadow: inset 0 0 0 1px var(--fo-fill); }
.fo-step.is-waiting .fo-step-title { color: var(--fo-muted); }
.fo-step-title { display: flex; align-items: center; gap: 10px; margin: 0; padding: 14px 16px; font-size: var(--text-title-sm); line-height: var(--leading-title-sm); font-weight: 600; letter-spacing: var(--tracking-title); }
/* A letter in a tile is centered on its capital height, not its line box (10b.5): the tile trims its text to cap height and centers it.
   Its 13px digits leave an even split above and below at 1x and 2x */
.fo-step-title span { display: block; align-content: center; text-align: center; text-box: trim-both cap alphabetic; width: 24px; height: 24px; border-radius: 50%; background: var(--fo-fill); font-size: var(--text-small); }
.fo-step:not(.is-waiting) .fo-step-title span { background: var(--fo-accent); color: var(--fo-on-accent); }
.fo-body { display: flex; flex-direction: column; gap: 12px; padding: 0 16px 16px; }
.fo-plans { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.fo-plan { position: relative; display: flex; flex-direction: column; gap: 2px; padding: 10px 12px; border-radius: var(--radius-lg); border: 1px solid var(--border); background: var(--fo-bg); box-shadow: 0 0 0 1px var(--fo-fill); cursor: pointer; transition: box-shadow var(--duration-base); }
.fo-plan input { position: absolute; opacity: 0; }
.fo-plan b { font-weight: 600; }
.fo-plan small { color: var(--fo-muted); font-size: var(--text-caption); line-height: var(--leading-caption); }
.fo-plan:has(input:checked) { box-shadow: 0 0 0 2px var(--fo-accent); }
.fo-plan:has(input:focus-visible) { outline: 2px solid var(--ring); outline-offset: 2px; }
.fo-stepper { display: flex; align-items: center; justify-content: center; gap: 16px; }
/* On the gray step panel the − and + use the fill for gray panels: a clear step darker than the panel in light, lighter in dark.
   The plain gray fill nearly matched the panel, and white matched the card around it and looked see-through (button rule 9) */
.fo-stepper button { display: grid; place-items: center; width: 40px; height: 40px; border: 0; border-radius: 50%; background: var(--fill-on-subtle); color: var(--fo-fg); font: 500 var(--text-title)/1 var(--font-sans); cursor: pointer; }
.fo-stepper button svg { display: block; width: 18px; height: 18px; }
.fo-stepper button:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }
.fo-seats { min-width: 2ch; font-size: var(--text-h2); line-height: var(--leading-h2); font-weight: 700; text-align: center; font-variant-numeric: tabular-nums; }
.fo-email { height: 44px; padding: 0 14px; border: 0; border-radius: var(--radius-md); background: var(--fo-bg); color: var(--fo-fg); font: inherit; font-size: var(--text-title-sm); outline: none; }
.fo-email:focus-visible { border-color: var(--ring); box-shadow: 0 0 0 3px color-mix(in srgb, var(--ring) 22%, transparent); }
.fo-email[aria-invalid="true"] { box-shadow: 0 0 0 2px var(--danger); }
.fo-next, .fo-start { height: 44px; border: 0; border-radius: var(--radius-md); background: var(--fo-accent); color: var(--fo-on-accent); font: inherit; font-size: var(--text-title-sm); font-weight: 600; cursor: pointer; transition: transform var(--spring-press-duration) var(--spring-press); }
.fo-next:active, .fo-start:active { transform: scale(0.97); }
.fo-next:focus-visible, .fo-start:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }
.fo-done { display: flex; flex-direction: column; gap: 12px; padding: 16px; border-radius: var(--radius-xl); background: var(--fo-sunken); animation: fo-unfold var(--spring-ui-duration) var(--spring-ui) both; }
.fo-total { margin: 0; font-size: var(--text-title-sm); line-height: var(--leading-title-sm); }
.fo-total b { font-size: var(--text-h3); line-height: var(--leading-h3); font-weight: 700; font-variant-numeric: tabular-nums; }
@media (prefers-reduced-motion: reduce) {
  .fo-chip, .fo-step.is-folding, .fo-step.is-unfolding, .fo-done { animation: none; }
}
/* Multi-line text wraps evenly and never ends on one or two lonely words */
.fo :is(p, li, dd, dt, small, label, figcaption, h1, h2, h3, h4) { text-wrap: balance; }
.fo [hidden] { display: none !important; }

</style>
</head>
<body>

<div class="fo" data-mi="step-fold">
  <div class="fo-chips" aria-label="Completed steps"></div>
  <section class="fo-step" data-step="plan" data-title="Plan">
    <p class="fo-step-title"><span>1</span>Choose a Plan</p>
    <div class="fo-body">
      <div class="fo-plans" role="radiogroup" aria-label="Plan">
        <label class="fo-plan"><input type="radio" name="fo-plan" value="Starter"><b>Starter</b><small>$12 <span class="fo-nowrap">per seat</span></small></label>
        <label class="fo-plan"><input type="radio" name="fo-plan" value="Pro" checked><b>Pro</b><small>$29 <span class="fo-nowrap">per seat</span></small></label>
        <label class="fo-plan"><input type="radio" name="fo-plan" value="Team"><b>Team</b><small>$79 <span class="fo-nowrap">per seat</span></small></label>
      </div>
      <button type="button" class="fo-next">Continue</button>
    </div>
  </section>
  <section class="fo-step" data-step="seats" data-title="Seats">
    <p class="fo-step-title"><span>2</span>How Many Seats?</p>
    <div class="fo-body">
      <div class="fo-stepper"><button type="button" class="fo-minus" aria-label="Fewer seats"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/></svg></button><output class="fo-seats" aria-live="polite">5</output><button type="button" class="fo-plus" aria-label="More seats"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="M12 5v14"/></svg></button></div>
      <button type="button" class="fo-next">Continue</button>
    </div>
  </section>
  <section class="fo-step" data-step="email" data-title="Billing">
    <p class="fo-step-title"><span>3</span>Billing Email</p>
    <div class="fo-body">
      <input class="fo-email" type="email" placeholder="billing@company.com" value="finance@northwind.co" aria-label="Billing email" autocomplete="off">
      <button type="button" class="fo-next">Continue</button>
    </div>
  </section>
  <section class="fo-done" hidden>
    <p class="fo-total"></p>
    <button type="button" class="fo-start">Start Free Trial</button>
  </section>
</div>


<script>
/* Step Fold — vanilla JS. Auto-initializes every [data-mi="step-fold"].
   Each .fo-step has data-step and data-title; summary() below says what its chip shows.
   Call window.initStepFold(el) for elements added later. */
(function () {
  'use strict';
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)');
  var PRICES = { Starter: 12, Pro: 29, Team: 79 };

  // Even line breaks: text that wraps to two or three lines is narrowed until its lines are close in length,
  // with the first line the longest, so no line runs long while the next holds a word or two.
  function evenLines(root) {
    var SEL = 'p, li, dd, dt, small, label, figcaption, h1, h2, h3, h4';
    function widths(el) {
      var range = document.createRange(), rows = [];
      range.selectNodeContents(el);
      Array.prototype.forEach.call(range.getClientRects(), function (b) {
        if (!b.width) return;
        var row = rows.filter(function (x) { return Math.abs(x.t - b.top) < b.height / 2; })[0];
        if (row) { row.l = Math.min(row.l, b.left); row.r = Math.max(row.r, b.right); } else rows.push({ t: b.top, l: b.left, r: b.right });
      });
      return rows.sort(function (a, b) { return a.t - b.t; }).map(function (x) { return x.r - x.l; });
    }
    function fit(el) {
      el.style.maxWidth = ''; el.style.textWrap = '';
      var cs = getComputedStyle(el), full = el.getBoundingClientRect().width;
      if (!full || cs.whiteSpace === 'nowrap' || /flex|grid/.test(cs.display)) return;
      if (Array.prototype.some.call(el.children, function (c) { return !/^inline/.test(getComputedStyle(c).display); })) return;
      el.style.textWrap = 'wrap';
      var n = widths(el).length, lo = 0, hi = full, w, L;
      if (n < 2 || n > 3) { el.style.textWrap = ''; return; }
      while (hi - lo > 1) { w = (lo + hi) / 2; el.style.maxWidth = w + 'px'; if (widths(el).length > n) lo = w; else hi = w; }
      var best = 0, gap = Infinity;
      for (w = Math.ceil(hi); w <= full; w += 2) {
        el.style.maxWidth = w + 'px'; L = widths(el);
        // Each line no longer than the one above (within 10%, which reads as equal). Keep the most even width,
        // and prefer the first line longer: a last line longer than the first costs three times its overhang
        var score = Math.max.apply(null, L) - Math.min.apply(null, L) + Math.max(0, L[n - 1] - L[0]) * 3;
        if (L.length === n && L.every(function (x, i) { return !i || x <= L[i - 1] * 1.1 + 1; }) && score < gap) { gap = score; best = w; }
      }
      if (!best) { el.style.maxWidth = ''; el.style.textWrap = ''; return; }
      el.style.maxWidth = best + 'px';
      if (cs.textAlign === 'center' && cs.display === 'block') { el.style.marginLeft = 'auto'; el.style.marginRight = 'auto'; }
    }
    var queued = false, lastW = 0;
    function run() { queued = false; Array.prototype.forEach.call(root.querySelectorAll(SEL), fit); }
    function later() { if (!queued) { queued = true; requestAnimationFrame(run); } }
    later();
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(later);
    if (window.ResizeObserver) new ResizeObserver(function () { var w = root.getBoundingClientRect().width; if (Math.abs(w - lastW) > 0.5) { lastW = w; later(); } }).observe(root);
    if (window.MutationObserver) new MutationObserver(later).observe(root, { subtree: true, childList: true, characterData: true, attributes: true, attributeFilter: ['hidden'] });
  }

  function initStepFold(root) {
    if (!root || root.__miFold) return;
    root.__miFold = true;
    evenLines(root);
    var steps = Array.prototype.slice.call(root.querySelectorAll('.fo-step'));
    var chips = root.querySelector('.fo-chips');
    var done = root.querySelector('.fo-done');
    var total = root.querySelector('.fo-total');
    var seatsOut = root.querySelector('.fo-seats');
    var email = root.querySelector('.fo-email');
    var seats = 5;
    var finished = {}; // step -> true
    var current = 0;

    function value(step) {
      var k = step.getAttribute('data-step');
      if (k === 'plan') return root.querySelector('input[name="fo-plan"]:checked').value;
      if (k === 'seats') return seats + (seats === 1 ? ' seat' : ' seats');
      if (k === 'email') return email.value.trim();
      return '';
    }

    function renderChips() {
      chips.replaceChildren();
      steps.forEach(function (s, i) {
        if (!finished[i] || i === current) return;
        var c = document.createElement('button');
        c.type = 'button';
        c.className = 'fo-chip';
        var n = document.createElement('i'); n.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>';
        var label = document.createElement('small'); label.textContent = s.getAttribute('data-title');
        var b = document.createElement('b'); b.textContent = value(s);
        c.append(n, label, b);
        c.setAttribute('aria-label', 'Edit ' + s.getAttribute('data-title') + ': ' + value(s));
        c.addEventListener('click', function () { open(i); });
        chips.appendChild(c);
      });
    }

    function layout() {
      var allDone = steps.every(function (s, i) { return finished[i]; }) && current === -1;
      steps.forEach(function (s, i) {
        s.hidden = !!finished[i] && i !== current;
        s.classList.toggle('is-waiting', !finished[i] && i !== current);
      });
      done.hidden = !allDone;
      if (allDone) {
        var plan = root.querySelector('input[name="fo-plan"]:checked').value;
        var b = document.createElement('b');
        b.textContent = '$' + (PRICES[plan] * seats).toLocaleString('en-US');
        total.replaceChildren(b, document.createTextNode(' per month after a 14-day trial. Billed to ' + email.value.trim() + '.'));
      }
      renderChips();
    }

    function open(i, quiet) {
      var prev = current;
      current = i;
      layout();
      var s = steps[i];
      if (!reduce.matches) { s.classList.remove('is-unfolding'); void s.offsetWidth; s.classList.add('is-unfolding'); }
      var focusable = s.querySelector('input, button');
      if (focusable && !quiet) focusable.focus({ preventScroll: true });
      return prev;
    }

    function complete(i) {
      if (steps[i].getAttribute('data-step') === 'email' && !/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email.value.trim())) {
        email.setAttribute('aria-invalid', 'true'); email.focus(); return;
      }
      email.removeAttribute('aria-invalid');
      finished[i] = true;
      var next = steps.findIndex(function (s, k) { return !finished[k]; });
      var go = function () {
        steps[i].classList.remove('is-folding');
        if (next === -1) { current = -1; layout(); root.querySelector('.fo-start').focus({ preventScroll: true }); }
        else open(next);
      };
      if (reduce.matches) { go(); return; }
      steps[i].classList.add('is-folding');
      setTimeout(go, 400);
    }

    steps.forEach(function (s, i) {
      s.querySelector('.fo-next').addEventListener('click', function () { complete(i); });
    });
    root.querySelector('.fo-minus').addEventListener('click', function () { seats = Math.max(1, seats - 1); seatsOut.textContent = seats; });
    root.querySelector('.fo-plus').addEventListener('click', function () { seats = Math.min(99, seats + 1); seatsOut.textContent = seats; });
    email.addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); complete(steps.indexOf(email.closest('.fo-step'))); } });
    root.querySelector('.fo-start').addEventListener('click', function () {
      total.textContent = 'Trial started. Welcome to ' + root.querySelector('input[name="fo-plan"]:checked').value + '.';
      setTimeout(function () { finished = {}; open(0); }, 1800);
    });
    open(0, true);
  }

  window.initStepFold = initStepFold;
  function boot() { document.querySelectorAll('[data-mi="step-fold"]').forEach(initStepFold); }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();

</script>
</body>
</html>
