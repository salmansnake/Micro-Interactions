<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Seat Stacker</title>
<style>
/* Demo page only. Remove this block when pasting into your own page. */
body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 48px 16px; box-sizing: border-box; background: #F3F2EE; }
@media (prefers-color-scheme: dark) { body { background: #0C0D0C; } }
</style>
<style>
@import url('https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap');

/* Outcraft Design System v2: the tokens this component uses, scoped to .ss so they never affect the rest of your page. */
.ss {
  --duration-reduced: 120ms;
  --duration-slow: 320ms;
  --ease-in: cubic-bezier(0.5, 0, 0.78, 0.24);
  --font-sans: "Geist", system-ui, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --leading-body: 22px;
  --leading-caption: 16px;
  --leading-h3: 32px;
  --leading-title-sm: 24px;
  --radius-full: 9999px;
  --radius-lg: 12px;
  --radius-md: 8px;
  --radius-xl: 16px;
  --spring-pop: linear(0, 0.0413, 0.1464, 0.2895, 0.4487, 0.6073, 0.7529, 0.8776, 0.9776, 1.0517, 1.1013, 1.1292, 1.1394, 1.1357, 1.1225, 1.1033, 1.0813, 1.059, 1.0382, 1.0202, 1.0055, 0.9945, 0.9869, 0.9825, 0.9807, 0.9808, 0.9825, 0.985, 0.9881, 0.9912, 0.9941, 0.9967, 0.9989, 1.0005, 1.0017, 1.0024, 1.0027, 1.0027, 1.0025, 1.0022, 1);
  --spring-pop-duration: 680ms;
  --spring-press: linear(0, 0.0189, 0.0676, 0.1361, 0.2164, 0.3025, 0.3896, 0.4743, 0.5543, 0.628, 0.6945, 0.7535, 0.8049, 0.849, 0.8863, 0.9172, 0.9425, 0.9629, 0.9789, 0.9912, 1.0004, 1.0071, 1.0116, 1.0145, 1.016, 1.0166, 1.0164, 1.0156, 1.0146, 1.0133, 1.0118, 1.0104, 1.009, 1.0076, 1.0064, 1.0053, 1.0043, 1.0034, 1.0026, 1.002, 1);
  --spring-press-duration: 310ms;
  --spring-ui: linear(0, 0.0237, 0.0849, 0.1704, 0.2697, 0.3746, 0.4788, 0.5777, 0.6685, 0.7491, 0.8189, 0.8776, 0.9257, 0.9639, 0.9931, 1.0147, 1.0296, 1.0391, 1.0442, 1.046, 1.0451, 1.0425, 1.0387, 1.0342, 1.0294, 1.0246, 1.02, 1.0158, 1.012, 1.0087, 1.0059, 1.0037, 1.0019, 1.0005, 0.9994, 0.9987, 0.9982, 0.998, 0.9979, 0.9979, 1);
  --spring-ui-duration: 460ms;
  --text-body: 15px;
  --text-caption: 12px;
  --text-h1: 36px;
  --text-h3: 24px;
  --text-small: 13px;
  --text-title-sm: 17px;
  --tracking-title: -0.015em;
  --aqua: #79EEEC;
  --aqua-700: #0B7573;
  --ash: #646A66;
  --black: #000000;
  --border: var(--line);
  --card: var(--white);
  --chart-1: var(--aqua);
  --chart-2: var(--pink);
  --chart-3: var(--orange);
  --chart-4: var(--sage);
  --chart-5: var(--olive);
  --foreground: var(--black);
  --green-11: #218358;
  --green-3: #e6f6eb;
  --input: var(--line-strong);
  --lift: #FFFFFF;
  --line: #DCDED9;
  --line-strong: #C6C9C3;
  --mist: #ECEBE6;
  --muted: var(--mist);
  --muted-foreground: var(--ash);
  --olive: #AA9856;
  --on-chart: #000000;
  --orange: #FE8C5F;
  --pink: #FFC7F6;
  --primary: var(--black);
  --primary-foreground: #ffffff;
  --raised: var(--lift);
  --ring: var(--aqua-700);
  --sage: #99AD88;
  --shadow-sm: 0 1px 2px rgba(17, 17, 16, 0.04), 0 1px 3px rgba(17, 17, 16, 0.07);
  --soft-ground: #F3F2EE;
  --subtle: var(--soft-ground);
  --success: var(--green-11);
  --success-subtle: var(--green-3);
  --success-text: #1f7b53;
  --white: #FFFFFF;
}
/* Dark mode: follows data-theme="dark" (or class "dark") on any ancestor, or the system setting. */
[data-theme="dark"] .ss, .dark .ss {
  --aqua: #79EEEC;
  --aqua-700: #79EEEC;
  --ash: #A3A8A4;
  --black: #000000;
  --border: var(--line);
  --card: var(--white);
  --chart-1: var(--aqua);
  --chart-2: var(--pink);
  --chart-3: var(--orange);
  --chart-4: var(--sage);
  --chart-5: var(--olive);
  --foreground: #F3F2EE;
  --green-11: #3dd68c;
  --green-3: #132d21;
  --input: var(--line-strong);
  --lift: #3F4341;
  --line: #313432;
  --line-strong: #434744;
  --mist: #2B2E2D;
  --muted: var(--mist);
  --muted-foreground: var(--ash);
  --olive: #AA9856;
  --on-chart: #000000;
  --orange: #FE8C5F;
  --pink: #FFC7F6;
  --primary: var(--aqua);
  --primary-foreground: #000000;
  --raised: var(--lift);
  --ring: var(--aqua);
  --sage: #99AD88;
  --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.4), 0 1px 3px rgba(0, 0, 0, 0.3);
  --soft-ground: #0C0D0C;
  --subtle: var(--soft-ground);
  --success: #218358;
  --success-subtle: var(--green-3);
  --success-text: var(--green-11);
  --white: #161817;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]):not(.light) .ss {
    --aqua: #79EEEC;
    --aqua-700: #79EEEC;
    --ash: #A3A8A4;
    --black: #000000;
    --border: var(--line);
    --card: var(--white);
    --chart-1: var(--aqua);
    --chart-2: var(--pink);
    --chart-3: var(--orange);
    --chart-4: var(--sage);
    --chart-5: var(--olive);
    --foreground: #F3F2EE;
    --green-11: #3dd68c;
    --green-3: #132d21;
    --input: var(--line-strong);
    --lift: #3F4341;
    --line: #313432;
    --line-strong: #434744;
    --mist: #2B2E2D;
    --muted: var(--mist);
    --muted-foreground: var(--ash);
    --olive: #AA9856;
    --on-chart: #000000;
    --orange: #FE8C5F;
    --pink: #FFC7F6;
    --primary: var(--aqua);
    --primary-foreground: #000000;
    --raised: var(--lift);
    --ring: var(--aqua);
    --sage: #99AD88;
    --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.4), 0 1px 3px rgba(0, 0, 0, 0.3);
    --soft-ground: #0C0D0C;
    --subtle: var(--soft-ground);
    --success: #218358;
    --success-subtle: var(--green-3);
    --success-text: var(--green-11);
    --white: #161817;
  }
}

/* Seat Stacker — avatars stack as you add seats, and crossing a volume tier rolls the price down.
   Outcraft Design System v2. Every value is an Outcraft token. */
.ss {
  --ss-bg: var(--card);
  --ss-fg: var(--foreground);
  --ss-muted: var(--muted-foreground);
  --ss-line: var(--border);
  --ss-sunken: var(--subtle);
  --ss-fill: var(--muted);
  --ss-accent: var(--primary);
  --ss-on-accent: var(--primary-foreground);
  --ss-green: var(--success);
  --ss-green-text: var(--success-text);
  --ss-green-soft: var(--success-subtle);
  display: flex;
  flex-direction: column;
  gap: 16px;
  width: 100%;
  max-width: 420px;
  box-sizing: border-box;
  padding: 20px;
  background: var(--ss-bg);
  color: var(--ss-fg);
  border-radius: var(--radius-xl);
  border: 1px solid var(--border);
  box-shadow: var(--shadow-sm);
  font: 400 var(--text-body)/var(--leading-body) var(--font-sans);
  letter-spacing: normal;
  text-align: left;
  -webkit-font-smoothing: antialiased;
}
.ss-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 32px; }
.ss-title { margin: 0; font-size: var(--text-title-sm); line-height: var(--leading-title-sm); font-weight: 600; letter-spacing: var(--tracking-title); }
.ss-avatars { display: flex; flex-direction: row-reverse; justify-content: flex-end; }
.ss-av {
  display: grid;
  place-items: center;
  width: 30px;
  height: 30px;
  margin-left: -8px;
  border-radius: 50%;
  box-shadow: 0 0 0 2px var(--ss-bg);
  color: var(--on-chart);
  font-size: calc(var(--text-caption) - 1px);
  font-weight: 700;
  animation: ss-pop var(--spring-pop-duration) var(--spring-pop) both;
}
.ss-av:last-child { margin-left: 0; }
.ss-av.is-more { background: var(--ss-fill); color: var(--ss-fg); font-size: calc(var(--text-caption) - 1px); }
.ss-av.is-leaving { animation: ss-leave var(--duration-slow) var(--ease-in) forwards; }
@keyframes ss-pop { from { transform: scale(0) translateY(6px); } }
@keyframes ss-leave { to { transform: scale(0); opacity: 0; } }
.ss-control { display: flex; align-items: center; justify-content: center; gap: 8px; }
.ss-step {
  display: grid;
  place-items: center;
  width: 44px;
  height: 44px;
  border: 0;
  border-radius: 50%;
  background: var(--ss-fill);
  color: var(--ss-fg);
  font: 500 var(--text-h3)/1 var(--font-sans);
  cursor: pointer;
  transition: transform var(--spring-press-duration) var(--spring-press);
}
.ss-step:active { transform: scale(0.9); }
.ss-step:disabled { opacity: 0.35; cursor: default; }
.ss-step:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }
.ss-count { width: 3.2ch; padding: 0; border: 0; border-radius: var(--radius-md); background: none; color: var(--ss-fg); font: 700 calc(var(--text-h1) + 4px) / 48px var(--font-sans); text-align: center; font-variant-numeric: tabular-nums; outline: none; }
.ss-count:focus-visible { border-color: var(--ring); box-shadow: 0 0 0 3px color-mix(in srgb, var(--ring) 22%, transparent); }
.ss-sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
/* Tiers */
.ss-tiers { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; padding: 4px; border-radius: var(--radius-lg); background: var(--ss-sunken); }
.ss-tier { display: flex; flex-direction: column; align-items: center; gap: 1px; padding: 8px 4px; border-radius: var(--radius-md); transition: background-color var(--duration-slow), box-shadow var(--duration-slow); }
.ss-tier b { font-size: var(--text-body); font-weight: 600; font-variant-numeric: tabular-nums; }
.ss-tier span { color: var(--ss-muted); font-size: calc(var(--text-caption) - 1px); line-height: 13px; }
.ss-tier.is-on { background: var(--raised); box-shadow: 0 0 0 1px var(--ss-line), var(--shadow-sm); }
.ss-tier.is-new { animation: ss-tier var(--spring-pop-duration) var(--spring-pop); }
@keyframes ss-tier { 30% { transform: scale(1.08); } 100% { transform: none; } }
/* Price odometers */
.ss-price { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.ss-price > div { padding: 12px 14px; border-radius: var(--radius-lg); background: var(--ss-sunken); }
.ss-k { margin: 0 0 2px; color: var(--ss-muted); font-size: var(--text-caption); line-height: var(--leading-caption); }
.ss-v { display: flex; align-items: baseline; margin: 0; font-size: var(--text-h3); line-height: var(--leading-h3); font-weight: 700; font-variant-numeric: tabular-nums; }
.ss-v small { margin-left: 3px; color: var(--ss-muted); font-size: var(--text-small); font-weight: 400; }
.ss-odo { display: inline-flex; height: 34px; overflow: hidden; }
.ss-col { display: flex; flex-direction: column; transition: transform var(--spring-ui-duration) var(--spring-ui); }
.ss-col span { height: 34px; line-height: 34px; text-align: center; }
.ss-note { min-height: 30px; margin: 0; }
.ss-note:empty { display: none; }
.ss-chip { display: inline-flex; align-items: center; gap: 6px; padding: 5px 12px; border-radius: var(--radius-full); background: var(--ss-green-soft); color: var(--ss-green-text); font-size: var(--text-small); font-weight: 600; animation: ss-chip var(--spring-pop-duration) var(--spring-pop) both; }
@keyframes ss-chip { from { opacity: 0; transform: translateY(6px) scale(0.9); } }
@media (prefers-reduced-motion: reduce) {
  .ss-av, .ss-av.is-leaving, .ss-tier.is-new, .ss-chip { animation: none; }
  .ss-col { transition-duration: var(--duration-reduced); }
}
.ss [hidden] { display: none !important; }

</style>
</head>
<body>

<div class="ss" data-mi="seat-stacker" data-seats="3">
  <div class="ss-head">
    <p class="ss-title">Team Seats</p>
    <div class="ss-avatars" aria-hidden="true"></div>
  </div>
  <div class="ss-control">
    <button type="button" class="ss-step" data-step="-1" aria-label="Remove a seat">−</button>
    <label class="ss-count-wrap"><span class="ss-sr">Seats</span><input class="ss-count" type="text" inputmode="numeric" value="3" aria-label="Seats"></label>
    <button type="button" class="ss-step" data-step="1" aria-label="Add a seat">+</button>
  </div>
  <div class="ss-tiers" aria-hidden="true">
    <div class="ss-tier" data-min="1"><b>$12</b><span>1–9 seats</span></div>
    <div class="ss-tier" data-min="10"><b>$10</b><span>10–24 seats</span></div>
    <div class="ss-tier" data-min="25"><b>$8</b><span>25+ seats</span></div>
  </div>
  <div class="ss-price">
    <div><p class="ss-k">Per Seat</p><p class="ss-v">$<span class="ss-odo" data-odo="per"></span><small>/mo</small></p></div>
    <div><p class="ss-k">Total</p><p class="ss-v ss-total">$<span class="ss-odo" data-odo="total"></span><small>/mo</small></p></div>
  </div>
  <p class="ss-note" role="status" aria-live="polite"></p>
</div>


<script>
/* Seat Stacker — vanilla JS. Auto-initializes every [data-mi="seat-stacker"].
   Tiers come from the .ss-tier elements (data-min + their $ price). Call window.initSeatStacker(el) for later elements. */
(function () {
  'use strict';
  var PEOPLE = [['SH', 'var(--chart-1)'], ['MK', 'var(--chart-2)'], ['AL', 'var(--chart-4)'], ['SR', 'var(--chart-3)'], ['JT', 'var(--chart-5)'], ['NB', 'var(--chart-1)'], ['RP', 'var(--chart-2)'], ['DV', 'var(--chart-4)']];
  var SHOW = 6; // avatars before "+n"
  var MAX = 99;

  // Odometer: one column of 0–9 per digit, rolled with a spring.
  function odometer(el, value) {
    var s = String(value);
    if (el.children.length !== s.length) {
      el.replaceChildren();
      for (var i = 0; i < s.length; i++) {
        var col = document.createElement('span');
        col.className = 'ss-col';
        for (var d = 0; d <= 9; d++) { var n = document.createElement('span'); n.textContent = d; col.appendChild(n); }
        el.appendChild(col);
      }
      void el.offsetWidth;
    }
    Array.prototype.forEach.call(el.children, function (col, i) {
      col.style.transform = 'translateY(' + (-Number(s[i]) * 34) + 'px)';
    });
    el.setAttribute('aria-label', s);
  }

  function initSeatStacker(root) {
    if (!root || root.__miSeat) return;
    root.__miSeat = true;
    var count = root.querySelector('.ss-count');
    var avatars = root.querySelector('.ss-avatars');
    var tiers = Array.prototype.slice.call(root.querySelectorAll('.ss-tier')).map(function (t) {
      return { el: t, min: Number(t.getAttribute('data-min')), price: Number(t.querySelector('b').textContent.replace(/[^0-9.]/g, '')) };
    });
    var per = root.querySelector('[data-odo="per"]');
    var total = root.querySelector('[data-odo="total"]');
    var note = root.querySelector('.ss-note');
    var minus = root.querySelector('[data-step="-1"]');
    var plus = root.querySelector('[data-step="1"]');
    var seats = Number(root.getAttribute('data-seats')) || 3;
    var tierIx = -1;

    function tierFor(n) { var t = 0; tiers.forEach(function (x, i) { if (n >= x.min) t = i; }); return t; }

    function drawAvatars(prev) {
      var shown = Math.min(seats, SHOW);
      var more = seats - shown;
      var current = Array.prototype.slice.call(avatars.querySelectorAll('.ss-av:not(.is-leaving):not(.is-more)'));
      // remove extras with a shrink
      for (var i = current.length - 1; i >= shown; i--) {
        (function (el) { el.classList.add('is-leaving'); setTimeout(function () { el.remove(); }, 300); })(current[i]);
      }
      for (var j = current.length; j < shown; j++) {
        var p = PEOPLE[j % PEOPLE.length];
        var a = document.createElement('span');
        a.className = 'ss-av';
        a.textContent = p[0];
        a.style.background = p[1];
        var moreEl = avatars.querySelector('.is-more');
        avatars.insertBefore(a, moreEl ? moreEl.nextSibling : avatars.firstChild);
      }
      var m = avatars.querySelector('.is-more');
      if (more > 0) {
        if (!m) { m = document.createElement('span'); m.className = 'ss-av is-more'; avatars.insertBefore(m, avatars.firstChild); }
        m.textContent = '+' + more;
      } else if (m) m.remove();
    }

    function set(n, fromInput) {
      n = Math.max(1, Math.min(MAX, Math.round(n) || 1));
      var prev = seats;
      seats = n;
      if (!fromInput) count.value = n;
      minus.disabled = n <= 1;
      plus.disabled = n >= MAX;
      var t = tierFor(n);
      tiers.forEach(function (x, i) { x.el.classList.toggle('is-on', i === t); });
      odometer(per, tiers[t].price);
      odometer(total, tiers[t].price * n);
      if (tierIx !== -1 && t !== tierIx) {
        tiers[t].el.classList.remove('is-new');
        void tiers[t].el.offsetWidth;
        tiers[t].el.classList.add('is-new');
        var chip = document.createElement('span');
        chip.className = 'ss-chip';
        chip.textContent = t > tierIx
          ? 'Tier unlocked: you now pay $' + tiers[t].price + ' per seat'
          : 'Back to $' + tiers[t].price + ' per seat';
        note.replaceChildren(chip);
      } else if (tierIx !== -1 && t < tiers.length - 1) {
        var next = tiers[t + 1];
        note.textContent = '';
        if (next.min - n <= 3) {
          var c = document.createElement('span'); c.className = 'ss-chip';
          c.textContent = (next.min - n) + ' more ' + (next.min - n === 1 ? 'seat' : 'seats') + ' unlocks $' + next.price + ' per seat';
          note.replaceChildren(c);
        }
      } else if (t === tiers.length - 1 && t === tierIx) note.textContent = '';
      tierIx = t;
      drawAvatars(prev);
    }

    root.addEventListener('click', function (e) {
      var b = e.target.closest('[data-step]');
      if (b && !b.disabled) set(seats + Number(b.getAttribute('data-step')));
    });
    count.addEventListener('input', function () {
      var v = Number(count.value.replace(/\D/g, ''));
      if (v) set(v, true);
    });
    count.addEventListener('blur', function () { count.value = seats; });
    count.addEventListener('keydown', function (e) {
      if (e.key === 'ArrowUp') { e.preventDefault(); set(seats + 1); }
      if (e.key === 'ArrowDown') { e.preventDefault(); set(seats - 1); }
    });
    set(seats);
  }

  window.initSeatStacker = initSeatStacker;
  function boot() { document.querySelectorAll('[data-mi="seat-stacker"]').forEach(initSeatStacker); }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();

</script>
</body>
</html>
