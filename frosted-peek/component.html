<div class="fp" data-mi="frosted-peek">
  <div class="fp-head">
    <div>
      <p class="fp-eyebrow">Revenue Forecast</p>
      <p class="fp-total"><span class="fp-secret">$548k</span> over the next 12 months</p>
    </div>
    <span class="fp-badge">Pro</span>
  </div>
  <div class="fp-chart" tabindex="0" role="slider" aria-label="Peek at the forecast by month" aria-valuemin="0" aria-valuemax="11" aria-valuenow="0">
    <svg class="fp-svg" viewBox="0 0 480 200" preserveAspectRatio="none" aria-hidden="true"></svg>
    <div class="fp-months" aria-hidden="true"></div>
    <div class="fp-frost" aria-hidden="true"></div>
    <div class="fp-lens" aria-hidden="true">
      <span class="fp-tip"></span>
      <span class="fp-dot"></span>
      <span class="fp-grip"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5.5 5 2.5 8l3 3M10.5 5l3 3-3 3"/></svg></span>
    </div>
    <span class="fp-hint" aria-hidden="true">Drag across to peek</span>
  </div>
  <div class="fp-foot">
    <p class="fp-note">Forecasts are part of Pro. Peek at any month for free.</p>
    <button type="button" class="fp-cta">Unlock Forecasts</button>
  </div>
</div>
