<style>

<style>

  --spring-press-duration: 310ms;
  --spring-ui: linear(0, 0.0237, 0.0849, 0.1704, 0.2697, 0.3746, 0.4788, 0.5777, 0.6685, 0.7491, 0.8189, 0.8776, 0.9257, 0.9639, 0.9931, 1.0147, 1.0296, 1.0391, 1.0442, 1.046, 1.0451, 1.0425, 1.0387, 1.0342, 1.0294, 1.0246, 1.02, 1.0158, 1.012, 1.0087, 1.0059, 1.0037, 1.0019, 1.0005, 0.9994, 0.9987, 0.9982, 0.998, 0.9979, 0.9979, 1);
  --spring-ui-duration: 460ms;
  --text-body: 15px;
  --text-caption: 12px;
  --text-h3: 24px;
  --text-small: 13px;
  --tracking-title: -0.015em;
  --aqua: #79EEEC;
  --aqua-700: #0B7573;
  --ash: #646A66;
  --black: #000000;
  --border: var(--line);
  --brand: var(--aqua);
  --brand-strong: var(--aqua-700);
  --brand-text: var(--aqua-700);
  --card: var(--white);
  --foreground: var(--black);
  --frost: rgba(255, 255, 255, 0.74);
  --frost-border: rgba(0, 0, 0, 0.08);
  --green-11: #218358;
  --green-3: #e6f6eb;
  --line: #DCDED9;
  --mist: #ECEBE6;
  --muted: var(--mist);
  --muted-foreground: var(--ash);
  --primary: var(--black);
  --primary-foreground: #ffffff;
  --ring: var(--aqua-700);
  --shadow-lg: 0 4px 8px -2px rgba(17, 17, 16, 0.06), 0 16px 32px -8px rgba(17, 17, 16, 0.14);
  --shadow-sm: 0 1px 2px rgba(17, 17, 16, 0.04), 0 1px 3px rgba(17, 17, 16, 0.07);
  --success: var(--green-11);
  --success-subtle: var(--green-3);
  --success-text: #1f7b53;
  --white: #FFFFFF;
}
/* Dark mode: follows data-theme="dark" (or class "dark") on any ancestor, or the system setting. */
[data-theme="dark"] .fp, .dark .fp {

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]):not(.light) .fp {
    --aqua: #79EEEC;
    --aqua-700: #79EEEC;
    --ash: #A3A8A4;
    --black: #000000;
    --border: var(--line);
    --brand: var(--aqua);
    --brand-strong: var(--aqua);

    --frost-border: rgba(243, 242, 238, 0.1);

    --green-3: #132d21;
    --line: #313432;

    --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.4), 0 1px 3px rgba(0, 0, 0, 0.3);

/* Frosted Peek — a locked feature you can wipe a window into before you pay.
   Outcraft Design System v2: a frosted material over real content, a Frost lens. */
@property --fp-x { syntax: "<length>"; inherits: true; initial-value: 0px; }
@property --fp-o { syntax: "<number>"; inherits: true; initial-value: 0; }
@property --fp-w { syntax: "<length>"; inherits: true; initial-value: 40px; }
.fp {
  --fp-bg: var(--card);
  --fp-fg: var(--foreground);
  --fp-muted: var(--muted-foreground);
  --fp-line: var(--border);
  --fp-fill: var(--muted);
  --fp-accent: var(--primary);
  --fp-on-accent: var(--primary-foreground);
  --fp-green: var(--success);
  --fp-green-text: var(--success-text);
  --fp-green-soft: var(--success-subtle);
  --fp-glass-edge: var(--frost-border);
  --fp-glass: var(--frost);
  --fp-glass-shadow: var(--shadow-lg);
  display: flex;
  flex-direction: column;
  gap: 14px;
  width: 100%;
  max-width: 520px;
  box-sizing: border-box;
  padding: 20px;
  background: var(--fp-bg);
  color: var(--fp-fg);
  border-radius: var(--radius-xl);
  border: 1px solid var(--border);
  box-shadow: var(--shadow-sm);
  font: 400 var(--text-body)/var(--leading-body) var(--font-sans);
  letter-spacing: normal;
  text-align: left;
  -webkit-font-smoothing: antialiased;
}
.fp-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
.fp-eyebrow { margin: 0; color: var(--fp-muted); font-size: var(--text-small); line-height: var(--leading-small); font-weight: 600; letter-spacing: normal; }
.fp-total { margin: 2px 0 0; color: var(--fp-muted); font-size: var(--text-body); }
.fp-secret { display: inline-block; color: var(--fp-fg); font-size: var(--text-h3); line-height: var(--leading-h3); font-weight: 700; letter-spacing: var(--tracking-title); filter: blur(7px); transition: filter var(--spring-panel-duration) var(--spring-panel); }
.fp.is-unlocked .fp-secret { filter: none; }
.fp-badge { flex: none; padding: 3px 10px; border-radius: var(--radius-full); background: color-mix(in srgb, var(--brand) 14%, transparent); color: var(--brand-text); font-size: var(--text-caption); font-weight: 600; transition: background-color var(--duration-slow), color var(--duration-slow); }
.fp.is-unlocked .fp-badge { background: var(--fp-green-soft); color: var(--fp-green-text); }

/* Chart + frost */
.fp-chart {
  --fp-x: 0px;
  --fp-o: 0;
  --fp-w: 40px;
  position: relative;
  height: 200px;
  overflow: hidden;
  border-radius: var(--radius-lg);
  background: color-mix(in srgb, var(--brand) 4%, var(--fp-bg));
  cursor: ew-resize;
  touch-action: pan-y;
  outline: none;
  transition: --fp-o var(--spring-ui-duration) var(--spring-ui), --fp-x var(--duration-fast) linear, --fp-w var(--spring-panel-duration) var(--spring-panel);
}
.fp-chart:focus-visible { box-shadow: 0 0 0 3px var(--ring); }
.fp-chart.is-dragging { transition: --fp-o var(--spring-ui-duration) var(--spring-ui), --fp-w var(--spring-panel-duration) var(--spring-panel); }
.fp-svg { position: absolute; inset: 0 0 22px; width: 100%; height: calc(100% - 22px); }
.fp-svg .fp-grid { stroke: var(--fp-line); stroke-width: 1; vector-effect: non-scaling-stroke; }
.fp-svg .fp-area { fill: color-mix(in srgb, var(--brand) 16%, transparent); }
.fp-svg .fp-line { fill: none; stroke: var(--brand-strong); stroke-width: 2.5; stroke-linejoin: round; stroke-linecap: round; vector-effect: non-scaling-stroke; }
.fp-months { position: absolute; left: 0; right: 0; bottom: 4px; display: flex; color: var(--fp-muted); font-size: calc(var(--text-caption) - 1px); line-height: 13px; }
.fp-months span { flex: 1; text-align: center; }
.fp-frost {
  position: absolute;
  inset: 0;
  background: color-mix(in srgb, var(--fp-bg) 38%, transparent);
  -webkit-backdrop-filter: blur(var(--blur-sm)) saturate(var(--frost-saturate));
  backdrop-filter: blur(var(--blur-sm)) saturate(var(--frost-saturate));
  --hole: color-mix(in srgb, var(--black) calc((1 - var(--fp-o)) * 100%), transparent);
  -webkit-mask-image: linear-gradient(to right, var(--black) calc(var(--fp-x) - var(--fp-w) - 14px), var(--hole) calc(var(--fp-x) - var(--fp-w)), var(--hole) calc(var(--fp-x) + var(--fp-w)), var(--black) calc(var(--fp-x) + var(--fp-w) + 14px));
  mask-image: linear-gradient(to right, var(--black) calc(var(--fp-x) - var(--fp-w) - 14px), var(--hole) calc(var(--fp-x) - var(--fp-w)), var(--hole) calc(var(--fp-x) + var(--fp-w)), var(--black) calc(var(--fp-x) + var(--fp-w) + 14px));
  pointer-events: none;
}
/* Frost lens marking the clear window */
.fp-lens {
  position: absolute;
  top: 6px;
  bottom: 6px;
  left: var(--fp-x);
  width: calc(var(--fp-w) * 2);
  margin-left: calc(var(--fp-w) * -1);
  border-radius: var(--radius-xl);
  box-shadow: 0 0 0 1px var(--fp-glass-edge), var(--shadow-lg);
  opacity: var(--fp-o);
  transform: scale(calc(0.9 + var(--fp-o) * 0.1));
  pointer-events: none;
}
.fp.is-unlocked .fp-lens { opacity: 0; }
.fp-tip {
  position: absolute;
  top: 8px;
  left: 50%;
  padding: 4px 10px;
  border-radius: var(--radius-full);
  background: var(--fp-fg);
  color: var(--fp-bg);
  font-size: var(--text-caption);
  line-height: var(--leading-caption);
  font-weight: 600;
  white-space: nowrap;
  font-variant-numeric: tabular-nums;
  transform: translateX(-50%);
}
.fp-dot {
  position: absolute;
  left: 50%;
  top: var(--fp-y, 50%);
  width: 10px;
  height: 10px;
  margin: -5px 0 0 -5px;
  border-radius: 50%;
  background: var(--fp-accent);
  box-shadow: 0 0 0 3px var(--fp-bg);
  transition: top var(--spring-ui-duration) var(--spring-ui);
}
.fp-grip {
  position: absolute;
  left: 50%;
  bottom: 6px;
  display: grid;
  place-items: center;
  width: 36px;
  height: 22px;
  border-radius: var(--radius-full);
  background: var(--fp-glass);
  -webkit-backdrop-filter: blur(var(--blur-md)) saturate(var(--frost-saturate));
  backdrop-filter: blur(var(--blur-md)) saturate(var(--frost-saturate));
  box-shadow: var(--fp-glass-shadow);
  color: var(--fp-fg);
  transform: translateX(-50%);
}
.fp-grip svg { width: 14px; height: 14px; }
.fp-hint {
  position: absolute;
  left: 50%;
  top: 50%;
  padding: 8px 14px;
  border-radius: var(--radius-full);
  background: var(--fp-glass);
  -webkit-backdrop-filter: blur(var(--blur-md)) saturate(var(--frost-saturate));
  backdrop-filter: blur(var(--blur-md)) saturate(var(--frost-saturate));
  box-shadow: var(--fp-glass-shadow);
  color: var(--fp-fg);
  font-size: var(--text-small);
  font-weight: 600;
  white-space: nowrap;
  transform: translate(-50%, -50%);
  transition: opacity var(--duration-base), transform var(--spring-press-duration) var(--spring-press);
  pointer-events: none;
}
.fp-chart.is-open .fp-hint,
.fp.is-unlocked .fp-hint { opacity: 0; transform: translate(-50%, -50%) scale(var(--press-scale-sm)); }

.fp-foot { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px 16px; }
.fp-note { flex: 1 1 200px; margin: 0; color: var(--fp-muted); font-size: var(--text-small); line-height: var(--leading-small); letter-spacing: normal; }
.fp-cta {
  height: 36px;
  padding: 0 18px;
  border: 0;
  border-radius: var(--radius-md);
  background: var(--fp-accent);
  color: var(--fp-on-accent);
  font: inherit;
  font-weight: 600;
  cursor: pointer;
  transition: transform var(--spring-press-duration) var(--spring-press), background-color var(--duration-base);
}
.fp-cta:active { transform: scale(var(--press-scale)); }
.fp-cta:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }
.fp.is-unlocked .fp-cta { background: var(--fp-fill); color: var(--fp-fg); }
@media (prefers-reduced-motion: reduce) {
  .fp-chart, .fp-secret, .fp-dot { transition-duration: var(--duration-reduced) !important; transition-timing-function: linear !important; }
}
.fp [hidden] { display: none !important; }

</style>

<body>

<div class="fp" data-mi="frosted-peek">
  <div class="fp-head">
    <div>
      <p class="fp-eyebrow">Revenue Forecast</p>
      <p class="fp-total"><span class="fp-secret">$548k</span> over the next 12 months</p>
    </div>
    <span class="fp-badge">Pro</span>
  </div>
  <div class="fp-chart" tabindex="0" role="slider" aria-label="Peek at the forecast by month" aria-valuemin="0" aria-valuemax="11" aria-valuenow="0">
    <svg class="fp-svg" viewBox="0 0 480 200" preserveAspectRatio="none" aria-hidden="true"></svg>
    <div class="fp-months" aria-hidden="true"></div>
    <div class="fp-frost" aria-hidden="true"></div>
    <div class="fp-lens" aria-hidden="true">
      <span class="fp-tip"></span>
      <span class="fp-dot"></span>
      <span class="fp-grip"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5.5 5 2.5 8l3 3M10.5 5l3 3-3 3"/></svg></span>
    </div>
    <span class="fp-hint" aria-hidden="true">Drag across to peek</span>
  </div>
  <div class="fp-foot">
    <p class="fp-note">Forecasts are part of Pro. Peek at any month for free.</p>
    <button type="button" class="fp-cta">Unlock Forecasts</button>
  </div>
</div>


<script>
/* Frosted Peek — vanilla JS. Auto-initializes every [data-mi="frosted-peek"].
   Call window.initFrostedPeek(el) for elements added later.
   Set data-values="32,35,…" and data-months="Nov,Dec,…" on the root to use your own numbers. */
(function () {
  'use strict';
  var SVGNS = 'http://www.w3.org/2000/svg';
  var VALUES = [38.4, 40.1, 39.2, 42.8, 44.5, 43.1, 46.9, 48.2, 47.6, 50.3, 52.8, 54.1];
  var MONTHS = ['Nov', 'Dec', 'Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct'];
  var FULL = { Jan: 'January', Feb: 'February', Mar: 'March', Apr: 'April', May: 'May', Jun: 'June', Jul: 'July', Aug: 'August', Sep: 'September', Oct: 'October', Nov: 'November', Dec: 'December' };

  function el(name, attrs) {
    var n = document.createElementNS(SVGNS, name);
    for (var k in attrs) n.setAttribute(k, attrs[k]);
    return n;
  }

  function initFrostedPeek(root) {
    if (!root || root.__miPeek) return;
    root.__miPeek = true;

    var values = root.getAttribute('data-values') ? root.getAttribute('data-values').split(',').map(Number) : VALUES;
    var months = root.getAttribute('data-months') ? root.getAttribute('data-months').split(',') : MONTHS;
    var chart = root.querySelector('.fp-chart');
    var svg = root.querySelector('.fp-svg');
    var monthRow = root.querySelector('.fp-months');
    var lens = root.querySelector('.fp-lens');
    var tip = root.querySelector('.fp-tip');
    var cta = root.querySelector('.fp-cta');
    var note = root.querySelector('.fp-note');
    var noteText = note ? note.textContent : '';
    var index = 0;
    var dragging = false;
    var closeTimer = 0;
    var unlocked = false;

    // ---- draw the chart (viewBox 480 × 200) ----
    var W = 480, H = 200, padT = 46, padB = 14;
    var lo = Math.min.apply(null, values) * 0.9, hi = Math.max.apply(null, values) * 1.04;
    function px(i) { return (i + 0.5) * (W / values.length); }
    function py(v) { return padT + (1 - (v - lo) / (hi - lo)) * (H - padT - padB); }
    [0.33, 0.66].forEach(function (f) {
      svg.appendChild(el('line', { class: 'fp-grid', x1: 0, x2: W, y1: padT + f * (H - padT - padB), y2: padT + f * (H - padT - padB) }));
    });
    var pts = values.map(function (v, i) { return px(i).toFixed(1) + ' ' + py(v).toFixed(1); });
    var first = py(values[0]).toFixed(1), last = py(values[values.length - 1]).toFixed(1);
    svg.appendChild(el('path', { class: 'fp-area', d: 'M0 ' + H + ' L0 ' + first + ' L' + pts.join(' L') + ' L' + W + ' ' + last + ' L' + W + ' ' + H + ' Z' }));
    svg.appendChild(el('path', { class: 'fp-line', d: 'M0 ' + first + ' L' + pts.join(' L') + ' L' + W + ' ' + last }));
    monthRow.replaceChildren.apply(monthRow, months.map(function (m) { var s = document.createElement('span'); s.textContent = m; return s; }));

    function money(v) { return '$' + v.toFixed(1) + 'k'; }

    function place(x) {
      var w = chart.clientWidth;
      var half = parseFloat(getComputedStyle(chart).getPropertyValue('--fp-w')) || 40;
      x = Math.max(half, Math.min(w - half, x));
      chart.style.setProperty('--fp-x', x + 'px');
      var i = Math.max(0, Math.min(values.length - 1, Math.floor(x / (w / values.length))));
      if (i !== index || !tip.textContent) {
        index = i;
        tip.textContent = months[i] + ' · ' + money(values[i]);
        lens.style.setProperty('--fp-y', ((py(values[i]) / H) * (chart.clientHeight - 22)).toFixed(1) + 'px');
        chart.setAttribute('aria-valuenow', i);
        chart.setAttribute('aria-valuetext', (FULL[months[i]] || months[i]) + ', ' + money(values[i]) + ' forecast');
      }
    }
    function snapTo(i) { place((i + 0.5) * (chart.clientWidth / values.length)); }
    function open(on) {
      if (unlocked) return;
      clearTimeout(closeTimer);
      chart.classList.toggle('is-open', on);
      chart.style.setProperty('--fp-o', on ? 1 : 0);
    }
    function localX(e) { return e.clientX - chart.getBoundingClientRect().left; }

    chart.addEventListener('pointerenter', function (e) { if (e.pointerType === 'mouse') { place(localX(e)); open(true); } });
    chart.addEventListener('pointermove', function (e) { if (e.pointerType === 'mouse' || dragging) place(localX(e)); });
    chart.addEventListener('pointerleave', function (e) { if (e.pointerType === 'mouse' && !dragging) open(false); });
    chart.addEventListener('pointerdown', function (e) {
      dragging = true;
      chart.classList.add('is-dragging');
      try { chart.setPointerCapture(e.pointerId); } catch (err) {}
      place(localX(e));
      open(true);
    });
    function endDrag(e) {
      if (!dragging) return;
      dragging = false;
      chart.classList.remove('is-dragging');
      if (e.pointerType !== 'mouse') closeTimer = setTimeout(function () { open(false); }, 900);
    }
    chart.addEventListener('pointerup', endDrag);
    chart.addEventListener('pointercancel', endDrag);

    chart.addEventListener('focus', function () { snapTo(index); open(true); });
    chart.addEventListener('blur', function () { open(false); });
    chart.addEventListener('keydown', function (e) {
      var k = e.key;
      if (k === 'ArrowRight' || k === 'ArrowUp') index = Math.min(values.length - 1, index + 1);
      else if (k === 'ArrowLeft' || k === 'ArrowDown') index = Math.max(0, index - 1);
      else if (k === 'Home') index = 0;
      else if (k === 'End') index = values.length - 1;
      else if (k === 'Escape') { open(false); return; }
      else return;
      e.preventDefault();
      open(true);
      tip.textContent = '';
      snapTo(index);
    });

    cta.addEventListener('click', function () {
      if (!unlocked) {
        unlocked = true;
        root.classList.add('is-unlocked');
        chart.classList.remove('is-open');
        chart.style.setProperty('--fp-o', 1);
        chart.style.setProperty('--fp-w', chart.clientWidth + 'px'); // the frost clears completely
        cta.textContent = 'Reset Demo';
        if (note) note.textContent = 'Pro trial started. Every month is yours for 14 days.';
      } else {
        unlocked = false;
        root.classList.remove('is-unlocked');
        chart.style.setProperty('--fp-w', '40px');
        chart.style.setProperty('--fp-o', 0);
        cta.textContent = 'Unlock Forecasts';
        if (note) note.textContent = noteText;
      }
    });

    snapTo(0);
  }

  window.initFrostedPeek = initFrostedPeek;
  function boot() { document.querySelectorAll('[data-mi="frosted-peek"]').forEach(initFrostedPeek); }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();

</script>
</body>
</html>
