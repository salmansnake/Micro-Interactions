<div class="ct" data-mi="line-clear">
  <div class="ct-head">
    <p class="ct-title">Thursday</p>
    <p class="ct-free">3 hours free</p>
  </div>
  <div class="ct-day">
    <div class="ct-hours" aria-hidden="true"><span>9</span><span>10</span><span>11</span><span>12</span><span>1</span><span>2</span><span>3</span><span>4</span></div>
    <div class="ct-col">
      <div class="ct-block" data-slot="0" style="--c: var(--chart-1)">Standup</div>
      <div class="ct-block" data-slot="1" style="--c: var(--chart-4)">Roadmap</div>
      <div class="ct-block" data-slot="2" style="--c: var(--chart-5)">1:1 with Leo</div>
      <div class="ct-block" data-slot="5" style="--c: var(--chart-2)">Design Review</div>
      <div class="ct-block" data-slot="7" style="--c: var(--chart-3)">Weekly Sync</div>
    </div>
  </div>
  <div class="ct-invites">
    <p class="ct-inv-title">Invites</p>
    <ul class="ct-list">
      <li><span><b>Budget Check</b><small>12:00 PM · Priya</small></span><button type="button" data-slot="3" data-name="Budget Check" data-c="var(--chart-2)">Accept</button></li>
      <li><span><b>Vendor Call</b><small>1:00 PM · Sam</small></span><button type="button" data-slot="4" data-name="Vendor Call" data-c="var(--chart-5)">Accept</button></li>
      <li><span><b>Quick Sync</b><small>3:00 PM · Mira</small></span><button type="button" data-slot="6" data-name="Quick Sync" data-c="var(--chart-1)">Accept</button></li>
    </ul>
  </div>
  <div class="ct-clear" hidden>
    <p class="ct-clear-text" data-fill><b>Line clear.</b> No gaps from 9 to 5. Not even for&nbsp;lunch.</p>
    <button type="button" class="ct-lunch">Protect 12:00 for Lunch</button>
  </div>
  <p class="ct-status" role="status" aria-live="polite"></p>
</div>
