/* Rage Click Detector — click a slow button too many times and it calms you down, then hands you a stress ball.
   Outcraft Design System v2. Every value is an Outcraft token. */
.rc {
  --rc-bg: var(--card);
  --rc-fg: var(--foreground);
  --rc-muted: var(--muted-foreground);
  --rc-line: var(--border);
  --rc-sunken: var(--subtle);
  --rc-fill: var(--muted);
  --rc-accent: var(--primary);
  --rc-on-accent: var(--primary-foreground);
  --rc-green: var(--success);
  display: flex;
  flex-direction: column;
  gap: 12px;
  width: 100%;
  max-width: 380px;
  box-sizing: border-box;
  padding: 20px;
  background: var(--rc-bg);
  color: var(--rc-fg);
  border-radius: var(--radius-xl);
  border: 1px solid var(--border);
  box-shadow: var(--shadow-sm);
  font: 400 var(--text-body)/var(--leading-body) var(--font-sans);
  letter-spacing: normal;
  text-align: left;
  -webkit-font-smoothing: antialiased;
}
.rc p { margin: 0; }
.rc-card { display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: var(--radius-lg); background: var(--rc-sunken); }
.rc-icon { display: grid; place-items: center; flex: none; width: 40px; height: 40px; border-radius: var(--radius-md); background: oklch(from var(--danger) var(--tint-l) calc(c * var(--tint-c)) h); color: var(--danger); }
.rc-icon svg { width: 22px; height: 22px; }
.rc-title { font-weight: 600; }
.rc-sub { color: var(--rc-muted); font-size: var(--text-small); line-height: var(--leading-small); }

.rc-btn {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  width: 100%;
  height: 44px;
  border: 0;
  border-radius: var(--radius-md);
  background: var(--rc-accent);
  color: var(--rc-on-accent);
  font: inherit;
  font-size: var(--text-title-sm);
  font-weight: 600;
  letter-spacing: var(--tracking-title);
  cursor: pointer;
  transition: background-color var(--duration-slow), color var(--duration-slow), transform var(--spring-press-duration) var(--spring-press);
}
.rc-btn:active { transform: scale(var(--press-scale)); }
.rc-btn:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }
.rc.is-busy .rc-btn { background: var(--rc-fill); color: var(--rc-fg); cursor: progress; }
.rc.is-done .rc-btn { background: var(--rc-green); color: var(--on-color); }
.rc-btn.is-nudge { animation: rc-nudge var(--duration-slow) var(--ease-out); }
@keyframes rc-nudge { 25% { transform: translateX(-3px) scale(var(--press-scale-lg)); } 60% { transform: translateX(2px); } }
.rc-spin { display: none; width: 16px; height: 16px; border-radius: 50%; border: 2px solid color-mix(in srgb, currentColor 25%, transparent); border-top-color: currentColor; animation: rc-spin 0.8s linear infinite; }
.rc.is-busy .rc-spin { display: block; }
@keyframes rc-spin { to { transform: rotate(1turn); } }
/* Centered on the capital height, not the line box (10b.5): the text is trimmed to cap height and centered */
.rc-count { position: absolute; right: 8px; top: 50%; display: block; align-content: center; text-align: center; text-box: trim-both cap alphabetic; min-width: 34px; height: 34px; margin-top: -17px; padding: 0 8px; box-sizing: border-box; border-radius: var(--radius-full); background: oklch(from var(--danger) var(--tint-l) calc(c * var(--tint-c)) h); color: var(--danger-text); font-size: var(--text-small); line-height: 1; font-weight: 700; font-variant-numeric: tabular-nums; opacity: 0; transform: scale(0.6); transition: opacity var(--duration-base), transform var(--spring-pop-duration) var(--spring-pop); }
.rc-count.is-on { opacity: 1; transform: none; }
.rc-count.is-bump { animation: rc-bump var(--spring-pop-duration) var(--spring-pop); }
@keyframes rc-bump { 30% { transform: scale(1.25); } }

.rc-bar { height: 4px; border-radius: var(--radius-xs); background: var(--rc-fill); overflow: hidden; opacity: 0; transition: opacity var(--duration-slow); }
.rc.is-busy .rc-bar, .rc.is-done .rc-bar { opacity: 1; animation: rc-bar-in var(--duration-slow) var(--ease-out); }
/* No export running, no bar: it takes no space until it has something to show */
.rc:not(.is-busy):not(.is-done) .rc-bar { display: none; }
@keyframes rc-bar-in { from { opacity: 0; } }
.rc-bar i { display: block; width: 0; height: 100%; border-radius: var(--radius-xs); background: var(--rc-accent); }
.rc.is-done .rc-bar i { background: var(--rc-green); }
.rc-msg { color: var(--rc-muted); font-size: var(--text-small); line-height: var(--leading-small); }
/* Nothing to say yet, so no space: it stays a live region but leaves the layout until text arrives */
.rc-msg:empty { position: absolute; width: 1px; height: 1px; min-height: 0; margin: 0; padding: 0; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
.rc.is-raging .rc-msg { color: var(--rc-fg); font-size: var(--text-body); font-weight: 500; }

/* The stress ball */
.rc-ball-wrap { display: flex; align-items: center; gap: 16px; padding: 14px 16px; border-radius: var(--radius-lg); background: var(--rc-sunken); animation: rc-in var(--spring-pop-duration) var(--spring-pop) both; }
@keyframes rc-in { from { opacity: 0; transform: translateY(12px) scale(var(--press-scale-sm)); } }
.rc-ball {
  position: relative;
  flex: none;
  width: 76px;
  height: 76px;
  padding: 0;
  border: 0;
  border-radius: 50%;
  background: radial-gradient(circle at 34% 30%, color-mix(in srgb, var(--orange) 22%, var(--on-color)) 0, color-mix(in srgb, var(--orange) 70%, var(--amber-9)) 26%, var(--orange) 58%, color-mix(in srgb, var(--orange) 72%, var(--black)) 100%);
  box-shadow: var(--shadow-md);
  cursor: grab;
  touch-action: none;
  transform-origin: 50% 100%;
  transition: transform var(--spring-pop-duration) var(--spring-pop);
  -webkit-tap-highlight-color: transparent;
}
.rc-ball.is-squeeze { transform: scale(1.26, 0.68); cursor: grabbing; transition: transform var(--duration-fast) var(--ease-out); }
.rc-ball:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }
.rc-eye { position: absolute; top: 34%; left: 30%; width: 7px; height: 9px; border-radius: 50%; background: color-mix(in srgb, var(--orange) 34%, var(--black)); transition: transform var(--duration-fast); }
.rc-eye + .rc-eye { left: auto; right: 30%; }
.rc-mouth { position: absolute; top: 54%; left: 50%; width: 16px; height: 7px; margin-left: -8px; box-sizing: border-box; border-bottom: 2.5px solid color-mix(in srgb, var(--orange) 34%, var(--black)); border-radius: 0 0 var(--radius-md) var(--radius-md); transition: transform var(--duration-fast); }
.rc-ball.is-squeeze .rc-eye { transform: scaleY(0.18); }
.rc-ball.is-squeeze .rc-mouth { transform: scale(1.5, 0.6); }
.rc-ball-note { display: flex; flex-direction: column; gap: 2px; min-width: 0; font-size: var(--text-small); line-height: var(--leading-small); }
.rc-ball-note b { font-size: var(--text-body); line-height: var(--leading-body); font-weight: 600; }
.rc-squeezes { color: var(--rc-muted); font-variant-numeric: tabular-nums; }

@media (prefers-reduced-motion: reduce) {
  .rc-btn.is-nudge, .rc-count.is-bump, .rc-ball-wrap { animation: none; }
  .rc-ball, .rc-ball.is-squeeze { transition-duration: var(--duration-reduced); transition-timing-function: linear; }
}
/* Multi-line text wraps evenly and never ends on one or two lonely words */
.rc :is(p, li, dd, dt, small, label, figcaption, h1, h2, h3, h4) { text-wrap: balance; }
.rc [hidden] { display: none !important; }

</style>

<body>

<div class="rc" data-mi="rage-click" data-duration="5000" data-file="Q3 Revenue Report.pdf">
  <div class="rc-card">
    <span class="rc-icon" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 22a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h8a2.4 2.4 0 0 1 1.704.706l3.588 3.588A2.4 2.4 0 0 1 20 8v12a2 2 0 0 1-2 2z"/><path d="M14 2v5a1 1 0 0 0 1 1h5"/><path d="M10 9H8"/><path d="M16 13H8"/><path d="M16 17H8"/></svg>
    </span>
    <div class="rc-meta"><p class="rc-title">Q3 Revenue Report</p><p class="rc-sub">2,418 rows · PDF</p></div>
  </div>
  <button type="button" class="rc-btn">
    <span class="rc-spin" aria-hidden="true"></span>
    <span class="rc-label">Export PDF</span>
    <span class="rc-count" aria-hidden="true"></span>
  </button>
  <div class="rc-bar" aria-hidden="true"><i></i></div>
  <p class="rc-msg" role="status" aria-live="polite"></p>
  <div class="rc-ball-wrap" hidden>
    <button type="button" class="rc-ball" aria-label="Stress ball. Press and hold to squeeze."><span class="rc-eye"></span><span class="rc-eye"></span><span class="rc-mouth"></span></button>
    <p class="rc-ball-note"><b>Squeeze while you wait.</b><span class="rc-squeezes">0 squeezes</span></p>
  </div>
</div>


<script>
/* Rage Click Detector — vanilla JS. Auto-initializes every [data-mi="rage-click"].
   Four or more clicks inside 1.5 seconds on a busy button counts as a rage click. Only one job ever starts.
   Replace startJob() with your real request. Call window.initRageClick(el) for elements added later. */
(function () {
  'use strict';
  var RAGE_CLICKS = 4, RAGE_WINDOW = 1500;

  // Even line breaks: text that wraps to two or three lines is narrowed until its lines are close in length,
  // with the first line the longest, so no line runs long while the next holds a word or two.
  function evenLines(root) {
    var SEL = 'p, li, dd, dt, small, label, figcaption, h1, h2, h3, h4';
    function widths(el) {
      var range = document.createRange(), rows = [];
      range.selectNodeContents(el);
      Array.prototype.forEach.call(range.getClientRects(), function (b) {
        if (!b.width) return;
        var row = rows.filter(function (x) { return Math.abs(x.t - b.top) < b.height / 2; })[0];
        if (row) { row.l = Math.min(row.l, b.left); row.r = Math.max(row.r, b.right); } else rows.push({ t: b.top, l: b.left, r: b.right });
      });
      return rows.sort(function (a, b) { return a.t - b.t; }).map(function (x) { return x.r - x.l; });
    }
    function fit(el) {
      el.style.maxWidth = ''; el.style.textWrap = '';
      var cs = getComputedStyle(el), full = el.getBoundingClientRect().width;
      if (!full || cs.whiteSpace === 'nowrap' || /flex|grid/.test(cs.display)) return;
      if (Array.prototype.some.call(el.children, function (c) { return !/^inline/.test(getComputedStyle(c).display); })) return;
      el.style.textWrap = 'wrap';
      var n = widths(el).length, lo = 0, hi = full, w, L;
      if (n < 2 || n > 3) { el.style.textWrap = ''; return; }
      while (hi - lo > 1) { w = (lo + hi) / 2; el.style.maxWidth = w + 'px'; if (widths(el).length > n) lo = w; else hi = w; }
      var best = 0, gap = Infinity;
      for (w = Math.ceil(hi); w <= full; w += 2) {
        el.style.maxWidth = w + 'px'; L = widths(el);
        // Each line no longer than the one above (within 10%, which reads as equal). Keep the most even width,
        // and prefer the first line longer: a last line longer than the first costs three times its overhang
        var score = Math.max.apply(null, L) - Math.min.apply(null, L) + Math.max(0, L[n - 1] - L[0]) * 3;
        if (L.length === n && L.every(function (x, i) { return !i || x <= L[i - 1] * 1.1 + 1; }) && score < gap) { gap = score; best = w; }
      }
      if (!best) { el.style.maxWidth = ''; el.style.textWrap = ''; return; }
      el.style.maxWidth = best + 'px';

    function run() { queued = false; Array.prototype.forEach.call(root.querySelectorAll(SEL), fit); }

    if (window.ResizeObserver) new ResizeObserver(function () { var w = root.getBoundingClientRect().width; if (Math.abs(w - lastW) > 0.5) { lastW = w; later(); } }).observe(root);
    if (window.MutationObserver) new MutationObserver(later).observe(root, { subtree: true, childList: true, characterData: true, attributes: true, attributeFilter: ['hidden'] });

  function initRageClick(root) {
    if (!root || root.__miRage) return;
    root.__miRage = true;
    evenLines(root);
    var btn = root.querySelector('.rc-btn'), label = root.querySelector('.rc-label'), count = root.querySelector('.rc-count');

    var wrap = root.querySelector('.rc-ball-wrap'), ball = root.querySelector('.rc-ball'), squeezesEl = root.querySelector('.rc-squeezes');
    var duration = Number(root.getAttribute('data-duration')) || 5000;
    var file = root.getAttribute('data-file') || 'Report.pdf';
    var state = 'idle', t0 = 0, raf = 0, clicks = [], extra = 0, raged = false, preached = false, squeezes = 0, holding = false;

    function left() { return Math.max(1, Math.round((duration - (performance.now() - t0)) / 1000)); }

    function tick(now) {

      root.classList.add('is-busy');
      btn.setAttribute('aria-disabled', 'true');
      label.textContent = 'Exporting…';
      msg.textContent = '';
      t0 = performance.now();
      raf = requestAnimationFrame(tick);
    }

    function finish() {
      state = 'done';
      root.classList.remove('is-busy');
      root.classList.add('is-done');
      btn.removeAttribute('aria-disabled');
      label.textContent = 'Download PDF';
      count.classList.remove('is-on');
      root.classList.remove('is-raging');
      msg.textContent = raged ? 'Done. It was always going to take ' + Math.round(duration / 1000) + (Math.round(duration / 1000) === 1 ? ' second.' : ' seconds.') : 'Your report is ready.';
    }

    function reset() {
      state = 'idle'; clicks = []; extra = 0; raged = false; preached = false; squeezes = 0;
      root.classList.remove('is-done', 'is-busy', 'is-raging');
      label.textContent = 'Export PDF';
      bar.style.width = '0';
      wrap.hidden = true;
      squeezesEl.textContent = '0 squeezes';
      msg.textContent = '';

    function nudge(el, cls) { el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); }

    btn.addEventListener('click', function () {

        setTimeout(reset, 1600);
        state = 'leaving';
        return;
      }
      if (state !== 'busy') return;

      var now = performance.now();

      count.textContent = '×' + (extra + 1);
      count.classList.add('is-on');
      nudge(count, 'is-bump');
      nudge(btn, 'is-nudge');
      if (!raged && clicks.length >= RAGE_CLICKS) {
        raged = true;
        root.classList.add('is-raging');
        msg.textContent = 'Okay, okay. I heard you. It’s still exporting, ' + secs(left()) + ' left. Only one export was started.';
        wrap.hidden = false;
      } else if (raged && !preached && extra >= 12) {
        preached = true;
        msg.textContent = 'Clicking faster won’t make it faster. But it’s sweet that you care.';
      } else if (!raged) {
        msg.textContent = 'Still working on it. ' + secs(left()).replace(/^a/, 'A') + ' left.';
      }

    function squeeze() { if (holding) return; holding = true; ball.classList.add('is-squeeze'); }
    function release() {
      if (!holding) return;
      holding = false;
      ball.classList.remove('is-squeeze');
      squeezes++;
      squeezesEl.textContent = squeezes + (squeezes === 1 ? ' squeeze' : ' squeezes') + (squeezes >= 10 ? '. You’re doing great.' : '');
    }
    ball.addEventListener('pointerdown', function (e) { if (e.button === 0) { ball.setPointerCapture && ball.setPointerCapture(e.pointerId); squeeze(); } });
    ball.addEventListener('pointerup', release);
    ball.addEventListener('pointercancel', release);
    ball.addEventListener('keydown', function (e) { if ((e.key === ' ' || e.key === 'Enter') && !e.repeat) { e.preventDefault(); squeeze(); } });
    ball.addEventListener('keyup', function (e) { if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); release(); } });
  }

  window.initRageClick = initRageClick;
  function boot() { document.querySelectorAll('[data-mi="rage-click"]').forEach(initRageClick); }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();

</script>
