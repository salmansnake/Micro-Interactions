<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Refill Timer</title>
<style>
/* Demo page only. Remove this block when pasting into your own page. */
body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 48px 16px; box-sizing: border-box; background: #F3F2EE; }
@media (prefers-color-scheme: dark) { body { background: #0C0D0C; } }
</style>
<style>
@import url('https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap');

/* Outcraft Design System v2: the tokens this component uses, scoped to .rt so they never affect the rest of your page. */
.rt {
  --duration-base: 200ms;
  --font-sans: "Geist", system-ui, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --leading-body: 22px;
  --leading-small: 18px;
  --leading-title-sm: 24px;
  --press-scale: 0.97;
  --press-scale-lg: 0.985;
  --radius-lg: 12px;
  --radius-md: 8px;
  --radius-xl: 16px;
  --spring-pop: linear(0, 0.0413, 0.1464, 0.2895, 0.4487, 0.6073, 0.7529, 0.8776, 0.9776, 1.0517, 1.1013, 1.1292, 1.1394, 1.1357, 1.1225, 1.1033, 1.0813, 1.059, 1.0382, 1.0202, 1.0055, 0.9945, 0.9869, 0.9825, 0.9807, 0.9808, 0.9825, 0.985, 0.9881, 0.9912, 0.9941, 0.9967, 0.9989, 1.0005, 1.0017, 1.0024, 1.0027, 1.0027, 1.0025, 1.0022, 1);
  --spring-pop-duration: 680ms;
  --spring-press: linear(0, 0.0189, 0.0676, 0.1361, 0.2164, 0.3025, 0.3896, 0.4743, 0.5543, 0.628, 0.6945, 0.7535, 0.8049, 0.849, 0.8863, 0.9172, 0.9425, 0.9629, 0.9789, 0.9912, 1.0004, 1.0071, 1.0116, 1.0145, 1.016, 1.0166, 1.0164, 1.0156, 1.0146, 1.0133, 1.0118, 1.0104, 1.009, 1.0076, 1.0064, 1.0053, 1.0043, 1.0034, 1.0026, 1.002, 1);
  --spring-press-duration: 310ms;
  --spring-ui: linear(0, 0.0237, 0.0849, 0.1704, 0.2697, 0.3746, 0.4788, 0.5777, 0.6685, 0.7491, 0.8189, 0.8776, 0.9257, 0.9639, 0.9931, 1.0147, 1.0296, 1.0391, 1.0442, 1.046, 1.0451, 1.0425, 1.0387, 1.0342, 1.0294, 1.0246, 1.02, 1.0158, 1.012, 1.0087, 1.0059, 1.0037, 1.0019, 1.0005, 0.9994, 0.9987, 0.9982, 0.998, 0.9979, 0.9979, 1);
  --spring-ui-duration: 460ms;
  --text-body: 15px;
  --text-small: 13px;
  --text-title-sm: 17px;
  --tracking-title: -0.015em;
  --aqua: #79EEEC;
  --aqua-700: #0B7573;
  --ash: #646A66;
  --black: #000000;
  --border: var(--line);
  --brand: var(--aqua);
  --brand-strong: var(--aqua-700);
  --card: var(--white);
  --foreground: var(--black);
  --line: #DCDED9;
  --mist: #ECEBE6;
  --muted: var(--mist);
  --muted-foreground: var(--ash);
  --primary: var(--black);
  --primary-foreground: #ffffff;
  --ring: var(--aqua-700);
  --shadow-sm: 0 1px 2px rgba(17, 17, 16, 0.04), 0 1px 3px rgba(17, 17, 16, 0.07);
  --soft-ground: #F3F2EE;
  --subtle: var(--soft-ground);
  --white: #FFFFFF;
}
/* Dark mode: follows data-theme="dark" (or class "dark") on any ancestor, or the system setting. */
[data-theme="dark"] .rt, .dark .rt {
  --aqua: #79EEEC;
  --aqua-700: #79EEEC;
  --ash: #A3A8A4;
  --black: #000000;
  --border: var(--line);
  --brand: var(--aqua);
  --brand-strong: var(--aqua);
  --card: var(--white);
  --foreground: #F3F2EE;
  --line: #313432;
  --mist: #2B2E2D;
  --muted: var(--mist);
  --muted-foreground: var(--ash);
  --primary: var(--aqua);
  --primary-foreground: #000000;
  --ring: var(--aqua);
  --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.4), 0 1px 3px rgba(0, 0, 0, 0.3);
  --soft-ground: #0C0D0C;
  --subtle: var(--soft-ground);
  --white: #161817;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]):not(.light) .rt {
    --aqua: #79EEEC;
    --aqua-700: #79EEEC;
    --ash: #A3A8A4;
    --black: #000000;
    --border: var(--line);
    --brand: var(--aqua);
    --brand-strong: var(--aqua);
    --card: var(--white);
    --foreground: #F3F2EE;
    --line: #313432;
    --mist: #2B2E2D;
    --muted: var(--mist);
    --muted-foreground: var(--ash);
    --primary: var(--aqua);
    --primary-foreground: #000000;
    --ring: var(--aqua);
    --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.4), 0 1px 3px rgba(0, 0, 0, 0.3);
    --soft-ground: #0C0D0C;
    --subtle: var(--soft-ground);
    --white: #161817;
  }
}

/* Refill Timer — a rate limit you can watch refill, instead of a dead button.
   Outcraft Design System v2. Every value is an Outcraft token. */
.rt {
  --rt-bg: var(--card);
  --rt-fg: var(--foreground);
  --rt-muted: var(--muted-foreground);
  --rt-line: var(--border);
  --rt-sunken: var(--subtle);
  --rt-fill-c: var(--muted);
  --rt-accent: var(--primary);
  --rt-on-accent: var(--primary-foreground);
  display: flex;
  flex-direction: column;
  gap: 14px;
  width: 100%;
  max-width: 440px;
  box-sizing: border-box;
  padding: 20px;
  background: var(--rt-bg);
  color: var(--rt-fg);
  border-radius: var(--radius-xl);
  border: 1px solid var(--border);
  box-shadow: var(--shadow-sm);
  font: 400 var(--text-body)/var(--leading-body) var(--font-sans);
  letter-spacing: normal;
  text-align: left;
  -webkit-font-smoothing: antialiased;
}
.rt-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
/* Top of the card: trimmed to the capitals, so the padding above reads the same as the padding below (10b.39) */
.rt-title { text-box: trim-start cap alphabetic; margin: 0; font-size: var(--text-title-sm); line-height: var(--leading-title-sm); font-weight: 600; letter-spacing: var(--tracking-title); }
.rt-sub { margin: 2px 0 0; color: var(--rt-muted); font-size: var(--text-small); line-height: var(--leading-small); letter-spacing: normal; }
.rt-left { color: var(--rt-fg); font-weight: 600; font-variant-numeric: tabular-nums; }
/* Each credit is a small tank that fills from the bottom */
.rt-dots { display: flex; gap: 6px; }
.rt-dot {
  position: relative;
  width: 12px;
  height: 12px;
  overflow: hidden;
  border-radius: 50%;
  box-shadow: inset 0 0 0 1.5px color-mix(in srgb, var(--brand-strong) 40%, transparent);
}
.rt-dot i {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  height: calc(var(--rt-f, 1) * 100%);
  background: var(--rt-accent);
}
.rt-dot.is-ready { animation: rt-pop var(--spring-pop-duration) var(--spring-pop); }
.rt-dot.is-spent { animation: rt-spend var(--spring-press-duration) var(--spring-press); }
@keyframes rt-pop { 0% { transform: scale(1); } 40% { transform: scale(1.5); } 100% { transform: scale(1); } }
@keyframes rt-spend { 0% { transform: scale(1); } 50% { transform: scale(0.6); } 100% { transform: scale(1); } }

.rt-out { display: flex; flex-direction: column; gap: 6px; min-height: 120px; margin: 0; padding: 0; list-style: none; }
.rt-out li {
  padding: 10px 14px;
  border-radius: var(--radius-lg);
  background: var(--rt-sunken);
  font-size: var(--text-body);
  line-height: var(--leading-body);
  animation: rt-in var(--spring-ui-duration) var(--spring-ui) both;
}
.rt-out li.rt-empty { display: grid; place-items: center; min-height: 120px; box-sizing: border-box; background: none; border: 1px dashed var(--rt-line); color: var(--rt-muted); font-size: var(--text-small); animation: none; }
@keyframes rt-in { from { opacity: 0; transform: translateY(-8px) scale(var(--press-scale-lg)); } }

.rt-foot { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px 16px; }
.rt-note { flex: 1 1 160px; margin: 0; color: var(--rt-muted); font-size: var(--text-small); line-height: var(--leading-small); letter-spacing: normal; }
.rt-btn {
  position: relative;
  flex: none;
  min-width: 128px;
  height: 40px;
  overflow: hidden;
  padding: 0 18px;
  border: 0;
  border-radius: var(--radius-md);
  background: var(--rt-accent);
  color: var(--rt-on-accent);
  font: inherit;
  font-weight: 600;
  font-variant-numeric: tabular-nums;
  cursor: pointer;
  transition: background-color var(--duration-base), color var(--duration-base), transform var(--spring-press-duration) var(--spring-press);
}
.rt-btn:active { transform: scale(var(--press-scale)); }
.rt-btn:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }
.rt-label { position: relative; z-index: 1; }
/* Empty: the button becomes the timer, refilling left to right */
.rt-fill {
  position: absolute;
  inset: 0;
  background: color-mix(in srgb, var(--brand) 22%, transparent);
  transform: scaleX(var(--rt-p, 0));
  transform-origin: left;
  opacity: 0;
}
.rt.is-empty .rt-btn { background: var(--rt-fill-c); color: var(--rt-fg); cursor: default; }
.rt.is-empty .rt-btn:active { transform: none; }
.rt.is-empty .rt-fill { opacity: 1; }
.rt-btn.is-ready { animation: rt-ready var(--spring-pop-duration) var(--spring-pop); }
@keyframes rt-ready { 0% { transform: scale(1); } 40% { transform: scale(1.06); } 100% { transform: scale(1); } }
@media (prefers-reduced-motion: reduce) {
  .rt-dot.is-ready, .rt-dot.is-spent, .rt-out li, .rt-btn.is-ready { animation: none; }
}
/* Multi-line text wraps evenly and never ends on one or two lonely words */
.rt :is(p, li, dd, dt, small, label, figcaption, h1, h2, h3, h4) { text-wrap: balance; }
.rt [hidden] { display: none !important; }

</style>
</head>
<body>

<div class="rt" data-mi="refill-timer" data-max="5" data-refill="3000">
  <div class="rt-head">
    <div>
      <p class="rt-title">Headline Ideas</p>
      <p class="rt-sub"><span class="rt-left">5 of 5</span> generations left</p>
    </div>
    <div class="rt-dots" aria-hidden="true"></div>
  </div>
  <ol class="rt-out" aria-live="polite" aria-label="Generated ideas">
    <li class="rt-empty">Your ideas appear here.</li>
  </ol>
  <div class="rt-foot">
    <p class="rt-note">One generation refills every 3 seconds in this demo.</p>
    <button type="button" class="rt-btn"><span class="rt-fill" aria-hidden="true"></span><span class="rt-label">Generate</span></button>
  </div>
</div>


<script>
/* Refill Timer — vanilla JS. Auto-initializes every [data-mi="refill-timer"].
   data-max = credits, data-refill = ms per credit. Call window.initRefillTimer(el) for later elements. */
(function () {
  'use strict';
  var IDEAS = [
    'Yearly billing, with the savings up front',
    'Delete with confidence',
    'Your plan, at a glance',
    'Every change, saved',
    'Shortcuts you will actually use',
    'Pricing that explains itself',
    'Errors that point at the problem',
    'Uploads that know what you dropped'
  ];

  // Even line breaks: text that wraps to two or three lines is narrowed until its lines are close in length,
  // with the first line the longest, so no line runs long while the next holds a word or two.
  function evenLines(root) {
    var SEL = 'p, li, dd, dt, small, label, figcaption, h1, h2, h3, h4';
    function widths(el) {
      var range = document.createRange(), rows = [];
      range.selectNodeContents(el);
      Array.prototype.forEach.call(range.getClientRects(), function (b) {
        if (!b.width) return;
        var row = rows.filter(function (x) { return Math.abs(x.t - b.top) < b.height / 2; })[0];
        if (row) { row.l = Math.min(row.l, b.left); row.r = Math.max(row.r, b.right); } else rows.push({ t: b.top, l: b.left, r: b.right });
      });
      return rows.sort(function (a, b) { return a.t - b.t; }).map(function (x) { return x.r - x.l; });
    }
    function fit(el) {
      el.style.maxWidth = ''; el.style.textWrap = '';
      var cs = getComputedStyle(el), full = el.getBoundingClientRect().width;
      if (!full || cs.whiteSpace === 'nowrap' || /flex|grid/.test(cs.display)) return;
      if (Array.prototype.some.call(el.children, function (c) { return !/^inline/.test(getComputedStyle(c).display); })) return;
      el.style.textWrap = 'wrap';
      var n = widths(el).length, lo = 0, hi = full, w, L;
      if (n < 2 || n > 3) { el.style.textWrap = ''; return; }
      while (hi - lo > 1) { w = (lo + hi) / 2; el.style.maxWidth = w + 'px'; if (widths(el).length > n) lo = w; else hi = w; }
      var best = 0, gap = Infinity;
      for (w = Math.ceil(hi); w <= full; w += 2) {
        el.style.maxWidth = w + 'px'; L = widths(el);
        // Each line no longer than the one above (within 10%, which reads as equal). Keep the most even width,
        // and prefer the first line longer: a last line longer than the first costs three times its overhang
        var score = Math.max.apply(null, L) - Math.min.apply(null, L) + Math.max(0, L[n - 1] - L[0]) * 3;
        if (L.length === n && L.every(function (x, i) { return !i || x <= L[i - 1] * 1.1 + 1; }) && score < gap) { gap = score; best = w; }
      }
      if (!best) { el.style.maxWidth = ''; el.style.textWrap = ''; return; }
      el.style.maxWidth = best + 'px';
      if (cs.textAlign === 'center' && cs.display === 'block') { el.style.marginLeft = 'auto'; el.style.marginRight = 'auto'; }
    }
    var queued = false, lastW = 0;
    function run() { queued = false; Array.prototype.forEach.call(root.querySelectorAll(SEL), fit); }
    function later() { if (!queued) { queued = true; requestAnimationFrame(run); } }
    later();
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(later);
    if (window.ResizeObserver) new ResizeObserver(function () { var w = root.getBoundingClientRect().width; if (Math.abs(w - lastW) > 0.5) { lastW = w; later(); } }).observe(root);
    if (window.MutationObserver) new MutationObserver(later).observe(root, { subtree: true, childList: true, characterData: true, attributes: true, attributeFilter: ['hidden'] });
  }

  function initRefillTimer(root) {
    if (!root || root.__miRefill) return;
    root.__miRefill = true;
    evenLines(root);

    var max = Number(root.getAttribute('data-max')) || 5;
    var refill = Number(root.getAttribute('data-refill')) || 3000;
    var dotsBox = root.querySelector('.rt-dots');
    var left = root.querySelector('.rt-left');
    var out = root.querySelector('.rt-out');
    var btn = root.querySelector('.rt-btn');
    var label = root.querySelector('.rt-label');
    var credits = max;
    var last = 0;
    var raf = 0;
    var ideaIx = 0;
    var shownWhole = max;

    var dots = [];
    for (var i = 0; i < max; i++) {
      var d = document.createElement('span');
      d.className = 'rt-dot';
      d.appendChild(document.createElement('i'));
      dotsBox.appendChild(d);
      dots.push(d);
    }

    function bump(elm, cls) {
      elm.classList.remove(cls);
      void elm.offsetWidth;
      elm.classList.add(cls);
    }

    function render() {
      var whole = Math.floor(credits + 1e-6);
      dots.forEach(function (d, i) {
        var f = Math.max(0, Math.min(1, credits - i));
        d.style.setProperty('--rt-f', f.toFixed(3));
      });
      left.textContent = whole + ' of ' + max;
      var empty = whole < 1;
      root.classList.toggle('is-empty', empty);
      btn.setAttribute('aria-disabled', empty ? 'true' : 'false');
      if (empty) {
        var frac = credits - whole;
        var secs = Math.ceil(((1 - frac) * refill) / 1000);
        label.textContent = 'Next in ' + secs + 's';
        btn.style.setProperty('--rt-p', frac.toFixed(3));
      } else {
        label.textContent = 'Generate';
      }
      if (whole > shownWhole) {
        bump(dots[whole - 1], 'is-ready');
        if (shownWhole === 0) bump(btn, 'is-ready');
      }
      shownWhole = whole;
    }

    function tick(now) {
      raf = 0;
      if (last) credits = Math.min(max, credits + (now - last) / refill);
      last = now;
      render();
      if (credits < max) raf = requestAnimationFrame(tick);
      else last = 0;
    }
    function start() { if (!raf && credits < max) { last = 0; raf = requestAnimationFrame(tick); } }

    btn.addEventListener('click', function () {
      if (credits < 1) return;
      var spent = Math.floor(credits + 1e-6) - 1;
      credits -= 1;
      shownWhole = Math.floor(credits + 1e-6);
      bump(dots[spent], 'is-spent');
      var empty = out.querySelector('.rt-empty');
      if (empty) empty.remove();
      var li = document.createElement('li');
      li.textContent = IDEAS[ideaIx++ % IDEAS.length];
      out.insertBefore(li, out.firstChild);
      while (out.children.length > 3) out.lastChild.remove();
      render();
      start();
    });

    render();
  }

  window.initRefillTimer = initRefillTimer;
  function boot() { document.querySelectorAll('[data-mi="refill-timer"]').forEach(initRefillTimer); }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();

</script>
</body>
</html>
