<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Time Zone Sundial</title>
<style>
/* Demo page only. Remove this block when pasting into your own page. */
body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 48px 16px; box-sizing: border-box; background: #F7F7F7; }
@media (prefers-color-scheme: dark) { body { background: #1F1F1F; } }
</style>
<style>
@import url('https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap');

/* Outcraft Design System v2: the tokens this component uses, scoped to .tzs so they never affect the rest of your page. */
.tzs {
  --duration-base: 200ms;
  --duration-reduced: 120ms;
  --duration-slow: 320ms;
  --font-sans: "Geist", system-ui, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --leading-body: 22px;
  --leading-caption: 16px;
  --leading-small: 18px;
  --leading-title: 28px;
  --leading-ui: 20px;
  --moon: #F4EFD6;
  --press-scale: 0.97;
  --radius-full: 9999px;
  --radius-md: 8px;
  --radius-xl: 16px;
  --sky-day-low: #8CCBF5;
  --sky-day-top: #2F86D8;
  --sky-dusk-low: #FFA66B;
  --sky-dusk-top: #5E62B0;
  --sky-night-low: #1F2C5A;
  --sky-night-top: #0A1430;
  --spring-press: linear(0, 0.0189, 0.0676, 0.1361, 0.2164, 0.3025, 0.3896, 0.4743, 0.5543, 0.628, 0.6945, 0.7535, 0.8049, 0.849, 0.8863, 0.9172, 0.9425, 0.9629, 0.9789, 0.9912, 1.0004, 1.0071, 1.0116, 1.0145, 1.016, 1.0166, 1.0164, 1.0156, 1.0146, 1.0133, 1.0118, 1.0104, 1.009, 1.0076, 1.0064, 1.0053, 1.0043, 1.0034, 1.0026, 1.002, 1);
  --spring-press-duration: 310ms;
  --spring-ui: linear(0, 0.0237, 0.0849, 0.1704, 0.2697, 0.3746, 0.4788, 0.5777, 0.6685, 0.7491, 0.8189, 0.8776, 0.9257, 0.9639, 0.9931, 1.0147, 1.0296, 1.0391, 1.0442, 1.046, 1.0451, 1.0425, 1.0387, 1.0342, 1.0294, 1.0246, 1.02, 1.0158, 1.012, 1.0087, 1.0059, 1.0037, 1.0019, 1.0005, 0.9994, 0.9987, 0.9982, 0.998, 0.9979, 0.9979, 1);
  --spring-ui-duration: 460ms;
  --star: #FFFFFF;
  --sun: #FFD23F;
  --text-body: 15px;
  --text-caption: 12px;
  --text-small: 13px;
  --text-title: 20px;
  --text-ui: 14px;
  --tracking-title: -0.015em;
  --aqua: #79EEEC;
  --aqua-700: #0B7573;
  --ash: #686868;
  --black: #000000;
  --body: var(--slate);
  --border: var(--line);
  --border-strong: var(--line-strong);
  --card: var(--white);
  --chart-1: var(--aqua);
  --chart-2: var(--pink);
  --chart-3: var(--orange);
  --chart-4: var(--sage);
  --danger-text: #ca2b30;
  --foreground: var(--black);
  --green-11: #218358;
  --input: var(--line-strong);
  --lift: #FFFFFF;
  --line: #DDDDDD;
  --line-strong: #C8C8C8;
  --mist: #EBEBEB;
  --muted: var(--mist);
  --muted-foreground: var(--ash);
  --on-chart: #000000;
  --orange: #FE8C5F;
  --pink: #FFC7F6;
  --primary: var(--black);
  --primary-foreground: #ffffff;
  --raised: var(--lift);
  --red-11: #ce2c31;
  --ring: var(--aqua-700);
  --sage: #99AD88;
  --shadow-sm: 0 1px 2px rgba(17, 17, 16, 0.04), 0 1px 3px rgba(17, 17, 16, 0.07);
  --slate: #4E4E4E;
  --success: var(--green-11);
  --white: #FFFFFF;
}
/* Dark mode: follows data-theme="dark" (or class "dark") on any ancestor, or the system setting. */
[data-theme="dark"] .tzs, .dark .tzs {
  --aqua: #79EEEC;
  --aqua-700: #79EEEC;
  --ash: #A6A6A6;
  --black: #000000;
  --body: var(--slate);
  --border: var(--line);
  --border-strong: var(--line-strong);
  --card: var(--white);
  --chart-1: var(--aqua);
  --chart-2: var(--pink);
  --chart-3: var(--orange);
  --chart-4: var(--sage);
  --danger-text: var(--red-11);
  --foreground: #F2F2F2;
  --green-11: #3dd68c;
  --input: var(--line-strong);
  --lift: #424242;
  --line: #333333;
  --line-strong: #464646;
  --mist: #2D2D2D;
  --muted: var(--mist);
  --muted-foreground: var(--ash);
  --on-chart: #000000;
  --orange: #FE8C5F;
  --pink: #FFC7F6;
  --primary: var(--aqua);
  --primary-foreground: #000000;
  --raised: var(--lift);
  --red-11: #ff9592;
  --ring: var(--aqua);
  --sage: #99AD88;
  --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.4), 0 1px 3px rgba(0, 0, 0, 0.3);
  --slate: #CCCCCC;
  --success: #218358;
  --white: #171717;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]):not(.light) .tzs {
    --aqua: #79EEEC;
    --aqua-700: #79EEEC;
    --ash: #A6A6A6;
    --black: #000000;
    --body: var(--slate);
    --border: var(--line);
    --border-strong: var(--line-strong);
    --card: var(--white);
    --chart-1: var(--aqua);
    --chart-2: var(--pink);
    --chart-3: var(--orange);
    --chart-4: var(--sage);
    --danger-text: var(--red-11);
    --foreground: #F2F2F2;
    --green-11: #3dd68c;
    --input: var(--line-strong);
    --lift: #424242;
    --line: #333333;
    --line-strong: #464646;
    --mist: #2D2D2D;
    --muted: var(--mist);
    --muted-foreground: var(--ash);
    --on-chart: #000000;
    --orange: #FE8C5F;
    --pink: #FFC7F6;
    --primary: var(--aqua);
    --primary-foreground: #000000;
    --raised: var(--lift);
    --red-11: #ff9592;
    --ring: var(--aqua);
    --sage: #99AD88;
    --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.4), 0 1px 3px rgba(0, 0, 0, 0.3);
    --slate: #CCCCCC;
    --success: #218358;
    --white: #171717;
  }
}

/* Time Zone Sundial — drag the meeting time and each attendee's sun or moon rises or sets where they are.
   Outcraft Design System v2. Every value is an Outcraft token. */
.tzs {
  --tzs-bg: var(--card);
  --tzs-fg: var(--foreground);
  --tzs-muted: var(--muted-foreground);
  --tzs-fill: var(--muted);
  --tzs-accent: var(--primary);
  --tzs-on-accent: var(--primary-foreground);
  --tzs-band: var(--tzs-fill);
  display: flex;
  flex-direction: column;
  gap: 16px;
  width: 100%;
  max-width: 400px;
  box-sizing: border-box;
  padding: 20px;
  background: var(--tzs-bg);
  color: var(--tzs-fg);
  border-radius: var(--radius-xl);
  border: 1px solid var(--border);
  box-shadow: var(--shadow-sm);
  font: 400 var(--text-body)/var(--leading-body) var(--font-sans);
  letter-spacing: normal;
  text-align: left;
  -webkit-font-smoothing: antialiased;
}
.tzs p, .tzs ul { margin: 0; }
.tzs-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
.tzs-title b { display: block; font-weight: 600; text-box: trim-start cap alphabetic; }
.tzs-title small { display: block; margin-top: 2px; color: var(--tzs-muted); font-size: var(--text-small); line-height: var(--leading-small); }
.tzs-time { flex: none; font: 600 var(--text-title)/var(--leading-title) var(--font-sans); letter-spacing: var(--tracking-title); font-variant-numeric: tabular-nums; white-space: nowrap; text-box: trim-start cap alphabetic; }

/* The slider: its track shows, in green, the times when nobody is asleep */
.tzs-slider { margin-top: -4px; }
.tzs-range { display: block; width: 100%; height: 32px; margin: 0; background: transparent; cursor: pointer; -webkit-appearance: none; appearance: none; }
.tzs-range::-webkit-slider-runnable-track { height: 8px; border-radius: var(--radius-full); background: var(--tzs-band); }
.tzs-range::-moz-range-track { height: 8px; border-radius: var(--radius-full); background: var(--tzs-band); }
.tzs-range::-webkit-slider-thumb { width: 24px; height: 24px; margin-top: -8px; border: 0; border-radius: 50%; background: var(--raised); box-shadow: 0 0 0 1px var(--border-strong), var(--shadow-sm); -webkit-appearance: none; appearance: none; transition: transform var(--spring-press-duration) var(--spring-press); }
.tzs-range::-moz-range-thumb { width: 24px; height: 24px; border: 0; border-radius: 50%; background: var(--raised); box-shadow: 0 0 0 1px var(--border-strong), var(--shadow-sm); }
.tzs-range:active::-webkit-slider-thumb { transform: scale(1.08); }
.tzs-range:focus-visible { outline: none; }
.tzs-range:focus-visible::-webkit-slider-thumb { box-shadow: 0 0 0 2px var(--tzs-bg), 0 0 0 4px var(--ring); }
.tzs-range:focus-visible::-moz-range-thumb { box-shadow: 0 0 0 2px var(--tzs-bg), 0 0 0 4px var(--ring); }
.tzs-axis { display: flex; justify-content: space-between; margin-top: 2px !important; color: var(--tzs-muted); font-size: var(--text-caption); line-height: var(--leading-caption); font-variant-numeric: tabular-nums; }

.tzs-people { padding: 0; list-style: none; }
.tzs-people li { position: relative; display: flex; align-items: center; gap: 12px; padding: 8px 0; }
.tzs-people li + li::before { content: ""; position: absolute; top: 0; left: 44px; right: 0; height: 1px; background: var(--border); }
.tzs-av { flex: none; display: block; width: 32px; height: 32px; border-radius: 50%; background: var(--chart-1); color: var(--on-chart); font-size: var(--text-ui); font-weight: 700; align-content: center; text-align: center; text-box: trim-both cap alphabetic; }
.tzs-people li:nth-child(2) .tzs-av { background: var(--chart-2); }
.tzs-people li:nth-child(3) .tzs-av { background: var(--chart-3); }
.tzs-people li:nth-child(4) .tzs-av { background: var(--chart-4); }
.tzs-who { flex: 1; min-width: 0; }
.tzs-who b { display: block; font-size: var(--text-ui); line-height: var(--leading-ui); font-weight: 600; }
.tzs-who small { display: block; margin-top: 2px; color: var(--tzs-muted); font-size: var(--text-small); line-height: var(--leading-small); font-variant-numeric: tabular-nums; }
.tzs-who em { font-style: normal; }
.tzs-people li.is-asleep .tzs-who em { color: var(--danger-text); font-weight: 500; }

/* The sky: a small scene in the colors of a real sky (the nature tokens), so anyone reads it at a glance and it stays
   the same in light and dark: blue by day, a violet-to-orange glow at dawn and dusk, deep navy with stars at night.
   Each sky is a layer that fades in over the day sky, because gradients can't transition */
.tzs-sky { position: relative; flex: none; width: 64px; height: 32px; overflow: hidden; border-radius: var(--radius-full); background: linear-gradient(var(--sky-day-top), var(--sky-day-low)); } /* no ring: every sky stands out from the card in both themes, and a ring showed only on the day sky (the other layers cover it) */
.tzs-sky::before, .tzs-sky::after { content: ""; position: absolute; inset: 0; opacity: 0; transition: opacity var(--duration-slow); }
.tzs-sky::before { background: linear-gradient(var(--sky-dusk-top), var(--sky-dusk-low)); }
.tzs-sky::after {
  background:
    radial-gradient(circle at 44px 8px, var(--star) 0.75px, transparent 1.25px),
    radial-gradient(circle at 54px 17px, var(--star) 0.5px, transparent 1px),
    radial-gradient(circle at 38px 22px, var(--star) 0.5px, transparent 1px),
    linear-gradient(var(--sky-night-top), var(--sky-night-low));
}
.tzs-people li.is-dusk .tzs-sky::before, .tzs-people li.is-night .tzs-sky::after { opacity: 1; }
.tzs-sky i { position: absolute; z-index: 1; left: 0; top: 0; display: grid; place-items: center; width: 32px; height: 32px; transition: transform var(--spring-ui-duration) var(--spring-ui), opacity var(--duration-base); }
.tzs-sky svg { width: 16px; height: 16px; }
/* A solid sun and moon: their round shapes are filled (Lucide draws the sun's circle before its rays, so no ray is covered) */
.tzs-sun { color: var(--sun); }
.tzs-sun circle, .tzs-moon path { fill: currentColor; }
.tzs-moon { color: var(--moon); opacity: 0; }
.tzs-people li.is-night .tzs-sun { opacity: 0; }
.tzs-people li.is-night .tzs-moon { opacity: 1; }

.tzs-foot { display: flex; align-items: center; gap: 12px; }
.tzs .tzs-status { flex: 1; min-width: 0; margin-right: auto; color: var(--body); font-size: var(--text-small); line-height: var(--leading-small); }
.tzs-best { flex: none; height: 44px; padding: 0 16px; border: 0; border-radius: var(--radius-md); background: var(--tzs-accent); color: var(--tzs-on-accent); font: inherit; font-size: var(--text-ui); font-weight: 600; white-space: nowrap; cursor: pointer; transition: transform var(--spring-press-duration) var(--spring-press); }
.tzs-best:active { transform: scale(var(--press-scale)); }
.tzs-best:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }

@media (prefers-reduced-motion: reduce) {
  .tzs-sky::before, .tzs-sky::after, .tzs-sky i, .tzs-best { transition-duration: var(--duration-reduced); }
}
/* Multi-line text wraps evenly and never ends on one or two lonely words */
.tzs :is(p, li, dd, dt, small, label, figcaption, h1, h2, h3, h4) { text-wrap: balance; }
.tzs [hidden] { display: none !important; }

</style>
</head>
<body>

<div class="tzs" data-mi="timezone-sundial" data-date="2026-11-05" data-home="America/Chicago">
  <div class="tzs-head">
    <p class="tzs-title"><b>Design review</b><small>Thu, Nov 5 · Austin time</small></p>

    <li data-tz="Asia/Tokyo" data-city="Tokyo"><span class="tzs-av" aria-hidden="true">JL</span><p class="tzs-who"><b>Jordan Lee</b><small></small></p><span class="tzs-sky" aria-hidden="true"><i class="tzs-sun"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg></i><i class="tzs-moon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg></i></span></li>

<script>
/* Time Zone Sundial — vanilla JS. Auto-initializes every [data-mi="timezone-sundial"].
   The slider picks a half-hour slot in the home time zone (data-home) on data-date. Each person (data-tz) gets their
   local time and a sky in natural colors: blue with the sun by day, a violet-to-orange glow at dawn and dusk, navy with the moon at night.
   Call window.initTimezoneSundial(el) for elements added later. */
(function () {
  'use strict';
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)');

  // Even line breaks: text that wraps to two or three lines is narrowed until its lines are close in length,
  // with the first line the longest, so no line runs long while the next holds a word or two.
  function evenLines(root) {
    var SEL = 'p, li, dd, dt, small, label, figcaption, h1, h2, h3, h4';
    function widths(el) {
      var range = document.createRange(), rows = [];
      range.selectNodeContents(el);
      Array.prototype.forEach.call(range.getClientRects(), function (b) {
        if (!b.width) return;
        var row = rows.filter(function (x) { return Math.abs(x.t - b.top) < b.height / 2; })[0];
        if (row) { row.l = Math.min(row.l, b.left); row.r = Math.max(row.r, b.right); } else rows.push({ t: b.top, l: b.left, r: b.right });
      });
      return rows.sort(function (a, b) { return a.t - b.t; }).map(function (x) { return x.r - x.l; });
    }
    function fit(el) {
      el.style.maxWidth = ''; el.style.textWrap = '';
      // A filled box marked data-fill spans the card from edge to edge, and its text fills it
      if (el.hasAttribute('data-fill')) return;
      var cs = getComputedStyle(el), full = el.getBoundingClientRect().width;
      if (!full || cs.whiteSpace === 'nowrap' || /flex|grid/.test(cs.display)) return;
      if (Array.prototype.some.call(el.children, function (c) { return !/^inline/.test(getComputedStyle(c).display); })) return;
      el.style.textWrap = 'wrap';
      var n = widths(el).length, lo = 0, hi = full, w, L;
      if (n < 2 || n > 3) { el.style.textWrap = ''; return; }
      while (hi - lo > 1) { w = (lo + hi) / 2; el.style.maxWidth = w + 'px'; if (widths(el).length > n) lo = w; else hi = w; }
      var best = 0, gap = Infinity;
      for (w = Math.ceil(hi); w <= full; w += 2) {
        el.style.maxWidth = w + 'px'; L = widths(el);
        // Each line no longer than the one above (within 10%, which reads as equal). Keep the most even width,
        // and prefer the first line longer: a last line longer than the first costs three times its overhang
        var score = Math.max.apply(null, L) - Math.min.apply(null, L) + Math.max(0, L[n - 1] - L[0]) * 3;
        if (L.length === n && L.every(function (x, i) { return !i || x <= L[i - 1] * 1.1 + 1; }) && score < gap) { gap = score; best = w; }
      }
      if (!best) { el.style.maxWidth = ''; el.style.textWrap = ''; return; }
      el.style.maxWidth = best + 'px';
      if (cs.textAlign === 'center' && cs.display === 'block') { el.style.marginLeft = 'auto'; el.style.marginRight = 'auto'; }
    }
    var queued = false, lastW = 0;
    function run() { queued = false; Array.prototype.forEach.call(root.querySelectorAll(SEL), fit); }
    function later() { if (!queued) { queued = true; requestAnimationFrame(run); } }
    later();
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(later);
    if (window.ResizeObserver) new ResizeObserver(function () { var w = root.getBoundingClientRect().width; if (Math.abs(w - lastW) > 0.5) { lastW = w; later(); } }).observe(root);
    if (window.MutationObserver) new MutationObserver(later).observe(root, { subtree: true, childList: true, characterData: true, attributes: true, attributeFilter: ['hidden'] });
  }

  function parts(ms, tz) {
    var p = {};
    new Intl.DateTimeFormat('en-US', { timeZone: tz, hourCycle: 'h23', year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', weekday: 'short' })
      .formatToParts(new Date(ms)).forEach(function (x) { p[x.type] = x.value; });
    return p;
  }
  function clock(ms, tz) { return new Intl.DateTimeFormat('en-US', { timeZone: tz, hour: 'numeric', minute: '2-digit' }).format(new Date(ms)); }

  function initTimezoneSundial(root) {
    if (!root || root.__miTzs) return;
    root.__miTzs = true;
    evenLines(root);
    var range = root.querySelector('.tzs-range'), time = root.querySelector('.tzs-time');
    var status = root.querySelector('.tzs-status'), best = root.querySelector('.tzs-best');
    var home = root.getAttribute('data-home') || 'America/Chicago';
    var d = (root.getAttribute('data-date') || '2026-11-05').split('-').map(Number);
    var people = Array.prototype.map.call(root.querySelectorAll('.tzs-people li'), function (li) {
      return { li: li, tz: li.getAttribute('data-tz'), city: li.getAttribute('data-city'), name: li.querySelector('b').textContent.split(' ')[0], small: li.querySelector('small'), sun: li.querySelector('.tzs-sun'), moon: li.querySelector('.tzs-moon') };
    });
    var min = Number(range.min), max = Number(range.max), anim = 0;

    // The instant of a slot: midnight on the date in the home zone, plus 30 minutes a step
    function instant(v) {
      var guess = Date.UTC(d[0], d[1] - 1, d[2], 0, v * 30), p = parts(guess, home);
      var asUtc = Date.UTC(+p.year, +p.month - 1, +p.day, +p.hour % 24, +p.minute);
      return guess - (asUtc - guess);
    }
    function look(v) {
      var ms = instant(v), homeDay = parts(ms, home).day;
      return people.map(function (p) {
        var q = parts(ms, p.tz), h = (+q.hour % 24) + (+q.minute) / 60;
        return { p: p, h: h, t: clock(ms, p.tz), day: q.day !== homeDay ? q.weekday : '', asleep: h < 7 || h >= 23, edge: (h >= 7 && h < 8) || (h >= 21 && h < 23) };
      });
    }
    function score(v) {
      var L = look(v);
      return { asleep: L.filter(function (x) { return x.asleep; }).length, kind: L.filter(function (x) { return !x.asleep && !x.edge; }).length };
    }

    // Green band on the track: every slot where nobody is asleep
    function band() {
      var stops = [], fill = 'var(--tzs-fill)', ok = 'color-mix(in oklab, var(--success) 45%, var(--tzs-fill))';
      for (var v = min; v <= max; v++) {
        var c = score(v).asleep ? fill : ok, a = (v - 0.5 - min) / (max - min), b = (v + 0.5 - min) / (max - min);
        a = Math.max(0, a); b = Math.min(1, b);
        stops.push(c + ' calc(12px + (100% - 24px) * ' + a.toFixed(4) + ') calc(12px + (100% - 24px) * ' + b.toFixed(4) + ')');
      }
      root.style.setProperty('--tzs-band', 'linear-gradient(to right, ' + stops.join(', ') + ')');
    }

    function list(names) { return names.length === 1 ? names[0] : names.slice(0, -1).join(', ') + ' and ' + names[names.length - 1]; }

    function render() {
      var v = Number(range.value), L = look(v), ms = instant(v);
      time.textContent = clock(ms, home);
      range.setAttribute('aria-valuetext', clock(ms, home) + ' in Austin');
      L.forEach(function (x) {
        var li = x.p.li, h = x.h, night = h < 6 || h >= 21, dusk = !night && (h < 8 || h >= 18);
        li.classList.toggle('is-night', night); li.classList.toggle('is-dusk', dusk); li.classList.toggle('is-asleep', x.asleep);
        x.p.small.innerHTML = '';
        x.p.small.appendChild(document.createTextNode(x.p.city + ' · ' + x.t + (x.day ? ' ' + x.day : '')));
        if (x.asleep) { var em = document.createElement('em'); em.textContent = ' · asleep'; x.p.small.appendChild(em); }
        // The sun crosses from 6 AM to 9 PM, the moon from 9 PM to 6 AM, low at the ends and high in the middle
        var f = night ? ((h < 6 ? h + 24 : h) - 21) / 9 : (h - 6) / 15;
        var tr = 'translate(' + (f * 32).toFixed(1) + 'px, ' + (6 - Math.sin(Math.PI * f) * 8).toFixed(1) + 'px)';
        x.p.sun.style.transform = tr; x.p.moon.style.transform = tr;
      });
      var asleep = L.filter(function (x) { return x.asleep; }), edge = L.filter(function (x) { return x.edge; });
      if (asleep.length === 1) status.textContent = asleep[0].p.name + ' is asleep. It’s ' + asleep[0].t + ' there.';
      else if (asleep.length) status.textContent = list(asleep.map(function (x) { return x.p.name; })) + ' are asleep.';
      else if (edge.length) status.textContent = 'Everyone is awake. It’s ' + list(edge.map(function (x) { return (x.h < 12 ? 'early for ' : 'late for ') + x.p.name; })) + '.';
      else status.textContent = 'Everyone is awake and at work.';
    }

    // Find a Kind Time: nobody asleep first, then the most people inside working hours, then the nearest slot
    best.addEventListener('click', function () {
      var now = Number(range.value), pick = now, top = null;
      for (var v = min; v <= max; v++) {
        var s = score(v), key = [-s.asleep, s.kind, -Math.abs(v - now)];
        if (!top || key[0] > top[0] || (key[0] === top[0] && (key[1] > top[1] || (key[1] === top[1] && key[2] > top[2])))) { top = key; pick = v; }
      }
      if (pick === now) { render(); status.textContent = 'This is already the kindest time.'; return; }
      cancelAnimationFrame(anim);
      if (reduce.matches) { range.value = pick; render(); return; }
      (function walk() {
        var v = Number(range.value);
        if (v === pick) return;
        range.value = v + (pick > v ? 1 : -1); render();
        anim = requestAnimationFrame(function () { anim = requestAnimationFrame(walk); });
      })();
    });

    range.addEventListener('input', function () { cancelAnimationFrame(anim); render(); });
    band();
    render();
  }

  window.initTimezoneSundial = initTimezoneSundial;
  function boot() { document.querySelectorAll('[data-mi="timezone-sundial"]').forEach(initTimezoneSundial); }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();

</script>
</body>
