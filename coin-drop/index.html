<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Coin Drop · Micro Interactions</title>
<link rel="icon" type="image/svg+xml" href="../icons/outcraft-favicon-light.svg" media="(prefers-color-scheme: light)">
<link rel="icon" type="image/svg+xml" href="../icons/outcraft-favicon-dark.svg" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="../icons/outcraft-icon-180x180-light.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="../outcraft-tokens.css">
<style>
html, body { min-height: 100%; }
body { margin: 0; display: grid; place-items: center; padding: 64px 16px 48px; box-sizing: border-box; background: var(--subtle); color: var(--body); font-family: var(--font-sans); }
</style>
<style>
/* Coin Drop — switching to yearly throws the savings into each plan as coins.
   Outcraft Design System v2: one card holding the segmented control and the plan cards. */
.cd {
  --cd-bg: var(--card);
  --cd-fg: var(--foreground);
  --cd-muted: var(--muted-foreground);
  --cd-line: var(--border);
  --cd-track: var(--subtle);
  --cd-thumb: var(--raised);
  --cd-accent: var(--primary);
  --cd-success: var(--success);
  --cd-success-text: var(--success-text);
  --cd-success-soft: var(--success-subtle);
  --cd-gold: var(--olive);
  --cd-gold-dark: var(--olive-700);
  --cd-spring: var(--spring-ui);
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 20px;
  width: 100%;
  max-width: 664px;
  box-sizing: border-box;
  padding: 20px;
  border: 1px solid var(--cd-line);
  border-radius: var(--radius-xl);
  background: var(--cd-bg);
  box-shadow: var(--shadow-sm);
  color: var(--cd-fg);
  font: 400 var(--text-body)/var(--leading-body) var(--font-sans);
  letter-spacing: normal;
  text-align: left;
  -webkit-font-smoothing: antialiased;
}
/* Segmented control */
.cd-toggle {
  position: relative;
  display: inline-grid;
  grid-template-columns: 1fr 1fr;
  padding: 2px;
  border-radius: var(--radius-full);
  background: var(--cd-track);
}
.cd-thumb {
  position: absolute;
  top: 2px;
  bottom: 2px;
  left: 2px;
  width: calc(50% - 2px);
  border-radius: var(--radius-full);
  background: var(--cd-thumb);
  box-shadow: var(--shadow-sm);
  transition: transform var(--spring-ui-duration) var(--cd-spring);
}
.cd[data-period="yearly"] .cd-thumb { transform: translateX(100%); }
.cd-toggle button {
  position: relative;
  z-index: 1;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  height: 32px;
  padding: 0 18px;
  border: 0;
  border-radius: var(--radius-sm);
  background: none;
  color: var(--cd-fg);
  font: inherit;
  font-size: var(--text-small);
  font-weight: 500;
  letter-spacing: normal;
  cursor: pointer;
}
.cd-toggle button[aria-checked="true"] { font-weight: 600; }
.cd-toggle button:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }
.cd-pct { padding: 1px 6px; border-radius: var(--radius-full); background: var(--cd-success-soft); color: var(--cd-success-text); font-size: var(--text-caption); font-weight: 600; transition: background-color var(--duration-base); }
/* On the gray track (Monthly selected) the pale green tint washes out, so it steps up; on the white thumb and in dark mode it stays the standard soft green */
.cd[data-period="monthly"] .cd-pct { background: color-mix(in srgb, var(--success) 14%, var(--cd-track)); }
:root[data-theme="dark"] .cd[data-period="monthly"] .cd-pct { background: var(--cd-success-soft); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .cd[data-period="monthly"] .cd-pct { background: var(--cd-success-soft); } }
/* Plans */
.cd-plans { display: grid; grid-template-columns: repeat(auto-fit, minmax(156px, 1fr)); gap: 12px; width: 100%; }
.cd-plan {
  display: flex;
  flex-direction: column;
  gap: 2px;
  min-width: 0;
  padding: 16px 16px 14px;
  border-radius: var(--radius-lg); border: 1px solid var(--border);
  background: var(--cd-bg);
}
.cd-plan.is-featured { box-shadow: 0 0 0 2px var(--cd-accent); }
.cd-name { margin: 0 0 4px; color: var(--cd-fg); font-size: var(--text-title-sm); line-height: var(--leading-title-sm); font-weight: 600; letter-spacing: var(--tracking-title); }
.cd-price { display: flex; align-items: baseline; margin: 0; }
.cd-cur { align-self: flex-start; margin-top: 4px; font-size: var(--text-title); font-weight: 600; }
.cd-amt { font-size: calc(var(--text-h1) + 4px); line-height: 1; font-weight: 600; letter-spacing: 0; font-variant-numeric: tabular-nums; }
.cd-per { margin-left: 4px; color: var(--cd-muted); font-size: var(--text-body); }
.cd-billed { margin: 4px 0 0; color: var(--cd-muted); font-size: var(--text-small); line-height: var(--leading-small); letter-spacing: normal; font-variant-numeric: tabular-nums; }
.cd-tray {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-top: 14px;
  min-width: 0;
  padding: 7px 10px;
  border-radius: var(--radius-md);
  background: var(--cd-track);
  color: var(--cd-muted);
  font-size: var(--text-small);
  line-height: var(--leading-small);
  letter-spacing: normal;
  transition: background-color var(--duration-slow), color var(--duration-slow);
}
.cd[data-period="yearly"] .cd-tray { background: var(--cd-success-soft); color: var(--cd-success-text); font-weight: 500; }
.cd-tray b { font-weight: 700; font-variant-numeric: tabular-nums; }
.cd-slot { flex: none; width: 18px; height: 5px; border-radius: var(--radius-xs); background: color-mix(in srgb, var(--cd-fg) 60%, transparent); }
/* Coins */
.cd-layer { position: absolute; inset: 0; z-index: 3; overflow: visible; pointer-events: none; }
.cd-coin {
  position: absolute;
  left: 0;
  top: 0;
  width: 18px;
  height: 18px;
  margin: -9px 0 0 -9px;
  border-radius: 50%;
  background: radial-gradient(circle at 35% 30%, color-mix(in srgb, var(--cd-gold) 35%, var(--on-color)), var(--cd-gold) 48%, var(--cd-gold-dark));
  box-shadow: var(--shadow-xs);
  opacity: 0;
  will-change: transform, opacity;
}
.cd-coin::after {
  content: "$";
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  color: color-mix(in srgb, var(--cd-gold-dark) 85%, transparent);
  font: 700 calc(var(--text-caption) - 2px) / 1 var(--font-sans);
}
.cd-sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
@media (prefers-reduced-motion: reduce) {
  .cd-thumb, .cd-tray { transition-duration: var(--duration-reduced) !important; transition-timing-function: linear !important; }
}
.cd [hidden] { display: none !important; }

</style>
<style>
/* Reset: a small icon button in the corner of every demo; a "Reset" pill slides out on hover or focus */
.mi-host { display: contents; }
.mi-reset { position: absolute; top: 12px; right: 12px; z-index: 5; display: grid; place-items: center; width: 32px; height: 32px; padding: 0; border: 1px solid var(--border); border-radius: var(--radius-full); background: var(--card); color: var(--muted-foreground); box-shadow: var(--shadow-xs); cursor: pointer; -webkit-tap-highlight-color: transparent; transition: color var(--duration-fast) var(--ease-out), border-color var(--duration-fast) var(--ease-out); }
.mi-reset svg { width: 16px; height: 16px; transition: transform var(--spring-ui-duration) var(--spring-ui); }
.mi-reset:hover, .mi-reset:focus-visible { color: var(--foreground); border-color: var(--border-strong); }
.mi-reset:hover svg { transform: rotate(-45deg); }
.mi-reset.is-spin svg { transform: rotate(-360deg); transition: transform var(--spring-pop-duration) var(--spring-pop); }
.mi-reset:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }
.mi-reset-tip { position: absolute; top: 50%; right: calc(100% + 6px); padding: 4px 10px; border-radius: var(--radius-full); background: var(--foreground); color: var(--background); font: 500 var(--text-caption)/var(--leading-caption) var(--font-sans); white-space: nowrap; pointer-events: none; opacity: 0; transform: translate(6px, -50%) scale(0.96); transform-origin: right center; transition: opacity var(--duration-fast) var(--ease-out), transform var(--spring-ui-duration) var(--spring-ui); }
.mi-reset:hover .mi-reset-tip, .mi-reset:focus-visible .mi-reset-tip { opacity: 1; transform: translate(0, -50%) scale(1); }
.mi-reset--page { position: fixed; top: 16px; right: 16px; }
@media (hover: none) { .mi-reset-tip { display: none; } }
@media (prefers-reduced-motion: reduce) { .mi-reset svg, .mi-reset.is-spin svg, .mi-reset-tip { transition: opacity var(--duration-reduced) var(--ease-out); transform: none; } .mi-reset-tip { transform: translate(0, -50%); } }
.mi-sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

</style>
</head>
<body>
<button type="button" class="mi-reset mi-reset--page" data-mi-reset aria-label="Reset Coin Drop"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg><span class="mi-reset-tip" aria-hidden="true">Reset</span></button>
<div class="mi-host"><div class="cd" data-mi="coin-drop" data-period="monthly">
  <div class="cd-toggle" role="radiogroup" aria-label="Billing period">
    <span class="cd-thumb" aria-hidden="true"></span>
    <button type="button" role="radio" aria-checked="true" data-period="monthly">Monthly</button>
    <button type="button" role="radio" aria-checked="false" tabindex="-1" data-period="yearly">Yearly <span class="cd-pct">−20%</span></button>
  </div>
  <div class="cd-plans">
    <article class="cd-plan" data-monthly="12" data-yearly="10">
      <h4 class="cd-name">Starter</h4>
      <p class="cd-price"><span class="cd-cur">$</span><span class="cd-amt">12</span><span class="cd-per">/mo</span></p>
      <p class="cd-billed">Billed monthly</p>
      <div class="cd-tray"><span class="cd-slot"></span><span><span class="cd-tray-pre">Yearly saves $</span><b>24</b><span class="cd-tray-post"></span></span></div>
    </article>
    <article class="cd-plan is-featured" data-monthly="29" data-yearly="23">
      <h4 class="cd-name">Pro</h4>
      <p class="cd-price"><span class="cd-cur">$</span><span class="cd-amt">29</span><span class="cd-per">/mo</span></p>
      <p class="cd-billed">Billed monthly</p>
      <div class="cd-tray"><span class="cd-slot"></span><span><span class="cd-tray-pre">Yearly saves $</span><b>72</b><span class="cd-tray-post"></span></span></div>
    </article>
    <article class="cd-plan" data-monthly="79" data-yearly="63">
      <h4 class="cd-name">Team</h4>
      <p class="cd-price"><span class="cd-cur">$</span><span class="cd-amt">79</span><span class="cd-per">/mo</span></p>
      <p class="cd-billed">Billed monthly</p>
      <div class="cd-tray"><span class="cd-slot"></span><span><span class="cd-tray-pre">Yearly saves $</span><b>192</b><span class="cd-tray-post"></span></span></div>
    </article>
  </div>
  <p class="cd-sr" role="status" aria-live="polite"></p>
  <div class="cd-layer" aria-hidden="true"></div>
</div>
</div>
<script>
/* Coin Drop — vanilla JS. Auto-initializes every [data-mi="coin-drop"].
   Call window.initCoinDrop(el) for elements added later. */
(function () {
  'use strict';
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)');

  function initCoinDrop(root) {
    if (!root || root.__miCoin) return;
    root.__miCoin = true;

    var toggle = root.querySelector('.cd-toggle');
    var buttons = Array.prototype.slice.call(toggle.querySelectorAll('[data-period]'));
    var origin = root.querySelector('.cd-pct') || buttons[1];
    var layer = root.querySelector('.cd-layer');
    var live = root.querySelector('.cd-sr');
    var gen = 0;
    var flying = [];

    var plans = Array.prototype.slice.call(root.querySelectorAll('.cd-plan')).map(function (el) {
      var m = Number(el.getAttribute('data-monthly'));
      var y = Number(el.getAttribute('data-yearly'));
      return {
        el: el, m: m, y: y, save: (m - y) * 12, shown: m, kept: 0,
        amt: el.querySelector('.cd-amt'), billed: el.querySelector('.cd-billed'),
        tray: el.querySelector('.cd-tray'), slot: el.querySelector('.cd-slot'),
        pre: el.querySelector('.cd-tray-pre'), num: el.querySelector('.cd-tray b'), post: el.querySelector('.cd-tray-post')
      };
    });

    function yearly() { return root.getAttribute('data-period') === 'yearly'; }

    function renderTray(p) {
      if (yearly()) { p.pre.textContent = 'You keep $'; p.num.textContent = p.kept; p.post.textContent = '/yr'; }
      else { p.pre.textContent = 'Yearly saves $'; p.num.textContent = p.save; p.post.textContent = ''; }
    }

    function center(el) {
      var r = el.getBoundingClientRect();
      var o = root.getBoundingClientRect();
      return { x: r.left + r.width / 2 - o.left, y: r.top + r.height / 2 - o.top };
    }

    function tweenPrice(p, to, token) {
      var from = p.shown;
      if (reduce.matches || from === to) { p.shown = to; p.amt.textContent = to; return; }
      var t0 = performance.now();
      function step(now) {
        if (token !== gen) return;
        var k = Math.min(1, (now - t0) / 520);
        var e = 1 - Math.pow(1 - k, 3);
        p.shown = Math.round(from + (to - from) * e);
        p.amt.textContent = p.shown;
        if (k < 1) requestAnimationFrame(step);
      }
      requestAnimationFrame(step);
    }

    // One coin on a parabolic arc from a to b.
    function fly(a, b, delay, intoSlot, token, onLand) {
      var coin = document.createElement('span');
      coin.className = 'cd-coin';
      layer.appendChild(coin);
      var lift = 50 + Math.random() * 40;
      var spin = (Math.random() < 0.5 ? -1 : 1) * (180 + Math.random() * 240);
      var sway = (Math.random() - 0.5) * 14;
      var frames = [];
      var N = 16;
      for (var i = 0; i <= N; i++) {
        var t = i / N;
        var x = a.x + (b.x - a.x) * t + Math.sin(t * Math.PI) * sway;
        var y = a.y + (b.y - a.y) * t - 4 * lift * t * (1 - t);
        var s = 1;
        var o = Math.min(1, t / 0.08);
        if (intoSlot) {
          if (t < 0.12) s = 0.6 + (t / 0.12) * 0.4;
          if (t > 0.85) { var k = (t - 0.85) / 0.15; s = 1 - 0.65 * k; o = 1 - k; }
        } else {
          if (t < 0.15) s = 0.35 + (t / 0.15) * 0.65;
          if (t > 0.88) o = (1 - t) / 0.12;
        }
        var flip = 0.35 + 0.65 * Math.abs(Math.cos(t * Math.PI * 2.5));
        frames.push({
          transform: 'translate(' + x.toFixed(1) + 'px,' + y.toFixed(1) + 'px) rotate(' + (spin * t).toFixed(0) + 'deg) scale(' + s.toFixed(3) + ') scaleX(' + flip.toFixed(3) + ')',
          opacity: o
        });
      }
      var anim = coin.animate(frames, {
        duration: 720 + Math.random() * 160,
        delay: delay,
        easing: 'cubic-bezier(.35,.1,.55,1)',
        fill: 'both'
      });
      flying.push(anim);
      anim.finished.then(function () {
        coin.remove();
        if (token === gen && onLand) onLand();
      }).catch(function () { coin.remove(); });
    }

    function land(p, n) {
      p.landed += 1; // coins land out of order, so count arrivals
      p.kept = Math.round(p.save * Math.min(p.landed, n) / n);
      renderTray(p);
      if (!p.tray.animate) return;
      p.tray.animate([{ transform: 'scale(1)' }, { transform: 'scale(1.05)' }, { transform: 'scale(1)' }], { duration: 220, easing: 'ease-out' });
      var ring = getComputedStyle(root).getPropertyValue('--olive').trim() || 'currentColor'; // Outcraft Olive
      p.slot.animate([
        { boxShadow: '0 0 0 0 color-mix(in srgb, ' + ring + ' 60%, transparent)' },
        { boxShadow: '0 0 0 5px color-mix(in srgb, ' + ring + ' 0%, transparent)' }
      ], { duration: 320, easing: 'ease-out' });
    }

    function select(period) {
      if (root.getAttribute('data-period') === period) return;
      root.setAttribute('data-period', period);
      buttons.forEach(function (b) {
        var on = b.getAttribute('data-period') === period;
        b.setAttribute('aria-checked', on ? 'true' : 'false');
        b.tabIndex = on ? 0 : -1;
      });

      var token = ++gen;
      flying.forEach(function (a) { a.cancel(); });
      flying = [];
      layer.replaceChildren();
      var toYearly = yearly();
      var most = 0;

      plans.forEach(function (p, pi) {
        most = Math.max(most, p.save);
        tweenPrice(p, toYearly ? p.y : p.m, token);
        p.billed.textContent = toYearly ? 'Billed yearly · $' + (p.y * 12).toLocaleString() : 'Billed monthly';
        p.kept = 0;
        p.landed = 0;
        if (reduce.matches) { if (toYearly) p.kept = p.save; renderTray(p); return; }
        renderTray(p);
        var n = Math.max(3, Math.min(8, Math.round(p.save / 24) + 2));
        var chip = center(origin);
        var slot = center(p.slot);
        for (var i = 0; i < n; i++) {
          var delay = pi * 120 + i * 85;
          if (toYearly) {
            fly(chip, slot, delay, true, token, land.bind(null, p, n));
          } else {
            fly(slot, chip, delay, false, token, null);
          }
        }
      });

      if (live) {
        live.textContent = toYearly
          ? 'Yearly billing selected. You save up to $' + most + ' a year.'
          : 'Monthly billing selected.';
      }
    }

    buttons.forEach(function (b) {
      b.addEventListener('click', function () { select(b.getAttribute('data-period')); });
    });
    toggle.addEventListener('keydown', function (e) {
      if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown'].indexOf(e.key) === -1) return;
      e.preventDefault();
      var next = yearly() ? 'monthly' : 'yearly';
      select(next);
      toggle.querySelector('[data-period="' + next + '"]').focus();
    });

    plans.forEach(renderTray);
  }

  window.initCoinDrop = initCoinDrop;
  function boot() { document.querySelectorAll('[data-mi="coin-drop"]').forEach(initCoinDrop); }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();

</script>
<script>
(function () {
  var host = document.querySelector('.mi-host'), orig = host.innerHTML, fn = window["initCoinDrop"];
  document.querySelector('[data-mi-reset]').addEventListener('click', function (e) {
    host.innerHTML = orig;
    host.querySelectorAll('[data-mi]').forEach(function (el) { if (typeof fn === 'function') fn(el); });
    var b = e.currentTarget; b.classList.remove('is-spin'); void b.offsetWidth; b.classList.add('is-spin');
    setTimeout(function () { b.classList.remove('is-spin'); }, 700);
  });
})();
</script>
</body>
</html>
