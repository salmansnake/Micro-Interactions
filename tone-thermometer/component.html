<div class="tn" data-mi="tone-thermometer" data-to="Sam">
  <div class="tn-head">
    <p class="tn-title">To: Sam</p>
    <span class="tn-temp" aria-live="polite">
      <svg viewBox="0 0 24 24" aria-hidden="true" data-gauge><path d="M14 4v10.54a4 4 0 1 1-4 0V4a2 2 0 0 1 4 0Z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><circle cx="12" cy="18" r="2" fill="currentColor"/><path class="tn-mercury" d="M12 15V8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <b class="tn-deg">22°</b><span class="tn-word">Warm</span>
    </span>
  </div>
  <div class="tn-field">
    <textarea class="tn-input" rows="4" aria-label="Message">Hi Sam,

Per my last email, the files are in the shared folder. Going forward, please check there first.</textarea>
    <span class="tn-frost" aria-hidden="true"></span>
  </div>
  <div class="tn-chips" aria-label="Add a phrase">
    <button type="button">As previously mentioned</button><button type="button">Friendly reminder</button><button type="button">Noted.</button>
  </div>
  <div class="tn-fix" hidden>
    <p class="tn-fix-text"></p>
    <button type="button" class="tn-warm">Warm It Up</button>
  </div>
  <div class="tn-foot">
    <p class="tn-status" role="status" aria-live="polite"></p>
    <button type="button" class="tn-send">Send</button>
  </div>
</div>
