<div class="qq" data-mi="quick-question">
  <header class="qq-head">
    <p class="qq-channel"># launch-team</p>
    <span class="qq-watch" hidden>
      <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="10" x2="14" y1="2" y2="2"/><line x1="12" x2="15" y1="14" y2="11"/><circle cx="12" cy="14" r="8"/></svg>
      <b class="qq-time">0:00</b>
    </span>
  </header>
  <div class="qq-thread" aria-live="polite"></div>
  <p class="qq-verdict"></p>
  <form class="qq-form">
    <input class="qq-input" type="text" value="Quick question about the launch date" aria-label="Message" autocomplete="off">
    <button type="submit" class="qq-send">Send</button>
  </form>
  <button type="button" class="qq-call" hidden>Turn It Into a Call</button>
</div>
