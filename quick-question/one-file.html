<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quick Question Stopwatch</title>
<style>
/* Demo page only. Remove this block when pasting into your own page. */
body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 48px 16px; box-sizing: border-box; background: #F3F2EE; }
@media (prefers-color-scheme: dark) { body { background: #0C0D0C; } }
</style>
<style>
@import url('https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap');

/* Outcraft Design System v2: the tokens this component uses, scoped to .qq so they never affect the rest of your page. */
.qq {
  --duration-base: 200ms;
  --duration-slower: 480ms;
  --font-sans: "Geist", system-ui, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --leading-body: 22px;
  --leading-small: 18px;
  --press-scale: 0.97;
  --radius-full: 9999px;
  --radius-lg: 12px;
  --radius-md: 8px;
  --radius-xl: 16px;
  --spring-pop: linear(0, 0.0413, 0.1464, 0.2895, 0.4487, 0.6073, 0.7529, 0.8776, 0.9776, 1.0517, 1.1013, 1.1292, 1.1394, 1.1357, 1.1225, 1.1033, 1.0813, 1.059, 1.0382, 1.0202, 1.0055, 0.9945, 0.9869, 0.9825, 0.9807, 0.9808, 0.9825, 0.985, 0.9881, 0.9912, 0.9941, 0.9967, 0.9989, 1.0005, 1.0017, 1.0024, 1.0027, 1.0027, 1.0025, 1.0022, 1);
  --spring-pop-duration: 680ms;
  --spring-press: linear(0, 0.0189, 0.0676, 0.1361, 0.2164, 0.3025, 0.3896, 0.4743, 0.5543, 0.628, 0.6945, 0.7535, 0.8049, 0.849, 0.8863, 0.9172, 0.9425, 0.9629, 0.9789, 0.9912, 1.0004, 1.0071, 1.0116, 1.0145, 1.016, 1.0166, 1.0164, 1.0156, 1.0146, 1.0133, 1.0118, 1.0104, 1.009, 1.0076, 1.0064, 1.0053, 1.0043, 1.0034, 1.0026, 1.002, 1);
  --spring-press-duration: 310ms;
  --spring-ui: linear(0, 0.0237, 0.0849, 0.1704, 0.2697, 0.3746, 0.4788, 0.5777, 0.6685, 0.7491, 0.8189, 0.8776, 0.9257, 0.9639, 0.9931, 1.0147, 1.0296, 1.0391, 1.0442, 1.046, 1.0451, 1.0425, 1.0387, 1.0342, 1.0294, 1.0246, 1.02, 1.0158, 1.012, 1.0087, 1.0059, 1.0037, 1.0019, 1.0005, 0.9994, 0.9987, 0.9982, 0.998, 0.9979, 0.9979, 1);
  --spring-ui-duration: 460ms;
  --text-body: 15px;
  --text-caption: 12px;
  --text-small: 13px;
  --text-ui: 14px;
  --amber-11: #ab6400;
  --aqua: #79EEEC;
  --aqua-700: #0B7573;
  --ash: #646A66;
  --black: #000000;
  --border: var(--line);
  --brand-strong: var(--aqua-700);
  --card: var(--white);
  --chart-1: var(--aqua);
  --chart-2: var(--pink);
  --chart-3: var(--orange);
  --danger: #ce2c31;
  --foreground: var(--black);
  --green-11: #218358;
  --input: var(--line-strong);
  --line: #DCDED9;
  --line-strong: #C6C9C3;
  --mist: #ECEBE6;
  --muted: var(--mist);
  --muted-foreground: var(--ash);
  --on-chart: #000000;
  --orange: #FE8C5F;
  --pink: #FFC7F6;
  --placeholder: var(--stone);
  --primary: var(--black);
  --primary-foreground: #ffffff;
  --ring: var(--aqua-700);
  --shadow-sm: 0 1px 2px rgba(17, 17, 16, 0.04), 0 1px 3px rgba(17, 17, 16, 0.07);
  --shadow-xs: 0 1px 2px rgba(17, 17, 16, 0.05);
  --soft-ground: #F3F2EE;
  --stone: #8A908C;
  --subtle: var(--soft-ground);
  --success: var(--green-11);
  --success-foreground: #ffffff;
  --warning-text: #a15e00;
  --white: #FFFFFF;
}
/* Dark mode: follows data-theme="dark" (or class "dark") on any ancestor, or the system setting. */
[data-theme="dark"] .qq, .dark .qq {
  --amber-11: #ffca16;
  --aqua: #79EEEC;
  --aqua-700: #79EEEC;
  --ash: #A3A8A4;
  --black: #000000;
  --border: var(--line);
  --brand-strong: var(--aqua);
  --card: var(--white);
  --chart-1: var(--aqua);
  --chart-2: var(--pink);
  --chart-3: var(--orange);
  --danger: #d4373c;
  --foreground: #F3F2EE;
  --green-11: #3dd68c;
  --input: var(--line-strong);
  --line: #313432;
  --line-strong: #434744;
  --mist: #2B2E2D;
  --muted: var(--mist);
  --muted-foreground: var(--ash);
  --on-chart: #000000;
  --orange: #FE8C5F;
  --pink: #FFC7F6;
  --placeholder: var(--stone);

  --primary-foreground: #000000;
  --ring: var(--aqua);
  --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.4), 0 1px 3px rgba(0, 0, 0, 0.3);
  --shadow-xs: 0 1px 2px rgba(0, 0, 0, 0.4);
  --soft-ground: #0C0D0C;
  --stone: #7C827E;
  --subtle: var(--soft-ground);
  --success: #218358;
  --success-foreground: #ffffff;
  --warning-text: var(--amber-11);
  --white: #161817;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]):not(.light) .qq {
    --amber-11: #ffca16;
    --aqua: #79EEEC;
    --aqua-700: #79EEEC;
    --ash: #A3A8A4;
    --black: #000000;
    --border: var(--line);
    --brand-strong: var(--aqua);
    --card: var(--white);
    --chart-1: var(--aqua);
    --chart-2: var(--pink);
    --chart-3: var(--orange);
    --danger: #d4373c;
    --foreground: #F3F2EE;
    --green-11: #3dd68c;
    --input: var(--line-strong);
    --line: #313432;
    --line-strong: #434744;
    --mist: #2B2E2D;
    --muted: var(--mist);
    --muted-foreground: var(--ash);
    --on-chart: #000000;
    --orange: #FE8C5F;
    --pink: #FFC7F6;
    --placeholder: var(--stone);
    --primary: var(--aqua);
    --primary-foreground: #000000;
    --ring: var(--aqua);
    --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.4), 0 1px 3px rgba(0, 0, 0, 0.3);
    --shadow-xs: 0 1px 2px rgba(0, 0, 0, 0.4);
    --soft-ground: #0C0D0C;
    --stone: #7C827E;
    --subtle: var(--soft-ground);
    --success: #218358;
    --success-foreground: #ffffff;
    --warning-text: var(--amber-11);
    --white: #161817;
  }
}

/* Quick Question Stopwatch — "quick question" starts a stopwatch that follows the thread it causes.
   Outcraft Design System v2. Every value is an Outcraft token. */
.qq {
  --qq-bg: var(--card);
  --qq-fg: var(--foreground);
  --qq-muted: var(--muted-foreground);
  --qq-line: var(--border);
  --qq-sunken: var(--subtle);
  --qq-fill: var(--muted);
  --qq-accent: var(--primary);
  --qq-on-accent: var(--primary-foreground);
  --qq-tone: var(--brand-strong);
  display: flex;
  flex-direction: column;
  gap: 12px;
  width: 100%;
  max-width: 400px;
  box-sizing: border-box;
  padding: 20px;
  background: var(--qq-bg);
  color: var(--qq-fg);
  border-radius: var(--radius-xl);
  border: 1px solid var(--border);
  box-shadow: var(--shadow-sm);
  font: 400 var(--text-body)/var(--leading-body) var(--font-sans);
  letter-spacing: normal;
  text-align: left;
  -webkit-font-smoothing: antialiased;
}
.qq p { margin: 0; }
.qq[data-level="2"] { --qq-tone: var(--warning-text); }
.qq[data-level="3"] { --qq-tone: var(--danger); }
.qq-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 30px; }
.qq-channel { font-weight: 700; }
.qq-watch { display: inline-flex; align-items: center; gap: 4px; height: 30px; padding: 0 12px 0 8px; border-radius: var(--radius-full); background: color-mix(in srgb, var(--qq-tone) 14%, transparent); color: color-mix(in srgb, var(--qq-tone) 80%, var(--qq-fg)); font-size: var(--text-body); font-variant-numeric: tabular-nums; transition: background-color var(--duration-slower), color var(--duration-slower); animation: qq-pop var(--spring-pop-duration) var(--spring-pop) both; }
.qq-watch svg { width: 18px; height: 18px; }
@keyframes qq-pop { from { opacity: 0; transform: scale(0.5); } }

.qq-thread { display: flex; flex-direction: column; gap: 10px; height: 214px; padding: 12px; overflow-y: auto; border-radius: var(--radius-lg); background: var(--qq-sunken); scroll-behavior: smooth; }
.qq-empty { margin: auto !important; color: var(--qq-muted); font-size: var(--text-small); text-align: center; }
.qq-msg { display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 2px 8px; animation: qq-in var(--spring-ui-duration) var(--spring-ui) both; }
@keyframes qq-in { from { opacity: 0; transform: translateY(6px); } }
/* Centered on the capital height, not the line box (10b.5): the text is trimmed to cap height and centered. 14px capitals leave an even split above and below at 1x and 2x */
.qq-av { grid-row: span 2; display: block; align-content: center; text-align: center; text-box: trim-both cap alphabetic; width: 28px; height: 28px; border-radius: var(--radius-md); background: var(--c, var(--placeholder)); color: var(--on-chart); font-size: var(--text-ui); font-weight: 700; }
.qq-who { font-size: var(--text-small); line-height: var(--leading-small); font-weight: 600; }
.qq-who time { margin-left: 6px; color: var(--qq-muted); font-weight: 400; font-variant-numeric: tabular-nums; }
.qq-text { font-size: var(--text-body); line-height: var(--leading-body); overflow-wrap: anywhere; }
.qq-tag { display: inline-flex; align-items: center; margin-left: 6px; padding: 1px 8px; border-radius: var(--radius-full); background: color-mix(in srgb, var(--qq-tone) 16%, transparent); color: color-mix(in srgb, var(--qq-tone) 80%, var(--qq-fg)); font-size: calc(var(--text-caption) - 1px); font-weight: 600; vertical-align: 1px; }
.qq-verdict { min-height: 20px; font-weight: 600; color: color-mix(in srgb, var(--qq-tone) 80%, var(--qq-fg)); transition: color var(--duration-slower); }
.qq-verdict:empty { min-height: 0; display: none; }
.qq-form { display: flex; gap: 8px; }
.qq-input { flex: 1 1 0; width: 0; min-width: 0; height: 44px; padding: 0 14px; border: 1px solid var(--input); box-shadow: var(--shadow-xs); border-radius: var(--radius-md); background: var(--card); color: inherit; font: inherit; }
.qq-input:focus { outline: 2px solid var(--ring); outline-offset: 2px; }
.qq-send, .qq-call { flex: none; height: 44px; padding: 0 18px; border: 0; border-radius: var(--radius-md); background: var(--qq-accent); color: var(--qq-on-accent); font: inherit; font-weight: 600; cursor: pointer; transition: transform var(--spring-press-duration) var(--spring-press), opacity var(--duration-base); }
.qq-send:disabled { opacity: 0.4; cursor: default; }
.qq-call { background: var(--success); color: var(--success-foreground); /* white on green in both themes */ animation: qq-pop var(--spring-pop-duration) var(--spring-pop) both; }
.qq-send:active, .qq-call:active { transform: scale(var(--press-scale)); }
.qq-send:focus-visible, .qq-call:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }

@media (prefers-reduced-motion: reduce) {
  .qq-watch, .qq-msg, .qq-call { animation: none; }
  .qq-thread { scroll-behavior: auto; }
}
/* Multi-line text wraps evenly and never ends on one or two lonely words */
.qq :is(p, li, dd, dt, small, label, figcaption, h1, h2, h3, h4) { text-wrap: balance; }
.qq [hidden] { display: none !important; }

</style>
</head>
<body>

<div class="qq" data-mi="quick-question">
  <header class="qq-head">
    <p class="qq-channel"># launch-team</p>
    <span class="qq-watch" hidden>
      <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="10" x2="14" y1="2" y2="2"/><line x1="12" x2="15" y1="14" y2="11"/><circle cx="12" cy="14" r="8"/></svg>
      <b class="qq-time">0:00</b>
    </span>
  </header>
  <div class="qq-thread" aria-live="polite"></div>
  <p class="qq-verdict"></p>
  <form class="qq-form">
    <input class="qq-input" type="text" value="Quick question about the launch date" aria-label="Message" autocomplete="off">
    <button type="submit" class="qq-send">Send</button>
  </form>
  <button type="button" class="qq-call" hidden>Turn It Into a Call</button>
</div>


<script>
/* Quick Question Stopwatch — vanilla JS. Auto-initializes every [data-mi="quick-question"].
   Sending a message that contains "quick question" starts a stopwatch; the demo then plays a scripted thread
   in time-lapse. Call window.initQuickQuestion(el) for elements added later. */
(function () {
  'use strict';
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)');
  // [who, color, text, minutes after the question]
  var REPLIES = [
    ['Mira', 'var(--chart-2)', 'Depends. Which launch date?', 2],
    ['Sam', 'var(--chart-1)', 'The one we moved, or the one before that?', 6],
    ['Leo', 'var(--chart-3)', 'Wait, I thought we were launching in Q1', 13],
    ['Mira', 'var(--chart-2)', 'Looping in Priya', 19],
    ['Priya', 'var(--chart-3)', 'Can someone summarize the thread?', 31],
    ['Sam', 'var(--chart-1)', 'Is this the same launch as the other thread?', 40],
    ['Leo', 'var(--chart-3)', 'Quick question: what was the original question?', 47]
  ];
  var LEVELS = [[0, 'Still quick.'], [6, 'Getting less quick.'], [20, 'No longer quick.'], [40, 'This is a meeting now.']];

  // Even line breaks: text that wraps to two or three lines is narrowed until its lines are close in length,
  // with the first line the longest, so no line runs long while the next holds a word or two.
  function evenLines(root) {
    var SEL = 'p, li, dd, dt, small, label, figcaption, h1, h2, h3, h4';
    function widths(el) {
      var range = document.createRange(), rows = [];
      range.selectNodeContents(el);
      Array.prototype.forEach.call(range.getClientRects(), function (b) {
        if (!b.width) return;
        var row = rows.filter(function (x) { return Math.abs(x.t - b.top) < b.height / 2; })[0];
        if (row) { row.l = Math.min(row.l, b.left); row.r = Math.max(row.r, b.right); } else rows.push({ t: b.top, l: b.left, r: b.right });
      });
      return rows.sort(function (a, b) { return a.t - b.t; }).map(function (x) { return x.r - x.l; });
    }
    function fit(el) {
      el.style.maxWidth = ''; el.style.textWrap = '';
      var cs = getComputedStyle(el), full = el.getBoundingClientRect().width;
      if (!full || cs.whiteSpace === 'nowrap' || /flex|grid/.test(cs.display)) return;
      if (Array.prototype.some.call(el.children, function (c) { return !/^inline/.test(getComputedStyle(c).display); })) return;
      el.style.textWrap = 'wrap';
      var n = widths(el).length, lo = 0, hi = full, w, L;
      if (n < 2 || n > 3) { el.style.textWrap = ''; return; }
      while (hi - lo > 1) { w = (lo + hi) / 2; el.style.maxWidth = w + 'px'; if (widths(el).length > n) lo = w; else hi = w; }
      var best = 0, gap = Infinity;
      for (w = Math.ceil(hi); w <= full; w += 2) {
        el.style.maxWidth = w + 'px'; L = widths(el);
        // Each line no longer than the one above (within 10%, which reads as equal). Keep the most even width,
        // and prefer the first line longer: a last line longer than the first costs three times its overhang
        var score = Math.max.apply(null, L) - Math.min.apply(null, L) + Math.max(0, L[n - 1] - L[0]) * 3;
        if (L.length === n && L.every(function (x, i) { return !i || x <= L[i - 1] * 1.1 + 1; }) && score < gap) { gap = score; best = w; }
      }
      if (!best) { el.style.maxWidth = ''; el.style.textWrap = ''; return; }
      el.style.maxWidth = best + 'px';
      if (cs.textAlign === 'center' && cs.display === 'block') { el.style.marginLeft = 'auto'; el.style.marginRight = 'auto'; }
    }
    var queued = false, lastW = 0;
    function run() { queued = false; Array.prototype.forEach.call(root.querySelectorAll(SEL), fit); }
    function later() { if (!queued) { queued = true; requestAnimationFrame(run); } }
    later();
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(later);
    if (window.ResizeObserver) new ResizeObserver(function () { var w = root.getBoundingClientRect().width; if (Math.abs(w - lastW) > 0.5) { lastW = w; later(); } }).observe(root);
    if (window.MutationObserver) new MutationObserver(later).observe(root, { subtree: true, childList: true, characterData: true, attributes: true, attributeFilter: ['hidden'] });
  }

  function initQuickQuestion(root) {
    if (!root || root.__miQuick) return;
    root.__miQuick = true;
    evenLines(root);
    var thread = root.querySelector('.qq-thread'), watch = root.querySelector('.qq-watch'), timeEl = root.querySelector('.qq-time');
    var verdict = root.querySelector('.qq-verdict'), form = root.querySelector('.qq-form'), input = root.querySelector('.qq-input');
    var send = root.querySelector('.qq-send'), call = root.querySelector('.qq-call');
    var running = false, raf = 0, t0 = 0, idx = 0, people = {};
    var MS_PER_MIN = reduce.matches ? 120 : 260; // time-lapse speed

    function empty() { thread.replaceChildren(); var p = document.createElement('p'); p.className = 'qq-empty'; p.textContent = 'No messages yet. Ask something quick.'; thread.appendChild(p); }
    function stamp(min) { var t = 14 * 60 + 2 + min; return (Math.floor(t / 60) % 12 || 12) + ':' + String(t % 60).padStart(2, '0'); }

    function post(who, color, text, min, tag) {
      var e = thread.querySelector('.qq-empty'); if (e) e.remove();
      var m = document.createElement('div'); m.className = 'qq-msg';
      var av = document.createElement('span'); av.className = 'qq-av'; av.style.setProperty('--c', color); av.textContent = who[0];
      var w = document.createElement('p'); w.className = 'qq-who'; w.textContent = who;
      var tm = document.createElement('time'); tm.textContent = stamp(min); w.appendChild(tm);
      var tx = document.createElement('p'); tx.className = 'qq-text'; tx.textContent = text;
      if (tag) { var g = document.createElement('span'); g.className = 'qq-tag'; g.textContent = tag; tx.appendChild(g); }
      m.append(av, w, tx);
      thread.appendChild(m);
      thread.scrollTop = thread.scrollHeight;
    }

    function level(min) { var l = 0; LEVELS.forEach(function (x, i) { if (min >= x[0]) l = i; }); return l; }

    function frame(now) {
      var min = (now - t0) / MS_PER_MIN;
      while (idx < REPLIES.length && min >= REPLIES[idx][3]) {
        var r = REPLIES[idx++]; people[r[0]] = 1; post(r[0], r[1], r[2], r[3]);
      }
      var shown = Math.min(min, 47.2);
      var secs = Math.floor(shown * 60);
      timeEl.textContent = Math.floor(secs / 60) + ':' + String(secs % 60).padStart(2, '0');
      var l = level(shown);
      root.setAttribute('data-level', l);
      verdict.textContent = LEVELS[l][1];
      if (idx >= REPLIES.length && min >= 47.2) {
        running = false;
        verdict.textContent = 'Quick question: 47 minutes, ' + (Object.keys(people).length + 1) + ' people, 0 answers.'; // never 1: you plus at least one reply
        call.hidden = false;
        send.disabled = false;
        return;
      }
      raf = requestAnimationFrame(frame);
    }

    form.addEventListener('submit', function (e) {
      e.preventDefault();
      var text = input.value.trim();
      if (!text || running) return;
      if (thread.querySelector('.qq-msg') && call.hidden === false) empty();
      call.hidden = true;
      var quick = /quick question/i.test(text);
      post('You', 'var(--chart-1)', text, 0, quick ? 'Quick question' : '');
      input.value = '';
      if (!quick) { verdict.textContent = 'Nice and direct. No stopwatch needed.'; root.setAttribute('data-level', 0); return; }
      running = true; idx = 0; people = {};
      send.disabled = true;
      watch.hidden = false;
      t0 = performance.now();
      raf = requestAnimationFrame(frame);
    });

    call.addEventListener('click', function () {
      verdict.textContent = 'Call started. Agenda: the quick question.';
      call.hidden = true;
      input.value = 'Quick question about the launch date';
      watch.hidden = true;
      empty();
      root.setAttribute('data-level', 0);
    });
    empty();
  }

  window.initQuickQuestion = initQuickQuestion;
  function boot() { document.querySelectorAll('[data-mi="quick-question"]').forEach(initQuickQuestion); }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();

</script>
</body>
</html>
