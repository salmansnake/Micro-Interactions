<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Exclamation Budget</title>
<style>
/* Demo page only. Remove this block when pasting into your own page. */
body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 48px 16px; box-sizing: border-box; background: #F3F2EE; }
@media (prefers-color-scheme: dark) { body { background: #0C0D0C; } }
</style>
<style>
@import url('https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap');

/* Outcraft Design System v2: the tokens this component uses, scoped to .eb so they never affect the rest of your page. */
.eb {
  --duration-slow: 320ms;
  --duration-slower: 480ms;
  --ease-out: cubic-bezier(0.22, 0.9, 0.24, 1);
  --font-sans: "Geist", system-ui, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --leading-body: 22px;
  --leading-small: 18px;
  --leading-title-sm: 24px;
  --press-scale: 0.97;
  --press-scale-sm: 0.94;
  --radius-full: 9999px;
  --radius-lg: 12px;
  --radius-md: 8px;
  --radius-sm: 6px;
  --radius-xl: 16px;
  --spring-pop: linear(0, 0.0413, 0.1464, 0.2895, 0.4487, 0.6073, 0.7529, 0.8776, 0.9776, 1.0517, 1.1013, 1.1292, 1.1394, 1.1357, 1.1225, 1.1033, 1.0813, 1.059, 1.0382, 1.0202, 1.0055, 0.9945, 0.9869, 0.9825, 0.9807, 0.9808, 0.9825, 0.985, 0.9881, 0.9912, 0.9941, 0.9967, 0.9989, 1.0005, 1.0017, 1.0024, 1.0027, 1.0027, 1.0025, 1.0022, 1);
  --spring-pop-duration: 680ms;
  --spring-press: linear(0, 0.0189, 0.0676, 0.1361, 0.2164, 0.3025, 0.3896, 0.4743, 0.5543, 0.628, 0.6945, 0.7535, 0.8049, 0.849, 0.8863, 0.9172, 0.9425, 0.9629, 0.9789, 0.9912, 1.0004, 1.0071, 1.0116, 1.0145, 1.016, 1.0166, 1.0164, 1.0156, 1.0146, 1.0133, 1.0118, 1.0104, 1.009, 1.0076, 1.0064, 1.0053, 1.0043, 1.0034, 1.0026, 1.002, 1);
  --spring-press-duration: 310ms;
  --spring-ui: linear(0, 0.0237, 0.0849, 0.1704, 0.2697, 0.3746, 0.4788, 0.5777, 0.6685, 0.7491, 0.8189, 0.8776, 0.9257, 0.9639, 0.9931, 1.0147, 1.0296, 1.0391, 1.0442, 1.046, 1.0451, 1.0425, 1.0387, 1.0342, 1.0294, 1.0246, 1.02, 1.0158, 1.012, 1.0087, 1.0059, 1.0037, 1.0019, 1.0005, 0.9994, 0.9987, 0.9982, 0.998, 0.9979, 0.9979, 1);
  --spring-ui-duration: 460ms;
  --text-body: 15px;
  --text-small: 13px;
  --text-title-sm: 17px;
  --tracking-title: -0.015em;
  --ai: var(--orange);
  --ai-foreground: #000000;
  --aqua: #79EEEC;
  --aqua-700: #0B7573;
  --ash: #646A66;
  --black: #000000;
  --border: var(--line);
  --card: var(--white);
  --foreground: var(--black);
  --input: var(--line-strong);
  --line: #DCDED9;
  --line-strong: #C6C9C3;
  --mist: #ECEBE6;
  --muted: var(--mist);
  --muted-foreground: var(--ash);
  --orange: #FE8C5F;
  --primary: var(--black);
  --primary-foreground: #ffffff;
  --ring: var(--aqua-700);
  --shadow-sm: 0 1px 2px rgba(17, 17, 16, 0.04), 0 1px 3px rgba(17, 17, 16, 0.07);
  --shadow-xs: 0 1px 2px rgba(17, 17, 16, 0.05);
  --soft-ground: #F3F2EE;
  --subtle: var(--soft-ground);
  --white: #FFFFFF;
}
/* Dark mode: follows data-theme="dark" (or class "dark") on any ancestor, or the system setting. */
[data-theme="dark"] .eb, .dark .eb {
  --ai: var(--orange);
  --ai-foreground: #000000;
  --aqua: #79EEEC;
  --aqua-700: #79EEEC;
  --ash: #A3A8A4;
  --black: #000000;
  --border: var(--line);
  --card: var(--white);
  --foreground: #F3F2EE;
  --input: var(--line-strong);
  --line: #313432;
  --line-strong: #434744;
  --mist: #2B2E2D;
  --muted: var(--mist);
  --muted-foreground: var(--ash);
  --orange: #FE8C5F;
  --primary: var(--aqua);
  --primary-foreground: #000000;
  --ring: var(--aqua);
  --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.4), 0 1px 3px rgba(0, 0, 0, 0.3);
  --shadow-xs: 0 1px 2px rgba(0, 0, 0, 0.4);
  --soft-ground: #0C0D0C;
  --subtle: var(--soft-ground);
  --white: #161817;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]):not(.light) .eb {
    --ai: var(--orange);
    --ai-foreground: #000000;
    --aqua: #79EEEC;
    --aqua-700: #79EEEC;
    --ash: #A3A8A4;
    --black: #000000;
    --border: var(--line);
    --card: var(--white);
    --foreground: #F3F2EE;
    --input: var(--line-strong);
    --line: #313432;
    --line-strong: #434744;
    --mist: #2B2E2D;
    --muted: var(--mist);
    --muted-foreground: var(--ash);
    --orange: #FE8C5F;
    --primary: var(--aqua);
    --primary-foreground: #000000;
    --ring: var(--aqua);
    --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.4), 0 1px 3px rgba(0, 0, 0, 0.3);
    --shadow-xs: 0 1px 2px rgba(0, 0, 0, 0.4);
    --soft-ground: #0C0D0C;
    --subtle: var(--soft-ground);
    --white: #161817;
  }
}

/* Exclamation Budget — three exclamation marks per message. Past that, they quietly turn into periods.
   Outcraft Design System v2. Every value is an Outcraft token. */
.eb {
  --eb-bg: var(--card);
  --eb-fg: var(--foreground);
  --eb-muted: var(--muted-foreground);
  --eb-line: var(--border);
  --eb-sunken: var(--subtle);
  --eb-fill: var(--muted);
  --eb-accent: var(--primary);
  --eb-on-accent: var(--primary-foreground);
  display: flex;
  flex-direction: column;
  gap: 12px;
  width: 100%;
  max-width: 400px;
  box-sizing: border-box;
  padding: 20px;
  background: var(--eb-bg);
  color: var(--eb-fg);
  border-radius: var(--radius-xl);
  border: 1px solid var(--border);
  box-shadow: var(--shadow-sm);
  font: 400 var(--text-body)/var(--leading-body) var(--font-sans);
  letter-spacing: normal;
  text-align: left;
  -webkit-font-smoothing: antialiased;
}
.eb p { margin: 0; }
.eb-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.eb-title { font-weight: 600; }
/* The wallet: one token per exclamation mark */
.eb-wallet { display: inline-flex; gap: 4px; padding: 4px; border-radius: var(--radius-full); background: var(--eb-sunken); }
.eb-wallet i { position: relative; display: grid; place-items: center; width: 24px; height: 24px; border-radius: 50%; background: var(--ai); box-shadow: inset 0 -2px 0 color-mix(in srgb, var(--black) 15%, transparent); transition: transform var(--spring-pop-duration) var(--spring-pop), background-color var(--duration-slow), box-shadow var(--duration-slow); }
.eb-wallet i::after { content: "!"; color: var(--ai-foreground); font: 800 var(--text-body)/1 var(--font-sans); font-style: normal; }
.eb-wallet i.is-spent { background: transparent; box-shadow: inset 0 0 0 1.5px var(--eb-line); transform: scale(0.82); }
.eb-wallet i.is-spent::after { color: var(--eb-muted); opacity: 0.4; }
.eb-wallet i.is-pop { animation: eb-pop var(--duration-slower) var(--ease-out); }
@keyframes eb-pop { 0% { transform: scale(1); } 40% { transform: scale(1.4) translateY(-6px); } 100% { transform: scale(0.82); } }

.eb-input { display: block; width: 100%; min-height: 84px; box-sizing: border-box; padding: 12px 14px; border: 1px solid var(--input); box-shadow: var(--shadow-xs); border-radius: var(--radius-lg); background: var(--card); color: inherit; font: inherit; font-size: var(--text-title-sm); line-height: var(--leading-title-sm); letter-spacing: var(--tracking-title); resize: none; }
.eb-input:focus { outline: 2px solid var(--ring); outline-offset: 2px; }
.eb-input.is-shrug { animation: eb-shrug var(--spring-ui-duration) var(--spring-ui); }
@keyframes eb-shrug { 30% { transform: translateY(-4px) scaleY(1.02); } 60% { transform: translateY(1px); } }
.eb-chips { display: flex; flex-wrap: wrap; gap: 6px; }
.eb-chips button { height: 30px; padding: 0 12px; border: 0; border-radius: var(--radius-sm); background: var(--eb-fill); color: var(--eb-fg); font: inherit; font-size: var(--text-small); font-weight: 500; cursor: pointer; transition: transform var(--spring-press-duration) var(--spring-press); }
.eb-chips button:active { transform: scale(var(--press-scale-sm)); }
.eb-chips button:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }
.eb-status { color: var(--eb-muted); font-size: var(--text-small); line-height: var(--leading-small); font-variant-numeric: tabular-nums; }
.eb.is-broke .eb-status { color: var(--eb-fg); font-weight: 500; }
.eb-shop { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 10px 10px 14px; border-radius: var(--radius-lg); background: color-mix(in srgb, var(--ai) 12%, transparent); animation: eb-in var(--spring-ui-duration) var(--spring-ui) both; }
@keyframes eb-in { from { opacity: 0; transform: translateY(-6px); } }
.eb-shop-text { font-size: var(--text-small); line-height: var(--leading-small); font-weight: 500; }
.eb-buy { flex: none; height: 34px; padding: 0 14px; border: 0; border-radius: var(--radius-md); background: var(--ai); color: var(--ai-foreground); font: inherit; font-size: var(--text-small); font-weight: 600; cursor: pointer; }
.eb-send { height: 44px; border: 0; border-radius: var(--radius-md); background: var(--eb-accent); color: var(--eb-on-accent); font: inherit; font-weight: 600; cursor: pointer; transition: transform var(--spring-press-duration) var(--spring-press); }
.eb-send:active, .eb-buy:active { transform: scale(var(--press-scale)); }
.eb-send:focus-visible, .eb-buy:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }

@media (prefers-reduced-motion: reduce) {
  .eb-wallet i.is-pop, .eb-input.is-shrug, .eb-shop { animation: none; }
}
.eb [hidden] { display: none !important; }

</style>
</head>
<body>

<div class="eb" data-mi="exclamation-budget" data-budget="3" data-to="Mira">
  <div class="eb-head">
    <p class="eb-title">Message Mira</p>
    <span class="eb-wallet" role="img" aria-label="3 exclamation marks left"><i></i><i></i><i></i></span>
  </div>
  <textarea class="eb-input" rows="3" aria-label="Message">Congrats on the launch</textarea>
  <div class="eb-chips">
    <button type="button" data-ins="!">Add “!”</button>
    <button type="button" data-ins="!!!">Add “!!!”</button>
    <button type="button" data-ins=" So proud of the team!">Add Enthusiasm</button>
  </div>
  <p class="eb-status" role="status" aria-live="polite">3 exclamation marks left today.</p>
  <div class="eb-shop" hidden>
    <p class="eb-shop-text">Need more enthusiasm?</p>
    <button type="button" class="eb-buy">3 More for $0.99</button>
  </div>
  <button type="button" class="eb-send">Send</button>
</div>


<script>
/* Exclamation Budget — vanilla JS. Auto-initializes every [data-mi="exclamation-budget"].
   The first data-budget "!" in the message are kept; any after that become "." in place (deleting one refunds it).
   Call window.initExclamationBudget(el) for elements added later. */
(function () {
  'use strict';

  function initExclamationBudget(root) {
    if (!root || root.__miBang) return;
    root.__miBang = true;
    var budget = Number(root.getAttribute('data-budget')) || 3;
    var to = root.getAttribute('data-to') || 'They';
    var input = root.querySelector('.eb-input'), wallet = root.querySelector('.eb-wallet');
    var coins = Array.prototype.slice.call(wallet.querySelectorAll('i'));
    var status = root.querySelector('.eb-status'), shop = root.querySelector('.eb-shop');
    var buy = root.querySelector('.eb-buy'), send = root.querySelector('.eb-send');
    var used = 0, converted = 0;

    function enforce() {
      var seen = 0, changed = false;
      var caret = input.selectionStart;
      var out = input.value.replace(/!/g, function () { seen++; if (seen > budget) { changed = true; return '.'; } return '!'; });
      if (changed) {
        input.value = out;
        input.setSelectionRange(caret, caret);
        converted++;
        input.classList.remove('is-shrug'); void input.offsetWidth; input.classList.add('is-shrug');
      }
      return changed;
    }

    function render(justConverted) {
      var n = Math.min(budget, (input.value.match(/!/g) || []).length);
      coins.forEach(function (c, i) {
        var spent = i >= budget - n;
        if (spent && !c.classList.contains('is-spent')) { c.classList.add('is-pop'); setTimeout(function () { c.classList.remove('is-pop'); }, 520); }
        c.classList.toggle('is-spent', spent);
      });
      var left = budget - n;
      wallet.setAttribute('aria-label', left + ' exclamation marks left');
      root.classList.toggle('is-broke', justConverted);
      status.textContent = justConverted ? 'Budget spent. That one’s a period now.' : left === 0 ? 'No exclamation marks left. Choose your words carefully.' : left + (left === 1 ? ' exclamation mark' : ' exclamation marks') + ' left today.';
      if (justConverted) shop.hidden = false;
      used = n;
    }

    input.addEventListener('input', function () { render(enforce()); });
    root.querySelectorAll('.eb-chips button').forEach(function (b) {
      b.addEventListener('click', function () {
        var ins = b.getAttribute('data-ins');
        var s = input.selectionStart != null && document.activeElement === input ? input.selectionStart : input.value.length;
        input.value = input.value.slice(0, s) + ins + input.value.slice(s);
        input.focus();
        input.setSelectionRange(s + ins.length, s + ins.length);
        render(enforce());
      });
    });
    buy.addEventListener('click', function () {
      shop.hidden = true;
      status.textContent = 'Just kidding. Try sounding excited with words. “This is genuinely great news” works.';
    });
    send.addEventListener('click', function () {
      status.textContent = used === 0 ? 'Sent. Calm, measured, slightly suspicious.'
        : used >= budget ? 'Sent with all ' + budget + ' exclamation marks. ' + to + ' can tell you mean it.'
        : 'Sent with ' + used + (used === 1 ? ' exclamation mark' : ' exclamation marks') + '. Tasteful.';
    });
    render(false);
  }

  window.initExclamationBudget = initExclamationBudget;
  function boot() { document.querySelectorAll('[data-mi="exclamation-budget"]').forEach(initExclamationBudget); }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();

</script>
</body>
</html>
