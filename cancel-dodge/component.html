<div class="cn" data-mi="cancel-dodge">
  <div class="cn-main">
    <div class="cn-head">
      <span class="cn-plan">Pro · $24/mo</span>
    </div>
    <h3 class="cn-title">Cancel your subscription?</h3>
    <p class="cn-body">You’ll lose 14 projects, your custom domain, and the 3 teammates who quietly depend on you.</p>
    <p class="cn-quip" role="status" aria-live="polite">No rush. We’ll be right here.</p>
    <div class="cn-actions">
      <button type="button" class="cn-keep">Keep My Plan</button>
      <button type="button" class="cn-cancel">Cancel<span class="cn-long"> Subscription</span></button>
    </div>
  </div>
  <div class="cn-done" hidden tabindex="-1">
    <h3 class="cn-title">Subscription canceled.</h3>
    <p class="cn-body">Your Pro plan ends on November 23. Your 14 projects will be fine. Probably.</p>
    <button type="button" class="cn-again">Resubscribe</button>
  </div>
</div>
