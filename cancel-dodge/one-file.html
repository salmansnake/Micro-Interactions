<style>

<style>
@import url('https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap');

/* Outcraft Design System v2: the tokens this component uses, scoped to .cn so they never affect the rest of your page. */
.cn {
  --duration-fast: 140ms;
  --duration-instant: 80ms;
  --duration-reduced: 120ms;
  --duration-slower: 480ms;
  --ease-in-out: cubic-bezier(0.62, 0, 0.32, 1);
  --ease-out: cubic-bezier(0.22, 0.9, 0.24, 1);
  --font-sans: "Geist", system-ui, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --leading-body: 22px;
  --leading-small: 18px;
  --leading-title: 28px;
  --leading-ui: 20px;
  --press-scale: 0.97;
  --radius-full: 9999px;
  --radius-md: 8px;
  --radius-xl: 16px;
  --spring-panel: linear(0, 0.0198, 0.069, 0.1356, 0.211, 0.2893, 0.3667, 0.4407, 0.5096, 0.5727, 0.6297, 0.6805, 0.7255, 0.765, 0.7995, 0.8294, 0.8552, 0.8774, 0.8964, 0.9127, 0.9265, 0.9382, 0.9482, 0.9566, 0.9637, 0.9696, 0.9746, 0.9788, 0.9824, 0.9853, 0.9878, 0.9899, 0.9916, 0.993, 0.9942, 0.9952, 0.996, 0.9967, 0.9973, 0.9978, 1);
  --spring-panel-duration: 530ms;
  --spring-pop: linear(0, 0.0413, 0.1464, 0.2895, 0.4487, 0.6073, 0.7529, 0.8776, 0.9776, 1.0517, 1.1013, 1.1292, 1.1394, 1.1357, 1.1225, 1.1033, 1.0813, 1.059, 1.0382, 1.0202, 1.0055, 0.9945, 0.9869, 0.9825, 0.9807, 0.9808, 0.9825, 0.985, 0.9881, 0.9912, 0.9941, 0.9967, 0.9989, 1.0005, 1.0017, 1.0024, 1.0027, 1.0027, 1.0025, 1.0022, 1);
  --spring-pop-duration: 680ms;
  --spring-press: linear(0, 0.0189, 0.0676, 0.1361, 0.2164, 0.3025, 0.3896, 0.4743, 0.5543, 0.628, 0.6945, 0.7535, 0.8049, 0.849, 0.8863, 0.9172, 0.9425, 0.9629, 0.9789, 0.9912, 1.0004, 1.0071, 1.0116, 1.0145, 1.016, 1.0166, 1.0164, 1.0156, 1.0146, 1.0133, 1.0118, 1.0104, 1.009, 1.0076, 1.0064, 1.0053, 1.0043, 1.0034, 1.0026, 1.002, 1);
  --spring-press-duration: 310ms;
  --spring-ui: linear(0, 0.0237, 0.0849, 0.1704, 0.2697, 0.3746, 0.4788, 0.5777, 0.6685, 0.7491, 0.8189, 0.8776, 0.9257, 0.9639, 0.9931, 1.0147, 1.0296, 1.0391, 1.0442, 1.046, 1.0451, 1.0425, 1.0387, 1.0342, 1.0294, 1.0246, 1.02, 1.0158, 1.012, 1.0087, 1.0059, 1.0037, 1.0019, 1.0005, 0.9994, 0.9987, 0.9982, 0.998, 0.9979, 0.9979, 1);
  --spring-ui-duration: 460ms;
  --text-body: 15px;
  --text-caption: 12px;
  --text-small: 13px;
  --text-title: 20px;
  --text-ui: 14px;
  --tracking-title: -0.015em;
  --aqua: #79EEEC;
  --aqua-100: #CFF8F6;
  --aqua-700: #0B7573;
  --ash: #646A66;
  --background: var(--canvas);
  --black: #000000;
  --border: var(--line);
  --brand-subtle: var(--aqua-100);
  --brand-text: var(--aqua-700);
  --canvas: #FAFAF8;
  --card: var(--white);
  --danger: #ce2c31;
  --danger-border: var(--red-7);
  --danger-foreground: #ffffff;
  --danger-subtle: var(--red-3);
  --danger-text: #ca2b30;
  --foreground: var(--black);
  --line: #DCDED9;
  --muted-foreground: var(--ash);
  --orange: #FE8C5F;
  --orange-700: #B5481A;
  --primary: var(--black);
  --primary-foreground: #ffffff;
  --red-11: #ce2c31;
  --red-3: #feebec;
  --red-7: #f4a9aa;
  --ring: var(--aqua-700);
  --shadow-sm: 0 1px 2px rgba(17, 17, 16, 0.04), 0 1px 3px rgba(17, 17, 16, 0.07);
  --soft-ground: #F3F2EE;
  --subtle: var(--soft-ground);
  --white: #FFFFFF;
}
/* Dark mode: follows data-theme="dark" (or class "dark") on any ancestor, or the system setting. */
[data-theme="dark"] .cn, .dark .cn {
  --aqua: #79EEEC;
  --aqua-100: #0E2E2D;

  --ash: #A3A8A4;

  --danger-border: var(--red-7);

  --danger-text: var(--red-11);
  --foreground: #F3F2EE;

  --muted-foreground: var(--ash);
  --orange: #FE8C5F;

}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]):not(.light) .cn {
    --aqua: #79EEEC;
    --aqua-100: #0E2E2D;
    --aqua-700: #79EEEC;
    --ash: #A3A8A4;
    --background: var(--canvas);
    --black: #000000;
    --border: var(--line);
    --brand-subtle: var(--aqua-100);
    --brand-text: var(--aqua);
    --canvas: #0B0C0B;
    --card: var(--white);
    --danger: #d4373c;
    --danger-border: var(--red-7);
    --danger-foreground: #ffffff;
    --danger-subtle: var(--red-3);

    --foreground: #F3F2EE;
    --line: #313432;
    --muted-foreground: var(--ash);
    --orange: #FE8C5F;
    --orange-700: #FE8C5F;
    --primary: var(--aqua);
    --primary-foreground: #000000;
    --red-11: #ff9592;
    --red-3: #3b1219;
    --red-7: #8c333a;
    --ring: var(--aqua);
    --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.4), 0 1px 3px rgba(0, 0, 0, 0.3);
    --soft-ground: #0C0D0C;
    --subtle: var(--soft-ground);
    --white: #161817;
  }
}

/* Cancel, Eventually: reach for Cancel and it swaps places with Keep My Plan. Five times. Then it gives up and works.
   Outcraft Design System v2. Every value is an Outcraft token. */
.cn {
  --cn-bg: var(--card);
  --cn-fg: var(--foreground);
  --cn-muted: var(--muted-foreground);
  --cn-line: var(--border);
  container-type: inline-size;
  width: 100%;
  max-width: 400px;
  box-sizing: border-box;
  padding: 24px;
  background: var(--cn-bg);
  color: var(--cn-fg);
  border: 1px solid var(--border);
  border-radius: var(--radius-xl);
  box-shadow: var(--shadow-sm);
  font: 400 var(--text-body)/var(--leading-body) var(--font-sans);
  letter-spacing: normal;
  text-align: left;
  -webkit-font-smoothing: antialiased;
}
.cn *, .cn *::before, .cn *::after { box-sizing: border-box; }
.cn p, .cn h3 { margin: 0; }
.cn-main, .cn-done { display: flex; flex-direction: column; gap: 8px; }
.cn-head { margin-bottom: 4px; }
.cn-plan { display: inline-flex; align-items: center; height: 24px; padding: 0 10px; border-radius: var(--radius-full); background: var(--brand-subtle); color: var(--brand-text); font: 600 var(--text-caption)/1 var(--font-sans); font-variant-numeric: tabular-nums; }
.cn-title { font: 600 var(--text-title)/var(--leading-title) var(--font-sans); letter-spacing: var(--tracking-title); color: var(--cn-fg); }
.cn-body { color: var(--cn-muted); }
/* The pleading line in Outcraft Orange, nudged 35% toward Orange 700 so it holds up on white (about #E47447, 3:1).
   In dark mode --orange-700 is Orange itself, so the mix is plain #FE8C5F. Space is reserved so nothing jumps. */
.cn-quip { min-height: var(--leading-small); color: color-mix(in srgb, var(--orange) 65%, var(--orange-700)); font: 600 var(--text-small)/var(--leading-small) var(--font-sans); }
.cn-quip:empty { visibility: hidden; }
.cn-quip.is-new { animation: cn-quip var(--spring-pop-duration) var(--spring-pop); }
@keyframes cn-quip { from { opacity: 0; transform: translateY(4px); } }

/* Two equal buttons on one line */
.cn-actions { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-top: 12px; }
.cn-keep, .cn-cancel, .cn-again {
  height: 44px; padding: 0 12px; border-radius: var(--radius-md);
  font: 600 var(--text-ui)/var(--leading-ui) var(--font-sans); white-space: nowrap; cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
.cn-keep, .cn-cancel {
  position: relative; min-width: 0; overflow: hidden; text-overflow: ellipsis;
  transition: transform var(--spring-ui-duration) var(--spring-ui), background-color var(--duration-fast), border-color var(--duration-fast), color var(--duration-fast);
  will-change: transform;
}
.cn-keep { border: 0; background: var(--primary); color: var(--primary-foreground); transform: translateX(var(--cn-keep-x, 0px)); }
.cn-keep:hover { background: color-mix(in srgb, var(--primary) 88%, var(--background)); }
/* Cancel: soft red while it's running away; once it's calm, pressing it goes solid red */
.cn-cancel { border: 1px solid var(--danger-border); background: var(--danger-subtle); color: var(--danger-text); transform: translateX(var(--cn-x, 0px)); }
.cn.is-free .cn-cancel:hover { border-color: var(--danger); background: color-mix(in srgb, var(--danger) 14%, var(--danger-subtle)); }
.cn.is-free .cn-cancel:active { border-color: var(--danger); background: var(--danger); color: var(--danger-foreground); transition-duration: var(--duration-instant); }
.cn-keep:focus-visible, .cn-cancel:focus-visible, .cn-again:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }
.cn-keep.is-plead { animation: cn-plead var(--spring-pop-duration) var(--spring-pop); }
@keyframes cn-plead { 40% { scale: 1.03; } }

/* Mid-swap: neither button can be hovered or clicked, and both lean into the run */
.cn.is-running .cn-keep, .cn.is-running .cn-cancel { pointer-events: none; }
.cn.is-run-l .cn-cancel, .cn.is-run-r .cn-keep { animation: cn-lean-l var(--spring-ui-duration) var(--ease-out); }
.cn.is-run-r .cn-cancel, .cn.is-run-l .cn-keep { animation: cn-lean-r var(--spring-ui-duration) var(--ease-out); }
@keyframes cn-lean-l { 30% { rotate: -5deg; scale: 1.03 0.96; } }
@keyframes cn-lean-r { 30% { rotate: 5deg; scale: 1.03 0.96; } }
/* Out of breath: the walk home is slow, then Cancel pants */
.cn.is-walking .cn-keep, .cn.is-walking .cn-cancel { transition: transform calc(var(--spring-panel-duration) * 2) var(--ease-in-out), background-color var(--duration-fast); }
.cn.is-tired .cn-cancel { animation: cn-pant var(--duration-slower) var(--ease-in-out) 3; }
@keyframes cn-pant { 50% { scale: 1.02 0.94; } }
@container (max-width: 340px) { .cn-keep, .cn-cancel { padding: 0 8px; font-size: var(--text-small); } .cn-long { display: none; } }

.cn-done { align-items: flex-start; outline: none; animation: cn-in var(--spring-panel-duration) var(--spring-panel) both; }
@keyframes cn-in { from { opacity: 0; transform: translateY(8px); } }
.cn-again { margin-top: 12px; border: 1px solid var(--cn-line); background: var(--background); color: var(--cn-fg); transition: transform var(--spring-press-duration) var(--spring-press); }
.cn-again:hover { background: var(--subtle); }
.cn-again:active { transform: scale(var(--press-scale)); }

@media (prefers-reduced-motion: reduce) {
  .cn-keep, .cn-cancel, .cn.is-walking .cn-keep, .cn.is-walking .cn-cancel { transition: opacity var(--duration-reduced) var(--ease-out), background-color var(--duration-fast); }
  .cn.is-run-l .cn-cancel, .cn.is-run-r .cn-cancel, .cn.is-run-l .cn-keep, .cn.is-run-r .cn-keep, .cn.is-tired .cn-cancel, .cn-keep.is-plead, .cn-done, .cn-quip.is-new { animation: none; }
  .cn.is-blink .cn-cancel, .cn.is-blink .cn-keep { opacity: 0; }
  .cn-again:active { transform: none; }
}
.cn [hidden] { display: none !important; }

</style>
</head>
<body>

<div class="cn" data-mi="cancel-dodge">
  <div class="cn-main">
    <div class="cn-head">
      <span class="cn-plan">Pro · $24/mo</span>
    </div>
    <h3 class="cn-title">Cancel your subscription?</h3>
    <p class="cn-body">You’ll lose 14 projects, your custom domain, and the 3 teammates who quietly depend on you.</p>
    <p class="cn-quip" role="status" aria-live="polite">No rush. We’ll be right here.</p>
    <div class="cn-actions">
      <button type="button" class="cn-keep">Keep My Plan</button>
      <button type="button" class="cn-cancel">Cancel<span class="cn-long"> Subscription</span></button>
    </div>
  </div>
  <div class="cn-done" hidden tabindex="-1">
    <h3 class="cn-title">Subscription canceled.</h3>
    <p class="cn-body">Your Pro plan ends on November 23. Your 14 projects will be fine. Probably.</p>
    <button type="button" class="cn-again">Resubscribe</button>
  </div>
</div>


<script>
/* Cancel, Eventually — vanilla JS. Auto-initializes every [data-mi="cancel-dodge"].
   Hover (or tap, or press Enter on) Cancel Subscription and it swaps places with Keep My Plan: Cancel runs left,
   Keep runs right, and back again. While they're running neither can be clicked. After five swaps Cancel gives up,
   both walk home slowly, and Cancel works normally. Call window.initCancelDodge(el) for elements added later. */
(function () {
  'use strict';
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)');
  var TRIES = 5;
  var QUIPS = ['Whoa. Careful.', 'Are you sure sure?', 'We can talk about this.', 'Think of the 3 teammates.', 'Last chance to stay…'];

  function ms(el, name, fallback) {
    var v = getComputedStyle(el).getPropertyValue(name).trim();
    var n = parseFloat(v);
    if (!n) return fallback;
    return /ms$/.test(v) ? n : n * 1000;
  }

  function initCancelDodge(root) {
    if (!root || root.__miCancelDodge) return;
    root.__miCancelDodge = true;
    var main = root.querySelector('.cn-main'), done = root.querySelector('.cn-done');
    var btn = root.querySelector('.cn-cancel');
    var keep = root.querySelector('.cn-keep'), again = root.querySelector('.cn-again');
    var quip = root.querySelector('.cn-quip');
    var tries = 0, swapped = false, running = false, free = false, timers = [];

    function later(fn, t) { timers.push(setTimeout(fn, t)); }
    function clearTimers() { timers.forEach(clearTimeout); timers = []; }
    function reach() { return btn.offsetLeft - keep.offsetLeft; }       // one button width plus the gap
    function place(on) {
      var d = on ? reach() : 0;
      root.style.setProperty('--cn-x', (-d).toFixed(1) + 'px');           // Cancel runs left
      root.style.setProperty('--cn-keep-x', d.toFixed(1) + 'px');         // Keep My Plan runs right
    }
    function say(t) {
      quip.textContent = t;
      quip.classList.remove('is-new'); void quip.offsetWidth; if (t) quip.classList.add('is-new');
    }
    function plead() {
      keep.classList.remove('is-plead'); void keep.offsetWidth; keep.classList.add('is-plead');
    }

    function moveTo(on, dur, done_) {
      if (reduce.matches) {
        // No travel: both blink out and reappear swapped.
        root.classList.add('is-blink');
        later(function () { place(on); root.classList.remove('is-blink'); }, ms(root, '--duration-reduced', 120));
        later(done_, ms(root, '--duration-reduced', 120) * 2);
      } else {
        place(on);
        later(done_, dur);
      }
    }

    function dodge() {
      if (running || free) return;
      tries += 1;
      swapped = !swapped;                              // Cancel left and Keep right, then back, alternating
      running = true;
      root.classList.add('is-running', swapped ? 'is-run-l' : 'is-run-r');
      say(QUIPS[tries - 1] || QUIPS[QUIPS.length - 1]);
      plead();
      moveTo(swapped, ms(root, '--spring-ui-duration', 460), function () {
        root.classList.remove('is-running', 'is-run-l', 'is-run-r');
        running = false;
        if (tries >= TRIES) { tire(); return; }
        // Cursor caught up while it was landing: off it goes again.
        if (btn.matches(':hover')) dodge();
      });
    }

    function tire() {
      running = true;
      say('Fine. It’s tired.');
      root.classList.add('is-running', 'is-walking');
      swapped = false;
      moveTo(false, ms(root, '--spring-panel-duration', 530) * 2, function () {
        root.classList.remove('is-running', 'is-walking');
        running = false; free = true;
        root.classList.add('is-free');
        say('Okay. It’s all yours.');
        if (!reduce.matches) {
          root.classList.add('is-tired');
          later(function () { root.classList.remove('is-tired'); }, ms(root, '--duration-slower', 480) * 3);
        }
      });
    }

    function cancel() {
      main.hidden = true; done.hidden = false;
      done.focus({ preventScroll: true });
    }

    function reset() {
      clearTimers();
      tries = 0; swapped = false; running = false; free = false;
      root.classList.remove('is-running', 'is-run-l', 'is-run-r', 'is-walking', 'is-tired', 'is-blink', 'is-free');
      place(false);
      done.hidden = true; main.hidden = false;
    }

    // Mouse and pen: just arriving on it is enough to make it run.
    btn.addEventListener('pointerenter', function (e) { if (e.pointerType !== 'touch') dodge(); });
    // Touch: a tap is an attempt. Swallow it so no click lands.
    btn.addEventListener('pointerdown', function (e) {
      if (e.pointerType === 'touch' && !free) { e.preventDefault(); dodge(); }
    });
    btn.addEventListener('click', function (e) {
      if (running) { e.preventDefault(); return; }       // clicks mid-run do nothing
      if (!free) { e.preventDefault(); if (e.detail === 0) dodge(); return; }   // keyboard: Enter counts as a try
      cancel();
    });
    keep.addEventListener('click', function (e) { if (running) { e.preventDefault(); return; } say('Great choice. It was the only choice.'); plead(); });
    again.addEventListener('click', function () {
      reset(); say('Welcome back. We knew you would.');
      keep.focus({ preventScroll: true });
    });
    window.addEventListener('resize', function () { if (swapped) place(true); });
  }

  window.initCancelDodge = initCancelDodge;
  function boot() { document.querySelectorAll('[data-mi="cancel-dodge"]').forEach(initCancelDodge); }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
})();

</script>
