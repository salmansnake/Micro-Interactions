<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Paper Invite · Micro Interactions</title>
<link rel="icon" type="image/svg+xml" href="../icons/outcraft-favicon-light.svg" media="(prefers-color-scheme: light)">
<link rel="icon" type="image/svg+xml" href="../icons/outcraft-favicon-dark.svg" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="../icons/outcraft-icon-180x180-light.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="../outcraft-tokens.css">
<style>
html, body { min-height: 100%; }
body { margin: 0; display: grid; place-items: center; padding: 64px 16px 48px; box-sizing: border-box; background: var(--subtle); color: var(--body); font-family: var(--font-sans); }
</style>
<style>
/* Paper Invite — invites fold into paper planes and fly off; the ones that can't go boomerang back with a reason.
   Outcraft Design System v2. Every value is an Outcraft token. */
.pi {
  --pi-bg: var(--card);
  --pi-fg: var(--foreground);
  --pi-muted: var(--muted-foreground);
  --pi-line: var(--border);
  --pi-sunken: var(--subtle);
  --pi-fill: var(--muted);
  --pi-accent: var(--primary);
  --pi-on-accent: var(--primary-foreground);
  --pi-red: var(--danger);
  --pi-red-text: var(--danger-text);
  --pi-red-soft: oklch(from var(--danger) var(--tint-l) calc(c * var(--tint-c)) h);
  --pi-green-text: var(--success-text);
  position: relative;
  display: flex;
  flex-direction: column;
  gap: 8px;
  width: 100%;
  max-width: 440px;
  box-sizing: border-box;
  padding: 20px;
  overflow: hidden;
  background: var(--pi-bg);
  color: var(--pi-fg);
  border-radius: var(--radius-xl);
  border: 1px solid var(--border);
  box-shadow: var(--shadow-sm);
  font: 400 var(--text-body)/var(--leading-body) var(--font-sans);
  letter-spacing: normal;
  text-align: left;
  -webkit-font-smoothing: antialiased;
}
/* Top of the card: trimmed to the capitals, so the padding above reads the same as the padding below (10b.39) */
.pi-title { text-box: trim-start cap alphabetic; margin: 0; font-size: var(--text-title-sm); line-height: var(--leading-title-sm); font-weight: 600; letter-spacing: var(--tracking-title); }
.pi-sub { margin: 0 0 4px; color: var(--pi-muted); font-size: var(--text-small); line-height: var(--leading-small); }
.pi-box { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; min-height: 52px; box-sizing: border-box; padding: 8px; border: 1px solid var(--input); border-radius: var(--radius-md); background: var(--card); box-shadow: var(--shadow-xs); cursor: text; transition: box-shadow var(--duration-base), border-color var(--duration-base); }
.pi-box:focus-within { border-color: var(--ring); box-shadow: 0 0 0 3px color-mix(in srgb, var(--ring) 22%, transparent); }
.pi-input { flex: 1 1 140px; min-width: 120px; height: 32px; padding: 0 6px; border: 0; background: transparent; color: var(--pi-fg); font: inherit; font-size: var(--text-body); outline: none; }
.pi-chip { display: inline-flex; align-items: center; gap: 4px; height: 32px; max-width: 100%; box-sizing: border-box; padding: 0 4px 0 12px; border-radius: var(--radius-full); background: var(--pi-bg); box-shadow: 0 0 0 1px var(--pi-line), var(--shadow-xs); font-size: var(--text-ui); animation: pi-in var(--spring-ui-duration) var(--spring-ui) both; }
@keyframes pi-in { from { opacity: 0; transform: scale(0.8); } }
.pi-chip span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pi-chip.is-bad { background: var(--pi-red-soft); color: var(--pi-red-text); box-shadow: 0 0 0 1px color-mix(in srgb, var(--pi-red) 45%, transparent); }
.pi-chip.is-back { animation: pi-back var(--spring-pop-duration) var(--spring-pop) both; }
@keyframes pi-back { 0% { transform: translate(60px, -40px) rotate(20deg) scale(0.6); opacity: 0.4; } 100% { transform: none; opacity: 1; } }
.pi-x { display: grid; place-items: center; width: 24px; height: 24px; padding: 0; border: 0; border-radius: 50%; background: none; color: inherit; opacity: 0.6; font-size: var(--text-body-lg); line-height: 1; cursor: pointer; }
.pi-x svg { display: block; width: 14px; height: 14px; }
/* The hover circle is a wash of the chip's own text color, so it reads on a white chip and a red one alike (plain gray went muddy on red) */
.pi-x:hover { background: color-mix(in srgb, currentColor 16%, transparent); opacity: 1; }
.pi-x:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; opacity: 1; }
.pi-why { display: block; width: 100%; margin: 2px 0 0 4px; color: var(--pi-red-text); font-size: var(--text-caption); line-height: var(--leading-caption); }
.pi-foot { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 4px; }
.pi-status { flex: 1; min-width: 0; margin: 0; color: var(--pi-muted); font-size: var(--text-small); line-height: var(--leading-small); }
.pi-status.is-good { color: var(--pi-green-text); font-weight: 600; }
.pi-send { flex: none; height: 40px; padding: 0 18px; border: 0; border-radius: var(--radius-md); background: var(--pi-accent); color: var(--pi-on-accent); font: inherit; font-weight: 600; cursor: pointer; transition: transform var(--spring-press-duration) var(--spring-press), opacity var(--duration-base); }
.pi-send:active { transform: scale(var(--press-scale)); }
.pi-send:disabled { opacity: 0.35; cursor: default; }
.pi-send:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }
.pi-try { display: flex; align-items: center; gap: 8px; margin-top: 6px; padding-top: 14px; border-top: 1px solid var(--pi-line); color: var(--pi-muted); font-size: var(--text-small); }
.pi-try button { height: 28px; padding: 0 12px; border: 0; border-radius: var(--radius-sm); background: var(--pi-fill); color: var(--pi-fg); font: inherit; cursor: pointer; }
.pi-try button:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }
/* A flying plane */
.pi-plane { position: absolute; z-index: 5; left: 0; top: 0; width: 26px; height: 26px; color: var(--pi-accent); pointer-events: none; }
.pi-plane.is-bad { color: var(--pi-red); }
.pi-plane svg { width: 100%; height: 100%; }
@media (prefers-reduced-motion: reduce) {
  .pi-chip, .pi-chip.is-back { animation: none; }
}
/* Multi-line text wraps evenly and never ends on one or two lonely words */
.pi :is(p, li, dd, dt, small, label, figcaption, h1, h2, h3, h4) { text-wrap: balance; }
.pi [hidden] { display: none !important; }

</style>
<style>
/* Reset: a small icon button in the corner of every demo; a "Reset" pill slides out on hover or focus */
.mi-host { display: contents; }
.mi-reset { position: absolute; top: 12px; right: 12px; z-index: 5; display: grid; place-items: center; width: 32px; height: 32px; padding: 0; border: 1px solid var(--border); border-radius: var(--radius-full); background: var(--card); color: var(--muted-foreground); box-shadow: var(--shadow-xs); cursor: pointer; -webkit-tap-highlight-color: transparent; transition: color var(--duration-fast) var(--ease-out), border-color var(--duration-fast) var(--ease-out); }
.mi-reset svg { width: 16px; height: 16px; transition: transform var(--spring-ui-duration) var(--spring-ui); }
.mi-reset:hover, .mi-reset:focus-visible { color: var(--foreground); border-color: var(--border-strong); }
.mi-reset:hover svg { transform: rotate(-45deg); }
.mi-reset.is-spin svg { transform: rotate(-360deg); transition: transform var(--spring-pop-duration) var(--spring-pop); }
.mi-reset:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }
.mi-reset-tip { position: absolute; top: 50%; right: calc(100% + 6px); padding: 4px 10px; border-radius: var(--radius-full); background: var(--foreground); color: var(--background); font: 500 var(--text-caption)/var(--leading-caption) var(--font-sans); white-space: nowrap; pointer-events: none; opacity: 0; transform: translate(6px, -50%) scale(0.96); transform-origin: right center; transition: opacity var(--duration-fast) var(--ease-out), transform var(--spring-ui-duration) var(--spring-ui); }
.mi-reset:hover .mi-reset-tip, .mi-reset:focus-visible .mi-reset-tip { opacity: 1; transform: translate(0, -50%) scale(1); }
.mi-reset--page { position: fixed; top: 16px; right: 16px; }
@media (hover: none) { .mi-reset-tip { display: none; } }
@media (prefers-reduced-motion: reduce) { .mi-reset svg, .mi-reset.is-spin svg, .mi-reset-tip { transition: opacity var(--duration-reduced) var(--ease-out); transform: none; } .mi-reset-tip { transform: translate(0, -50%); } }
.mi-sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

</style>
</head>
<body>
<button type="button" class="mi-reset mi-reset--page" data-mi-reset aria-label="Reset Paper Invite"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg><span class="mi-reset-tip" aria-hidden="true">Reset</span></button>
<div class="mi-host"><div class="pi" data-mi="paper-invite" data-members="mira@northwind.co">
  <p class="pi-title">Invite Teammates</p>
  <p class="pi-sub">Type emails, separated by commas or spaces.</p>
  <div class="pi-box">
    <input class="pi-input" type="text" inputmode="email" autocomplete="off" spellcheck="false" placeholder="name@company.com" aria-label="Email addresses">
  </div>
  <div class="pi-foot">
    <p class="pi-status" role="status" aria-live="polite"></p>
    <button type="button" class="pi-send" disabled>Send Invites</button>
  </div>
  <div class="pi-try"><span>Try</span><button type="button" class="pi-sample">Fill Sample Emails</button></div>
</div>
</div>
<script>
/* Paper Invite — vanilla JS. Auto-initializes every [data-mi="paper-invite"].
   data-members lists emails already in the workspace. Call window.initPaperInvite(el) for later elements. */
(function () {
  'use strict';
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)');
  var PLANE = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M2.6 10.9 20.4 3.4c.8-.3 1.5.4 1.2 1.2l-7.5 17.8c-.3.8-1.5.8-1.8-.1l-2-6.4-6.4-2c-.9-.3-.9-1.5-.1-1.8Z"/></svg>';
  var SAMPLE = 'sam@northwind.co, ali@northwind.co, mira@northwind.co, jo@northwind';

  function problem(email, members) {
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)) return 'This address is missing its ending, like .com.';
    if (members.indexOf(email.toLowerCase()) > -1) return 'Already a member of this workspace.';
    return '';
  }

  // Even line breaks: text that wraps to two or three lines is narrowed until its lines are close in length,
  // with the first line the longest, so no line runs long while the next holds a word or two.
  function evenLines(root) {
    var SEL = 'p, li, dd, dt, small, label, figcaption, h1, h2, h3, h4';
    function widths(el) {
      var range = document.createRange(), rows = [];
      range.selectNodeContents(el);
      Array.prototype.forEach.call(range.getClientRects(), function (b) {
        if (!b.width) return;
        var row = rows.filter(function (x) { return Math.abs(x.t - b.top) < b.height / 2; })[0];
        if (row) { row.l = Math.min(row.l, b.left); row.r = Math.max(row.r, b.right); } else rows.push({ t: b.top, l: b.left, r: b.right });
      });
      return rows.sort(function (a, b) { return a.t - b.t; }).map(function (x) { return x.r - x.l; });
    }
    function fit(el) {
      el.style.maxWidth = ''; el.style.textWrap = '';
      var cs = getComputedStyle(el), full = el.getBoundingClientRect().width;
      if (!full || cs.whiteSpace === 'nowrap' || /flex|grid/.test(cs.display)) return;
      if (Array.prototype.some.call(el.children, function (c) { return !/^inline/.test(getComputedStyle(c).display); })) return;
      el.style.textWrap = 'wrap';
      var n = widths(el).length, lo = 0, hi = full, w, L;
      if (n < 2 || n > 3) { el.style.textWrap = ''; return; }
      while (hi - lo > 1) { w = (lo + hi) / 2; el.style.maxWidth = w + 'px'; if (widths(el).length > n) lo = w; else hi = w; }
      var best = 0, gap = Infinity;
      for (w = Math.ceil(hi); w <= full; w += 2) {
        el.style.maxWidth = w + 'px'; L = widths(el);
        // Each line no longer than the one above (within 10%, which reads as equal). Keep the most even width,
        // and prefer the first line longer: a last line longer than the first costs three times its overhang
        var score = Math.max.apply(null, L) - Math.min.apply(null, L) + Math.max(0, L[n - 1] - L[0]) * 3;
        if (L.length === n && L.every(function (x, i) { return !i || x <= L[i - 1] * 1.1 + 1; }) && score < gap) { gap = score; best = w; }
      }
      if (!best) { el.style.maxWidth = ''; el.style.textWrap = ''; return; }
      el.style.maxWidth = best + 'px';
      if (cs.textAlign === 'center' && cs.display === 'block') { el.style.marginLeft = 'auto'; el.style.marginRight = 'auto'; }
    }
    var queued = false, lastW = 0;
    function run() { queued = false; Array.prototype.forEach.call(root.querySelectorAll(SEL), fit); }
    function later() { if (!queued) { queued = true; requestAnimationFrame(run); } }
    later();
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(later);
    if (window.ResizeObserver) new ResizeObserver(function () { var w = root.getBoundingClientRect().width; if (Math.abs(w - lastW) > 0.5) { lastW = w; later(); } }).observe(root);
    if (window.MutationObserver) new MutationObserver(later).observe(root, { subtree: true, childList: true, characterData: true, attributes: true, attributeFilter: ['hidden'] });
  }

  function initPaperInvite(root) {
    if (!root || root.__miInvite) return;
    root.__miInvite = true;
    evenLines(root);
    var members = (root.getAttribute('data-members') || '').toLowerCase().split(',').filter(Boolean);
    var box = root.querySelector('.pi-box');
    var input = root.querySelector('.pi-input');
    var send = root.querySelector('.pi-send');
    var status = root.querySelector('.pi-status');
    var sending = false;

    function chips() { return Array.prototype.slice.call(box.querySelectorAll('.pi-chip')); }
    function refresh() { send.disabled = sending || chips().length === 0; }

    function addChip(email, bad, why) {
      email = email.trim().replace(/[,;]+$/, '');
      if (!email) return;
      if (chips().some(function (c) { return c.getAttribute('data-email') === email.toLowerCase(); })) return;
      var c = document.createElement('span');
      c.className = 'pi-chip' + (bad ? ' is-bad is-back' : '');
      c.setAttribute('data-email', email.toLowerCase());
      var s = document.createElement('span'); s.textContent = email;
      var x = document.createElement('button'); x.type = 'button'; x.className = 'pi-x'; x.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>'; x.setAttribute('aria-label', 'Remove ' + email);
      x.addEventListener('click', function () { var why = c.nextElementSibling; if (why && why.classList.contains('pi-why')) why.remove(); c.remove(); refresh(); input.focus(); });
      c.append(s, x);
      box.insertBefore(c, input);
      if (bad && why) {
        var w = document.createElement('span'); w.className = 'pi-why'; w.textContent = email + ': ' + why;
        box.insertBefore(w, input);
      }
      refresh();
    }

    function takeInput() {
      input.value.split(/[\s,;]+/).forEach(function (e) { addChip(e); });
      input.value = '';
    }

    input.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' || e.key === ',' || e.key === ' ' || e.key === 'Tab' && input.value.trim()) {
        if (input.value.trim()) { e.preventDefault(); takeInput(); }
        if (e.key === 'Enter' && !input.value.trim() && !send.disabled) send.click();
      } else if (e.key === 'Backspace' && !input.value) {
        var last = chips().pop();
        if (last) { var why = last.nextElementSibling; if (why && why.classList.contains('pi-why')) why.remove(); last.remove(); refresh(); }
      }
    });
    input.addEventListener('paste', function () { setTimeout(takeInput, 0); });
    input.addEventListener('blur', function () { if (input.value.trim()) takeInput(); });
    box.addEventListener('click', function (e) { if (e.target === box) input.focus(); });

    function fly(chip, bad) {
      return new Promise(function (resolve) {
        var o = root.getBoundingClientRect(), r = chip.getBoundingClientRect();
        var plane = document.createElement('span');
        plane.className = 'pi-plane' + (bad ? ' is-bad' : '');
        plane.innerHTML = PLANE;
        root.appendChild(plane);
        var x0 = r.left - o.left + r.width / 2 - 13, y0 = r.top - o.top + r.height / 2 - 13;
        var x1 = o.width + 40, y1 = -60;
        // The chip folds: squash to nothing while the plane appears.
        chip.animate([{ transform: 'none', opacity: 1 }, { transform: 'scale(0.2, 0.6) rotate(-12deg)', opacity: 0 }], { duration: 260, easing: 'ease-in', fill: 'forwards' });
        var frames = [];
        for (var k = 0; k <= 16; k++) {
          var t = k / 16, x, y, rot;
          if (!bad) {
            x = x0 + (x1 - x0) * t * t; y = y0 + (y1 - y0) * t - Math.sin(t * Math.PI) * 30;
            rot = -20 + t * 10;
          } else { // out, then a loop back home
            var q = Math.sin(t * Math.PI);
            x = x0 + q * 150; y = y0 - q * 70 - Math.sin(t * Math.PI * 2) * 20;
            rot = t < 0.5 ? -25 : 160;
          }
          frames.push({ transform: 'translate(' + x.toFixed(1) + 'px,' + y.toFixed(1) + 'px) rotate(' + rot + 'deg) scale(' + (t < 0.1 ? 0.4 + t * 6 : 1) + ')', opacity: !bad && t > 0.85 ? (1 - t) / 0.15 : 1 });
        }
        plane.animate(frames, { duration: bad ? 1050 : 800, delay: 150, easing: 'cubic-bezier(.45,.05,.55,.95)', fill: 'both' }).finished.then(function () { plane.remove(); resolve(); });
      });
    }

    send.addEventListener('click', function () {
      if (input.value.trim()) takeInput();
      var list = chips();
      if (!list.length || sending) return;
      sending = true;
      refresh();
      status.className = 'pi-status';
      status.textContent = 'Sending…';
      box.querySelectorAll('.pi-why').forEach(function (w) { w.remove(); });
      var sent = 0, failed = [];
      var jobs = list.map(function (chip, i) {
        var email = chip.querySelector('span').textContent;
        var why = problem(email, members);
        return new Promise(function (resolve) {
          setTimeout(function () {
            if (reduce.matches) { chip.remove(); if (why) failed.push([email, why]); else sent++; resolve(); return; }
            fly(chip, !!why).then(function () {
              chip.remove();
              if (why) failed.push([email, why]); else sent++;
              resolve();
            });
          }, i * 140);
        });
      });
      Promise.all(jobs).then(function () {
        failed.forEach(function (f) { addChip(f[0], true, f[1]); });
        sending = false;
        refresh();
        status.className = 'pi-status' + (failed.length ? '' : ' is-good');
        status.textContent = (sent ? sent + (sent === 1 ? ' invite sent.' : ' invites sent.') : 'Nothing sent.') + (failed.length ? ' ' + failed.length + (failed.length === 1 ? ' needs' : ' need') + ' attention.' : '');
      });
    });

    root.querySelector('.pi-sample').addEventListener('click', function () {
      chips().forEach(function (c) { c.remove(); });
      box.querySelectorAll('.pi-why').forEach(function (w) { w.remove(); });
      SAMPLE.split(',').forEach(function (e) { addChip(e); });
      status.className = 'pi-status';
      status.textContent = '';
    });
  }

  window.initPaperInvite = initPaperInvite;
  function boot() { document.querySelectorAll('[data-mi="paper-invite"]').forEach(initPaperInvite); }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();

</script>
<script>
(function () {
  var host = document.querySelector('.mi-host'), orig = host.innerHTML, fn = window["initPaperInvite"];
  document.querySelector('[data-mi-reset]').addEventListener('click', function (e) {
    host.innerHTML = orig;
    host.querySelectorAll('[data-mi]').forEach(function (el) { if (typeof fn === 'function') fn(el); });
    var b = e.currentTarget; b.classList.remove('is-spin'); void b.offsetWidth; b.classList.add('is-spin');
    setTimeout(function () { b.classList.remove('is-spin'); }, 700);
  });
})();
</script>
</body>
</html>
