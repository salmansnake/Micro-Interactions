<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bubble Wrap Loader · Micro Interactions</title>
<link rel="icon" type="image/svg+xml" href="../icons/outcraft-favicon-light.svg" media="(prefers-color-scheme: light)">
<link rel="icon" type="image/svg+xml" href="../icons/outcraft-favicon-dark.svg" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="../icons/outcraft-icon-180x180-light.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="../outcraft-tokens.css">
<style>
html, body { min-height: 100%; }
body { margin: 0; display: grid; place-items: center; padding: 64px 16px 48px; box-sizing: border-box; background: var(--background); color: var(--body); font-family: var(--font-sans); }
</style>
<style>
/* Bubble Wrap Loader — a sheet of bubble wrap to pop while an upload finishes.
   Outcraft Design System v2. Every value is an Outcraft token. */
.bw {
  --bw-bg: var(--card);
  --bw-fg: var(--foreground);
  --bw-muted: var(--muted-foreground);
  --bw-sunken: var(--subtle);
  --bw-fill: var(--muted);
  --bw-accent: var(--primary);
  --bw-shine: var(--raised);
  --bw-rim: color-mix(in srgb, var(--bw-fill) 78%, var(--foreground));
  --bw-p: 0;
  display: flex;
  flex-direction: column;
  gap: 16px;
  width: 100%;
  max-width: 400px;
  box-sizing: border-box;
  padding: 20px;
  background: var(--bw-bg);
  color: var(--bw-fg);
  border-radius: var(--radius-xl);
  border: 1px solid var(--border);
  box-shadow: var(--shadow-sm);
  font: 400 var(--text-body)/var(--leading-body) var(--font-sans);
  letter-spacing: normal;
  text-align: left;
  -webkit-font-smoothing: antialiased;
}
.bw p { margin: 0; }
.bw-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
.bw-title b { display: block; font-weight: 600; text-box: trim-start cap alphabetic; }
.bw-title small { display: block; margin-top: 2px; color: var(--bw-muted); font-size: var(--text-small); line-height: var(--leading-small); font-variant-numeric: tabular-nums; }
.bw-pct { font: 600 var(--text-title)/var(--leading-title) var(--font-mono); font-variant-numeric: tabular-nums; text-box: trim-start cap alphabetic; }
.bw.is-done .bw-pct { color: var(--success-text); }
.bw-bar { position: relative; height: 8px; overflow: hidden; border-radius: var(--radius-full); background: var(--bw-fill); }
.bw-fill { position: absolute; inset: 0; border-radius: inherit; background: var(--bw-accent); transform: scaleX(var(--bw-p)); transform-origin: 0 50%; }
.bw.is-done .bw-fill { background: var(--success); color: var(--success-foreground); }

/* The sheet: clear air bubbles, see-through in the middle and denser at the rim like a lens, with a soft shine
   top left, a light catch bottom right and a small shadow on the film; popped ones go flat and crinkled */
.bw-sheet { display: grid; grid-template-columns: repeat(auto-fill, minmax(30px, 1fr)); gap: 6px; padding: 12px; border-radius: var(--radius-lg); background: var(--bw-sunken); touch-action: none; -webkit-user-select: none; user-select: none; }
.bw-b {
  position: relative; aspect-ratio: 1; padding: 0; border: 0; border-radius: 50%;
  background:
    radial-gradient(circle at 33% 28%, var(--bw-shine) 0 8%, transparent 14%),
    radial-gradient(ellipse 42% 30% at 38% 30%, color-mix(in srgb, var(--bw-shine) 40%, transparent), transparent),
    radial-gradient(circle at 50% 46%, color-mix(in srgb, var(--bw-fill) 92%, transparent) 0 40%, color-mix(in srgb, var(--bw-fill) 93%, var(--foreground)) 76%, var(--bw-rim) 100%);
  box-shadow: inset -2px -3px 3px -1px color-mix(in srgb, var(--bw-shine) 80%, transparent), inset 0 0 0 1px color-mix(in srgb, var(--foreground) 6%, transparent), 0 2px 3px -1px color-mix(in srgb, var(--foreground) 18%, transparent);
  cursor: pointer; transition: transform var(--spring-press-duration) var(--spring-press);
}
.bw-b:hover:not(.is-popped) { transform: scale(1.06); }
.bw-b:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }
.bw-b.is-popped {
  background: color-mix(in srgb, var(--bw-fill) 60%, transparent);
  box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--foreground) 6%, transparent), inset 0 1px 2px color-mix(in srgb, var(--foreground) 10%, transparent);
  transform: scale(0.82, 0.7); cursor: default; animation: bw-pop var(--duration-slow) var(--ease-out);
}
.bw-b.is-popped::before { content: ""; position: absolute; left: 22%; right: 22%; top: 48%; height: 1px; background: color-mix(in srgb, var(--foreground) 18%, transparent); transform: rotate(-18deg); }
/* In dark the shine is the light text color, so the bubbles stay clear rather than going dull gray */
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .bw { --bw-shine: color-mix(in srgb, var(--foreground) 42%, transparent); } }
:root[data-theme="dark"] .bw { --bw-shine: color-mix(in srgb, var(--foreground) 42%, transparent); }
/* The pop: a quick squash and a ring that bursts out and fades */
.bw-b.is-popped::after { content: ""; position: absolute; inset: -2px; border-radius: 50%; box-shadow: 0 0 0 2px var(--bw-accent); opacity: 0; animation: bw-burst var(--duration-slower) var(--ease-out); }
@keyframes bw-pop { 0% { transform: scale(1.12); } 40% { transform: scale(0.74, 0.62); } 100% { transform: scale(0.82, 0.7); } }
@keyframes bw-burst { 0% { opacity: 0.7; transform: scale(0.8); } 100% { opacity: 0; transform: scale(1.5); } }

.bw-foot { display: flex; align-items: center; gap: 12px; }
.bw .bw-status { flex: 1; min-width: 0; margin-right: auto; color: var(--body); font-size: var(--text-small); line-height: var(--leading-small); font-variant-numeric: tabular-nums; }
.bw-new { flex: none; height: 44px; padding: 0 16px; border: 0; border-radius: var(--radius-md); background: var(--bw-fill); color: var(--bw-fg); font: inherit; font-size: var(--text-ui); font-weight: 600; white-space: nowrap; cursor: pointer; transition: transform var(--spring-press-duration) var(--spring-press), background-color var(--duration-fast); }
.bw-new:hover { background: var(--muted-hover); }
.bw-new:active { transform: scale(var(--press-scale)); }
.bw-new:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }

@media (prefers-reduced-motion: reduce) {
  .bw-b { transition-duration: var(--duration-reduced); }
  .bw-b.is-popped, .bw-b.is-popped::after { animation: none; }
}
/* Multi-line text wraps evenly and never ends on one or two lonely words */
.bw :is(p, li, dd, dt, small, label, figcaption, h1, h2, h3, h4) { text-wrap: balance; }
.bw [hidden] { display: none !important; }

</style>
<style>
/* Reset: a small icon button in the corner of every demo; a "Reset" pill slides out on hover or focus */
.mi-host { display: contents; }
.mi-reset { position: absolute; top: 12px; right: 12px; z-index: 5; display: grid; place-items: center; width: 32px; height: 32px; padding: 0; border: 1px solid var(--border); border-radius: var(--radius-full); background: var(--card); color: var(--muted-foreground); box-shadow: var(--shadow-xs); cursor: pointer; -webkit-tap-highlight-color: transparent; transition: color var(--duration-fast) var(--ease-out), border-color var(--duration-fast) var(--ease-out); }
.mi-reset svg { width: 16px; height: 16px; transition: transform var(--spring-ui-duration) var(--spring-ui); }
.mi-reset:hover, .mi-reset:focus-visible { color: var(--foreground); border-color: var(--border-strong); }
.mi-reset:hover svg { transform: rotate(-45deg); }
.mi-reset.is-spin svg { transform: rotate(-360deg); transition: transform var(--spring-pop-duration) var(--spring-pop); }
.mi-reset:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }
.mi-reset-tip { position: absolute; top: 50%; right: calc(100% + 6px); padding: 4px 10px; border-radius: var(--radius-full); background: var(--foreground); color: var(--background); font: 500 var(--text-caption)/var(--leading-caption) var(--font-sans); white-space: nowrap; pointer-events: none; opacity: 0; transform: translate(6px, -50%) scale(0.96); transform-origin: right center; transition: opacity var(--duration-fast) var(--ease-out), transform var(--spring-ui-duration) var(--spring-ui); }
.mi-reset:hover .mi-reset-tip, .mi-reset:focus-visible .mi-reset-tip { opacity: 1; transform: translate(0, -50%) scale(1); }
.mi-reset--page { position: fixed; top: 16px; right: 16px; }
@media (hover: none) { .mi-reset-tip { display: none; } }
@media (prefers-reduced-motion: reduce) { .mi-reset svg, .mi-reset.is-spin svg, .mi-reset-tip { transition: opacity var(--duration-reduced) var(--ease-out); transform: none; } .mi-reset-tip { transform: translate(0, -50%); } }
.mi-sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

</style>
</head>
<body>
<button type="button" class="mi-reset mi-reset--page" data-mi-reset aria-label="Reset Bubble Wrap Loader"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg><span class="mi-reset-tip" aria-hidden="true">Reset</span></button>
<div class="mi-host"><div class="bw" data-mi="bubble-wrap" data-bubbles="32" data-seconds="14">
  <div class="bw-head">
    <p class="bw-title"><b>Uploading 12 photos</b><small class="bw-sub">About 14 seconds left</small></p>
    <p class="bw-pct" aria-hidden="true">0%</p>
  </div>
  <div class="bw-bar" role="progressbar" aria-label="Upload progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><span class="bw-fill"></span></div>
  <div class="bw-sheet" role="group" aria-label="Bubble wrap, for while you wait"></div>
  <div class="bw-foot">
    <p class="bw-status" role="status" aria-live="polite">Something to do while you wait.</p>
    <button type="button" class="bw-new">New Sheet</button>
  </div>
</div>
</div>
<script>
/* Bubble Wrap Loader — vanilla JS. Auto-initializes every [data-mi="bubble-wrap"].
   The upload runs on its own (data-seconds); the sheet of data-bubbles bubbles (6 to 60) is just for passing the time.
   Press a bubble, or drag across several, to pop them. Arrow keys move between bubbles; Space or Enter pops.
   Call window.initBubbleWrap(el) for elements added later. */
(function () {
  'use strict';

  // Even line breaks: text that wraps to two or three lines is narrowed until its lines are close in length,
  // with the first line the longest, so no line runs long while the next holds a word or two.
  function evenLines(root) {
    var SEL = 'p, li, dd, dt, small, label, figcaption, h1, h2, h3, h4';
    function widths(el) {
      var range = document.createRange(), rows = [];
      range.selectNodeContents(el);
      Array.prototype.forEach.call(range.getClientRects(), function (b) {
        if (!b.width) return;
        var row = rows.filter(function (x) { return Math.abs(x.t - b.top) < b.height / 2; })[0];
        if (row) { row.l = Math.min(row.l, b.left); row.r = Math.max(row.r, b.right); } else rows.push({ t: b.top, l: b.left, r: b.right });
      });
      return rows.sort(function (a, b) { return a.t - b.t; }).map(function (x) { return x.r - x.l; });
    }
    function fit(el) {
      el.style.maxWidth = ''; el.style.textWrap = '';
      // A filled box marked data-fill spans the card from edge to edge, and its text fills it
      if (el.hasAttribute('data-fill')) return;
      var cs = getComputedStyle(el), full = el.getBoundingClientRect().width;
      if (!full || cs.whiteSpace === 'nowrap' || /flex|grid/.test(cs.display)) return;
      if (Array.prototype.some.call(el.children, function (c) { return !/^inline/.test(getComputedStyle(c).display); })) return;
      el.style.textWrap = 'wrap';
      var n = widths(el).length, lo = 0, hi = full, w, L;
      if (n < 2 || n > 3) { el.style.textWrap = ''; return; }
      while (hi - lo > 1) { w = (lo + hi) / 2; el.style.maxWidth = w + 'px'; if (widths(el).length > n) lo = w; else hi = w; }
      var best = 0, gap = Infinity;
      for (w = Math.ceil(hi); w <= full; w += 2) {
        el.style.maxWidth = w + 'px'; L = widths(el);
        // Each line no longer than the one above (within 10%, which reads as equal). Keep the most even width,
        // and prefer the first line longer: a last line longer than the first costs three times its overhang
        var score = Math.max.apply(null, L) - Math.min.apply(null, L) + Math.max(0, L[n - 1] - L[0]) * 3;
        if (L.length === n && L.every(function (x, i) { return !i || x <= L[i - 1] * 1.1 + 1; }) && score < gap) { gap = score; best = w; }
      }
      if (!best) { el.style.maxWidth = ''; el.style.textWrap = ''; return; }
      el.style.maxWidth = best + 'px';
      if (cs.textAlign === 'center' && cs.display === 'block') { el.style.marginLeft = 'auto'; el.style.marginRight = 'auto'; }
    }
    var queued = false, lastW = 0;
    function run() { queued = false; Array.prototype.forEach.call(root.querySelectorAll(SEL), fit); }
    function later() { if (!queued) { queued = true; requestAnimationFrame(run); } }
    later();
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(later);
    if (window.ResizeObserver) new ResizeObserver(function () { var w = root.getBoundingClientRect().width; if (Math.abs(w - lastW) > 0.5) { lastW = w; later(); } }).observe(root);
    if (window.MutationObserver) new MutationObserver(later).observe(root, { subtree: true, childList: true, characterData: true, attributes: true, attributeFilter: ['hidden'] });
  }

  function initBubbleWrap(root) {
    if (!root || root.__miBw) return;
    root.__miBw = true;
    evenLines(root);
    var sheet = root.querySelector('.bw-sheet'), bar = root.querySelector('.bw-bar'), pct = root.querySelector('.bw-pct');
    var sub = root.querySelector('.bw-sub'), status = root.querySelector('.bw-status'), fresh = root.querySelector('.bw-new');
    var count = Math.min(60, Math.max(6, Number(root.getAttribute('data-bubbles')) || 32)), secs = Number(root.getAttribute('data-seconds')) || 14;
    var popped = 0, total = 0, done = false, t0 = performance.now(), raf = 0, dragging = false, at = 0;

    function say() {
      if (done) status.textContent = 'Uploaded. You popped ' + total + (total === 1 ? ' bubble' : ' bubbles') + ' while you waited.';
      else if (popped === count) status.textContent = 'Sheet finished. There’s always another sheet.';
      else if (total) status.textContent = total + ' popped. It doesn’t make it faster. It does feel nice.';
    }

    function build() {
      sheet.innerHTML = ''; popped = 0;
      for (var i = 0; i < count; i++) {
        var b = document.createElement('button');
        b.type = 'button'; b.className = 'bw-b'; b.tabIndex = i === at ? 0 : -1;
        b.setAttribute('aria-label', 'Bubble ' + (i + 1));
        sheet.appendChild(b);
      }
    }
    function pop(b) {
      if (!b || !b.classList.contains('bw-b') || b.classList.contains('is-popped')) return;
      b.classList.add('is-popped'); b.setAttribute('aria-label', 'Popped');
      popped++; total++; say();
    }

    // Press, or drag across: every bubble under the pointer pops
    sheet.addEventListener('pointerdown', function (e) {
      dragging = true; sheet.setPointerCapture(e.pointerId);
      pop(e.target.closest('.bw-b'));
    });
    sheet.addEventListener('pointermove', function (e) {
      if (!dragging) return;
      var el = document.elementFromPoint(e.clientX, e.clientY);
      pop(el && el.closest ? el.closest('.bw-b') : null);
    });
    ['pointerup', 'pointercancel'].forEach(function (t) { sheet.addEventListener(t, function () { dragging = false; }); });
    // One tab stop for the whole sheet; arrows move, Space and Enter pop
    sheet.addEventListener('keydown', function (e) {
      var bs = sheet.querySelectorAll('.bw-b'), cols = Math.max(1, Math.round(sheet.clientWidth / (bs[0].offsetWidth + 6))), to = at;
      if (e.key === 'ArrowRight') to = at + 1; else if (e.key === 'ArrowLeft') to = at - 1;
      else if (e.key === 'ArrowDown') to = at + cols; else if (e.key === 'ArrowUp') to = at - cols;
      else if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); pop(bs[at]); return; }
      else return;
      e.preventDefault();
      to = Math.max(0, Math.min(bs.length - 1, to));
      bs[at].tabIndex = -1; at = to; bs[at].tabIndex = 0; bs[at].focus();
    });
    sheet.addEventListener('click', function (e) { if (e.detail === 0) pop(e.target.closest('.bw-b')); });

    fresh.addEventListener('click', function () { at = 0; build(); say(); if (!total) status.textContent = 'Something to do while you wait.'; });

    // The upload, on its own clock
    (function tick(now) {
      if (!root.isConnected) return;
      var t = Math.min(1, (now - t0) / (secs * 1000)), p = Math.round(t * 100);
      root.style.setProperty('--bw-p', t.toFixed(4));
      pct.textContent = p + '%'; bar.setAttribute('aria-valuenow', p);
      var left = Math.ceil(secs * (1 - t));
      sub.textContent = t < 1 ? 'About ' + left + (left === 1 ? ' second' : ' seconds') + ' left' : 'All 12 photos are up';
      if (t < 1) { raf = requestAnimationFrame(tick); return; }
      done = true; root.classList.add('is-done'); say();
      if (!total) status.textContent = 'Uploaded. You didn’t pop a single one. Remarkable restraint.';
    })(t0);
    build();
  }

  window.initBubbleWrap = initBubbleWrap;
  function boot() { document.querySelectorAll('[data-mi="bubble-wrap"]').forEach(initBubbleWrap); }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();

</script>
<script>
(function () {
  var host = document.querySelector('.mi-host'), orig = host.innerHTML, fn = window["initBubbleWrap"];
  document.querySelector('[data-mi-reset]').addEventListener('click', function (e) {
    host.innerHTML = orig;
    host.querySelectorAll('[data-mi]').forEach(function (el) { if (typeof fn === 'function') fn(el); });
    var b = e.currentTarget; b.classList.remove('is-spin'); void b.offsetWidth; b.classList.add('is-spin');
    setTimeout(function () { b.classList.remove('is-spin'); }, 700);
  });
})();
</script>
</body>
</html>
