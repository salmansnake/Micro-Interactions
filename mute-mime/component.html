<div class="mm" data-mi="mute-mime">
  <div class="mm-tile">
    <div class="mm-box" aria-hidden="true"></div>
    <div class="mm-waves" aria-hidden="true"></div>
    <span class="mm-avatar" aria-hidden="true">You</span>
    <span class="mm-name"><svg class="mm-mic mm-mic--off" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19v3"/><path d="M15 9.34V5a3 3 0 0 0-5.68-1.33"/><path d="M16.95 16.95A7 7 0 0 1 5 12v-2"/><path d="M18.89 13.23A7 7 0 0 0 19 12v-2"/><path d="m2 2 20 20"/><path d="M9 9v3a3 3 0 0 0 5.12 2.12"/></svg><svg class="mm-mic mm-mic--on" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19v3"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><rect x="9" y="2" width="6" height="13" rx="3"/></svg>You</span>
  </div>
  <div class="mm-toast" hidden>
    <p class="mm-toast-text" data-fill role="status" aria-live="polite">You’re on mute. You’ve been talking for&nbsp;<span class="mm-keep"><b class="mm-secs">2</b> <span class="mm-unit">seconds</span>.</span></p>
    <button type="button" class="mm-unmute-inline">Unmute</button>
  </div>
  <div class="mm-controls">
    <button type="button" class="mm-mute" aria-pressed="true"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19v3"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><rect x="9" y="2" width="6" height="13" rx="3"/></svg><span class="mm-mute-label">Unmute</span></button>
    <button type="button" class="mm-talk">Hold to Talk</button>
  </div>
</div>
