<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Over-the-Shoulder Cursor</title>
<style>
/* Demo page only. Remove this block when pasting into your own page. */
body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 48px 16px; box-sizing: border-box; background: #F3F2EE; }
@media (prefers-color-scheme: dark) { body { background: #0C0D0C; } }
</style>
<style>
@import url('https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap');

/* Outcraft Design System v2: the tokens this component uses, scoped to .oc so they never affect the rest of your page. */
.oc {
  --duration-base: 200ms;
  --duration-reduced: 120ms;
  --duration-slower: 480ms;
  --font-sans: "Geist", system-ui, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --leading-body: 22px;
  --leading-small: 18px;
  --leading-title-sm: 24px;
  --radius-lg: 12px;
  --radius-md: 8px;
  --radius-sm: 6px;
  --radius-xl: 16px;
  --spring-pop: linear(0, 0.0413, 0.1464, 0.2895, 0.4487, 0.6073, 0.7529, 0.8776, 0.9776, 1.0517, 1.1013, 1.1292, 1.1394, 1.1357, 1.1225, 1.1033, 1.0813, 1.059, 1.0382, 1.0202, 1.0055, 0.9945, 0.9869, 0.9825, 0.9807, 0.9808, 0.9825, 0.985, 0.9881, 0.9912, 0.9941, 0.9967, 0.9989, 1.0005, 1.0017, 1.0024, 1.0027, 1.0027, 1.0025, 1.0022, 1);
  --spring-pop-duration: 680ms;
  --spring-ui: linear(0, 0.0237, 0.0849, 0.1704, 0.2697, 0.3746, 0.4788, 0.5777, 0.6685, 0.7491, 0.8189, 0.8776, 0.9257, 0.9639, 0.9931, 1.0147, 1.0296, 1.0391, 1.0442, 1.046, 1.0451, 1.0425, 1.0387, 1.0342, 1.0294, 1.0246, 1.02, 1.0158, 1.012, 1.0087, 1.0059, 1.0037, 1.0019, 1.0005, 0.9994, 0.9987, 0.9982, 0.998, 0.9979, 0.9979, 1);
  --spring-ui-duration: 460ms;
  --text-body: 15px;
  --text-caption: 12px;
  --text-small: 13px;
  --text-title-sm: 17px;
  --text-ui: 14px;
  --tracking-title: -0.015em;
  --aqua: #79EEEC;
  --aqua-700: #0B7573;
  --ash: #646A66;
  --black: #000000;
  --border: var(--line);
  --brand-strong: var(--aqua-700);
  --card: var(--white);
  --chart-1: var(--aqua);
  --chart-2: var(--pink);
  --foreground: var(--black);
  --input: var(--line-strong);
  --line: #DCDED9;
  --line-strong: #C6C9C3;
  --muted-foreground: var(--ash);
  --on-chart: #000000;
  --on-color: #ffffff;
  --pink: #FFC7F6;
  --primary: var(--black);
  --shadow-sm: 0 1px 2px rgba(17, 17, 16, 0.04), 0 1px 3px rgba(17, 17, 16, 0.07);
  --soft-ground: #F3F2EE;
  --subtle: var(--soft-ground);
  --white: #FFFFFF;
}
/* Dark mode: follows data-theme="dark" (or class "dark") on any ancestor, or the system setting. */
[data-theme="dark"] .oc, .dark .oc {
  --aqua: #79EEEC;
  --aqua-700: #79EEEC;
  --ash: #A3A8A4;
  --black: #000000;
  --border: var(--line);
  --brand-strong: var(--aqua);
  --card: var(--white);
  --chart-1: var(--aqua);
  --chart-2: var(--pink);
  --foreground: #F3F2EE;
  --input: var(--line-strong);
  --line: #313432;
  --line-strong: #434744;
  --muted-foreground: var(--ash);
  --on-chart: #000000;
  --on-color: #ffffff;
  --pink: #FFC7F6;
  --primary: var(--aqua);
  --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.4), 0 1px 3px rgba(0, 0, 0, 0.3);
  --soft-ground: #0C0D0C;
  --subtle: var(--soft-ground);
  --white: #161817;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]):not(.light) .oc {
    --aqua: #79EEEC;
    --aqua-700: #79EEEC;
    --ash: #A3A8A4;
    --black: #000000;
    --border: var(--line);
    --brand-strong: var(--aqua);
    --card: var(--white);
    --chart-1: var(--aqua);
    --chart-2: var(--pink);
    --foreground: #F3F2EE;
    --input: var(--line-strong);
    --line: #313432;
    --line-strong: #434744;
    --muted-foreground: var(--ash);
    --on-chart: #000000;
    --on-color: #ffffff;
    --pink: #FFC7F6;
    --primary: var(--aqua);
    --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.4), 0 1px 3px rgba(0, 0, 0, 0.3);
    --soft-ground: #0C0D0C;
    --subtle: var(--soft-ground);
    --white: #161817;
  }
}

/* Over-the-Shoulder Cursor — a teammate's cursor that lingers on your paragraph puts on reading glasses.
   Outcraft Design System v2. Every value is an Outcraft token. */
.oc {
  --oc-bg: var(--card);
  --oc-fg: var(--foreground);
  --oc-muted: var(--muted-foreground);
  --oc-line: var(--border);
  --oc-sunken: var(--subtle);
  --oc-accent: var(--primary);
  --oc-c: var(--chart-1);
  display: flex;
  flex-direction: column;
  gap: 12px;
  width: 100%;
  max-width: 420px;
  box-sizing: border-box;
  padding: 20px;
  background: var(--oc-bg);
  color: var(--oc-fg);
  border-radius: var(--radius-xl);
  border: 1px solid var(--border);
  box-shadow: var(--shadow-sm);
  font: 400 var(--text-body)/var(--leading-body) var(--font-sans);
  letter-spacing: normal;
  text-align: left;
  -webkit-font-smoothing: antialiased;
}
.oc p { margin: 0; }
.oc-bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.oc-doc-title { font-size: var(--text-title-sm); line-height: var(--leading-title-sm); font-weight: 600; letter-spacing: var(--tracking-title); }
.oc-people { display: flex; }
/* A letter in a tile is centered on its capital height, not its line box (10b.5): the tile trims its text to cap height and centers it.
   14px capitals leave an even split above and below at 1x and 2x */
.oc-people span { display: block; align-content: center; text-align: center; text-box: trim-both cap alphabetic; width: 26px; height: 26px; margin-left: -6px; border-radius: 50%; background: var(--c); color: var(--on-chart); font-size: var(--text-ui); font-weight: 700; box-shadow: 0 0 0 2px var(--oc-bg); }
.oc-doc { position: relative; display: flex; flex-direction: column; gap: 14px; min-height: 190px; padding: 18px 18px 22px; overflow: hidden; border-radius: var(--radius-lg); background: var(--oc-sunken); }
.oc-p { font-size: var(--text-title-sm); line-height: var(--leading-title-sm); letter-spacing: var(--tracking-title); }
.oc-edit { margin: -4px -6px !important; padding: 4px 6px; border-radius: var(--radius-md); outline: none; caret-color: var(--oc-accent); }
.oc-edit:focus-visible, .oc-edit:focus { box-shadow: 0 0 0 2px color-mix(in srgb, var(--brand-strong) 40%, transparent); }
.oc-other { color: var(--oc-muted); }

/* The teammate's cursor */
.oc-cursor { position: absolute; left: 0; top: 0; z-index: 2; pointer-events: none; transform: translate(var(--x, 300px), var(--y, 150px)) scale(var(--s, 1)); transform-origin: 3px 2px; }
.oc-arrow { display: block; width: 20px; height: 20px; filter: drop-shadow(0 1px 2px color-mix(in srgb, var(--black) 25%, transparent)); }
.oc-tag { position: absolute; left: 14px; top: 16px; display: inline-flex; align-items: center; justify-content: center; min-width: 48px; box-sizing: border-box; height: 22px; padding: 0 8px; border-radius: var(--radius-sm) var(--radius-md) var(--radius-md) var(--radius-md); background: var(--oc-c); color: var(--on-chart); font-size: var(--text-caption); font-weight: 600; white-space: nowrap; }
.oc-glasses { flex: none; width: 0; height: 10px; margin-right: 0; opacity: 0; transform: translateY(-10px) rotate(-12deg); transition: width var(--spring-ui-duration) var(--spring-ui), margin var(--spring-ui-duration) var(--spring-ui), transform var(--spring-pop-duration) var(--spring-pop), opacity var(--duration-base); }
.oc.is-reading .oc-glasses { width: 28px; margin-right: 5px; opacity: 1; transform: none; }
.oc.is-squinting .oc-glasses { transform: translateY(1px) scale(1.12); }
.oc.is-startled .oc-glasses { width: 0; margin-right: 0; opacity: 0; transform: translate(10px, 26px) rotate(140deg); transition-duration: var(--duration-slower); }
/* Bottom of the card: trimmed to the baseline, so the padding below reads the same as the padding above (10b.39) */
.oc-status { text-box: trim-end cap alphabetic; color: var(--oc-muted); font-size: var(--text-small); line-height: var(--leading-small); font-variant-numeric: tabular-nums; }

@media (prefers-reduced-motion: reduce) {
  .oc-glasses { transition-duration: var(--duration-reduced); }
}
/* Multi-line text wraps evenly and never ends on one or two lonely words */
.oc :is(p, li, dd, dt, small, label, figcaption, h1, h2, h3, h4) { text-wrap: balance; }
/* Document paragraphs keep their natural flow; only a lonely last word is avoided */
.oc .oc-doc :is(p, li) { text-wrap: pretty; }
.oc [hidden] { display: none !important; }

</style>
</head>
<body>

<div class="oc" data-mi="shoulder-cursor" data-name="Sam">
  <div class="oc-bar">
    <p class="oc-doc-title">Launch Plan</p>
    <span class="oc-people" aria-hidden="true"><span style="--c: var(--chart-1)">S</span><span style="--c: var(--chart-2)">Y</span></span>
  </div>
  <div class="oc-doc">
    <p class="oc-p oc-edit" contenteditable="true" spellcheck="false" role="textbox" aria-multiline="true" aria-label="Your paragraph">We ship on the 14th. Marketing goes live the same morning, and support gets the FAQ two days before. If anything slips, we move everything together.</p>
    <p class="oc-p oc-other">Budget stays flat. Sam owns the vendor list and the press kit.</p>
    <div class="oc-cursor" aria-hidden="true">
      <svg class="oc-arrow" viewBox="0 0 20 20"><path d="M3 2l13 7.5-5.6 1.4L8 16.5Z" stroke-width="1.4" stroke-linejoin="round" style="fill: var(--oc-c); stroke: var(--on-color)"/></svg>
      <span class="oc-tag"><svg class="oc-glasses" viewBox="0 0 40 14"><circle cx="9" cy="7" r="5.5" stroke-width="2" style="fill: color-mix(in srgb, var(--on-color) 35%, transparent); stroke: var(--on-color)"/><circle cx="31" cy="7" r="5.5" stroke-width="2" style="fill: color-mix(in srgb, var(--on-color) 35%, transparent); stroke: var(--on-color)"/><path d="M14.5 6.5q5.5-3 11 0" stroke-width="2" fill="none" style="stroke: var(--on-color)"/></svg>Sam</span>
    </div>
  </div>
  <p class="oc-status" role="status" aria-live="polite">Sam is in this document.</p>
</div>


<script>
/* Over-the-Shoulder Cursor — vanilla JS. Auto-initializes every [data-mi="shoulder-cursor"].
   The demo drives a teammate's cursor with a small script: it wanders, then settles on your paragraph. After 2.5s
   it puts on glasses; after 5s it leans in. Typing startles it away. In a real app, feed it live cursor positions.
   Call window.initShoulderCursor(el) for elements added later. */
(function () {
  'use strict';
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)');

  // Even line breaks: text that wraps to two or three lines is narrowed until its lines are close in length,
  // with the first line the longest, so no line runs long while the next holds a word or two.
  function evenLines(root) {
    var SEL = 'p, li, dd, dt, small, label, figcaption, h1, h2, h3, h4';
    function widths(el) {
      var range = document.createRange(), rows = [];
      range.selectNodeContents(el);
      Array.prototype.forEach.call(range.getClientRects(), function (b) {
        if (!b.width) return;
        var row = rows.filter(function (x) { return Math.abs(x.t - b.top) < b.height / 2; })[0];
        if (row) { row.l = Math.min(row.l, b.left); row.r = Math.max(row.r, b.right); } else rows.push({ t: b.top, l: b.left, r: b.right });
      });
      return rows.sort(function (a, b) { return a.t - b.t; }).map(function (x) { return x.r - x.l; });
    }
    function fit(el) {
      el.style.maxWidth = ''; el.style.textWrap = '';
      var cs = getComputedStyle(el), full = el.getBoundingClientRect().width;
      if (!full || cs.whiteSpace === 'nowrap' || /flex|grid/.test(cs.display)) return;
      if (Array.prototype.some.call(el.children, function (c) { return !/^inline/.test(getComputedStyle(c).display); })) return;
      el.style.textWrap = 'wrap';
      var n = widths(el).length, lo = 0, hi = full, w, L;
      if (n < 2 || n > 3) { el.style.textWrap = ''; return; }
      while (hi - lo > 1) { w = (lo + hi) / 2; el.style.maxWidth = w + 'px'; if (widths(el).length > n) lo = w; else hi = w; }
      var best = 0, gap = Infinity;
      for (w = Math.ceil(hi); w <= full; w += 2) {
        el.style.maxWidth = w + 'px'; L = widths(el);
        // Each line no longer than the one above (within 10%, which reads as equal). Keep the most even width,
        // and prefer the first line longer: a last line longer than the first costs three times its overhang
        var score = Math.max.apply(null, L) - Math.min.apply(null, L) + Math.max(0, L[n - 1] - L[0]) * 3;
        if (L.length === n && L.every(function (x, i) { return !i || x <= L[i - 1] * 1.1 + 1; }) && score < gap) { gap = score; best = w; }
      }
      if (!best) { el.style.maxWidth = ''; el.style.textWrap = ''; return; }
      el.style.maxWidth = best + 'px';
      if (cs.textAlign === 'center' && cs.display === 'block') { el.style.marginLeft = 'auto'; el.style.marginRight = 'auto'; }
    }
    var queued = false, lastW = 0;
    function run() { queued = false; Array.prototype.forEach.call(root.querySelectorAll(SEL), fit); }
    function later() { if (!queued) { queued = true; requestAnimationFrame(run); } }
    later();
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(later);
    if (window.ResizeObserver) new ResizeObserver(function () { var w = root.getBoundingClientRect().width; if (Math.abs(w - lastW) > 0.5) { lastW = w; later(); } }).observe(root);
    if (window.MutationObserver) new MutationObserver(later).observe(root, { subtree: true, childList: true, characterData: true, attributes: true, attributeFilter: ['hidden'] });
  }

  function initShoulderCursor(root) {
    if (!root || root.__miShoulder) return;
    root.__miShoulder = true;
    evenLines(root);
    var name = root.getAttribute('data-name') || 'They';
    var doc = root.querySelector('.oc-doc'), edit = root.querySelector('.oc-edit'), other = root.querySelector('.oc-other');
    var cur = root.querySelector('.oc-cursor'), status = root.querySelector('.oc-status');
    var pos = { x: 0, y: 0 }, target = { x: 0, y: 0 }, speed = 0.06, scale = 1, targetScale = 1;
    var phase = 'idle', since = 0, shown = 0, raf = 0, timers = [], running = false;

    function set(x, y, sp) { target.x = x; target.y = y; speed = sp || 0.06; }
    function later(fn, ms) { timers.push(setTimeout(fn, ms)); }
    function clearAll() { timers.forEach(clearTimeout); timers = []; }
    function box(el) { var d = doc.getBoundingClientRect(), r = el.getBoundingClientRect(); return { x: r.left - d.left, y: r.top - d.top, w: r.width, h: r.height }; }

    function frame(now) {
      pos.x += (target.x - pos.x) * speed;
      pos.y += (target.y - pos.y) * speed;
      scale += (targetScale - scale) * 0.08;
      cur.style.setProperty('--x', pos.x.toFixed(1) + 'px');
      cur.style.setProperty('--y', pos.y.toFixed(1) + 'px');
      cur.style.setProperty('--s', scale.toFixed(3));
      if (phase === 'reading') {
        var secs = (now - since) / 1000;
        if (secs > 2.5 && !root.classList.contains('is-reading')) { root.classList.add('is-reading'); status.textContent = name + ' is reading over your shoulder.'; }
        if (secs > 5) {
          root.classList.add('is-squinting');
          targetScale = 1.18;
          var whole = Math.floor(secs);
          if (whole !== shown && whole % 2 === 0) { shown = whole; status.textContent = name + ' has been reading this sentence for ' + whole + ' seconds.'; } // never 1: even seconds only
          // Creep along the line, word by word.
          var b = box(edit);
          target.x = Math.min(b.x + b.w - 40, target.x + 0.12);
        }
      }
      raf = requestAnimationFrame(frame);
    }

    function wander() {
      clearAll();
      phase = 'wander';
      root.classList.remove('is-reading', 'is-squinting', 'is-startled');
      targetScale = 1;
      var d = doc.getBoundingClientRect(), o = box(other), e = box(edit);
      set(o.x + o.w * 0.6, o.y + 6, 0.05);
      status.textContent = name + ' is in this document.';
      later(function () { set(d.width * 0.75, 18, 0.05); }, 1200);
      later(function () {
        set(e.x + e.w * 0.32, e.y + 14, 0.045);
        later(function () { phase = 'reading'; since = performance.now(); }, 900);
      }, 2400);
    }

    function startle() {
      if (phase !== 'reading' && phase !== 'wander') return;
      clearAll();
      phase = 'startled';
      root.classList.add('is-startled');
      root.classList.remove('is-squinting');
      targetScale = 1;
      var d = doc.getBoundingClientRect();
      set(d.width - 60, d.height - 40, reduce.matches ? 1 : 0.22);
      status.textContent = name + ' suddenly remembered something else.';
      later(wander, 4200);
    }

    edit.addEventListener('input', startle);
    edit.addEventListener('keydown', function (e) { if (e.key.length === 1) startle(); });

    function start() {
      if (running) return;
      running = true;
      var d = doc.getBoundingClientRect();
      pos.x = target.x = d.width - 50; pos.y = target.y = d.height - 30;
      raf = requestAnimationFrame(frame);
      wander();
    }
    if ('IntersectionObserver' in window) {
      var io = new IntersectionObserver(function (en) {
        if (en.some(function (x) { return x.isIntersecting; })) { io.disconnect(); start(); }
      }, { threshold: 0.4 });
      io.observe(root);
    } else start();
  }

  window.initShoulderCursor = initShoulderCursor;
  function boot() { document.querySelectorAll('[data-mi="shoulder-cursor"]').forEach(initShoulderCursor); }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();

</script>
</body>
</html>
