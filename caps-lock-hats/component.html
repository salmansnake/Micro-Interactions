<div class="clh" data-mi="caps-lock-hats">

  <label class="clh-f"><span class="clh-lab">Email</span><input class="clh-email" type="email" value="mira@atlas.io" autocomplete="off"></label>
  <label class="clh-f">
    <span class="clh-lab">Password</span>
    <span class="clh-box">
      <input class="clh-pass" type="password" value="lunchtime" autocomplete="off" spellcheck="false">

    <button type="button" class="clh-btn is-primary"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m10 17 5-5-5-5"/><path d="M15 12H3"/><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/></svg><span>Sign In</span></button>

</div>
