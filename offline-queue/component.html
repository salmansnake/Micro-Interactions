<div class="oq" data-mi="offline-queue">
  <div class="oq-head">
    <div class="oq-titles">
      <p class="oq-title">Launch Tasks</p>
      <p class="oq-state" aria-live="polite"><span class="oq-dot"></span><span class="oq-state-text">Online · All changes saved</span></p>
    </div>
    <span class="oq-cloud" aria-hidden="true">
      <svg class="oq-on" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"/></svg><svg class="oq-off" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M10.94 5.274A7 7 0 0 1 15.71 10h1.79a4.5 4.5 0 0 1 4.222 6.057"/><path d="M18.796 18.81A4.5 4.5 0 0 1 17.5 19H9A7 7 0 0 1 5.79 5.78"/><path class="oq-slash" d="m2 2 20 20"/></svg>
    </span>
    <label class="oq-switch-row"><span>Online</span>
      <span class="oq-switch"><input type="checkbox" role="switch" class="oq-online" checked aria-label="Online"><span class="oq-track"></span><span class="oq-knob"></span></span>
    </label>
  </div>
  <ul class="oq-list">
    <li class="oq-row"><button type="button" class="oq-check" aria-pressed="true" aria-label="Write release notes, done"></button><span class="oq-text">Write release notes</span><span class="oq-badge" aria-hidden="true"></span></li>
    <li class="oq-row"><button type="button" class="oq-check" aria-pressed="false" aria-label="Update pricing page"></button><span class="oq-text">Update pricing page</span><span class="oq-badge" aria-hidden="true"></span></li>
    <li class="oq-row"><button type="button" class="oq-check" aria-pressed="false" aria-label="Email beta customers"></button><span class="oq-text">Email beta customers</span><span class="oq-badge" aria-hidden="true"></span></li>
  </ul>
  <form class="oq-add"><input class="oq-input" type="text" placeholder="Add a task" aria-label="Add a task" autocomplete="off"><button type="submit" class="oq-add-btn">Add</button></form>
  <div class="oq-queue" hidden>
    <span class="oq-chips" aria-hidden="true"></span>
    <span class="oq-queue-text"></span>
  </div>
</div>
